<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学中文 - Học Từ Vựng HSK 1-4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#5b9bd5;--pri-light:#93c5e8;--pri-bg:#eef5fb;
  --green:#6dc5a1;--green-bg:#edf8f3;--green-dark:#4da882;
  --orange:#e8956a;--orange-bg:#fdf0e8;--orange-dark:#b85c2e;
  --bg:#f0f4f2;--card:#fff;--text:#3a4a5c;--text-sec:#8899a6;
  --border:#dce4e8;--border-light:#f0f4f2;
  --red:#e87c7c;--red-bg:#fdf0f0;
  --radius:14px;--shadow:0 2px 12px rgba(60,80,100,0.07);
}
body{font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.container{max-width:1100px;margin:0 auto;padding:12px 16px}
.app-layout{display:flex;gap:20px;align-items:flex-start}

/* ── Sidebar ── */
.sidebar{width:200px;flex-shrink:0;position:sticky;top:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 14px;display:flex;flex-direction:column;gap:16px}
.sidebar-brand{font-size:1.5em;font-weight:300;color:var(--green-dark);font-family:'LXGW WenKai TC',sans-serif;text-align:center;padding-bottom:4px;border-bottom:1px solid var(--border-light)}
.sidebar-stats{display:flex;gap:6px}
.stat-item{flex:1;padding:10px 6px;border-radius:12px;text-align:center}
.stat-item:nth-child(1){background:var(--pri-bg)}
.stat-item:nth-child(2){background:var(--green-bg)}
.stat-item:nth-child(3){background:var(--orange-bg)}
.stat-item .num{font-size:1.1em;font-weight:700;display:block}
.stat-item:nth-child(1) .num{color:var(--pri)}
.stat-item:nth-child(2) .num{color:var(--green-dark)}
.stat-item:nth-child(3) .num{color:var(--orange-dark)}
.stat-item .label{font-size:.6em;color:var(--text-sec);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;display:block}
.sidebar-section{}
.sidebar-label{font-size:.65em;font-weight:700;color:var(--text-sec);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;padding:0 4px}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.nav-tab{display:block;width:100%;text-align:left;padding:9px 14px;border:none;cursor:pointer;font-size:.85em;font-weight:600;background:none;color:var(--text-sec);transition:all .15s;border-radius:10px;white-space:nowrap}
.nav-tab:hover{background:var(--border-light);color:var(--text)}
.nav-tab.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(109,197,161,0.3)}
.hsk-filters{display:flex;flex-wrap:wrap;gap:4px}
.filter-btn{padding:6px 0;border:none;border-radius:8px;cursor:pointer;font-size:.8em;font-weight:600;background:var(--border-light);color:var(--text-sec);transition:all .15s;flex:1;text-align:center;min-width:0}
.filter-btn:hover{background:var(--pri-bg);color:var(--pri)}
.filter-btn.active{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(91,155,213,0.25)}
.filter-btn.hsk1.active,.filter-btn.hsk2.active,.filter-btn.hsk3.active,.filter-btn.hsk4.active{background:var(--pri);color:#fff}

/* ── Main ── */
.main-content{flex:1;min-width:0}
.sub-nav{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.sub-nav button{padding:7px 18px;border:none;border-radius:999px;cursor:pointer;font-size:.82em;font-weight:600;background:var(--card);color:var(--text-sec);transition:all .15s;white-space:nowrap;box-shadow:var(--shadow)}
.sub-nav button:hover{color:var(--pri);background:var(--pri-bg)}
.sub-nav button.active{background:var(--pri);color:#fff;box-shadow:0 2px 10px rgba(91,155,213,0.3)}
.filter-group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.fc-filter-btn{padding:6px 14px;border:none;border-radius:999px;cursor:pointer;font-size:.78em;font-weight:500;background:var(--card);color:var(--text-sec);transition:all .15s;box-shadow:var(--shadow)}
.fc-filter-btn:hover{color:var(--orange-dark);background:var(--orange-bg)}
.fc-filter-btn.active{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(232,149,106,0.35)}
.search-box{width:100%;padding:10px 16px;border:none;border-radius:var(--radius);font-size:.9em;background:var(--card);margin:0 0 10px;outline:none;box-shadow:var(--shadow);transition:box-shadow .15s}
.search-box:focus{box-shadow:0 0 0 3px rgba(91,155,213,0.15)}

/* ── Flashcard ── */
.card-container{perspective:1000px;margin:10px 0}
.flashcard{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform 0.5s}
.flashcard.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;min-height:300px;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:var(--card);box-shadow:var(--shadow)}
.card-front{background:var(--card)}
.card-back{background:var(--card);transform:rotateY(180deg)}
.card-hanzi{font-size:3.8em;font-weight:300;color:var(--text);margin-bottom:8px;line-height:1.2;font-family:'LXGW WenKai TC',sans-serif}
.card-pinyin{font-size:1.05em;color:var(--pri);margin-bottom:3px;font-weight:500}
.card-vi{font-size:.92em;color:var(--text-sec);margin-bottom:14px;text-align:center}
.card-example{background:var(--border-light);padding:14px 18px;border-radius:10px;width:100%;margin-top:8px}
.card-example .ex-zh,.grammar-ex .ex-zh,.wd-example .ex-zh{font-size:1.05em;color:var(--text);margin-bottom:4px;font-family:'LXGW WenKai TC',sans-serif;font-weight:400;line-height:1.7}
.card-example .ex-py,.grammar-ex .ex-py,.wd-example .ex-py{font-size:.78em;color:var(--pri);margin-bottom:2px;line-height:1.5}
.card-example .ex-vi,.grammar-ex .ex-vi,.wd-example .ex-vi{font-size:.78em;color:var(--text-sec);font-style:italic;line-height:1.5}
.example-title{font-size:.7em;color:var(--text-sec);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:6px 0 3px}
.example-toggle{margin-top:8px}
.example-toggle button{padding:5px 12px;border:none;border-radius:999px;background:var(--pri-bg);color:var(--pri);cursor:pointer;font-size:.78em;font-weight:600;transition:all .15s}
.example-toggle button:hover{background:var(--pri);color:#fff}
.example-hidden{display:none;margin-top:6px}
.example-hidden.show{display:block}
.card-hint{font-size:.82em;color:var(--text-sec);margin-top:12px}
.card-badge{position:absolute;top:14px;left:14px;padding:4px 12px;border-radius:999px;font-size:.72em;font-weight:600;background:var(--pri);color:#fff}
.card-badge.hsk1,.card-badge.hsk2,.card-badge.hsk3,.card-badge.hsk4{background:var(--pri)}
.card-lesson{position:absolute;top:14px;right:14px;font-size:.72em;color:var(--text-sec)}
.card-nav{display:flex;gap:8px;justify-content:center;margin:12px 0;align-items:center}
.card-nav button{padding:10px 22px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.88em;font-weight:600;transition:all .15s}
.btn-prev,.btn-next{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn-prev:hover,.btn-next:hover{background:var(--pri-bg);color:var(--pri)}
.btn-know{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(109,197,161,0.3)}
.btn-know:hover{opacity:.9}
.btn-dontknow{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(232,124,124,0.3)}
.btn-dontknow:hover{opacity:.9}
.progress-text{font-size:.85em;color:var(--text-sec);min-width:50px;text-align:center}
.fc-toolbar{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap;align-items:center}

/* ── Quiz ── */
.quiz-container{margin:10px 0}
.quiz-question{background:var(--card);border-radius:var(--radius);padding:32px 24px;text-align:center;margin-bottom:10px;box-shadow:var(--shadow)}
.quiz-hanzi{font-size:3.2em;font-weight:300;color:var(--text);margin-bottom:6px;font-family:'LXGW WenKai TC',sans-serif}
.quiz-prompt{font-size:.88em;color:var(--text-sec);margin-bottom:4px}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.quiz-option{padding:14px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.9em;background:var(--card);transition:all .15s;text-align:center;box-shadow:var(--shadow)}
.quiz-option:hover{background:var(--pri-bg);color:var(--pri)}
.quiz-option.correct{background:var(--green-bg);color:var(--green-dark);box-shadow:0 0 0 2px var(--green)}
.quiz-option.wrong{background:var(--red-bg);color:#c55;box-shadow:0 0 0 2px var(--red)}
.quiz-option.disabled{pointer-events:none}
.quiz-result{text-align:center;padding:10px;border-radius:10px;margin:6px 0;font-weight:600}
.quiz-result.correct-result{background:var(--green-bg);color:var(--green-dark)}
.quiz-result.wrong-result{background:var(--red-bg);color:#c55}
.quiz-score{display:flex;gap:16px;justify-content:center;margin:8px 0;font-size:.88em}
.quiz-score .score-correct{color:var(--green-dark);font-weight:700}
.quiz-score .score-wrong{color:var(--red);font-weight:700}

/* ── Word list ── */
.word-list{display:grid;gap:0;margin:8px 0;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.word-item{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--card);cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border-light)}
.word-item:last-child{border-bottom:none}
.word-item:hover{background:var(--green-bg)}
.word-item .wi-hanzi{font-size:1.2em;font-weight:400;color:var(--text);min-width:70px;font-family:'LXGW WenKai TC',sans-serif}
.word-item .wi-pinyin{color:var(--pri);font-size:.85em;min-width:90px}
.word-item .wi-vi{color:var(--text);font-size:.85em;flex:1}
.word-item .wi-badge{padding:3px 8px;border-radius:999px;font-size:.65em;background:var(--orange-bg);color:var(--orange-dark);font-weight:600;white-space:nowrap}
.word-item .wi-star{font-size:1.1em;cursor:pointer;opacity:0.3;transition:opacity .2s}
.word-item .wi-star.starred{opacity:1;color:var(--orange-dark)}

/* ── Detail popup ── */
.word-detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(58,74,92,0.25);display:none;z-index:100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.word-detail-overlay.show{display:flex}
.word-detail{background:var(--card);border-radius:18px;padding:32px 24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 8px 40px rgba(60,80,100,0.15)}
.word-detail .close-btn{position:absolute;top:12px;right:16px;font-size:1.4em;cursor:pointer;color:var(--text-sec);border:none;background:none}
.word-detail .wd-hanzi{font-size:2.8em;font-weight:300;color:var(--text);text-align:center;font-family:'LXGW WenKai TC',sans-serif}
.word-detail .wd-pinyin{font-size:.95em;color:var(--pri);text-align:center;margin:3px 0}
.word-detail .wd-vi{font-size:.88em;color:var(--text-sec);text-align:center;margin-bottom:14px}
.word-detail .wd-example{background:var(--border-light);padding:14px 18px;border-radius:12px;margin-top:10px}

/* ── Inputs & buttons ── */
.pinyin-input{width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:1.05em;text-align:center;outline:none;margin:10px 0;background:var(--card);box-shadow:var(--shadow)}
.pinyin-input:focus{box-shadow:0 0 0 3px rgba(91,155,213,0.15)}
.btn-check{padding:10px 28px;border:none;border-radius:var(--radius);background:var(--green);color:#fff;font-size:.92em;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(109,197,161,0.3)}
.btn-check:hover{opacity:.88}
.btn-reset{padding:6px 14px;border:none;border-radius:999px;background:var(--card);color:var(--text-sec);font-size:.78em;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.btn-reset:hover{color:var(--pri);background:var(--pri-bg)}
.section{display:none}
.section.active{display:block}
.sub-section{display:none}
.sub-section.active{display:block}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-sec)}
.empty-state .emoji{font-size:2.5em;margin-bottom:8px}
.shuffle-btn{padding:6px 14px;border:none;border-radius:999px;background:var(--card);color:var(--text-sec);font-size:.78em;cursor:pointer;font-weight:600;transition:all .15s;box-shadow:var(--shadow)}
.shuffle-btn:hover{color:var(--pri);background:var(--pri-bg)}
.panel-card{margin:8px 0}
.panel-title{font-size:1em;font-weight:700;color:var(--text);margin-bottom:4px}
.panel-sub{font-size:.8em;color:var(--text-sec);margin-bottom:8px}

/* ── Shared orange header (reading + grammar) ── */
.content-head{display:flex;align-items:stretch}
.content-meta{flex-shrink:0;display:flex;align-items:center;font-size:.72em;color:#fff;background:var(--orange);padding:8px 12px;font-weight:600;white-space:nowrap}
.content-title-wrap{flex:1;display:flex;align-items:center;padding:8px 14px;background:var(--orange-bg)}
.content-title{font-size:.95em;font-weight:600;color:var(--orange-dark);line-height:1.4;font-family:'LXGW WenKai TC',sans-serif}

/* ── Grammar ── */
.grammar-list{display:grid;gap:10px;margin-top:8px}
.grammar-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.grammar-body{padding:14px 20px 18px}
.grammar-ex{background:var(--border-light);padding:14px 18px;border-radius:10px;margin-top:10px}
.grammar-note{font-size:.88em;line-height:1.55;color:var(--text-sec);margin-bottom:0}

/* ── Reading ── */
.reading-list{display:flex;flex-direction:column;gap:20px;margin-top:8px}
.reading-lesson{margin-bottom:4px}
.reading-lesson-body{display:flex;flex-direction:column;gap:10px}
.reading-text-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.reading-text-block.passage{box-shadow:0 2px 12px rgba(210,170,60,0.12)}
.reading-text-body{padding:16px 20px}
.reading-text-block.passage .reading-text-body{background:var(--orange-bg)}
.vocab-hl{font-weight:600;padding:0 2px;border-radius:3px;border-bottom:1.5px dotted currentColor;cursor:pointer;position:relative;font-family:'LXGW WenKai TC',sans-serif}
.speaker-a .vocab-hl{background:var(--pri-bg);color:var(--pri)}
.speaker-b .vocab-hl{background:var(--green-bg);color:var(--green-dark)}
.passage-line .vocab-hl,.reading-text-block.passage .vocab-hl{background:var(--orange-bg);color:var(--orange-dark)}
.dialogue-line{margin:2px 0;padding:7px 14px;line-height:1.7;font-size:.95em;border-radius:8px;font-family:'LXGW WenKai TC',sans-serif;font-weight:400}
.dialogue-line.speaker-a{background:var(--pri-bg)}
.dialogue-line.speaker-b{background:var(--green-bg)}
.dialogue-line .speaker{font-weight:600;color:var(--text);margin-right:2px}
.dialogue-line:not(.speaker-a):not(.speaker-b) .vocab-hl{background:var(--card);color:var(--pri)}
.passage-line{margin:0;padding:4px 0;line-height:1.85;font-size:.95em;text-indent:2em;font-family:'LXGW WenKai TC',sans-serif;font-weight:400}
.passage-line:first-child{margin-top:0}

/* ── Tooltips ── */
.vocab-tip{position:fixed;z-index:200;border-radius:10px;padding:7px 11px;pointer-events:none;box-shadow:0 4px 16px rgba(60,80,100,0.1);max-width:200px;display:none;font-size:12px;line-height:1.35;border-left:3px solid transparent}
.vocab-tip .vt-py{font-size:.92em;font-weight:600;margin-bottom:1px}
.vocab-tip .vt-vi{font-size:.8em;color:var(--text-sec)}
.vocab-tip.tip-a{background:var(--pri-bg);border-left-color:var(--pri)}
.vocab-tip.tip-a .vt-py{color:var(--pri)}
.vocab-tip.tip-b{background:var(--green-bg);border-left-color:var(--green-dark)}
.vocab-tip.tip-b .vt-py{color:var(--green-dark)}
.vocab-tip.tip-passage{background:var(--orange-bg);border-left-color:var(--orange-dark)}
.vocab-tip.tip-passage .vt-py{color:var(--orange-dark)}
.vocab-tip.tip-default{background:var(--card);border-left-color:var(--pri)}
.vocab-tip.tip-default .vt-py{color:var(--pri)}

.small-btn{padding:5px 12px;border:none;border-radius:999px;background:var(--card);color:var(--text-sec);cursor:pointer;font-size:.78em;box-shadow:var(--shadow)}
.small-btn:hover{background:var(--pri-bg);color:var(--pri)}

/* ── Responsive ── */
@media(max-width:700px){
  .app-layout{flex-direction:column;gap:0}
  .sidebar{width:100%;position:static;border-radius:0;box-shadow:none;padding:12px;gap:10px;border-bottom:1px solid var(--border)}
  .sidebar-brand{font-size:1.2em;text-align:left;border-bottom:none;padding-bottom:0}
  .sidebar-stats{gap:4px}
  .stat-item{padding:6px 4px}
  .sidebar-label{display:none}
  .sidebar-nav{flex-direction:row;gap:3px;overflow-x:auto}
  .nav-tab{padding:7px 12px;font-size:.78em;text-align:center;white-space:nowrap}
  .hsk-filters{gap:3px}
  .filter-btn{padding:5px 0;font-size:.75em;min-width:0}
  .card-hanzi,.quiz-hanzi{font-size:2.8em}
  .quiz-options{grid-template-columns:1fr}
  .card-nav{flex-wrap:wrap}
  .filter-group{flex-wrap:wrap}
}

/* ── Animations ── */
.mastery-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:4px}
.mastery-0{background:var(--border)}
.mastery-1{background:var(--orange)}
.mastery-2{background:var(--green)}
.mastery-3{background:var(--green-dark)}
.fade-in{animation:fadeIn .2s ease-in}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.correct-flash{animation:correctFlash .4s}
@keyframes correctFlash{0%,100%{background:var(--card)}50%{background:var(--green-bg)}}
.wrong-flash{animation:wrongFlash .4s}
@keyframes wrongFlash{0%,100%{background:var(--card)}50%{background:var(--red-bg)}}
</style>
</head>
<body>
<div class="container">
  <div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">学中文</div>

    <div class="sidebar-stats">
      <div class="stat-item"><span class="num" id="totalWords">0</span><span class="label">Tổng</span></div>
      <div class="stat-item"><span class="num" id="learningWords">0</span><span class="label">Học</span></div>
      <div class="stat-item"><span class="num" id="accuracy">0%</span><span class="label">Đúng</span></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Mục</div>
      <div class="sidebar-nav">
        <button class="nav-tab active" onclick="switchSection('vocab',this)">Từ vựng</button>
        <button class="nav-tab" onclick="switchSection('test',this)">Kiểm tra</button>
        <button class="nav-tab" onclick="switchSection('reading',this)">Bài đọc</button>
        <button class="nav-tab" onclick="switchSection('grammar',this)">Ngữ pháp</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Cấp độ</div>
      <div class="hsk-filters">
        <button class="filter-btn hsk1 active" onclick="toggleHSK(1,this)">1</button>
        <button class="filter-btn hsk2 active" onclick="toggleHSK(2,this)">2</button>
        <button class="filter-btn hsk3 active" onclick="toggleHSK(3,this)">3</button>
        <button class="filter-btn hsk4 active" onclick="toggleHSK(4,this)">4</button>
      </div>
    </div>
  </aside>

  <main class="main-content">

  <!-- ===== HỌC TỪ VỰNG ===== -->
  <div class="section active" id="sec-vocab">
    <div class="sub-nav" id="vocab-nav">
      <button class="active" onclick="switchSub('vocab','flashcard',this)">Flashcard</button>
      <button onclick="switchSub('vocab','list',this)">Danh sách từ</button>
    </div>

    <div class="sub-section active" id="sub-flashcard">
      <div class="fc-toolbar">
        <div class="filter-group">
          <button class="fc-filter-btn active" data-status="all" onclick="setStatusFilter('all',this)">Tất cả</button>
          <button class="fc-filter-btn" data-status="new" onclick="setStatusFilter('new',this)">Chưa học</button>
          <button class="fc-filter-btn" data-status="learning" onclick="setStatusFilter('learning',this)">Đang học</button>
        </div>
        <button type="button" class="shuffle-btn" onclick="shuffleWords()">Trộn</button>
        <button type="button" class="btn-reset" onclick="resetProgress()">Reset</button>
      </div>
      <div class="card-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">

## 📗 HSK 1 — NGỮ PHÁP CƠ BẢN

### 1. 是 (shì) — Là
Dùng để giới thiệu, xác nhận danh tính.
> 我**是**学生。(Wǒ shì xuéshēng.) — Tôi là sinh viên.
> 他**是**老师。(Tā shì lǎoshī.) — Anh ấy là giáo viên.

### 2. 不 (bù) — Phủ định (không)
Đặt trước động từ/tính từ để phủ định.
> 我**不**喝咖啡。(Wǒ bù hē kāfēi.) — Tôi không uống cà phê.
> 她**不**高兴。(Tā bù gāoxìng.) — Cô ấy không vui.

### 3. 没 / 没有 (méi / méiyǒu) — Chưa / Không có
Phủ định quá khứ hoặc biểu thị "không có".
> 我**没有**钱。(Wǒ méiyǒu qián.) — Tôi không có tiền.
> 他**没**去学校。(Tā méi qù xuéxiào.) — Anh ấy chưa đi học.

### 4. 的 (de) — Trợ từ sở hữu / bổ nghĩa
Biểu thị sở hữu hoặc liên kết bổ nghĩa.
> 我**的**书。(Wǒ de shū.) — Sách của tôi.
> 漂亮**的**花。(Piàoliang de huā.) — Hoa đẹp.

### 5. 了 (le) — Đã (hoàn thành)
Đặt sau động từ biểu thị hành động đã xảy ra.
> 我吃**了**饭。(Wǒ chī le fàn.) — Tôi đã ăn cơm.
> 她买**了**一本书。(Tā mǎi le yì běn shū.) — Cô ấy đã mua một cuốn sách.

### 6. 吗 (ma) — Trợ từ nghi vấn
Thêm vào cuối câu để tạo câu hỏi yes/no.
> 你是中国人**吗**？(Nǐ shì Zhōngguó rén ma?) — Bạn là người Trung Quốc à?
> 你喜欢咖啡**吗**？(Nǐ xǐhuān kāfēi ma?) — Bạn thích cà phê không?

### 7. 呢 (ne) — Còn…thì sao?
Dùng để hỏi lại tương tự.
> 我很好，你**呢**？(Wǒ hěn hǎo, nǐ ne?) — Tôi khỏe, còn bạn?

### 8. 很 (hěn) — Rất
Đặt trước tính từ. Lưu ý: trong tiếng Trung, tính từ vị ngữ thường cần 很 dù không nhấn mạnh.
> 她**很**漂亮。(Tā hěn piàoliang.) — Cô ấy (rất) đẹp.
> 今天**很**热。(Jīntiān hěn rè.) — Hôm nay (rất) nóng.

### 9. 在 (zài) — Ở / Đang
**Ở (vị trí):**
> 我**在**家。(Wǒ zài jiā.) — Tôi ở nhà.

**Đang (tiến hành):**
> 他**在**吃饭。(Tā zài chīfàn.) — Anh ấy đang ăn cơm.

### 10. 有 (yǒu) — Có
> 我**有**一个哥哥。(Wǒ yǒu yí gè gēge.) — Tôi có một anh trai.
> 桌子上**有**一本书。(Zhuōzi shàng yǒu yì běn shū.) — Trên bàn có một cuốn sách.

### 11. 几 (jǐ) — Mấy (hỏi số lượng nhỏ)
> 你有**几**个孩子？(Nǐ yǒu jǐ gè háizi?) — Bạn có mấy đứa con?
> 现在**几**点？(Xiànzài jǐ diǎn?) — Bây giờ mấy giờ?

### 12. 多少 (duōshǎo) — Bao nhiêu
> 这个**多少**钱？(Zhège duōshǎo qián?) — Cái này bao nhiêu tiền?

### 13. 想 (xiǎng) — Muốn / Nghĩ
> 我**想**喝水。(Wǒ xiǎng hē shuǐ.) — Tôi muốn uống nước.
> 我**想**你了。(Wǒ xiǎng nǐ le.) — Tôi nhớ bạn rồi.

### 14. 能 (néng) / 会 (huì) — Có thể / Biết (kỹ năng)
**能** — có khả năng, được phép:
> 你**能**来吗？(Nǐ néng lái ma?) — Bạn có thể đến không?

**会** — biết làm (đã học):
> 我**会**说中文。(Wǒ huì shuō Zhōngwén.) — Tôi biết nói tiếng Trung.

### 15. 和 (hé) — Và (nối danh từ)
> 我**和**他是朋友。(Wǒ hé tā shì péngyǒu.) — Tôi và anh ấy là bạn.

### 16. Cấu trúc thời gian: S + Thời gian + V
Thời gian đặt trước động từ.
> 我**明天**去北京。(Wǒ míngtiān qù Běijīng.) — Tôi ngày mai đi Bắc Kinh.
> 他**昨天**来了。(Tā zuótiān lái le.) — Anh ấy hôm qua đã đến.

### 17. Cấu trúc địa điểm: S + 在 + Nơi + V
> 我**在**家**吃**饭。(Wǒ zài jiā chīfàn.) — Tôi ăn cơm ở nhà.
> 她**在**学校**学**中文。(Tā zài xuéxiào xué Zhōngwén.) — Cô ấy học tiếng Trung ở trường.

### 18. 怎么 (zěnme) — Thế nào / Làm sao
> 你**怎么**去？(Nǐ zěnme qù?) — Bạn đi bằng cách nào?
> 这个字**怎么**写？(Zhège zì zěnme xiě?) — Chữ này viết thế nào?

### 19. 太…了 (tài…le) — Quá…
> **太**好**了**！(Tài hǎo le!) — Quá tốt rồi!
> **太**贵**了**。(Tài guì le.) — Quá đắt.

### 20. Số + Lượng từ + Danh từ
> **一个**人 (yí gè rén) — một người
> **两本**书 (liǎng běn shū) — hai cuốn sách
> **三杯**咖啡 (sān bēi kāfēi) — ba ly cà phê

## 📘 HSK 2 — NGỮ PHÁP MỞ RỘNG

### 21. 正在 (zhèngzài) — Đang (nhấn mạnh)
> 他**正在**看书。(Tā zhèngzài kànshū.) — Anh ấy đang đọc sách.
> 我**正在**工作。(Wǒ zhèngzài gōngzuò.) — Tôi đang làm việc.

### 22. 已经…了 (yǐjīng…le) — Đã…rồi
> 我**已经**吃**了**。(Wǒ yǐjīng chī le.) — Tôi đã ăn rồi.
> 他**已经**走**了**。(Tā yǐjīng zǒu le.) — Anh ấy đã đi rồi.

### 23. 要 (yào) — Muốn / Sắp / Cần
**Muốn:**
> 我**要**一杯水。(Wǒ yào yì bēi shuǐ.) — Tôi muốn một ly nước.

**Sắp:**
> 他**要**来了。(Tā yào lái le.) — Anh ấy sắp đến rồi.

### 24. 可以 (kěyǐ) — Có thể / Được phép
> 我**可以**进来吗？(Wǒ kěyǐ jìnlái ma?) — Tôi có thể vào không?
> 这里**可以**抽烟吗？(Zhèlǐ kěyǐ chōuyān ma?) — Ở đây được phép hút thuốc không?

### 25. 别 (bié) — Đừng
> **别**说话！(Bié shuōhuà!) — Đừng nói chuyện!
> **别**担心。(Bié dānxīn.) — Đừng lo.

### 26. 从…到… (cóng…dào…) — Từ…đến…
> **从**我家**到**公司很近。(Cóng wǒ jiā dào gōngsī hěn jìn.) — Từ nhà tôi đến công ty rất gần.
> **从**星期一**到**星期五。(Cóng xīngqīyī dào xīngqīwǔ.) — Từ thứ Hai đến thứ Sáu.

### 27. 比 (bǐ) — So sánh hơn
A + 比 + B + Tính từ
> 他**比**我高。(Tā bǐ wǒ gāo.) — Anh ấy cao hơn tôi.
> 今天**比**昨天冷。(Jīntiān bǐ zuótiān lěng.) — Hôm nay lạnh hơn hôm qua.

### 28. 一点儿 (yìdiǎnr) — Một chút
> 我会说**一点儿**中文。(Wǒ huì shuō yìdiǎnr Zhōngwén.) — Tôi biết nói một chút tiếng Trung.
> 给我**一点儿**时间。(Gěi wǒ yìdiǎnr shíjiān.) — Cho tôi một chút thời gian.

### 29. 得 (de) — Bổ ngữ trình độ
V + 得 + Tính từ (đánh giá cách thực hiện)
> 他说**得**很好。(Tā shuō de hěn hǎo.) — Anh ấy nói rất giỏi.
> 她跑**得**很快。(Tā pǎo de hěn kuài.) — Cô ấy chạy rất nhanh.

### 30. 过 (guò) — Đã từng (kinh nghiệm)
V + 过
> 我去**过**中国。(Wǒ qù guò Zhōngguó.) — Tôi đã từng đi Trung Quốc.
> 你吃**过**火锅吗？(Nǐ chī guò huǒguō ma?) — Bạn đã từng ăn lẩu chưa?

### 31. 还 (hái) — Vẫn / Còn
> 他**还**在睡觉。(Tā hái zài shuìjiào.) — Anh ấy vẫn đang ngủ.
> 你**还**要什么？(Nǐ hái yào shénme?) — Bạn còn muốn gì?

### 32. 又 (yòu) — Lại (đã xảy ra lần nữa)
> 他**又**迟到了。(Tā yòu chídào le.) — Anh ấy lại trễ rồi.
> 你**又**忘了！(Nǐ yòu wàng le!) — Bạn lại quên rồi!

### 33. 再 (zài) — Lại (sẽ xảy ra lần nữa)
> 请**再**说一次。(Qǐng zài shuō yí cì.) — Xin nói lại một lần.
> 我们**再**见！(Wǒmen zàijiàn!) — Chúng ta gặp lại!

### 34. 都 (dōu) — Đều / Tất cả đều
> 我们**都**是学生。(Wǒmen dōu shì xuéshēng.) — Chúng tôi đều là sinh viên.
> 什么**都**好。(Shénme dōu hǎo.) — Cái gì cũng tốt.

### 35. 就 (jiù) — Liền / Ngay / Chính là
> 我吃完饭**就**走。(Wǒ chī wán fàn jiù zǒu.) — Tôi ăn xong là đi luôn.
> 他**就是**我的老师。(Tā jiùshì wǒ de lǎoshī.) — Anh ấy chính là giáo viên của tôi.

### 36. 因为…所以… (yīnwèi…suǒyǐ…) — Vì…nên…
> **因为**下雨，**所以**我不去。(Yīnwèi xiàyǔ, suǒyǐ wǒ bú qù.) — Vì mưa nên tôi không đi.

### 37. 虽然…但是… (suīrán…dànshì…) — Tuy…nhưng…
> **虽然**很累，**但是**很开心。(Suīrán hěn lèi, dànshì hěn kāixīn.) — Tuy rất mệt nhưng rất vui.

### 38. 如果…就… (rúguǒ…jiù…) — Nếu…thì…
> **如果**明天下雨，我**就**不去。(Rúguǒ míngtiān xiàyǔ, wǒ jiù bú qù.) — Nếu mai mưa thì tôi không đi.

### 39. 给 (gěi) — Cho / Giúp
> 请**给**我一杯水。(Qǐng gěi wǒ yì bēi shuǐ.) — Xin cho tôi một ly nước.
> 他**给**我打电话了。(Tā gěi wǒ dǎ diànhuà le.) — Anh ấy gọi điện cho tôi.

### 40. 对 (duì) — Đối với / Với
> 他**对**我很好。(Tā duì wǒ hěn hǎo.) — Anh ấy đối với tôi rất tốt.
> 这**对**你有帮助。(Zhè duì nǐ yǒu bāngzhù.) — Điều này có ích cho bạn.

### 41. V + 到 (dào) — V đến (kết quả)
> 我找**到**了！(Wǒ zhǎo dào le!) — Tôi tìm thấy rồi!
> 你看**到**他了吗？(Nǐ kàn dào tā le ma?) — Bạn nhìn thấy anh ấy chưa?

### 42. 最 (zuì) — Nhất (so sánh nhất)
> 她**最**漂亮。(Tā zuì piàoliang.) — Cô ấy đẹp nhất.
> 我**最**喜欢吃火锅。(Wǒ zuì xǐhuān chī huǒguō.) — Tôi thích ăn lẩu nhất.

### 43. 每 (měi) — Mỗi
> **每**天我都运动。(Měi tiān wǒ dōu yùndòng.) — Mỗi ngày tôi đều tập thể dục.
> **每**个人都很开心。(Měi gè rén dōu hěn kāixīn.) — Mỗi người đều vui.

### 44. 为什么 (wèishénme) — Tại sao
> 你**为什么**不来？(Nǐ wèishénme bù lái?) — Tại sao bạn không đến?

### 45. 还是 (háishì) — Hay là (câu hỏi lựa chọn)
> 你喝茶**还是**咖啡？(Nǐ hē chá háishì kāfēi?) — Bạn uống trà hay cà phê?

### 46. 或者 (huòzhě) — Hoặc (câu trần thuật)
> 你可以坐公交车**或者**地铁。(Nǐ kěyǐ zuò gōngjiāochē huòzhě dìtiě.) — Bạn có thể đi xe buýt hoặc tàu điện.

### 47. 着 (zhe) — Đang (trạng thái kéo dài)
V + 着
> 门开**着**。(Mén kāi zhe.) — Cửa đang mở.
> 他穿**着**一件白衬衫。(Tā chuān zhe yí jiàn bái chènshān.) — Anh ấy đang mặc một chiếc áo sơ mi trắng.

### 48. 真 (zhēn) — Thật sự
> 你**真**聪明！(Nǐ zhēn cōngmíng!) — Bạn thật thông minh!
> **真的**吗？(Zhēn de ma?) — Thật à?

### 49. 长 (cháng/zhǎng) — Dài / Lớn lên
> 这条路很**长**。(Zhè tiáo lù hěn cháng.) — Con đường này rất dài.

### 50. 离 (lí) — Cách (khoảng cách)
A + 离 + B + Tính từ
> 我家**离**学校很近。(Wǒ jiā lí xuéxiào hěn jìn.) — Nhà tôi cách trường rất gần.

---

## 📙 HSK 3 — NGỮ PHÁP NÂNG CAO

### 51. 把 (bǎ) — Cấu trúc BÃ (nhấn mạnh tác động lên đối tượng)
S + 把 + O + V + Bổ ngữ
> 请**把**门关上。(Qǐng bǎ mén guānshàng.) — Xin hãy đóng cửa lại.
> 他**把**作业做完了。(Tā bǎ zuòyè zuò wán le.) — Anh ấy đã làm xong bài tập.
> 我**把**书放在桌子上了。(Wǒ bǎ shū fàng zài zhuōzi shàng le.) — Tôi đã đặt sách lên bàn.

### 52. 被 (bèi) — Bị / Được (câu bị động)
S + 被 + (Agent) + V
> 我的手机**被**偷了。(Wǒ de shǒujī bèi tōu le.) — Điện thoại tôi bị trộm.
> 蛋糕**被**他吃了。(Dàngāo bèi tā chī le.) — Bánh bị anh ấy ăn mất.

### 53. 让 (ràng) — Để cho / Bảo
S + 让 + Ai + V
> 妈妈**让**我学习。(Māma ràng wǒ xuéxí.) — Mẹ bảo tôi học bài.
> **让**我想想。(Ràng wǒ xiǎngxiǎng.) — Để tôi nghĩ đã.

### 54. 向 (xiàng) — Hướng về / Theo hướng
> 他**向**我走来。(Tā xiàng wǒ zǒu lái.) — Anh ấy đi về phía tôi.
> 你应该**向**他学习。(Nǐ yīnggāi xiàng tā xuéxí.) — Bạn nên học hỏi từ anh ấy.

### 55. 越来越 (yuè lái yuè) — Ngày càng
> 天气**越来越**冷了。(Tiānqì yuè lái yuè lěng le.) — Thời tiết ngày càng lạnh.
> 她的中文**越来越**好。(Tā de Zhōngwén yuè lái yuè hǎo.) — Tiếng Trung cô ấy ngày càng tốt.

### 56. 越…越… (yuè…yuè…) — Càng…càng…
> **越**吃**越**想吃。(Yuè chī yuè xiǎng chī.) — Càng ăn càng muốn ăn.
> **越**快**越**好。(Yuè kuài yuè hǎo.) — Càng nhanh càng tốt.

### 57. 除了…以外 (chúle…yǐwài) — Ngoài…ra
**Ngoài ra còn (+也/还):**
> **除了**中文**以外**，我**还**会说英语。(Chúle Zhōngwén yǐwài, wǒ hái huì shuō Yīngyǔ.) — Ngoài tiếng Trung, tôi còn biết nói tiếng Anh.

**Ngoài ra không (+都):**
> **除了**他**以外**，大家**都**来了。(Chúle tā yǐwài, dàjiā dōu lái le.) — Ngoài anh ấy ra, mọi người đều đến.

### 58. 一边…一边… (yìbiān…yìbiān…) — Vừa…vừa…
> 她**一边**唱歌，**一边**跳舞。(Tā yìbiān chànggē, yìbiān tiàowǔ.) — Cô ấy vừa hát vừa nhảy.
> 我**一边**吃饭，**一边**看电视。(Wǒ yìbiān chīfàn, yìbiān kàn diànshì.) — Tôi vừa ăn vừa xem TV.

### 59. 先…然后… (xiān…ránhòu…) — Trước…sau đó…
> 我**先**洗澡，**然后**睡觉。(Wǒ xiān xǐzǎo, ránhòu shuìjiào.) — Tôi tắm trước, sau đó ngủ.

### 60. 一…就… (yī…jiù…) — Vừa…liền…
> 我**一**回家**就**吃饭。(Wǒ yī huí jiā jiù chīfàn.) — Tôi vừa về nhà liền ăn cơm.
> 她**一**看到他**就**笑了。(Tā yī kàn dào tā jiù xiào le.) — Cô ấy vừa thấy anh ấy liền cười.

### 61. 只要…就… (zhǐyào…jiù…) — Chỉ cần…thì…
> **只要**你努力，**就**能成功。(Zhǐyào nǐ nǔlì, jiù néng chénggōng.) — Chỉ cần bạn cố gắng thì sẽ thành công.

### 62. 只有…才… (zhǐyǒu…cái…) — Chỉ có…mới…
> **只有**努力学习，**才**能考好。(Zhǐyǒu nǔlì xuéxí, cái néng kǎo hǎo.) — Chỉ có chăm học mới thi tốt được.

### 63. 不但…而且… (búdàn…érqiě…) — Không những…mà còn…
> 她**不但**聪明，**而且**漂亮。(Tā búdàn cōngmíng, érqiě piàoliang.) — Cô ấy không những thông minh mà còn đẹp.

### 64. 虽然…但是/可是… — Tuy…nhưng… (nhắc lại, HSK3 dùng thường xuyên hơn)
> **虽然**他很忙，**可是**还是来了。(Suīrán tā hěn máng, kěshì háishì lái le.) — Tuy anh ấy rất bận nhưng vẫn đến.

### 65. 不是…而是… (búshì…érshì…) — Không phải…mà là…
> 我**不是**不想去，**而是**没时间。(Wǒ búshì bù xiǎng qù, érshì méi shíjiān.) — Tôi không phải không muốn đi, mà là không có thời gian.

### 66. 又…又… (yòu…yòu…) — Vừa…vừa… (tính chất)
> 这个菜**又**好吃**又**便宜。(Zhège cài yòu hǎochī yòu piányi.) — Món này vừa ngon vừa rẻ.

### 67. 连…都/也… (lián…dōu/yě…) — Ngay cả…cũng…
> 他**连**一块钱**都**没有。(Tā lián yí kuài qián dōu méiyǒu.) — Anh ấy ngay cả một đồng cũng không có.
> **连**小孩**都**知道。(Lián xiǎohái dōu zhīdào.) — Ngay cả trẻ con cũng biết.

### 68. 对…来说 (duì…lái shuō) — Đối với…mà nói
> **对**我**来说**，这不难。(Duì wǒ lái shuō, zhè bù nán.) — Đối với tôi mà nói, cái này không khó.

### 69. 关于 (guānyú) — Về (chủ đề)
> **关于**这个问题，我有一些想法。(Guānyú zhège wèntí, wǒ yǒu yìxiē xiǎngfǎ.) — Về vấn đề này, tôi có một số ý tưởng.

### 70. 根据 (gēnjù) — Căn cứ theo / Dựa vào
> **根据**天气预报，明天会下雨。(Gēnjù tiānqì yùbào, míngtiān huì xiàyǔ.) — Theo dự báo thời tiết, ngày mai sẽ mưa.

### 71. 为了 (wèile) — Để / Vì mục đích
> **为了**健康，我每天运动。(Wèile jiànkāng, wǒ měi tiān yùndòng.) — Vì sức khỏe, tôi tập thể dục mỗi ngày.

### 72. 着 (zhe) mở rộng — V1着 + V2 (Trạng thái kèm hành động)
> 他笑**着**说。(Tā xiào zhe shuō.) — Anh ấy vừa cười vừa nói.
> 她站**着**等。(Tā zhàn zhe děng.) — Cô ấy đứng đợi.

### 73. 地 (de) — Trạng từ hóa
Tính từ/Trạng từ + 地 + V
> 他认真**地**学习。(Tā rènzhēn de xuéxí.) — Anh ấy học tập nghiêm túc.
> 她高兴**地**跑了过来。(Tā gāoxìng de pǎo le guòlái.) — Cô ấy vui vẻ chạy đến.

### 74. Bổ ngữ kết quả (Resultative Complement)
V + Kết quả
> 我听**懂**了。(Wǒ tīng dǒng le.) — Tôi nghe hiểu rồi.
> 作业做**完**了。(Zuòyè zuò wán le.) — Bài tập làm xong rồi.
> 你看**见**他了吗？(Nǐ kàn jiàn tā le ma?) — Bạn thấy anh ấy chưa?
> 我找**到**工作了。(Wǒ zhǎo dào gōngzuò le.) — Tôi tìm được việc rồi.

**Các bổ ngữ kết quả thường gặp:**
| Bổ ngữ | Nghĩa | Ví dụ |
|---------|--------|-------|
| 完 wán | xong | 吃完 (ăn xong) |
| 到 dào | được/đến | 买到 (mua được) |
| 见 jiàn | thấy | 听见 (nghe thấy) |
| 懂 dǒng | hiểu | 看懂 (đọc hiểu) |
| 好 hǎo | xong/ổn | 准备好 (chuẩn bị xong) |
| 错 cuò | sai | 写错 (viết sai) |
| 清楚 qīngchǔ | rõ | 看清楚 (nhìn rõ) |

### 75. Bổ ngữ xu hướng (Directional Complement)
V + 来/去/上/下/进/出/回/过/起
> 请进**来**。(Qǐng jìn lái.) — Mời vào.
> 他跑**出去**了。(Tā pǎo chūqù le.) — Anh ấy chạy ra ngoài rồi.
> 站**起来**！(Zhàn qǐlái!) — Đứng lên!
> 她拿**出**一本书**来**。(Tā ná chū yì běn shū lái.) — Cô ấy lấy ra một cuốn sách.

### 76. Bổ ngữ khả năng (Potential Complement)
V + 得/不 + Kết quả
> 我听**得**懂。(Wǒ tīng de dǒng.) — Tôi nghe hiểu được.
> 我听**不**懂。(Wǒ tīng bu dǒng.) — Tôi nghe không hiểu.
> 吃**得**完吗？(Chī de wán ma?) — Ăn hết được không?
> 来**不**及了！(Lái bu jí le!) — Không kịp rồi!

### 77. 多 (duō) / 少 (shǎo) + V — V nhiều/ít hơn
> **多**喝水。(Duō hē shuǐ.) — Uống nhiều nước vào.
> **少**吃糖。(Shǎo chī táng.) — Ăn ít đường thôi.
> **多**练习。(Duō liànxí.) — Luyện tập nhiều vào.

### 78. 快要…了 / 就要…了 (kuài yào…le / jiù yào…le) — Sắp…rồi
> 他**快要**毕业**了**。(Tā kuài yào bìyè le.) — Anh ấy sắp tốt nghiệp rồi.
> 飞机**就要**起飞**了**。(Fēijī jiù yào qǐfēi le.) — Máy bay sắp cất cánh rồi.

### 79. 刚 (gāng) / 刚才 (gāngcái) — Vừa mới
> 我**刚**到。(Wǒ gāng dào.) — Tôi vừa đến.
> **刚才**谁来了？(Gāngcái shéi lái le?) — Vừa nãy ai đến vậy?

### 80. 以前 (yǐqián) / 以后 (yǐhòu) — Trước đây / Sau này
> **以前**我不会做饭。(Yǐqián wǒ bú huì zuòfàn.) — Trước đây tôi không biết nấu ăn.
> 吃完饭**以后**我们去散步。(Chī wán fàn yǐhòu wǒmen qù sànbù.) — Ăn xong sau đó chúng ta đi dạo.

### 81. 的时候 (de shíhòu) — Khi / Lúc
> 我小**的时候**住在农村。(Wǒ xiǎo de shíhòu zhù zài nóngcūn.) — Lúc tôi còn nhỏ sống ở nông thôn.
> 下雨**的时候**别出去。(Xiàyǔ de shíhòu bié chūqù.) — Khi mưa đừng ra ngoài.

### 82. 是…的 (shì…de) — Nhấn mạnh thời gian/cách thức/nơi chốn
> 你**是**什么时候来**的**？(Nǐ shì shénme shíhòu lái de?) — Bạn đến lúc nào vậy?
> 我**是**坐飞机来**的**。(Wǒ shì zuò fēijī lái de.) — Tôi đến bằng máy bay đấy.

### 83. 不是…吗？ (búshì…ma?) — Chẳng phải…sao?
> 你**不是**说过要来**吗**？(Nǐ búshì shuō guò yào lái ma?) — Chẳng phải bạn nói sẽ đến sao?

### 84. 怎么 (zěnme) mở rộng — Sao lại / Thế nào mà
> 你**怎么**还没走？(Nǐ zěnme hái méi zǒu?) — Sao bạn vẫn chưa đi?
> **怎么**办？(Zěnme bàn?) — Làm sao bây giờ?

### 85. 多么 (duōme) — Biết bao / Thật là
> 多么美丽的地方！(Duōme měilì de dìfāng!) — Nơi đây đẹp biết bao!

### 86. 一下 (yíxià) — Một chút (làm nhẹ nhàng hơn)
> 请等**一下**。(Qǐng děng yíxià.) — Xin đợi một chút.
> 我看**一下**。(Wǒ kàn yíxià.) — Để tôi xem một chút.

### 87. V + 了 + Số + Lượng từ (Bổ ngữ số lượng)
> 我学**了**两年中文。(Wǒ xué le liǎng nián Zhōngwén.) — Tôi đã học 2 năm tiếng Trung.
> 他等**了**半个小时。(Tā děng le bàn gè xiǎoshí.) — Anh ấy đã đợi nửa tiếng.
> 我去**了**三次中国。(Wǒ qù le sān cì Zhōngguó.) — Tôi đã đi Trung Quốc 3 lần.

### 88. 跟…一样 (gēn…yíyàng) — Giống như
> 他**跟**我**一样**高。(Tā gēn wǒ yíyàng gāo.) — Anh ấy cao bằng tôi.
> 今天**跟**昨天**一样**热。(Jīntiān gēn zuótiān yíyàng rè.) — Hôm nay nóng giống hôm qua.

### 89. A 比 B + Adj + 多了 / 得多 — Hơn nhiều
> 他**比**我高**多了**。(Tā bǐ wǒ gāo duō le.) — Anh ấy cao hơn tôi nhiều.
> 这个**比**那个好**得多**。(Zhège bǐ nàge hǎo de duō.) — Cái này tốt hơn cái kia nhiều.

### 90. A 没有 B + Adj — Không bằng
> 我**没有**他高。(Wǒ méiyǒu tā gāo.) — Tôi không cao bằng anh ấy.
> 今天**没有**昨天冷。(Jīntiān méiyǒu zuótiān lěng.) — Hôm nay không lạnh bằng hôm qua.

### 91. 有点儿 (yǒudiǎnr) — Hơi (hàm ý tiêu cực)
> 我**有点儿**累。(Wǒ yǒudiǎnr lèi.) — Tôi hơi mệt.
> 这个菜**有点儿**咸。(Zhège cài yǒudiǎnr xián.) — Món này hơi mặn.

### 92. 差不多 (chàbuduō) — Gần như / Tương tự
> 他们两个**差不多**高。(Tāmen liǎng gè chàbuduō gāo.) — Hai người họ cao gần bằng nhau.
> **差不多**了，我们走吧。(Chàbuduō le, wǒmen zǒu ba.) — Gần xong rồi, chúng ta đi thôi.

### 93. 极了 (jí le) — Cực kỳ
> 今天热**极了**。(Jīntiān rè jí le.) — Hôm nay nóng cực kỳ.
> 好吃**极了**！(Hǎochī jí le!) — Ngon cực kỳ!

### 94. 应该 (yīnggāi) — Nên
> 你**应该**多休息。(Nǐ yīnggāi duō xiūxí.) — Bạn nên nghỉ ngơi nhiều hơn.
> 我们**应该**出发了。(Wǒmen yīnggāi chūfā le.) — Chúng ta nên xuất phát rồi.

### 95. 必须 (bìxū) — Phải / Bắt buộc
> 你**必须**按时完成。(Nǐ bìxū ànshí wánchéng.) — Bạn phải hoàn thành đúng hạn.

### 96. 不得不 (bùdébù) — Buộc phải / Không thể không
> 我**不得不**同意。(Wǒ bùdébù tóngyì.) — Tôi buộc phải đồng ý.

### 97. 或者…或者… — Hoặc…hoặc…
> 周末我**或者**看电影，**或者**逛街。(Zhōumò wǒ huòzhě kàn diànyǐng, huòzhě guàngjiē.) — Cuối tuần tôi hoặc xem phim, hoặc đi dạo phố.

### 98. 要是…就… (yàoshi…jiù…) — Nếu…thì… (口语, khẩu ngữ hơn 如果)
> **要是**你有空，**就**来我家吧。(Yàoshi nǐ yǒu kòng, jiù lái wǒ jiā ba.) — Nếu bạn rảnh thì đến nhà tôi nhé.

### 99. 那么 (nàme) — Vậy thì / Như vậy
> **那么**我们明天见。(Nàme wǒmen míngtiān jiàn.) — Vậy thì ngày mai gặp nhé.
> 他**那么**高！(Tā nàme gāo!) — Anh ấy cao vậy!

### 100. 可能 (kěnéng) — Có thể / Có lẽ
> 他**可能**不来了。(Tā kěnéng bù lái le.) — Anh ấy có lẽ không đến nữa.
> 明天**可能**下雨。(Míngtiān kěnéng xiàyǔ.) — Ngày mai có thể mưa.

## 📕 HSK 4 — NGỮ PHÁP TRUNG CẤP

### 101. 不得不 (bùdébù) — Buộc phải / Không thể không
> 老板很讨厌应酬，但是她**不得不**去。(Lǎobǎn hěn tǎoyàn yìngchóu, dànshì tā bùdébù qù.) — Sếp rất ghét tiếp khách nhưng bà ấy buộc phải đi.
> 我**不得不**承认自己错了。(Wǒ bùdébù chéngrèn zìjǐ cuò le.) — Tôi buộc phải thừa nhận mình sai.

### 102. 既然…就… (jìrán…jiù…) — Đã…thì… / Đã vậy thì…
> **既然**来了，**就**留下来吃饭吧。(Jìrán lái le, jiù liú xiàlái chīfàn ba.) — Đã đến rồi thì ở lại ăn cơm đi.
> **既然**你不喜欢，**就**别勉强了。(Jìrán nǐ bù xǐhuān, jiù bié miǎnqiǎng le.) — Đã không thích thì đừng miễn cưỡng.

### 103. 即使…也… (jíshǐ…yě…) — Cho dù…cũng… / Ngay cả khi…
> **即使**你没胃口，**也**要吃一点。(Jíshǐ nǐ méi wèikǒu, yě yào chī yìdiǎn.) — Cho dù không ngon miệng cũng phải ăn một chút.
> **即使**失败了，我**也**不后悔。(Jíshǐ shībài le, wǒ yě bù hòuhuǐ.) — Cho dù thất bại tôi cũng không hối hận.

### 104. 尽管…但是… (jǐnguǎn…dànshì…) — Mặc dù…nhưng…
> **尽管**我很生气，**但是**我没发脾气。(Jǐnguǎn wǒ hěn shēngqì, dànshì wǒ méi fā píqi.) — Mặc dù tôi rất giận nhưng tôi không nổi nóng.
> **尽管**很累，**但是**他还是坚持了。(Jǐnguǎn hěn lèi, dànshì tā háishì jiānchí le.) — Mặc dù rất mệt nhưng anh ấy vẫn kiên trì.

### 105. 不管/无论…都… (bùguǎn/wúlùn…dōu…) — Bất kể…đều… / Dù…cũng…
> **不管**身体好坏，他**都**工作到深夜。(Bùguǎn shēntǐ hǎo huài, tā dōu gōngzuò dào shēnyè.) — Bất kể sức khỏe tốt xấu, anh ấy đều làm việc đến khuya.
> **无论**天多热，**都**要坚持。(Wúlùn tiān duō rè, dōu yào jiānchí.) — Dù trời nóng đến mấy cũng phải kiên trì.

### 106. 除非…才… (chúfēi…cái…) — Trừ phi…mới…
> **除非**你求情，他**才**肯帮忙。(Chúfēi nǐ qiúqíng, tā cái kěn bāngmáng.) — Trừ phi bạn cầu xin, anh ấy mới chịu giúp.
> **除非**下雨，我们**才**不去。(Chúfēi xiàyǔ, wǒmen cái bù qù.) — Trừ phi mưa chúng tôi mới không đi.

### 107. 由于…… (yóuyú…) — Do / Vì (nguyên nhân, trang trọng)
> **由于**天气原因，我们的航班取消了。(Yóuyú tiānqì yuányīn, wǒmen de hángbān qǔxiāo le.) — Do thời tiết, chuyến bay của chúng tôi bị hủy.

### 108. 因此 (yīncǐ) — Vì vậy / Do đó (trang trọng)
> 这家饭店涨价了，**因此**顾客也少了。(Zhè jiā fàndiàn zhǎngjià le, yīncǐ gùkè yě shǎo le.) — Nhà hàng này tăng giá, do đó khách cũng ít đi.

### 109. 于是 (yúshì) — Thế là / Rồi thì
> 他实在太懒了，**于是**老板把他辞了。(Tā shízài tài lǎn le, yúshì lǎobǎn bǎ tā cí le.) — Anh ấy quá lười, thế là sếp sa thải anh ấy.

### 110. 既…又/也… (jì…yòu/yě…) — Vừa…vừa… (hai tính chất)
> 他做事情**既**快**又**好。(Tā zuò shìqíng jì kuài yòu hǎo.) — Anh ấy làm việc vừa nhanh vừa tốt.
> 这个地方**既**安静**又**方便。(Zhège dìfāng jì ānjìng yòu fāngbiàn.) — Nơi này vừa yên tĩnh vừa tiện lợi.

### 111. 不是…而是… (búshì…érshì…) — Không phải…mà là… (HSK4 mở rộng)
> 以后后悔的人不是我，**而是**你自己。(Yǐhòu hòuhuǐ de rén búshì wǒ, érshì nǐ zìjǐ.) — Sau này người hối hận không phải tôi mà là chính bạn.

### 112. 不但/不仅…而且/还… (búdàn/bùjǐn…érqiě/hái…) — Không những…mà còn… (HSK4 mở rộng)
> 他**不仅**喜欢吃中国菜，**而且**也会做几个中国菜！(Tā bùjǐn xǐhuān chī Zhōngguó cài, érqiě yě huì zuò jǐ ge Zhōngguó cài!) — Anh ấy không chỉ thích ăn món Trung mà còn biết làm vài món!

### 113. 把 cấu trúc mở rộng — 把 + O + V + Bổ ngữ thời lượng/tần suất
> 他**把**这本书看了三遍。(Tā bǎ zhè běn shū kàn le sān biàn.) — Anh ấy đọc cuốn sách này ba lần.
> 请**把**这个句子再读一遍。(Qǐng bǎ zhège jùzi zài dú yí biàn.) — Xin hãy đọc lại câu này một lần nữa.

### 114. 被/叫/让 bị động mở rộng — Dùng 叫/让 thay 被 (khẩu ngữ)
> 我的手机**叫**他拿走了。(Wǒ de shǒujī jiào tā ná zǒu le.) — Điện thoại tôi bị anh ấy lấy đi rồi.
> 那个蛋糕**让**孩子吃了。(Nàge dàngāo ràng háizi chī le.) — Cái bánh bị bọn trẻ ăn mất rồi.

### 115. 不如 (bùrú) — Không bằng / Chi bằng
A + 不如 + B
> 坐公共汽车**不如**坐地铁快。(Zuò gōnggòng qìchē bùrú zuò dìtiě kuài.) — Đi xe buýt không nhanh bằng đi tàu điện.
> 说得好**不如**做得好。(Shuō de hǎo bùrú zuò de hǎo.) — Nói hay không bằng làm giỏi.

### 116. 跟…相比 (gēn…xiāngbǐ) — So với…
> **跟**去年**相比**，今年的成绩好多了。(Gēn qùnián xiāngbǐ, jīnnián de chéngjì hǎo duō le.) — So với năm ngoái, thành tích năm nay tốt hơn nhiều.

### 117. 随着 (suízhe) — Theo / Cùng với (sự biến đổi)
> **随着**经济的发展，人们的生活越来越好。(Suízhe jīngjì de fāzhǎn, rénmen de shēnghuó yuè lái yuè hǎo.) — Cùng với sự phát triển kinh tế, cuộc sống người dân ngày càng tốt hơn.

### 118. 竟然 (jìngrán) — Không ngờ / Thật bất ngờ
> 我们要出发的时候，他**竟然**说不去了。(Wǒmen yào chūfā de shíhòu, tā jìngrán shuō bù qù le.) — Lúc chúng tôi sắp xuất phát, anh ấy không ngờ lại nói không đi nữa.

### 119. 究竟 (jiūjìng) — Rốt cuộc / Đến cùng
> 你**究竟**喜不喜欢我？(Nǐ jiūjìng xǐ bu xǐhuān wǒ?) — Rốt cuộc bạn có thích tôi không?
> 事情**究竟**是怎么回事？(Shìqíng jiūjìng shì zěnme huíshì?) — Chuyện rốt cuộc là thế nào?

### 120. 难道…吗？ (nándào…ma?) — Lẽ nào…sao? (câu hỏi tu từ)
> **难道**你不知道吗？(Nándào nǐ bù zhīdào ma?) — Lẽ nào bạn không biết sao?
> 这都是你引起的，**难道**你就不内疚？(Zhè dōu shì nǐ yǐnqǐ de, nándào nǐ jiù bù nèijiù?) — Đều do bạn gây ra, lẽ nào bạn không thấy có lỗi?

### 121. 恐怕 (kǒngpà) — E rằng / Có lẽ (lo lắng)
> **恐怕**今天做不完。(Kǒngpà jīntiān zuò bu wán.) — E rằng hôm nay không làm xong được.
> **恐怕**他不会来了。(Kǒngpà tā bú huì lái le.) — E rằng anh ấy sẽ không đến nữa.

### 122. 差点(儿) (chàdiǎnr) — Suýt / Gần như
> 我今天**差点儿**迟到了。(Wǒ jīntiān chàdiǎnr chídào le.) — Hôm nay tôi suýt trễ.
> 他**差点儿**摔倒了。(Tā chàdiǎnr shuāidǎo le.) — Anh ấy suýt ngã.

### 123. 原来 (yuánlái) — Hóa ra / Thì ra
> **原来**昨天那个人是你啊。(Yuánlái zuótiān nàge rén shì nǐ a.) — Hóa ra người hôm qua là bạn.
> **原来**你也在这儿！(Yuánlái nǐ yě zài zhèr!) — Hóa ra bạn cũng ở đây!

### 124. 本来 (běnlái) — Vốn dĩ / Ban đầu
> 搬家**本来**就很麻烦。(Bānjiā běnlái jiù hěn máfan.) — Chuyển nhà vốn dĩ đã rất phiền.
> 我**本来**想去，后来没去。(Wǒ běnlái xiǎng qù, hòulái méi qù.) — Tôi ban đầu định đi, sau đó không đi.

### 125. 结果 (jiéguǒ) — Kết quả là / Rốt cuộc
> 他没好好复习，**结果**没通过考试。(Tā méi hǎohāo fùxí, jiéguǒ méi tōngguò kǎoshì.) — Anh ấy không ôn tập tốt, kết quả là không qua kỳ thi.

### 126. 否则 (fǒuzé) — Nếu không thì
> 快点走，**否则**就来不及了。(Kuài diǎn zǒu, fǒuzé jiù lái bu jí le.) — Đi nhanh lên, nếu không thì không kịp đâu.

### 127. 千万 (qiānwàn) — Nhất định phải / Tuyệt đối (nhấn mạnh)
> 路上**千万**小心。(Lùshang qiānwàn xiǎoxīn.) — Trên đường nhất định phải cẩn thận nhé.
> **千万**别告诉他！(Qiānwàn bié gàosu tā!) — Tuyệt đối đừng nói cho anh ấy!

### 128. 甚至 (shènzhì) — Thậm chí
> 他们贡献出所有的精力，**甚至**最宝贵的生命。(Tāmen gòngxiàn chū suǒyǒu de jīnglì, shènzhì zuì bǎoguì de shēngmìng.) — Họ cống hiến hết sức lực, thậm chí cả sinh mạng quý giá nhất.
> 她忙得**甚至**没时间吃饭。(Tā máng de shènzhì méi shíjiān chīfàn.) — Cô ấy bận đến mức thậm chí không có thời gian ăn cơm.

### 129. 却 (què) — Nhưng lại / Lại (ngược lại)
> 他们一见钟情，**却**没有在一起。(Tāmen yíjiànzhōngqíng, què méiyǒu zài yìqǐ.) — Họ yêu nhau từ cái nhìn đầu tiên, nhưng lại không ở bên nhau.
> 我叫了他，他**却**假装没听见。(Wǒ jiào le tā, tā què jiǎzhuāng méi tīngjiàn.) — Tôi gọi anh ấy, nhưng anh ấy lại giả vờ không nghe thấy.

### 130. 倒 (dào) — Ngược lại / Trái lại
> 雨没有停，**倒**大起来了。(Yǔ méiyǒu tíng, dào dà qǐlái le.) — Mưa không ngừng, ngược lại còn to hơn.
> 你说得**倒**轻松。(Nǐ shuō de dào qīngsōng.) — Nói thì bạn nói nhẹ nhàng lắm nhỉ.

### 131. 不过 (búguò) — Nhưng mà / Tuy nhiên (nhẹ)
> 他的汉语口语不错，**不过**不认识汉字。(Tā de Hànyǔ kǒuyǔ búcuò, búguò bù rènshi Hànzì.) — Khẩu ngữ tiếng Trung của anh ấy khá tốt, nhưng mà không biết chữ Hán.

### 132. 由 (yóu) — Do / Bởi (chỉ người thực hiện)
> 这个项目**由**小李来完成。(Zhège xiàngmù yóu Xiǎo Lǐ lái wánchéng.) — Dự án này do Tiểu Lý hoàn thành.

### 133. 以为 (yǐwéi) — Tưởng là / Lầm tưởng
> 我**以为**你不是我的朋友。(Wǒ yǐwéi nǐ búshì wǒ de péngyǒu.) — Tôi tưởng bạn không phải bạn tôi.
> 大家**以为**他走了，其实他还在。(Dàjiā yǐwéi tā zǒu le, qíshí tā hái zài.) — Mọi người tưởng anh ấy đi rồi, thực ra anh ấy vẫn còn đây.

### 134. 通过 (tōngguò) — Thông qua
> 我们是**通过**他的朋友找到他的。(Wǒmen shì tōngguò tā de péngyǒu zhǎodào tā de.) — Chúng tôi thông qua bạn anh ấy tìm được anh ấy.
> **通过**努力学习，他终于通过了考试。(Tōngguò nǔlì xuéxí, tā zhōngyú tōngguò le kǎoshì.) — Thông qua nỗ lực học tập, cuối cùng anh ấy đã qua kỳ thi.

### 135. 值得 (zhídé) — Đáng / Xứng đáng
> 这个想法不错，**值得**考虑。(Zhège xiǎngfǎ búcuò, zhídé kǎolǜ.) — Ý tưởng này không tồi, đáng cân nhắc.
> 这本书很**值得**看。(Zhè běn shū hěn zhídé kàn.) — Cuốn sách này rất đáng đọc.

### 136. 来自 (láizì) — Đến từ / Xuất phát từ
> 我**来自**美国。(Wǒ láizì Měiguó.) — Tôi đến từ Mỹ.

### 137. 好像 (hǎoxiàng) — Hình như / Có vẻ như
> 他**好像**是英国人。(Tā hǎoxiàng shì Yīngguó rén.) — Anh ấy hình như là người Anh.
> 外面**好像**下雨了。(Wàimiàn hǎoxiàng xiàyǔ le.) — Bên ngoài hình như mưa rồi.

### 138. 得 (děi) — Phải (khẩu ngữ, tương đương 必须)
> 我们**得**走了。(Wǒmen děi zǒu le.) — Chúng ta phải đi thôi.
> 你**得**早点儿来。(Nǐ děi zǎo diǎnr lái.) — Bạn phải đến sớm hơn.

### 139. 不用 (búyòng) — Không cần / Khỏi phải
> **不用**担心。(Búyòng dānxīn.) — Không cần lo.
> **不用**谢。(Búyòng xiè.) — Không có gì / Khỏi cảm ơn.

### 140. 只好 (zhǐhǎo) — Đành phải
> 上个周末下雨了，我们**只好**待在家。(Shàng ge zhōumò xiàyǔ le, wǒmen zhǐhǎo dāi zài jiā.) — Cuối tuần trước mưa, chúng tôi đành phải ở nhà.

### 141. 最好 (zuìhǎo) — Tốt nhất nên
> 你**最好**先休息一下。(Nǐ zuìhǎo xiān xiūxi yíxià.) — Bạn tốt nhất nên nghỉ ngơi một chút.

### 142. 从来 (cónglái) — Từ trước đến nay / Luôn luôn
> 她**从来**不喝酒。(Tā cónglái bù hējiǔ.) — Cô ấy từ trước đến nay không uống rượu.
> 我**从来**没有去过美国。(Wǒ cónglái méiyǒu qù guò Měiguó.) — Tôi từ trước tới nay chưa từng đến Mỹ.

### 143. 所有 (suǒyǒu) — Tất cả
> 我喜欢吃**所有**我妈妈做的菜。(Wǒ xǐhuān chī suǒyǒu wǒ māma zuò de cài.) — Tôi thích ăn tất cả các món mẹ tôi nấu.

### 144. 任何 (rènhé) — Bất kỳ / Bất cứ
> **任何**人都不能说服他。(Rènhé rén dōu bù néng shuōfú tā.) — Bất kỳ ai cũng không thể thuyết phục anh ấy.

### 145. 其中 (qízhōng) — Trong đó
> 有五个人报名了，**其中**两个是女生。(Yǒu wǔ ge rén bàomíng le, qízhōng liǎng ge shì nǚshēng.) — Có năm người đăng ký, trong đó hai người là nữ.

### 146. 之一 (zhīyī) — Một trong (những)
> 你是我最好的朋友**之一**。(Nǐ shì wǒ zuì hǎo de péngyǒu zhīyī.) — Bạn là một trong những người bạn tốt nhất của tôi.

### 147. 另外 (lìngwài) — Ngoài ra / Cái khác
> 我有两个手机，一个是小米，**另**一个是iPhone。(Wǒ yǒu liǎng ge shǒujī, yí ge shì Xiǎomǐ, lìng yí ge shì iPhone.) — Tôi có hai điện thoại, một cái Xiaomi, cái còn lại là iPhone.

### 148. 再说 (zàishuō) — Hơn nữa / Vả lại
> 这么晚，别走了。**再说**，外面还在下雨。(Zhème wǎn, bié zǒu le. Zàishuō, wàimiàn hái zài xiàyǔ.) — Muộn thế này đừng đi nữa. Vả lại, bên ngoài vẫn đang mưa.

### 149. 挺…的 (tǐng…de) — Khá / Cũng…đấy
> 你男朋友**挺**帅**的**。(Nǐ nánpéngyǒu tǐng shuài de.) — Bạn trai bạn cũng đẹp trai đấy.

### 150. Adj + 死了 — Cực kỳ / …muốn chết
> 我今天累**死了**。(Wǒ jīntiān lèi sǐ le.) — Hôm nay tôi mệt muốn chết.
> 饿**死了**，快吃饭吧。(È sǐ le, kuài chīfàn ba.) — Đói muốn chết, ăn nhanh đi.

### 151. 正好 (zhènghǎo) — Vừa vặn / Đúng lúc
> 他**正好**问了我想问的问题。(Tā zhènghǎo wèn le wǒ xiǎng wèn de wèntí.) — Anh ấy hỏi đúng câu mà tôi muốn hỏi.

### 152. 害得 (hàide) — Làm cho / Khiến cho (hậu quả xấu)
> 老师给的作业太难了，**害得**我浪费了一个下午。(Lǎoshī gěi de zuòyè tài nán le, hàide wǒ làngfèi le yí ge xiàwǔ.) — Bài tập thầy giao quá khó, khiến tôi lãng phí cả buổi chiều.

### 153. 并 (bìng) + 不/没 — Hoàn toàn không (nhấn mạnh phủ định)
> 当金融分析人员**并**不是我的梦想。(Dāng jīnróng fēnxī rényuán bìng búshì wǒ de mèngxiǎng.) — Làm phân tích tài chính hoàn toàn không phải ước mơ của tôi.

### 154. 一方面…一方面… (yì fāngmiàn…yì fāngmiàn…) — Một mặt…mặt khác…
> **一方面**他很喜欢这份工作，**一方面**他又觉得工资太低。(Yì fāngmiàn tā hěn xǐhuān zhè fèn gōngzuò, yì fāngmiàn tā yòu juéde gōngzī tài dī.) — Một mặt anh ấy rất thích công việc này, mặt khác lại thấy lương quá thấp.

### 155. Adj + 是 + Adj，但是… — …thì có…, nhưng…
> 这个东西好**是**好，就是太贵了。(Zhège dōngxi hǎo shì hǎo, jiùshì tài guì le.) — Đồ này tốt thì có tốt, nhưng quá đắt.

### 156. 一…量词…比…一…量词… — Mỗi lúc một…hơn
> 天气**一**天**比一**天冷。(Tiānqì yì tiān bǐ yì tiān lěng.) — Thời tiết mỗi ngày một lạnh hơn.

function stripMd(text){
  return (text||'').replace(/\*\*(.*?)\*\*/g,'$1').trim();
}

function parseGrammarMd(md){
  const lines=(md||'').replace(/\r/g,'').split('\n');
  let level='';
  let current=null;
  const out=[];
  let levelCounter=0;
  const lessonMap={
    HSK1:[4,2,14,4,14,3,4,5,9,5,5,8,8,6,10,7,9,6,12,8],
    HSK2:[2,4,1,5,10,7,11,5,12,14,6,2,8,1,5,6,14,8,4,10,9,1,2,1,3,7,13,3,7,7],
    HSK3:[11,12,8,14,5,7,5,4,3,6,13,13,10,10,15,3,17,16,19,20,15,4,18,9,14,17,12,15,19,6,2,4,16,6,18,12,8,10,10,10,3,9,7,13,13,13,7,16,20,16],
    HSK4:[9,3,7,4,8,15,12,12,6,2,5,3,11,11,4,4,17,6,9,10,8,5,1,1,14,16,9,13,2,7,3,18,1,15,19,1,5,2,8,6,6,10,14,16,20,17,13,7,3,5,11,19,18,20,4,15,12,14,17,16]
  };

  function pushCurrent(){
    if(!current)return;
    current.note=current.noteLines.filter(Boolean).join('<br>');
    current.exZh=current.exZhLines.filter(Boolean).join('<br>');
    current.exPy=current.exPyLines.filter(Boolean).join('<br>');
    current.exVi=current.exViLines.filter(Boolean).join('<br>');
    delete current.noteLines;
    delete current.exZhLines;
    delete current.exPyLines;
    delete current.exViLines;
    out.push(current);
    current=null;
  }

  for(const raw of lines){
    const line=(raw||'').trim();
    if(!line || line==='---')continue;

    if(line.startsWith('## ')){
      if(line.includes('HSK 1'))level='HSK1';
      else if(line.includes('HSK 2'))level='HSK2';
      else if(line.includes('HSK 3'))level='HSK3';
      else if(line.includes('HSK 4'))level='HSK4';
      levelCounter=0;
      continue;
    }

    const h=line.match(/^###\s+(\d+)\.\s+(.*)$/);
    if(h){
      pushCurrent();
      const map=lessonMap[level]||[];
      const lessonNum=map[levelCounter]||1;
      levelCounter++;
      const title=stripMd(h[2]);
      current={
        level:level||'HSK',
        lesson:`Bài ${lessonNum}`,
        pattern:title,
        note:'',
        exZh:'',
        exPy:'',
        exVi:'',
        noteLines:[],
        exZhLines:[],
        exPyLines:[],
        exViLines:[]
      };
      continue;
    }

    if(!current)continue;
    if(line.startsWith('> ')){
      const s=stripMd(line.slice(2).trim());
      const m=s.match(/^(.*?)\s*[（(]\s*(.*?)\s*[)）]\s*(?:—|-)\s*(.*)$/);
      if(m){
        current.exZhLines.push(m[1].trim());
        current.exPyLines.push(m[2].trim());
        current.exViLines.push(m[3].trim());
      }else{
        current.exZhLines.push(s);
      }
      continue;
    }

    // Skip table rows; keep simple explanation lines
    if(line.startsWith('|'))continue;
    if(line.startsWith('**') && line.endsWith('**'))continue;
    current.noteLines.push(stripMd(line));
  }

  pushCurrent();
  return out;
}
