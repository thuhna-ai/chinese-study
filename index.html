  "3-13-然后":{zh:["我准备先去银行办点儿事，然后再去图书馆。","如果时间还够，晚上还想顺便去超市买点水果。"],py:["Wǒ zhǔn bèi xiān qù yín háng bàn diǎnr shì, rán hòu zài qù tú shū guǎn.","Rú guǒ shí jiān hái gòu, wǎn shang hái xiǎng shùn biàn qù chāo shì mǎi diǎn shuǐ guǒ."],vi:["Tôi định đến ngân hàng giải quyết chút việc trước rồi mới đi thư viện.","Nếu vẫn còn đủ thời gian, tối còn muốn tiện thể ghé siêu thị mua ít trái cây."]},
  "3-13-冰箱":{zh:["妈妈把买回来的牛奶和水果都放进了冰箱。","她说天气这么热，东西放在外面很容易坏。"],py:["Mā ma bǎ mǎi huí lái de niú nǎi hé shuǐ guǒ dōu fàng jìn le bīng xiāng.","Tā shuō tiān qì zhè me rè, dōng xi fàng zài wài mian hěn róng yì huài."],vi:["Mẹ cất hết sữa và trái cây mới mua vào tủ lạnh.","Mẹ nói trời nóng thế này, để đồ ở ngoài rất dễ hỏng."]},
  "3-13-洗澡":{zh:["打完球以后，我最想做的事就是先回去洗澡。","全身都是汗，不快点儿洗一下会很难受。"],py:["Dǎ wán qiú yǐ hòu, wǒ zuì xiǎng zuò de shì jiù shì xiān huí qù xǐ zǎo.","Quán shēn dōu shì hàn, bù kuài diǎnr xǐ yí xià huì hěn nán shòu."],vi:["Sau khi chơi bóng xong, việc tôi muốn làm nhất là về tắm ngay.","Cả người toàn mồ hôi, nếu không tắm nhanh một chút sẽ rất khó chịu."]},
  "3-13-一边":{zh:["他一边听老师讲课，一边认真做笔记。","所以每次考试以前，他复习起来都比较轻松。"],py:["Tā yì biān tīng lǎo shī jiǎng kè, yì biān rèn zhēn zuò bǐ jì.","Suǒ yǐ měi cì kǎo shì yǐ qián, tā fù xí qǐ lái dōu bǐ jiào qīng sōng."],vi:["Cậu ấy vừa nghe giáo viên giảng bài vừa ghi chép cẩn thận.","Vì vậy mỗi lần trước khi thi, việc ôn tập của cậu ấy đều khá nhẹ nhàng."]},
  "3-13-节目":{zh:["这个节目我已经看了好几次，可是还是觉得很有意思。","主持人说话很幽默，所以大家都喜欢他。"],py:["Zhè ge jié mù wǒ yǐ jīng kàn le hǎo jǐ cì, kě shì hái shi jué de hěn yǒu yì si.","Zhǔ chí rén shuō huà hěn yōu mò, suǒ yǐ dà jiā dōu xǐ huan tā."],vi:["Chương trình này tôi đã xem mấy lần rồi nhưng vẫn thấy rất thú vị.","Người dẫn chương trình nói chuyện rất hài hước nên ai cũng thích anh ấy."]},
  "3-13-月亮":{zh:["今天晚上天特别清楚，月亮也很亮。","我们吃完饭以后站在阳台上看了很久。"],py:["Jīn tiān wǎn shang tiān tè bié qīng chu, yuè liang yě hěn liàng.","Wǒ men chī wán fàn yǐ hòu zhàn zài yáng tái shàng kàn le hěn jiǔ."],vi:["Tối nay trời đặc biệt quang đãng, mặt trăng cũng rất sáng.","Sau khi ăn cơm xong, chúng tôi đứng ở ban công ngắm rất lâu."]},
  "3-14-留学":{zh:["我来中国留学已经两年了。","刚开始的时候很不习惯，现在却越来越喜欢这里的生活。"],py:["Wǒ lái Zhōng guó liú xué yǐ jīng liǎng nián le.","Gāng kāi shǐ de shí hou hěn bù xí guàn, xiàn zài què yuè lái yuè xǐ huan zhè lǐ de shēng huó."],vi:["Tôi đến Trung Quốc du học đã được hai năm.","Lúc mới đầu còn rất chưa quen, nhưng bây giờ lại ngày càng thích cuộc sống ở đây."]},
  "3-14-水平":{zh:["他的中文水平提高得很快。","以前聊天儿的时候还常常停下来想，现在已经自然多了。"],py:["Tā de Zhōng wén shuǐ píng tí gāo de hěn kuài.","Yǐ qián liáo tiānr de shí hou hái cháng cháng tíng xià lái xiǎng, xiàn zài yǐ jīng zì rán duō le."],vi:["Trình độ tiếng Trung của anh ấy tiến bộ rất nhanh.","Trước đây khi trò chuyện còn hay phải dừng lại suy nghĩ, bây giờ đã tự nhiên hơn nhiều rồi."]},
  "3-14-提高":{zh:["如果你想提高听力，就得每天都听一点儿。","只靠上课那一点儿时间，进步一定不会太快。"],py:["Rú guǒ nǐ xiǎng tí gāo tīng lì, jiù děi měi tiān dōu tīng yì diǎnr.","Zhǐ kào shàng kè nà yì diǎnr shí jiān, jìn bù yí dìng bú huì tài kuài."],vi:["Nếu bạn muốn nâng cao kỹ năng nghe thì phải nghe một ít mỗi ngày.","Chỉ dựa vào chút thời gian trên lớp thì nhất định sẽ không tiến bộ nhanh được."]},
  "3-14-练习":{zh:["我每天都会找十分钟练习发音。","虽然时间不长，可是坚持下来真的很有用。"],py:["Wǒ měi tiān dōu huì zhǎo shí fēn zhōng liàn xí fā yīn.","Suī rán shí jiān bù cháng, kě shì jiān chí xià lái zhēn de hěn yǒu yòng."],vi:["Mỗi ngày tôi đều dành mười phút để luyện phát âm.","Tuy thời gian không dài nhưng kiên trì như vậy thực sự rất có ích."]},
  "3-14-完成":{zh:["我昨晚把老师留的作业都完成了。","今天上课的时候终于可以放心一点儿了。"],py:["Wǒ zuó wǎn bǎ lǎo shī liú de zuò yè dōu wán chéng le.","Jīn tiān shàng kè de shí hou zhōng yú kě yǐ fàng xīn yì diǎnr le."],vi:["Tối qua tôi đã hoàn thành hết bài tập giáo viên giao.","Hôm nay lúc lên lớp cuối cùng cũng có thể yên tâm hơn một chút rồi."]},
  "3-14-句子":{zh:["这个句子虽然不长，可是语法有一点儿复杂。","我看了三遍以后，才明白为什么要这样说。"],py:["Zhè ge jù zi suī rán bù cháng, kě shì yǔ fǎ yǒu yì diǎnr fù zá.","Wǒ kàn le sān biàn yǐ hòu, cái míng bai wèi shén me yào zhè yàng shuō."],vi:["Câu này tuy không dài nhưng ngữ pháp hơi phức tạp.","Tôi đọc ba lần rồi mới hiểu tại sao lại phải nói như vậy."]},
  "3-14-其他":{zh:["大家都已经到了，其他人怎么还没来？","要是再等一会儿还不见他们，我们就先开始吧。"],py:["Dà jiā dōu yǐ jīng dào le, qí tā rén zěn me hái méi lái?","Yào shì zài děng yí huìr hái bù jiàn tā men, wǒ men jiù xiān kāi shǐ ba."],vi:["Mọi người đều đã đến rồi, sao những người khác vẫn chưa tới?","Nếu đợi thêm một lúc nữa vẫn không thấy họ thì chúng ta bắt đầu trước nhé."]},
  "3-15-城市":{zh:["我很喜欢这座城市的生活节奏。","白天很热闹，晚上也有很多安静的地方可以散步。"],py:["Wǒ hěn xǐ huan zhè zuò chéng shì de shēng huó jié zòu.","Bái tiān hěn rè nao, wǎn shang yě yǒu hěn duō ān jìng de dì fang kě yǐ sàn bù."],vi:["Tôi rất thích nhịp sống của thành phố này.","Ban ngày rất nhộn nhịp, buổi tối cũng có nhiều nơi yên tĩnh để đi dạo."]},
  "3-15-如果":{zh:["如果明天下午天气好，咱们就去公园拍照。","要是下雨的话，就改成在图书馆见面。"],py:["Rú guǒ míng tiān xià wǔ tiān qì hǎo, zán men jiù qù gōng yuán pāi zhào.","Yào shì xià yǔ de huà, jiù gǎi chéng zài tú shū guǎn jiàn miàn."],vi:["Nếu chiều mai thời tiết đẹp thì chúng ta sẽ ra công viên chụp ảnh.","Nếu trời mưa thì đổi thành gặp nhau ở thư viện."]},
  "3-15-认为":{zh:["我认为他说的话很有道理。","虽然听起来简单，可是认真想一想就会发现他说得对。"],py:["Wǒ rèn wéi tā shuō de huà hěn yǒu dào lǐ.","Suī rán tīng qǐ lái jiǎn dān, kě shì rèn zhēn xiǎng yi xiǎng jiù huì fā xiàn tā shuō de duì."],vi:["Tôi cho rằng lời anh ấy nói rất có lý.","Tuy nghe có vẻ đơn giản nhưng nếu suy nghĩ kỹ sẽ thấy anh ấy nói đúng."]},
  "3-15-皮鞋":{zh:["今天有一个比较正式的活动，所以他穿了一双黑皮鞋。","虽然走路没有运动鞋那么舒服，可是看起来更合适。"],py:["Jīn tiān yǒu yí ge bǐ jiào zhèng shì de huó dòng, suǒ yǐ tā chuān le yì shuāng hēi pí xié.","Suī rán zǒu lù méi yǒu yùn dòng xié nà me shū fu, kě shì kàn qǐ lái gèng hé shì."],vi:["Hôm nay có một hoạt động khá trang trọng nên anh ấy mang một đôi giày da đen.","Tuy đi không thoải mái bằng giày thể thao nhưng trông phù hợp hơn."]},
  "3-15-帽子":{zh:["外面的太阳太大了，你最好戴一顶帽子。","不然走一会儿，脸就会晒得很红。"],py:["Wài mian de tài yáng tài dà le, nǐ zuì hǎo dài yì dǐng mào zi.","Bù rán zǒu yí huìr, liǎn jiù huì shài de hěn hóng."],vi:["Ngoài trời nắng quá lớn, tốt nhất bạn nên đội một chiếc mũ.","Nếu không chỉ đi một lúc là mặt sẽ bị nắng làm đỏ lên."]},
  "3-15-别人":{zh:["做决定的时候，不要总是只听别人怎么说。","有些事情还是要自己想清楚以后再决定。"],py:["Zuò jué dìng de shí hou, bú yào zǒng shì zhǐ tīng bié rén zěn me shuō.","Yǒu xiē shì qing hái shi yào zì jǐ xiǎng qīng chu yǐ hòu zài jué dìng."],vi:["Khi đưa ra quyết định, đừng lúc nào cũng chỉ nghe người khác nói thế nào.","Có những việc vẫn phải tự nghĩ cho rõ rồi mới quyết định."]},
  "3-16-请假":{zh:["我今天身体不太舒服，所以想跟老师请半天假。","等明天好一点儿以后，我再把作业补上。"],py:["Wǒ jīn tiān shēn tǐ bù tài shū fu, suǒ yǐ xiǎng gēn lǎo shī qǐng bàn tiān jià.","Děng míng tiān hǎo yì diǎnr yǐ hòu, wǒ zài bǎ zuò yè bǔ shàng."],vi:["Hôm nay tôi không được khỏe lắm nên muốn xin giáo viên nghỉ nửa ngày.","Đợi ngày mai đỡ hơn tôi sẽ làm bù bài tập."]},
  "3-16-一共":{zh:["这些书和词典一共多少钱？","如果价格差不多，我想今天一次都买下来。"],py:["Zhè xiē shū hé cí diǎn yí gòng duō shǎo qián?","Rú guǒ jià gé chà bu duō, wǒ xiǎng jīn tiān yí cì dōu mǎi xià lái."],vi:["Những quyển sách và từ điển này tổng cộng bao nhiêu tiền?","Nếu giá chênh không nhiều thì hôm nay tôi muốn mua hết luôn một lần."]},
  "3-16-邻居":{zh:["我家新来的邻居很热情。","昨天我搬东西的时候，他还主动过来帮忙。"],py:["Wǒ jiā xīn lái de lín jū hěn rè qíng.","Zuó tiān wǒ bān dōng xi de shí hou, tā hái zhǔ dòng guò lái bāng máng."],vi:["Người hàng xóm mới nhà tôi rất nhiệt tình.","Hôm qua lúc tôi chuyển đồ, anh ấy còn chủ động qua giúp."]},
  "3-16-后来":{zh:["开始的时候我不太喜欢跑步。","后来坚持了几个月，才慢慢觉得它对身体真的有帮助。"],py:["Kāi shǐ de shí hou wǒ bù tài xǐ huan pǎo bù.","Hòu lái jiān chí le jǐ ge yuè, cái màn man jué de tā duì shēn tǐ zhēn de yǒu bāng zhù."],vi:["Lúc đầu tôi không thích chạy bộ lắm.","Sau này kiên trì mấy tháng rồi tôi mới dần thấy nó thật sự có ích cho sức khỏe."]},
  "3-16-爱好":{zh:["我的爱好不多，平时最喜欢看书和听音乐。","周末有空的时候，我也会带着照相机出去走走。"],py:["Wǒ de ài hào bù duō, píng shí zuì xǐ huan kàn shū hé tīng yīn yuè.","Zhōu mò yǒu kòng de shí hou, wǒ yě huì dài zhe zhào xiàng jī chū qù zǒu zǒu."],vi:["Sở thích của tôi không nhiều, bình thường thích nhất là đọc sách và nghe nhạc.","Cuối tuần rảnh tôi cũng sẽ mang máy ảnh ra ngoài đi dạo."]},
  "3-16-办法":{zh:["这道题我想了很久，还是没想到好办法。","最后只好去问老师，请他给我一点儿提示。"],py:["Zhè dào tí wǒ xiǎng le hěn jiǔ, hái shì méi xiǎng dào hǎo bàn fǎ.","Zuì hòu zhǐ hǎo qù wèn lǎo shī, qǐng tā gěi wǒ yì diǎnr tí shì."],vi:["Bài này tôi nghĩ rất lâu mà vẫn chưa ra cách hay.","Cuối cùng đành phải đi hỏi giáo viên xin một chút gợi ý."]},
  "3-16-饱":{zh:["中午我吃得特别饱，下午一点儿也不饿。","所以同学叫我去买点心的时候，我没有跟他们一起去。"],py:["Zhōng wǔ wǒ chī de tè bié bǎo, xià wǔ yì diǎnr yě bù è.","Suǒ yǐ tóng xué jiào wǒ qù mǎi diǎn xīn de shí hou, wǒ méi yǒu gēn tā men yì qǐ qù."],vi:["Trưa nay tôi ăn rất no nên chiều chẳng thấy đói chút nào.","Vì vậy lúc bạn học rủ đi mua điểm tâm, tôi đã không đi cùng họ."]},
  "3-16-为了":{zh:["为了准备这次考试，我这几个星期一直很认真。","每天晚上做完作业以后，我还会再复习半个小时。"],py:["Wèi le zhǔn bèi zhè cì kǎo shì, wǒ zhè jǐ ge xīng qī yì zhí hěn rèn zhēn.","Měi tiān wǎn shang zuò wán zuò yè yǐ hòu, wǒ hái huì zài fù xí bàn ge xiǎo shí."],vi:["Để chuẩn bị cho kỳ thi này, mấy tuần nay tôi luôn rất nghiêm túc.","Tối nào làm xong bài tập tôi cũng ôn thêm nửa tiếng nữa."]},
  "3-17-向":{zh:["出了地铁站以后，你先向右走。","看到银行以后再过马路，公园就在对面。"],py:["Chū le dì tiě zhàn yǐ hòu, nǐ xiān xiàng yòu zǒu.","Kàn dào yín háng yǐ hòu zài guò mǎ lù, gōng yuán jiù zài duì miàn."],vi:["Ra khỏi ga tàu điện ngầm rồi, bạn đi sang phải trước.","Nhìn thấy ngân hàng rồi băng qua đường, công viên sẽ ở đối diện."]},
  "3-17-万":{zh:["这台电脑要一万多块钱。","对学生来说，这个价格还是有一点儿贵。"],py:["Zhè tái diàn nǎo yào yí wàn duō kuài qián.","Duì xué sheng lái shuō, zhè ge jià gé hái shì yǒu yì diǎnr guì."],vi:["Chiếc máy tính này giá hơn một vạn tệ.","Đối với sinh viên mà nói thì mức giá này vẫn hơi đắt."]},
  "3-17-只":{zh:["我今天只带了一本词典，没有带课本。","幸好同桌愿意借书给我一起看。"],py:["Wǒ jīn tiān zhǐ dài le yì běn cí diǎn, méi yǒu dài kè běn.","Xìng hǎo tóng zhuō yuàn yì jiè shū gěi wǒ yì qǐ kàn."],vi:["Hôm nay tôi chỉ mang theo một cuốn từ điển, không mang sách giáo khoa.","May mà bạn cùng bàn sẵn lòng cho tôi mượn sách để xem cùng."]},
  "3-17-嘴":{zh:["天气太冷的时候，我的嘴很容易干。","所以冬天出门以前，我总会先喝一点儿水。"],py:["Tiān qì tài lěng de shí hou, wǒ de zuǐ hěn róng yì gān.","Suǒ yǐ dōng tiān chū mén yǐ qián, wǒ zǒng huì xiān hē yì diǎnr shuǐ."],vi:["Khi thời tiết quá lạnh, môi miệng tôi rất dễ bị khô.","Vì thế vào mùa đông, trước khi ra ngoài tôi luôn uống chút nước trước."]},
  "3-17-动物":{zh:["我从小就喜欢看关于动物的节目。","特别是熊猫和海豚，我总觉得它们很聪明。"],py:["Wǒ cóng xiǎo jiù xǐ huan kàn guān yú dòng wù de jié mù.","Tè bié shì xióng māo hé hǎi tún, wǒ zǒng jué de tā men hěn cōng ming."],vi:["Từ nhỏ tôi đã thích xem những chương trình về động vật.","Đặc biệt là gấu trúc và cá heo, tôi luôn cảm thấy chúng rất thông minh."]},
  "3-17-段":{zh:["这段路虽然不远，可是走起来有点儿累。","因为一直在上坡，我们都走得很慢。"],py:["Zhè duàn lù suī rán bù yuǎn, kě shì zǒu qǐ lái yǒu diǎnr lèi.","Yīn wèi yì zhí zài shàng pō, wǒ men dōu zǒu de hěn màn."],vi:["Đoạn đường này tuy không xa nhưng đi lại hơi mệt.","Vì cứ phải đi lên dốc nên chúng tôi đều đi rất chậm."]},
  "3-17-不但...而且":{zh:["这家书店不但很安静，而且离学校也近。","所以我周末常常一个人去那儿看书。"],py:["Zhè jiā shū diàn bú dàn hěn ān jìng, ér qiě lí xué xiào yě jìn.","Suǒ yǐ wǒ zhōu mò cháng cháng yí ge rén qù nàr kàn shū."],vi:["Hiệu sách này không những yên tĩnh mà còn gần trường nữa.","Vì vậy cuối tuần tôi thường một mình đến đó đọc sách."]},
  "3-18-耳朵":{zh:["外面刮风的时候，我的耳朵总觉得特别冷。","所以冬天出门，我一定会戴帽子。"],py:["Wài mian guā fēng de shí hou, wǒ de ěr duo zǒng jué de tè bié lěng.","Suǒ yǐ dōng tiān chū mén, wǒ yí dìng huì dài mào zi."],vi:["Khi ngoài trời có gió, tai tôi luôn cảm thấy đặc biệt lạnh.","Vì vậy mùa đông ra ngoài tôi nhất định sẽ đội mũ."]},
  "3-18-脸":{zh:["她刚跑完步，脸红得特别明显。","坐下休息了一会儿以后，才慢慢恢复正常。"],py:["Tā gāng pǎo wán bù, liǎn hóng de tè bié míng xiǎn.","Zuò xià xiū xi le yí huìr yǐ hòu, cái màn man huī fù zhèng cháng."],vi:["Cô ấy vừa chạy bộ xong nên mặt đỏ rất rõ.","Ngồi nghỉ một lát rồi mới dần trở lại bình thường."]},
  "3-18-短":{zh:["这件衣服的袖子对我来说有点儿短。","如果再长一点儿，穿起来会更舒服。"],py:["Zhè jiàn yī fu de xiù zi duì wǒ lái shuō yǒu diǎnr duǎn.","Rú guǒ zài cháng yì diǎnr, chuān qǐ lái huì gèng shū fu."],vi:["Tay áo của bộ đồ này đối với tôi hơi ngắn.","Nếu dài thêm một chút nữa thì mặc sẽ thoải mái hơn."]},
  "3-18-马":{zh:["我以前只在电视上看过马。","上次去旅行的时候，我才第一次离它那么近。"],py:["Wǒ yǐ qián zhǐ zài diàn shì shàng kàn guo mǎ.","Shàng cì qù lǚ xíng de shí hou, wǒ cái dì yī cì lí tā nà me jìn."],vi:["Trước đây tôi chỉ nhìn thấy ngựa trên tivi.","Lần trước đi du lịch tôi mới lần đầu tiên được đứng gần nó như vậy."]},
  "3-18-张":{zh:["我把那张照片一直放在书桌前面。","每次学习累了的时候，看一眼心情就会好一点儿。"],py:["Wǒ bǎ nà zhāng zhào piàn yì zhí fàng zài shū zhuō qián mian.","Měi cì xué xí lèi le de shí hou, kàn yì yǎn xīn qíng jiù huì hǎo yì diǎnr."],vi:["Tôi luôn đặt tấm ảnh đó ở trước bàn học.","Mỗi khi học mệt, chỉ cần nhìn một cái là tâm trạng sẽ tốt hơn một chút."]},
  "3-18-位":{zh:["刚才站在门口的那位是谁？","我觉得好像以前在哪儿见过他。"],py:["Gāng cái zhàn zài mén kǒu de nà wèi shì shéi?","Wǒ jué de hǎo xiàng yǐ qián zài nǎr jiàn guo tā."],vi:["Người vừa đứng ở cửa lúc nãy là ai vậy?","Tôi cảm thấy hình như trước đây đã gặp anh ấy ở đâu rồi."]},
  "3-18-有名":{zh:["这家饭店在附近很有名。","听说他们的面条不但好吃，而且价格也不贵。"],py:["Zhè jiā fàn diàn zài fù jìn hěn yǒu míng.","Tīng shuō tā men de miàn tiáo bú dàn hǎo chī, ér qiě jià gé yě bú guì."],vi:["Nhà hàng này rất nổi tiếng ở khu vực gần đây.","Nghe nói mì của họ không những ngon mà giá cũng không đắt."]},
  "3-18-秋天":{zh:["我最喜欢秋天，因为天气凉快又舒服。","周末去公园散步的时候，也不会像夏天那样流很多汗。"],py:["Wǒ zuì xǐ huan qiū tiān, yīn wèi tiān qì liáng kuai yòu shū fu.","Zhōu mò qù gōng yuán sàn bù de shí hou, yě bú huì xiàng xià tiān nà yàng liú hěn duō hàn."],vi:["Tôi thích mùa thu nhất vì thời tiết mát mẻ và dễ chịu.","Khi cuối tuần đi dạo công viên cũng không ra nhiều mồ hôi như mùa hè."]},
  "3-19-照相机":{zh:["我最近买了一台新的照相机。","如果周末天气好，我想带它去公园拍秋天的风景。"],py:["Wǒ zuì jìn mǎi le yì tái xīn de zhào xiàng jī.","Rú guǒ zhōu mò tiān qì hǎo, wǒ xiǎng dài tā qù gōng yuán pāi qiū tiān de fēng jǐng."],vi:["Gần đây tôi mua một chiếc máy ảnh mới.","Nếu cuối tuần thời tiết đẹp, tôi muốn mang nó ra công viên chụp phong cảnh mùa thu."]},
  "3-19-被":{zh:["我的伞昨天被同学拿错了。","幸好他后来发现了问题，又专门送回来给我。"],py:["Wǒ de sǎn zuó tiān bèi tóng xué ná cuò le.","Xìng hǎo tā hòu lái fā xiàn le wèn tí, yòu zhuān mén sòng huí lái gěi wǒ."],vi:["Cái ô của tôi hôm qua bị bạn học cầm nhầm mất.","May mà sau đó cậu ấy phát hiện ra và còn đem trả lại tận nơi cho tôi."]},
  "3-19-难过":{zh:["听到那个消息以后，她看起来特别难过。","大家都没有马上说话，只是安静地陪着她。"],py:["Tīng dào nà ge xiāo xi yǐ hòu, tā kàn qǐ lái tè bié nán guò.","Dà jiā dōu méi yǒu mǎ shàng shuō huà, zhǐ shì ān jìng de péi zhe tā."],vi:["Sau khi nghe tin đó, cô ấy trông rất buồn.","Mọi người đều không nói gì ngay mà chỉ lặng lẽ ở bên cạnh cô ấy."]},
  "3-19-东":{zh:["太阳刚从东边出来的时候，天还没有完全亮。","公园里的人不多，空气也特别新鲜。"],py:["Tài yáng gāng cóng dōng biān chū lái de shí hou, tiān hái méi yǒu wán quán liàng.","Gōng yuán lǐ de rén bù duō, kōng qì yě tè bié xīn xiān."],vi:["Khi mặt trời vừa mọc từ phía đông, trời vẫn chưa sáng hẳn.","Trong công viên không có nhiều người, không khí cũng rất trong lành."]},
  "3-19-信用卡":{zh:["这家店能不能刷信用卡？","我今天出门太急，身上没有带多少现金。"],py:["Zhè jiā diàn néng bu néng shuā xìn yòng kǎ?","Wǒ jīn tiān chū mén tài jí, shēn shang méi yǒu dài duō shǎo xiàn jīn."],vi:["Cửa hàng này có quẹt thẻ tín dụng được không?","Hôm nay tôi ra ngoài vội quá nên không mang theo nhiều tiền mặt."]},
  "3-19-关心":{zh:["谢谢你一直这么关心我。","每次我有困难的时候，你都会第一个来问我需不需要帮忙。"],py:["Xiè xie nǐ yì zhí zhè me guān xīn wǒ.","Měi cì wǒ yǒu kùn nan de shí hou, nǐ dōu huì dì yī ge lái wèn wǒ xū bú xū yào bāng máng."],vi:["Cảm ơn bạn đã luôn quan tâm đến tôi như vậy.","Mỗi lần tôi gặp khó khăn, bạn đều là người đầu tiên hỏi tôi có cần giúp không."]},
  "3-19-蓝":{zh:["今天的天空特别蓝，看起来一点儿云也没有。","这样的天气最适合出去拍照或者散步。"],py:["Jīn tiān de tiān kōng tè bié lán, kàn qǐ lái yì diǎnr yún yě méi yǒu.","Zhè yàng de tiān qì zuì shì hé chū qù pāi zhào huò zhě sàn bù."],vi:["Bầu trời hôm nay xanh đặc biệt, trông như chẳng có một gợn mây nào.","Thời tiết như thế này thích hợp nhất để ra ngoài chụp ảnh hoặc đi dạo."]},
  "3-19-只有...才":{zh:["只有每天坚持练习，口语才会越来越自然。","如果学两天就停下来，很难看到真正的变化。"],py:["Zhǐ yǒu měi tiān jiān chí liàn xí, kǒu yǔ cái huì yuè lái yuè zì rán.","Rú guǒ xué liǎng tiān jiù tíng xià lái, hěn nán kàn dào zhēn zhèng de biàn huà."],vi:["Chỉ có kiên trì luyện tập mỗi ngày thì khẩu ngữ mới ngày càng tự nhiên hơn.","Nếu học hai hôm rồi dừng lại thì rất khó thấy được sự thay đổi thật sự."]},
  "3-19-过":{zh:["我以前去过上海一次。","虽然只待了几天，可是那次旅行给我留下了很深的印象。"],py:["Wǒ yǐ qián qù guo Shàng hǎi yí cì.","Suī rán zhǐ dāi le jǐ tiān, kě shì nà cì lǚ xíng gěi wǒ liú xià le hěn shēn de yìn xiàng."],vi:["Trước đây tôi đã từng đến Thượng Hải một lần.","Tuy chỉ ở vài ngày nhưng chuyến đi đó đã để lại cho tôi ấn tượng rất sâu sắc."]},
  "3-19-成绩":{zh:["这次考试他的成绩提高了很多。","看来最近每天早起复习，真的很有效果。"],py:["Zhè cì kǎo shì tā de chéng jì tí gāo le hěn duō.","Kàn lái zuì jìn měi tiān zǎo qǐ fù xí, zhēn de hěn yǒu xiào guǒ."],vi:["Kết quả thi lần này của cậu ấy đã tiến bộ rất nhiều.","Có vẻ việc dạo này dậy sớm ôn bài mỗi ngày thật sự rất hiệu quả."]},
  "3-20-鸟":{zh:["早上我一打开窗户，就听见外面有很多鸟在叫。","虽然声音不大，可是让人觉得很有精神。"],py:["Zǎo shang wǒ yì dǎ kāi chuāng hu, jiù tīng jiàn wài mian yǒu hěn duō niǎo zài jiào.","Suī rán shēng yīn bù dà, kě shì ràng rén jué de hěn yǒu jīng shén."],vi:["Sáng ra tôi vừa mở cửa sổ là nghe bên ngoài có rất nhiều chim hót.","Tuy âm thanh không lớn nhưng khiến người ta cảm thấy rất có tinh thần."]},
  "3-20-碗":{zh:["晚上天气有点儿冷，我只想吃一碗热面。","如果再加一个鸡蛋，味道一定会更好。"],py:["Wǎn shang tiān qì yǒu diǎnr lěng, wǒ zhǐ xiǎng chī yì wǎn rè miàn.","Rú guǒ zài jiā yí ge jī dàn, wèi dào yí dìng huì gèng hǎo."],vi:["Tối nay thời tiết hơi lạnh, tôi chỉ muốn ăn một bát mì nóng.","Nếu cho thêm một quả trứng nữa thì hương vị nhất định sẽ ngon hơn."]},
  "3-20-起飞":{zh:["飞机还有半个小时就要起飞了。","所以我们得快一点儿去办手续，不能再慢慢走了。"],py:["Fēi jī hái yǒu bàn ge xiǎo shí jiù yào qǐ fēi le.","Suǒ yǐ wǒ men děi kuài yì diǎnr qù bàn shǒu xù, bù néng zài màn man zǒu le."],vi:["Máy bay còn nửa tiếng nữa là cất cánh.","Vì vậy chúng tôi phải nhanh lên để làm thủ tục, không thể đi chậm nữa."]},
  "3-20-愿意":{zh:["如果你愿意的话，周末可以跟我们一起去爬山。","路线不难，而且大家也都很好相处。"],py:["Rú guǒ nǐ yuàn yì de huà, zhōu mò kě yǐ gēn wǒ men yì qǐ qù pá shān.","Lù xiàn bù nán, ér qiě dà jiā yě dōu hěn hǎo xiāng chǔ."],vi:["Nếu bạn sẵn lòng thì cuối tuần có thể đi leo núi cùng chúng tôi.","Đường đi không khó mà mọi người cũng đều rất dễ hòa đồng."]},
  "3-20-一般":{zh:["这家店的菜不算难吃，不过味道也只是一般。","如果只是随便吃一顿饭，来这儿也可以。"],py:["Zhè jiā diàn de cài bú suàn nán chī, bú guò wèi dào yě zhǐ shì yì bān.","Rú guǒ zhǐ shì suí biàn chī yí dùn fàn, lái zhèr yě kě yǐ."],vi:["Món ăn của quán này không đến mức khó ăn, nhưng hương vị cũng chỉ bình thường thôi.","Nếu chỉ ăn tạm một bữa thì đến đây cũng được."]},
  "3-20-应该":{zh:["你昨天睡得太晚了，今天应该早点儿休息。","不然明天上课的时候一定会特别累。"],py:["Nǐ zuó tiān shuì de tài wǎn le, jīn tiān yīng gāi zǎo diǎnr xiū xi.","Bù rán míng tiān shàng kè de shí hou yí dìng huì tè bié lèi."],vi:["Hôm qua bạn ngủ quá muộn rồi, hôm nay nên nghỉ sớm hơn một chút.","Nếu không thì ngày mai lúc lên lớp nhất định sẽ rất mệt."]},
  "3-20-像":{zh:["这个孩子长得很像他妈妈。","不但眼睛一样大，连笑起来的样子也很像。"],py:["Zhè ge hái zi zhǎng de hěn xiàng tā mā ma.","Bú dàn yǎn jīng yí yàng dà, lián xiào qǐ lái de yàng zi yě hěn xiàng."],vi:["Đứa trẻ này trông rất giống mẹ nó.","Không những đôi mắt to giống hệt mà ngay cả dáng cười cũng rất giống."]},
  "3-20-盘子":{zh:["桌子上已经没有干净的盘子了。","我去厨房再拿两个出来吧。"],py:["Zhuō zi shàng yǐ jīng méi yǒu gān jìng de pán zi le.","Wǒ qù chú fáng zài ná liǎng ge chū lái ba."],vi:["Trên bàn đã không còn đĩa sạch nữa rồi.","Để tôi vào bếp lấy thêm hai cái ra nhé."]},
  "3-20-经常":{zh:["我经常晚上一个人去操场走路。","安静地走半个小时以后，心情会轻松很多。"],py:["Wǒ jīng cháng wǎn shang yí ge rén qù cāo chǎng zǒu lù.","Ān jìng de zǒu bàn ge xiǎo shí yǐ hòu, xīn qíng huì qīng sōng hěn duō."],vi:["Tôi thường buổi tối một mình ra sân trường đi bộ.","Đi yên lặng nửa tiếng đồng hồ xong thì tâm trạng sẽ nhẹ nhõm hơn nhiều."]},
  "3-20-刮风":{zh:["今天外面一直在刮风，所以我没有去跑步。","我待在宿舍里看书，顺便把窗户关好了。"],py:["Jīn tiān wài mian yì zhí zài guā fēng, suǒ yǐ wǒ méi yǒu qù pǎo bù.","Wǒ dāi zài sù shè lǐ kàn shū, shùn biàn bǎ chuāng hu guān hǎo le."],vi:["Hôm nay bên ngoài gió thổi suốt nên tôi không đi chạy bộ.","Tôi ở trong ký túc xá đọc sách và tiện thể đóng chặt cửa sổ lại."]},
  "3-20-简单":{zh:["这个问题看起来很简单，可是回答起来不太容易。","我想了一会儿，才慢慢找到合适的说法。"],py:["Zhè ge wèn tí kàn qǐ lái hěn jiǎn dān, kě shì huí dá qǐ lái bù tài róng yì.","Wǒ xiǎng le yí huìr, cái màn man zhǎo dào hé shì de shuō fǎ."],vi:["Câu hỏi này nhìn có vẻ rất đơn giản nhưng trả lời lại không dễ lắm.","Tôi suy nghĩ một lúc rồi mới dần tìm được cách nói phù hợp."]},
  "3-20-中间":{zh:["这张照片里，我站在最中间。","左边是我弟弟，右边是我最好的朋友。"],py:["Zhè zhāng zhào piàn lǐ, wǒ zhàn zài zuì zhōng jiān.","Zuǒ biān shì wǒ dì di, yòu biān shì wǒ zuì hǎo de péng you."],vi:["Trong tấm ảnh này, tôi đứng ở chính giữa.","Bên trái là em trai tôi, bên phải là người bạn thân nhất của tôi."]},
  "3-20-需要":{zh:["如果你需要帮忙，就直接告诉我。","只要我有时间，一定会过来。"],py:["Rú guǒ nǐ xū yào bāng máng, jiù zhí jiē gào su wǒ.","Zhǐ yào wǒ yǒu shí jiān, yí dìng huì guò lái."],vi:["Nếu bạn cần giúp đỡ thì cứ nói thẳng với tôi.","Chỉ cần tôi có thời gian thì nhất định sẽ qua."]},
  "3-20-忘记":{zh:["我今天早上太着急了，结果忘记带学生卡。","到了学校门口才发现，只好又跑回去拿。"],py:["Wǒ jīn tiān zǎo shang tài zháo jí le, jié guǒ wàng jì dài xué sheng kǎ.","Dào le xué xiào mén kǒu cái fā xiàn, zhǐ hǎo yòu pǎo huí qù ná."],vi:["Sáng nay tôi vội quá nên quên mang theo thẻ sinh viên.","Đến cổng trường mới phát hiện ra, đành phải chạy về lấy lại."]},
  "3-20-必须":{zh:["这份表格你今天必须交上去。","如果再晚一点儿，老师就没办法帮你安排了。"],py:["Zhè fèn biǎo gé nǐ jīn tiān bì xū jiāo shàng qù.","Rú guǒ zài wǎn yì diǎnr, lǎo shī jiù méi bàn fǎ bāng nǐ ān pái le."],vi:["Mẫu đơn này hôm nay bạn bắt buộc phải nộp lên.","Nếu chậm thêm một chút nữa thì giáo viên sẽ không thể sắp xếp giúp bạn được."]},
  "3-20-新闻":{zh:["我每天早上吃早饭的时候都会看一会儿新闻。","这样出门以前，就能知道今天发生了什么事。"],py:["Wǒ měi tiān zǎo shang chī zǎo fàn de shí hou dōu huì kàn yí huìr xīn wén.","Zhè yàng chū mén yǐ qián, jiù néng zhī dào jīn tiān fā shēng le shén me shì."],vi:["Mỗi sáng lúc ăn sáng tôi đều xem tin tức một lát.","Như vậy trước khi ra ngoài tôi sẽ biết hôm nay đã xảy ra những gì."]},
  "3-20-环境":{zh:["我很喜欢这家咖啡馆的环境。","虽然人不多，可是灯光很舒服，也很适合看书。"],py:["Wǒ hěn xǐ huan zhè jiā kā fēi guǎn de huán jìng.","Suī rán rén bù duō, kě shì dēng guāng hěn shū fu, yě hěn shì hé kàn shū."],vi:["Tôi rất thích không gian của quán cà phê này.","Tuy không đông người nhưng ánh đèn rất dễ chịu và cũng rất hợp để đọc sách."]},
  "3-20-附近":{zh:["学校附近新开了一家书店。","听说里面不但有中文小说，还有很多词典。"],py:["Xué xiào fù jìn xīn kāi le yì jiā shū diàn.","Tīng shuō lǐ mian bú dàn yǒu Zhōng wén xiǎo shuō, hái yǒu hěn duō cí diǎn."],vi:["Gần trường mới mở một hiệu sách.","Nghe nói bên trong không những có tiểu thuyết tiếng Trung mà còn có rất nhiều từ điển."]},
  "3-20-公园":{zh:["周末天气好的时候，我喜欢去公园散步。","走一走、看看树和花，心情就会慢慢变好。"],py:["Zhōu mò tiān qì hǎo de shí hou, wǒ xǐ huan qù gōng yuán sàn bù.","Zǒu yi zǒu, kàn kan shù hé huā, xīn qíng jiù huì màn man biàn hǎo."],vi:["Cuối tuần khi thời tiết đẹp, tôi thích ra công viên đi dạo.","Đi một chút, ngắm cây và hoa là tâm trạng sẽ dần tốt lên."]},
  "3-20-影响":{zh:["晚上睡得太晚，第二天一定会影响上课的状态。","所以最近我都在提醒自己早点儿休息。"],py:["Wǎn shang shuì de tài wǎn, dì èr tiān yí dìng huì yǐng xiǎng shàng kè de zhuàng tài.","Suǒ yǐ zuì jìn wǒ dōu zài tí xǐng zì jǐ zǎo diǎnr xiū xi."],vi:["Tối ngủ quá muộn thì hôm sau nhất định sẽ ảnh hưởng đến trạng thái học tập.","Vì vậy gần đây tôi luôn tự nhắc mình nghỉ sớm hơn."]},
  "3-20-主要":{zh:["这次迟到的主要原因是路上堵车。","不过我也应该早点儿出门，不然总会很紧张。"],py:["Zhè cì chí dào de zhǔ yào yuán yīn shì lù shàng dǔ chē.","Bú guò wǒ yě yīng gāi zǎo diǎnr chū mén, bù rán zǒng huì hěn jǐn zhāng."],vi:["Nguyên nhân chủ yếu của lần đi muộn này là tắc đường.","Tuy vậy tôi cũng nên ra ngoài sớm hơn, nếu không lúc nào cũng sẽ rất căng thẳng."]},
  "3-20-黑板":{zh:["老师在黑板上写了几个重要的词。","我怕自己回去以后会忘记，就马上抄进了笔记本里。"],py:["Lǎo shī zài hēi bǎn shàng xiě le jǐ ge zhòng yào de cí.","Wǒ pà zì jǐ huí qù yǐ hòu huì wàng jì, jiù mǎ shàng chāo jìn le bǐ jì běn lǐ."],vi:["Giáo viên viết vài từ quan trọng lên bảng đen.","Tôi sợ về rồi sẽ quên nên liền chép ngay vào sổ ghi chép."]},
  "3-20-声音":{zh:["她的声音不大，可是说话特别清楚。","坐在教室最后面的同学也都能听明白。"],py:["Tā de shēng yīn bú dà, kě shì shuō huà tè bié qīng chu.","Zuò zài jiào shì zuì hòu mian de tóng xué yě dōu néng tīng míng bai."],vi:["Giọng của cô ấy không lớn nhưng nói rất rõ ràng.","Ngay cả những bạn ngồi cuối lớp cũng đều có thể nghe hiểu."]},
  "4-1-法律":{zh:["姐姐大学毕业以后决定学习法律。","她说了解法律以后，才能更认真地帮助别人。"],py:["Jiě jie dà xué bì yè yǐ hòu jué dìng xué xí fǎ lǜ.","Tā shuō liǎo jiě fǎ lǜ yǐ hòu, cái néng gèng rèn zhēn de bāng zhù bié rén."],vi:["Chị gái sau khi tốt nghiệp đại học đã quyết định học luật.","Chị ấy nói rằng sau khi hiểu pháp luật thì mới có thể giúp người khác nghiêm túc hơn."]},
  "4-1-俩":{zh:["我们俩下课以后没有马上回家。","我们坐在操场旁边，一边聊天儿一边背新单词。"],py:["Wǒ men liǎ xià kè yǐ hòu méi yǒu mǎ shàng huí jiā.","Wǒ men zuò zài cāo chǎng páng biān, yì biān liáo tiānr yì biān bèi xīn dān cí."],vi:["Hai chúng tôi sau giờ học đã không về nhà ngay.","Chúng tôi ngồi bên cạnh sân trường, vừa trò chuyện vừa học thuộc từ mới."]},
  "4-1-印象":{zh:["我第一次见那位老师的时候，印象就很好。","他说话不快，可是每一句都特别清楚。"],py:["Wǒ dì yī cì jiàn nà wèi lǎo shī de shí hou, yìn xiàng jiù hěn hǎo.","Tā shuō huà bú kuài, kě shì měi yí jù dōu tè bié qīng chu."],vi:["Lần đầu tiên gặp vị giáo viên đó, tôi đã có ấn tượng rất tốt.","Thầy nói không nhanh, nhưng mỗi câu đều đặc biệt rõ ràng."]},
  "4-1-深":{zh:["那次北京旅行给我留下了很深的印象。","到现在我一看到照片，还会想起长城上的风。"],py:["Nà cì Běi jīng lǚ xíng gěi wǒ liú xià le hěn shēn de yìn xiàng.","Dào xiàn zài wǒ yí kàn dào zhào piàn, hái huì xiǎng qǐ Cháng Chéng shàng de fēng."],vi:["Chuyến đi Bắc Kinh đó đã để lại cho tôi ấn tượng rất sâu.","Đến bây giờ mỗi khi nhìn thấy ảnh, tôi vẫn nhớ đến gió trên Vạn Lý Trường Thành."]},
  "4-1-熟悉":{zh:["我刚搬到这儿的时候，谁也不认识。","住了半年以后，我已经熟悉附近的街道和商店了。"],py:["Wǒ gāng bān dào zhèr de shí hou, shéi yě bù rèn shi.","Zhù le bàn nián yǐ hòu, wǒ yǐ jīng shú xī fù jìn de jiē dào hé shāng diàn le."],vi:["Khi mới chuyển tới đây, tôi không quen biết ai cả.","Sau nửa năm sống ở đây, tôi đã quen thuộc với đường phố và cửa hàng xung quanh rồi."]},
  "4-1-不仅":{zh:["他不仅会说中文，而且会写得很漂亮。","每次老师请他回答问题，大家都听得很认真。"],py:["Tā bù jǐn huì shuō Zhōng wén, ér qiě huì xiě de hěn piào liang.","Měi cì lǎo shī qǐng tā huí dá wèn tí, dà jiā dōu tīng de hěn rèn zhēn."],vi:["Anh ấy không chỉ nói được tiếng Trung mà còn viết rất đẹp.","Mỗi lần giáo viên mời anh ấy trả lời câu hỏi, mọi người đều nghe rất chăm chú."]},
  "4-1-性格":{zh:["新来的同学性格很安静。","虽然他平时话不多，但是对每个人都很有礼貌。"],py:["Xīn lái de tóng xué xìng gé hěn ān jìng.","Suī rán tā píng shí huà bù duō, dàn shì duì měi ge rén dōu hěn yǒu lǐ mào."],vi:["Bạn học mới có tính cách rất trầm.","Tuy bình thường cậu ấy không nói nhiều, nhưng với ai cũng rất lịch sự."]},
  "4-1-开玩笑":{zh:["他刚才说自己明天不考试，我还真的相信了。","后来大家都笑了，我才知道他是在开玩笑。"],py:["Tā gāng cái shuō zì jǐ míng tiān bù kǎo shì, wǒ hái zhēn de xiāng xìn le.","Hòu lái dà jiā dōu xiào le, wǒ cái zhī dào tā shì zài kāi wán xiào."],vi:["Lúc nãy anh ấy nói ngày mai mình không phải thi, tôi còn tin là thật.","Sau đó mọi người đều cười, tôi mới biết anh ấy đang nói đùa."]},
  "4-1-从来":{zh:["我从来不在上课的时候看手机。","因为我知道一分心，就听不懂老师后面的话了。"],py:["Wǒ cóng lái bù zài shàng kè de shí hou kàn shǒu jī.","Yīn wèi wǒ zhī dào yì fēn xīn, jiù tīng bù dǒng lǎo shī hòu mian de huà le."],vi:["Tôi chưa bao giờ xem điện thoại trong lúc học.","Vì tôi biết chỉ cần mất tập trung một chút là sẽ không hiểu lời giáo viên nói tiếp theo."]},
  "4-1-最好":{zh:["你明天要坐很早的车，今晚最好早点儿休息。","如果睡得太晚，路上一定会觉得很累。"],py:["Nǐ míng tiān yào zuò hěn zǎo de chē, jīn wǎn zuì hǎo zǎo diǎnr xiū xi.","Rú guǒ shuì de tài wǎn, lù shàng yí dìng huì jué de hěn lèi."],vi:["Ngày mai bạn phải đi xe rất sớm, tối nay tốt nhất nên nghỉ ngơi sớm.","Nếu ngủ quá muộn thì trên đường nhất định sẽ thấy rất mệt."]},
  "4-1-共同":{zh:["我们虽然来自不同的国家，但是有很多共同的话题。","一谈到电影和音乐，大家就聊个不停。"],py:["Wǒ men suī rán lái zì bù tóng de guó jiā, dàn shì yǒu hěn duō gòng tóng de huà tí.","Yì tán dào diàn yǐng hé yīn yuè, dà jiā jiù liáo ge bù tíng."],vi:["Chúng tôi tuy đến từ những quốc gia khác nhau nhưng có rất nhiều chủ đề chung.","Hễ nhắc đến phim ảnh và âm nhạc là mọi người nói chuyện mãi không ngừng."]},
  "4-1-适合":{zh:["这双鞋很轻，特别适合去旅行的时候穿。","走了一整天以后，脚也不会太累。"],py:["Zhè shuāng xié hěn qīng, tè bié shì hé qù lǚ xíng de shí hou chuān.","Zǒu le yì zhěng tiān yǐ hòu, jiǎo yě bú huì tài lèi."],vi:["Đôi giày này rất nhẹ, đặc biệt phù hợp để mang khi đi du lịch.","Sau khi đi bộ cả ngày, chân cũng sẽ không quá mệt."]},
  "4-1-幸福":{zh:["晚饭以后，一家人坐在一起喝茶聊天儿。","那一刻我觉得，平常的生活也可以很幸福。"],py:["Wǎn fàn yǐ hòu, yì jiā rén zuò zài yì qǐ hē chá liáo tiānr.","Nà yí kè wǒ jué de, píng cháng de shēng huó yě kě yǐ hěn xìng fú."],vi:["Sau bữa tối, cả nhà ngồi cùng nhau uống trà và trò chuyện.","Khoảnh khắc đó tôi cảm thấy cuộc sống bình thường cũng có thể rất hạnh phúc."]},
  "4-1-刚":{zh:["我刚到教室，老师就开始点名了。","幸好今天路上不堵车，不然我又要迟到了。"],py:["Wǒ gāng dào jiào shì, lǎo shī jiù kāi shǐ diǎn míng le.","Xìng hǎo jīn tiān lù shàng bù dǔ chē, bù rán wǒ yòu yào chí dào le."],vi:["Tôi vừa mới đến lớp thì giáo viên bắt đầu điểm danh.","May mà hôm nay đường không tắc, nếu không tôi lại đi học muộn rồi."]},
  "4-1-浪漫":{zh:["海边的夜晚很安静，也很浪漫。","我们一边散步，一边听远处传来的音乐。"],py:["Hǎi biān de yè wǎn hěn ān jìng, yě hěn làng màn.","Wǒ men yì biān sàn bù, yì biān tīng yuǎn chù chuán lái de yīn yuè."],vi:["Buổi tối ở bờ biển rất yên tĩnh và cũng rất lãng mạn.","Chúng tôi vừa đi dạo vừa nghe tiếng nhạc vọng lại từ xa."]},
  "4-1-够":{zh:["今天带的钱不够，所以我只买了一本书。","剩下那本词典，我打算下个月再来买。"],py:["Jīn tiān dài de qián bú gòu, suǒ yǐ wǒ zhǐ mǎi le yì běn shū.","Shèng xià nà běn cí diǎn, wǒ dǎ suàn xià ge yuè zài lái mǎi."],vi:["Hôm nay tiền mang theo không đủ nên tôi chỉ mua một quyển sách.","Cuốn từ điển còn lại, tôi dự định tháng sau sẽ quay lại mua."]},
  "4-1-缺点":{zh:["每个人都有缺点，没有人真的十全十美。","重要的是知道自己的问题，然后慢慢改。"],py:["Měi ge rén dōu yǒu quē diǎn, méi yǒu rén zhēn de shí quán shí měi.","Zhòng yào de shì zhī dào zì jǐ de wèn tí, rán hòu màn man gǎi."],vi:["Ai cũng có khuyết điểm, không có ai thật sự hoàn hảo cả.","Quan trọng là biết vấn đề của mình rồi dần dần sửa đổi."]},
  "4-1-接受":{zh:["刚开始的时候，我不太能接受老师的批评。","后来我明白了，他是希望我进步得更快。"],py:["Gāng kāi shǐ de shí hou, wǒ bú tài néng jiē shòu lǎo shī de pī píng.","Hòu lái wǒ míng bai le, tā shì xī wàng wǒ jìn bù de gèng kuài."],vi:["Lúc ban đầu tôi không dễ chấp nhận lời phê bình của giáo viên.","Sau này tôi hiểu rằng thầy muốn tôi tiến bộ nhanh hơn."]},
  "4-1-羡慕":{zh:["我很羡慕那个同学的发音。","他平时练习得特别认真，所以现在说得很自然。"],py:["Wǒ hěn xiàn mù nà ge tóng xué de fā yīn.","Tā píng shí liàn xí de tè bié rèn zhēn, suǒ yǐ xiàn zài shuō de hěn zì rán."],vi:["Tôi rất ngưỡng mộ cách phát âm của bạn học đó.","Bình thường cậu ấy luyện tập đặc biệt chăm chỉ nên bây giờ nói rất tự nhiên."]},
  "4-1-爱情":{zh:["爷爷奶奶年轻时候的爱情故事很简单。","可是他们互相陪伴了这么多年，让我特别感动。"],py:["Yé ye nǎi nai nián qīng de shí hou de ài qíng gù shi hěn jiǎn dān.","Kě shì tā men hù xiāng péi bàn le zhè me duō nián, ràng wǒ tè bié gǎn dòng."],vi:["Câu chuyện tình yêu thời trẻ của ông bà tôi rất giản dị.","Nhưng họ đã đồng hành cùng nhau suốt bao năm khiến tôi vô cùng cảm động."]},
  "4-1-星星":{zh:["昨晚天气特别好，天上有很多星星。","我们关了灯以后，坐在阳台上看了很久。"],py:["Zuó wǎn tiān qì tè bié hǎo, tiān shàng yǒu hěn duō xīng xing.","Wǒ men guān le dēng yǐ hòu, zuò zài yáng tái shàng kàn le hěn jiǔ."],vi:["Tối qua thời tiết đặc biệt đẹp, trên trời có rất nhiều ngôi sao.","Sau khi tắt đèn, chúng tôi ngồi trên ban công ngắm rất lâu."]},
  "4-1-即使":{zh:["即使明天很忙，我也要抽时间复习。","因为这次考试对我来说真的很重要。"],py:["Jí shǐ míng tiān hěn máng, wǒ yě yào chōu shí jiān fù xí.","Yīn wèi zhè cì kǎo shì duì wǒ lái shuō zhēn de hěn zhòng yào."],vi:["Cho dù ngày mai rất bận, tôi cũng phải dành thời gian ôn bài.","Vì kỳ thi lần này đối với tôi thật sự rất quan trọng."]},
  "4-1-加班":{zh:["爸爸这几天一直在公司加班。","所以我们每天都等他回家以后才一起吃晚饭。"],py:["Bà ba zhè jǐ tiān yì zhí zài gōng sī jiā bān.","Suǒ yǐ wǒ men měi tiān dōu děng tā huí jiā yǐ hòu cái yì qǐ chī wǎn fàn."],vi:["Mấy ngày nay bố tôi luôn phải tăng ca ở công ty.","Vì thế mỗi ngày cả nhà đều đợi bố về rồi mới cùng ăn tối."]},
  "4-1-亮":{zh:["今天晚上月亮特别亮。","不用开太多灯，院子里也看得很清楚。"],py:["Jīn tiān wǎn shang yuè liang tè bié liàng.","Bú yòng kāi tài duō dēng, yuàn zi lǐ yě kàn de hěn qīng chu."],vi:["Tối nay mặt trăng đặc biệt sáng.","Không cần bật quá nhiều đèn mà trong sân vẫn nhìn rất rõ."]},
  "4-1-感动":{zh:["朋友悄悄帮我准备了生日蛋糕，我特别感动。","我本来以为大家都忘了，没想到他们记得这么清楚。"],py:["Péng you qiāo qiāo bāng wǒ zhǔn bèi le shēng rì dàn gāo, wǒ tè bié gǎn dòng.","Wǒ běn lái yǐ wéi dà jiā dōu wàng le, méi xiǎng dào tā men jì de zhè me qīng chu."],vi:["Bạn tôi lặng lẽ chuẩn bị bánh sinh nhật cho tôi, tôi vô cùng cảm động.","Ban đầu tôi tưởng mọi người đều quên rồi, không ngờ họ nhớ rõ đến vậy."]},
  "4-1-自然":{zh:["老师说，学语言的时候表情要自然一点儿。","如果太紧张，别人听起来也会不舒服。"],py:["Lǎo shī shuō, xué yǔ yán de shí hou biǎo qíng yào zì rán yì diǎnr.","Rú guǒ tài jǐn zhāng, bié rén tīng qǐ lái yě huì bù shū fu."],vi:["Giáo viên nói rằng khi học ngôn ngữ thì nét mặt nên tự nhiên hơn một chút.","Nếu quá căng thẳng thì người khác nghe cũng sẽ thấy không thoải mái."]},
  "4-1-原因":{zh:["他今天没有来上课，一定有自己的原因。","老师没有马上批评他，而是先打电话问情况。"],py:["Tā jīn tiān méi yǒu lái shàng kè, yí dìng yǒu zì jǐ de yuán yīn.","Lǎo shī méi yǒu mǎ shàng pī píng tā, ér shì xiān dǎ diàn huà wèn qíng kuàng."],vi:["Hôm nay cậu ấy không đến lớp chắc chắn có nguyên nhân riêng.","Giáo viên không phê bình ngay mà gọi điện hỏi tình hình trước."]},
  "4-1-互相":{zh:["我们住在一个宿舍里，平时会互相照顾。","谁先回去，谁就顺便帮大家打开空调。"],py:["Wǒ men zhù zài yí ge sù shè lǐ, píng shí huì hù xiāng zhào gù.","Shéi xiān huí qù, shéi jiù shùn biàn bāng dà jiā dǎ kāi kōng tiáo."],vi:["Chúng tôi sống cùng một ký túc xá nên bình thường sẽ chăm sóc lẫn nhau.","Ai về trước thì tiện thể bật điều hòa giúp mọi người."]},
  "4-1-吸引":{zh:["这家小书店不大，可是很吸引人。","门口放着很多旧书，我每次经过都想进去看看。"],py:["Zhè jiā xiǎo shū diàn bú dà, kě shì hěn xī yǐn rén.","Mén kǒu fàng zhe hěn duō jiù shū, wǒ měi cì jīng guò dōu xiǎng jìn qù kàn kan."],vi:["Hiệu sách nhỏ này không lớn nhưng rất thu hút.","Ngoài cửa bày rất nhiều sách cũ, mỗi lần đi ngang tôi đều muốn vào xem."]},
  "4-1-幽默":{zh:["我们的中文老师很幽默。","本来有点儿难的课，让他一讲，大家都轻松起来了。"],py:["Wǒ men de Zhōng wén lǎo shī hěn yōu mò.","Běn lái yǒu diǎnr nán de kè, ràng tā yì jiǎng, dà jiā dōu qīng sōng qǐ lái le."],vi:["Giáo viên tiếng Trung của chúng tôi rất hài hước.","Tiết học vốn hơi khó, qua cách thầy giảng thì mọi người đều thấy thoải mái hơn."]},
  "4-1-脾气":{zh:["我弟弟小时候脾气很急。","现在长大一点儿了，遇到问题也知道先冷静了。"],py:["Wǒ dì di xiǎo shí hou pí qi hěn jí.","Xiàn zài zhǎng dà yì diǎnr le, yù dào wèn tí yě zhī dào xiān lěng jìng le."],vi:["Em trai tôi hồi nhỏ tính khí rất nóng.","Bây giờ lớn hơn một chút rồi, gặp vấn đề cũng biết bình tĩnh trước."]},
  "4-2-适应":{zh:["刚来北京的时候，我不太适应冬天的天气。","现在住了一年，已经觉得没有以前那么冷了。"],py:["Gāng lái Běi jīng de shí hou, wǒ bú tài shì yìng dōng tiān de tiān qì.","Xiàn zài zhù le yì nián, yǐ jīng jué de méi yǒu yǐ qián nà me lěng le."],vi:["Khi mới đến Bắc Kinh, tôi không quen thời tiết mùa đông.","Bây giờ ở được một năm rồi, tôi đã thấy không còn lạnh như trước nữa."]},
  "4-2-交":{zh:["她虽然安静，但是很愿意交朋友。","只要有人主动跟她说话，她马上就会笑起来。"],py:["Tā suī rán ān jìng, dàn shì hěn yuàn yì jiāo péng you.","Zhǐ yào yǒu rén zhǔ dòng gēn tā shuō huà, tā mǎ shàng jiù huì xiào qǐ lái."],vi:["Cô ấy tuy trầm tính nhưng rất sẵn lòng kết bạn.","Chỉ cần có ai chủ động nói chuyện thì cô ấy sẽ lập tức mỉm cười."]},
  "4-2-平时":{zh:["你平时下课以后都做什么？","如果没有作业，我一般会去操场走一走。"],py:["Nǐ píng shí xià kè yǐ hòu dōu zuò shén me?","Rú guǒ méi yǒu zuò yè, wǒ yì bān huì qù cāo chǎng zǒu yi zǒu."],vi:["Bình thường sau giờ học bạn thường làm gì?","Nếu không có bài tập thì tôi thường ra sân trường đi dạo một chút."]},
  "4-2-逛":{zh:["周末我们没有安排考试，所以想去市中心逛一逛。","听说那边新开了一家很有意思的书店。"],py:["Zhōu mò wǒ men méi yǒu ān pái kǎo shì, suǒ yǐ xiǎng qù shì zhōng xīn guàng yi guàng.","Tīng shuō nà biān xīn kāi le yì jiā hěn yǒu yì si de shū diàn."],vi:["Cuối tuần chúng tôi không có lịch thi nên muốn ra trung tâm thành phố dạo chơi.","Nghe nói bên đó mới mở một hiệu sách rất thú vị."]},
  "4-2-短信":{zh:["我给他发了两条短信，可是他一直没有回。","后来才知道，他开会的时候把手机关了。"],py:["Wǒ gěi tā fā le liǎng tiáo duǎn xìn, kě shì tā yì zhí méi yǒu huí.","Hòu lái cái zhī dào, tā kāi huì de shí hou bǎ shǒu jī guān le."],vi:["Tôi đã nhắn cho anh ấy hai tin nhắn nhưng anh ấy vẫn chưa trả lời.","Sau đó mới biết là lúc họp anh ấy đã tắt điện thoại."]},
  "4-2-正好":{zh:["你来得正好，我正想找你帮忙。","这道题我看了半天，还是不知道怎么做。"],py:["Nǐ lái de zhèng hǎo, wǒ zhèng xiǎng zhǎo nǐ bāng máng.","Zhè dào tí wǒ kàn le bàn tiān, hái shì bù zhī dào zěn me zuò."],vi:["Bạn đến đúng lúc, tôi đang định tìm bạn giúp đây.","Bài này tôi xem nãy giờ mà vẫn không biết làm thế nào."]},
  "4-2-聚会":{zh:["毕业以后，我们班很少再有机会聚会。","所以这次大家都特别珍惜见面的时间。"],py:["Bì yè yǐ hòu, wǒ men bān hěn shǎo zài yǒu jī huì jù huì.","Suǒ yǐ zhè cì dà jiā dōu tè bié zhēn xī jiàn miàn de shí jiān."],vi:["Sau khi tốt nghiệp, lớp chúng tôi rất hiếm khi có cơ hội tụ họp nữa.","Vì vậy lần này mọi người đều đặc biệt trân trọng thời gian gặp mặt."]},
  "4-2-联系":{zh:["如果你到了机场，就马上跟我联系。","我会在出口附近等你，不会走远。"],py:["Rú guǒ nǐ dào le jī chǎng, jiù mǎ shàng gēn wǒ lián xì.","Wǒ huì zài chū kǒu fù jìn děng nǐ, bú huì zǒu yuǎn."],vi:["Nếu bạn đến sân bay thì hãy liên lạc với tôi ngay.","Tôi sẽ đợi bạn gần lối ra, sẽ không đi xa."]},
  "4-2-差不多":{zh:["这两件衣服的价格差不多。","可是我还是觉得蓝色那件更适合你。"],py:["Zhè liǎng jiàn yī fu de jià gé chà bu duō.","Kě shì wǒ hái shì jué de lán sè nà jiàn gèng shì hé nǐ."],vi:["Giá của hai bộ quần áo này gần như nhau.","Nhưng tôi vẫn thấy bộ màu xanh hợp với bạn hơn."]},
  "4-2-专门":{zh:["他今天专门从郊区赶过来看我。","我们只是一起吃了一顿饭，我也觉得很感动。"],py:["Tā jīn tiān zhuān mén cóng jiāo qū gǎn guò lái kàn wǒ.","Wǒ men zhǐ shì yì qǐ chī le yí dùn fàn, wǒ yě jué de hěn gǎn dòng."],vi:["Hôm nay anh ấy đặc biệt từ ngoại ô chạy đến thăm tôi.","Chúng tôi chỉ cùng ăn một bữa cơm thôi mà tôi cũng đã thấy rất cảm động."]},
  "4-2-毕业":{zh:["我哥哥今年夏天就要毕业了。","他最近一边写论文，一边准备找工作。"],py:["Wǒ gē ge jīn nián xià tiān jiù yào bì yè le.","Tā zuì jìn yì biān xiě lùn wén, yì biān zhǔn bèi zhǎo gōng zuò."],vi:["Anh trai tôi mùa hè năm nay sẽ tốt nghiệp.","Dạo gần đây anh ấy vừa viết luận văn vừa chuẩn bị tìm việc."]},
  "4-2-麻烦":{zh:["这件事要是太麻烦你，就算了吧。","我自己再想想办法，也许能解决。"],py:["Zhè jiàn shì yào shì tài má fan nǐ, jiù suàn le ba.","Wǒ zì jǐ zài xiǎng xiang bàn fǎ, yě xǔ néng jiě jué."],vi:["Nếu chuyện này làm phiền bạn quá thì thôi vậy.","Tôi sẽ tự nghĩ thêm cách khác, có lẽ sẽ giải quyết được."]},
  "4-2-好像":{zh:["外面突然安静下来了，好像要下雪。","我们赶快把窗户关上，然后泡了两杯热茶。"],py:["Wài mian tū rán ān jìng xià lái le, hǎo xiàng yào xià xuě.","Wǒ men gǎn kuài bǎ chuāng hu guān shàng, rán hòu pào le liǎng bēi rè chá."],vi:["Bên ngoài bỗng yên tĩnh hẳn đi, hình như sắp có tuyết.","Chúng tôi vội đóng cửa sổ lại rồi pha hai cốc trà nóng."]},
  "4-2-重新":{zh:["这篇作文我写得不太满意，所以想重新写一遍。","老师也说，只要认真改，成绩一定会更好。"],py:["Zhè piān zuò wén wǒ xiě de bú tài mǎn yì, suǒ yǐ xiǎng chóng xīn xiě yí biàn.","Lǎo shī yě shuō, zhǐ yào rèn zhēn gǎi, chéng jì yí dìng huì gèng hǎo."],vi:["Bài văn này tôi viết chưa được hài lòng nên muốn viết lại một lần nữa.","Giáo viên cũng nói rằng chỉ cần sửa nghiêm túc thì điểm nhất định sẽ tốt hơn."]},
  "4-2-尽管":{zh:["你心里有什么想法，尽管说出来。","咱们今天就是想认真讨论这件事。"],py:["Nǐ xīn lǐ yǒu shén me xiǎng fǎ, jǐn guǎn shuō chū lái.","Zán men jīn tiān jiù shì xiǎng rèn zhēn tǎo lùn zhè jiàn shì."],vi:["Trong lòng bạn có suy nghĩ gì thì cứ việc nói ra.","Hôm nay chúng ta chính là muốn thảo luận nghiêm túc chuyện này."]},
  "4-2-友谊":{zh:["真正的友谊不是每天见面。","而是遇到困难的时候，你知道对方一定会帮助你。"],py:["Zhēn zhèng de yǒu yì bú shì měi tiān jiàn miàn.","Ér shì yù dào kùn nan de shí hou, nǐ zhī dào duì fāng yí dìng huì bāng zhù nǐ."],vi:["Tình bạn thật sự không phải là ngày nào cũng gặp nhau.","Mà là khi gặp khó khăn, bạn biết đối phương nhất định sẽ giúp mình."]},
  "4-2-丰富":{zh:["这座城市的夜生活很丰富。","你想听音乐、看电影或者吃夜宵，都能找到地方。"],py:["Zhè zuò chéng shì de yè shēng huó hěn fēng fù.","Nǐ xiǎng tīng yīn yuè, kàn diàn yǐng huò zhě chī yè xiāo, dōu néng zhǎo dào dì fang."],vi:["Đời sống về đêm của thành phố này rất phong phú.","Bạn muốn nghe nhạc, xem phim hay ăn đêm đều có thể tìm được chỗ."]},
  "4-2-无聊":{zh:["今天下午一直下雨，我们哪儿也去不了。","我在宿舍里坐了两个小时，觉得特别无聊。"],py:["Jīn tiān xià wǔ yì zhí xià yǔ, wǒ men nǎr yě qù bù liǎo.","Wǒ zài sù shè lǐ zuò le liǎng ge xiǎo shí, jué de tè bié wú liáo."],vi:["Chiều nay mưa suốt nên chúng tôi không đi đâu được.","Tôi ngồi trong ký túc xá hai tiếng đồng hồ và cảm thấy đặc biệt chán."]},
  "4-2-讨厌":{zh:["我最讨厌别人答应了却不来。","这样不仅浪费时间，也让人很失望。"],py:["Wǒ zuì tǎo yàn bié rén dā ying le què bù lái.","Zhè yàng bù jǐn làng fèi shí jiān, yě ràng rén hěn shī wàng."],vi:["Tôi ghét nhất là người khác đã đồng ý rồi mà lại không đến.","Như vậy không chỉ lãng phí thời gian mà còn khiến người ta rất thất vọng."]},
  "4-2-却":{zh:["他说今天会早点儿回来，却又临时加班了。","妈妈把晚饭热了两次，最后还是等到很晚。"],py:["Tā shuō jīn tiān huì zǎo diǎnr huí lái, què yòu lín shí jiā bān le.","Mā ma bǎ wǎn fàn rè le liǎng cì, zuì hòu hái shì děng dào hěn wǎn."],vi:["Anh ấy nói hôm nay sẽ về sớm hơn nhưng lại đột xuất tăng ca.","Mẹ hâm nóng bữa tối hai lần, cuối cùng vẫn phải đợi đến rất muộn."]},
  "4-2-周围":{zh:["学校周围最近开了很多小饭店。","下课以后，我们常常一起去那边吃面。"],py:["Xué xiào zhōu wéi zuì jìn kāi le hěn duō xiǎo fàn diàn.","Xià kè yǐ hòu, wǒ men cháng cháng yì qǐ qù nà biān chī miàn."],vi:["Xung quanh trường gần đây mở rất nhiều quán ăn nhỏ.","Sau giờ học, chúng tôi thường cùng nhau qua đó ăn mì."]},
  "4-2-交流":{zh:["刚开始的时候，我不敢用中文交流。","后来老师一直鼓励我，现在我已经自然多了。"],py:["Gāng kāi shǐ de shí hou, wǒ bù gǎn yòng Zhōng wén jiāo liú.","Hòu lái lǎo shī yì zhí gǔ lì wǒ, xiàn zài wǒ yǐ jīng zì rán duō le."],vi:["Lúc ban đầu tôi không dám giao tiếp bằng tiếng Trung.","Sau này giáo viên luôn động viên tôi nên bây giờ tôi đã tự nhiên hơn nhiều."]},
  "4-2-理解":{zh:["我能理解你现在的压力。","如果你想安静一点儿，我就不打扰你了。"],py:["Wǒ néng lǐ jiě nǐ xiàn zài de yā lì.","Rú guǒ nǐ xiǎng ān jìng yì diǎnr, wǒ jiù bù dǎ rǎo nǐ le."],vi:["Tôi có thể hiểu áp lực hiện tại của bạn.","Nếu bạn muốn yên tĩnh một chút thì tôi sẽ không làm phiền bạn nữa."]},
  "4-2-镜子":{zh:["她站在镜子前面看了很久。","不是因为爱漂亮，而是担心自己穿得不正式。"],py:["Tā zhàn zài jìng zi qián mian kàn le hěn jiǔ.","Bú shì yīn wèi ài piào liang, ér shì dān xīn zì jǐ chuān de bù zhèng shì."],vi:["Cô ấy đứng trước gương nhìn rất lâu.","Không phải vì thích làm đẹp mà vì lo mình ăn mặc chưa đủ trang trọng."]},
  "4-2-而":{zh:["这次聚会不是老师安排的，而是学生自己组织的。","大家都希望用轻松的方式再见一次面。"],py:["Zhè cì jù huì bú shì lǎo shī ān pái de, ér shì xué sheng zì jǐ zǔ zhī de.","Dà jiā dōu xī wàng yòng qīng sōng de fāng shì zài jiàn yí cì miàn."],vi:["Buổi họp mặt lần này không phải do giáo viên sắp xếp mà do học sinh tự tổ chức.","Mọi người đều hy vọng có thể gặp lại nhau một cách thoải mái."]},
  "4-2-当":{zh:["当你真的喜欢一件事的时候，坚持就没有那么难。","我学中文到现在，一直都是这样想的。"],py:["Dāng nǐ zhēn de xǐ huan yí jiàn shì de shí hou, jiān chí jiù méi yǒu nà me nán.","Wǒ xué Zhōng wén dào xiàn zài, yì zhí dōu shì zhè yàng xiǎng de."],vi:["Khi bạn thật sự thích một việc gì đó thì việc kiên trì sẽ không còn khó đến thế.","Từ khi học tiếng Trung đến nay, tôi vẫn luôn nghĩ như vậy."]},
  "4-2-困难":{zh:["刚开始练听力的时候，我遇到了很多困难。","不过每天听半个小时以后，我慢慢有了信心。"],py:["Gāng kāi shǐ liàn tīng lì de shí hou, wǒ yù dào le hěn duō kùn nan.","Bú guò měi tiān tīng bàn ge xiǎo shí yǐ hòu, wǒ màn man yǒu le xìn xīn."],vi:["Lúc mới bắt đầu luyện nghe, tôi gặp rất nhiều khó khăn.","Nhưng sau khi nghe mỗi ngày nửa tiếng, tôi dần dần đã có tự tin hơn."]},
  "4-2-及时":{zh:["幸好你及时提醒了我。","不然我可能真的会忘记今天下午的面试时间。"],py:["Xìng hǎo nǐ jí shí tí xǐng le wǒ.","Bù rán wǒ kě néng zhēn de huì wàng jì jīn tiān xià wǔ de miàn shì shí jiān."],vi:["May mà bạn đã nhắc tôi kịp thời.","Nếu không thì có lẽ tôi thật sự sẽ quên mất thời gian phỏng vấn chiều nay."]},
  "4-2-陪":{zh:["周末妈妈想去医院检查身体，我陪她一起去。","检查结束以后，我们还顺便在外面吃了午饭。"],py:["Zhōu mò mā ma xiǎng qù yī yuàn jiǎn chá shēn tǐ, wǒ péi tā yì qǐ qù.","Jiǎn chá jié shù yǐ hòu, wǒ men hái shùn biàn zài wài mian chī le wǔ fàn."],vi:["Cuối tuần mẹ muốn đến bệnh viện kiểm tra sức khỏe nên tôi đi cùng mẹ.","Sau khi kiểm tra xong, chúng tôi còn tiện thể ăn trưa ở ngoài."]},
  "4-3-挺":{zh:["这家小店虽然不大，但是菜做得挺好。","怪不得晚上总有那么多人排队。"],py:["Zhè jiā xiǎo diàn suī rán bú dà, dàn shì cài zuò de tǐng hǎo.","Guài bu de wǎn shang zǒng yǒu nà me duō rén pái duì."],vi:["Quán nhỏ này tuy không lớn nhưng nấu ăn khá ngon.","Bảo sao buổi tối lúc nào cũng có nhiều người xếp hàng như vậy."]},
  "4-3-紧张":{zh:["我第一次用中文做报告的时候特别紧张。","站到前面以后，手心一直在出汗。"],py:["Wǒ dì yī cì yòng Zhōng wén zuò bào gào de shí hou tè bié jǐn zhāng.","Zhàn dào qián mian yǐ hòu, shǒu xīn yì zhí zài chū hàn."],vi:["Lần đầu tiên thuyết trình bằng tiếng Trung tôi cực kỳ căng thẳng.","Sau khi đứng lên phía trước, lòng bàn tay tôi cứ đổ mồ hôi liên tục."]},
  "4-3-信心":{zh:["虽然题目有一点儿难，但是我对自己还有信心。","只要把学过的内容认真写出来，结果应该不会太差。"],py:["Suī rán tí mù yǒu yì diǎnr nán, dàn shì wǒ duì zì jǐ hái yǒu xìn xīn.","Zhǐ yào bǎ xué guo de nèi róng rèn zhēn xiě chū lái, jié guǒ yīng gāi bú huì tài chà."],vi:["Tuy đề bài có hơi khó nhưng tôi vẫn còn tự tin vào bản thân.","Chỉ cần nghiêm túc viết ra những gì đã học thì kết quả chắc sẽ không quá tệ."]},
  "4-3-能力":{zh:["公司找人的时候，不只看学历，也看能力。","如果你真的会做事，别人一定能看出来。"],py:["Gōng sī zhǎo rén de shí hou, bù zhǐ kàn xué lì, yě kàn néng lì.","Rú guǒ nǐ zhēn de huì zuò shì, bié rén yí dìng néng kàn chū lái."],vi:["Khi công ty tuyển người, họ không chỉ nhìn bằng cấp mà còn nhìn năng lực.","Nếu bạn thật sự làm được việc thì người khác nhất định sẽ nhận ra."]},
  "4-3-招聘":{zh:["那家公司正在网上招聘新的翻译。","我看了要求以后，觉得自己可以试一试。"],py:["Nà jiā gōng sī zhèng zài wǎng shàng zhāo pìn xīn de fān yì.","Wǒ kàn le yāo qiú yǐ hòu, jué de zì jǐ kě yǐ shì yi shì."],vi:["Công ty đó đang tuyển dụng phiên dịch mới trên mạng.","Sau khi xem yêu cầu, tôi cảm thấy mình có thể thử một chút."]},
  "4-3-提供":{zh:["学校图书馆给学生提供了很多安静的座位。","考试周的时候，大家都喜欢去那儿复习。"],py:["Xué xiào tú shū guǎn gěi xué sheng tí gōng le hěn duō ān jìng de zuò wèi.","Kǎo shì zhōu de shí hou, dà jiā dōu xǐ huan qù nàr fù xí."],vi:["Thư viện trường cung cấp cho sinh viên rất nhiều chỗ ngồi yên tĩnh.","Vào tuần thi, mọi người đều thích đến đó ôn tập."]},
  "4-3-负责":{zh:["这次活动由我负责安排时间。","如果哪里有问题，请你马上告诉我。"],py:["Zhè cì huó dòng yóu wǒ fù zé ān pái shí jiān.","Rú guǒ nǎ lǐ yǒu wèn tí, qǐng nǐ mǎ shàng gào su wǒ."],vi:["Lần hoạt động này do tôi phụ trách sắp xếp thời gian.","Nếu chỗ nào có vấn đề thì hãy báo cho tôi ngay."]},
  "4-3-本来":{zh:["我本来打算晚上出去跑步。","可是突然下起了大雨，只好留在宿舍里。"],py:["Wǒ běn lái dǎ suàn wǎn shang chū qù pǎo bù.","Kě shì tū rán xià qǐ le dà yǔ, zhǐ hǎo liú zài sù shè lǐ."],vi:["Ban đầu tôi dự định tối sẽ ra ngoài chạy bộ.","Nhưng đột nhiên trời mưa to nên đành phải ở lại ký túc xá."]},
  "4-3-应聘":{zh:["他穿得很正式，因为今天下午要去应聘。","出门以前，他还在镜子前面练习了两遍自我介绍。"],py:["Tā chuān de hěn zhèng shì, yīn wèi jīn tiān xià wǔ yào qù yìng pìn.","Chū mén yǐ qián, tā hái zài jìng zi qián mian liàn xí le liǎng biàn zì wǒ jiè shào."],vi:["Anh ấy ăn mặc rất trang trọng vì chiều nay phải đi ứng tuyển.","Trước khi ra khỏi nhà, anh ấy còn đứng trước gương luyện giới thiệu bản thân hai lần."]},
  "4-3-材料":{zh:["老师让我们先把申请的材料准备好。","如果少一张表格，后面的事情都会更麻烦。"],py:["Lǎo shī ràng wǒ men xiān bǎ shēn qǐng de cái liào zhǔn bèi hǎo.","Rú guǒ shǎo yì zhāng biǎo gé, hòu mian de shì qíng dōu huì gèng má fan."],vi:["Giáo viên bảo chúng tôi chuẩn bị đầy đủ tài liệu đăng ký trước.","Nếu thiếu một tờ biểu mẫu thì những việc sau sẽ phiền phức hơn nhiều."]},
  "4-3-符合":{zh:["你的经历很符合这份工作的要求。","如果准备得认真一点儿，面试应该没有问题。"],py:["Nǐ de jīng lì hěn fú hé zhè fèn gōng zuò de yāo qiú.","Rú guǒ zhǔn bèi de rèn zhēn yì diǎnr, miàn shì yīng gāi méi yǒu wèn tí."],vi:["Kinh nghiệm của bạn rất phù hợp với yêu cầu của công việc này.","Nếu chuẩn bị kỹ hơn một chút thì buổi phỏng vấn chắc sẽ không có vấn đề."]},
  "4-3-通知":{zh:["昨天晚上我收到了学校的通知。","下周的考试时间改到了星期五上午。"],py:["Zuó tiān wǎn shang wǒ shōu dào le xué xiào de tōng zhī.","Xià zhōu de kǎo shì shí jiān gǎi dào le xīng qī wǔ shàng wǔ."],vi:["Tối qua tôi đã nhận được thông báo của nhà trường.","Thời gian kỳ thi tuần sau đã đổi sang sáng thứ Sáu."]},
  "4-3-律师":{zh:["她毕业以后在一家大公司当律师。","工作虽然很忙，但是她一直觉得很有意义。"],py:["Tā bì yè yǐ hòu zài yì jiā dà gōng sī dāng lǜ shī.","Gōng zuò suī rán hěn máng, dàn shì tā yì zhí jué de hěn yǒu yì yì."],vi:["Sau khi tốt nghiệp cô ấy làm luật sư ở một công ty lớn.","Công việc tuy rất bận nhưng cô ấy luôn thấy nó rất có ý nghĩa."]},
  "4-3-专业":{zh:["你大学学的是什么专业？","如果跟现在的工作一样，那一定帮了你很多。"],py:["Nǐ dà xué xué de shì shén me zhuān yè?","Rú guǒ gēn xiàn zài de gōng zuò yí yàng, nà yí dìng bāng le nǐ hěn duō."],vi:["Bạn học chuyên ngành gì ở đại học?","Nếu giống với công việc hiện tại thì chắc chắn nó đã giúp bạn rất nhiều."]},
  "4-3-另外":{zh:["这家饭店的面很好吃。","另外，他们家的汤也特别有名。"],py:["Zhè jiā fàn diàn de miàn hěn hǎo chī.","Lìng wài, tā men jiā de tāng yě tè bié yǒu míng."],vi:["Mì ở nhà hàng này rất ngon.","Ngoài ra, món canh ở đây cũng đặc biệt nổi tiếng."]},
  "4-3-收入":{zh:["这份工作的收入不算很高。","可是离家近，而且发展机会不错。"],py:["Zhè fèn gōng zuò de shōu rù bú suàn hěn gāo.","Kě shì lí jiā jìn, ér qiě fā zhǎn jī huì bú cuò."],vi:["Thu nhập của công việc này không tính là quá cao.","Nhưng nó gần nhà và cơ hội phát triển cũng khá tốt."]},
  "4-3-咱们":{zh:["咱们别站在门口说话了。","先进去坐下，再慢慢商量后面的安排吧。"],py:["Zán men bié zhàn zài mén kǒu shuō huà le.","Xiān jìn qù zuò xià, zài màn man shāng liang hòu mian de ān pái ba."],vi:["Chúng ta đừng đứng ở cửa nói chuyện nữa.","Vào trong ngồi xuống trước rồi từ từ bàn sắp xếp phía sau nhé."]},
  "4-3-安排":{zh:["老师把明天的活动都安排好了。","我们只要按时到学校集合就可以。"],py:["Lǎo shī bǎ míng tiān de huó dòng dōu ān pái hǎo le.","Wǒ men zhǐ yào àn shí dào xué xiào jí hé jiù kě yǐ."],vi:["Giáo viên đã sắp xếp xong toàn bộ hoạt động ngày mai.","Chúng tôi chỉ cần đến trường tập trung đúng giờ là được."]},
  "4-3-首先":{zh:["首先，你要把自己的简历认真检查一遍。","如果连名字都写错，别人怎么会相信你呢？"],py:["Shǒu xiān, nǐ yào bǎ zì jǐ de jiǎn lì rèn zhēn jiǎn chá yí biàn.","Rú guǒ lián míng zi dōu xiě cuò, bié rén zěn me huì xiāng xìn nǐ ne?"],vi:["Trước hết, bạn phải kiểm tra cẩn thận sơ yếu lý lịch của mình một lần.","Nếu ngay cả tên cũng viết sai thì người khác làm sao tin bạn được?"]},
  "4-3-正式":{zh:["明天我们要参加一个很正式的会议。","所以老师提醒大家，衣服一定要穿整齐。"],py:["Míng tiān wǒ men yào cān jiā yí ge hěn zhèng shì de huì yì.","Suǒ yǐ lǎo shī tí xǐng dà jiā, yī fu yí dìng yào chuān zhěng qí."],vi:["Ngày mai chúng tôi sẽ tham gia một cuộc họp rất trang trọng.","Vì vậy giáo viên nhắc mọi người nhất định phải ăn mặc chỉnh tề."]},
  "4-3-留":{zh:["老师让我留在教室里一下。","原来他想跟我单独谈谈这次作文的问题。"],py:["Lǎo shī ràng wǒ liú zài jiào shì lǐ yí xià.","Yuán lái tā xiǎng gēn wǒ dān dú tán tan zhè cì zuò wén de wèn tí."],vi:["Giáo viên bảo tôi ở lại lớp một lát.","Hóa ra thầy muốn nói riêng với tôi về vấn đề của bài văn lần này."]},
  "4-3-其次":{zh:["做这个计划，首先要想目标。","其次，你还得安排每天具体要做什么。"],py:["Zuò zhè ge jì huà, shǒu xiān yào xiǎng mù biāo.","Qí cì, nǐ hái děi ān pái měi tiān jù tǐ yào zuò shén me."],vi:["Khi lập kế hoạch này, trước hết phải nghĩ đến mục tiêu.","Tiếp theo, bạn còn phải sắp xếp mỗi ngày cụ thể cần làm gì."]},
  "4-3-诚实":{zh:["他虽然说话不多，但是很诚实。","不知道的事情，他从来不会假装自己明白。"],py:["Tā suī rán shuō huà bù duō, dàn shì hěn chéng shí.","Bù zhī dào de shì qing, tā cóng lái bú huì jiǎ zhuāng zì jǐ míng bai."],vi:["Anh ấy tuy nói không nhiều nhưng rất trung thực.","Những chuyện không biết thì anh ấy chưa bao giờ giả vờ là mình hiểu."]},
  "4-3-改变":{zh:["来到中国以后，我的生活习惯改变了很多。","现在我早上起得更早，也更喜欢在外面吃早餐。"],py:["Lái dào Zhōng guó yǐ hòu, wǒ de shēng huó xí guàn gǎi biàn le hěn duō.","Xiàn zài wǒ zǎo shang qǐ de gèng zǎo, yě gèng xǐ huan zài wài mian chī zǎo cān."],vi:["Sau khi đến Trung Quốc, thói quen sinh hoạt của tôi đã thay đổi rất nhiều.","Bây giờ tôi dậy sớm hơn và cũng thích ăn sáng ở ngoài hơn."]},
  "4-3-感觉":{zh:["这两天我总感觉有点儿累。","也许是因为晚上一直睡得不太好。"],py:["Zhè liǎng tiān wǒ zǒng gǎn jué yǒu diǎnr lèi.","Yě xǔ shì yīn wèi wǎn shang yì zhí shuì de bú tài hǎo."],vi:["Hai ngày nay tôi luôn cảm thấy hơi mệt.","Có lẽ là vì buổi tối tôi ngủ không được ngon lắm."]},
  "4-3-判断":{zh:["听别人说的时候，你也要自己判断。","不是每一个消息都值得马上相信。"],py:["Tīng bié rén shuō de shí hou, nǐ yě yào zì jǐ pàn duàn.","Bú shì měi yí ge xiāo xi dōu zhí de mǎ shàng xiāng xìn."],vi:["Khi nghe người khác nói, bạn cũng phải tự phán đoán.","Không phải tin tức nào cũng đáng để tin ngay lập tức."]},
  "4-3-顾客":{zh:["这家店的服务很好，所以顾客特别多。","老板每次看到有人进来，都会主动打招呼。"],py:["Zhè jiā diàn de fú wù hěn hǎo, suǒ yǐ gù kè tè bié duō.","Lǎo bǎn měi cì kàn dào yǒu rén jìn lái, dōu huì zhǔ dòng dǎ zhāo hu."],vi:["Dịch vụ của cửa hàng này rất tốt nên khách hàng đặc biệt đông.","Mỗi lần thấy có người bước vào, ông chủ đều chủ động chào hỏi."]},
  "4-3-准时":{zh:["明天的面试很重要，你一定要准时到。","如果迟到了，第一印象就会差很多。"],py:["Míng tiān de miàn shì hěn zhòng yào, nǐ yí dìng yào zhǔn shí dào.","Rú guǒ chí dào le, dì yī yìn xiàng jiù huì chà hěn duō."],vi:["Buổi phỏng vấn ngày mai rất quan trọng, bạn nhất định phải đến đúng giờ.","Nếu đến muộn thì ấn tượng đầu tiên sẽ tệ đi rất nhiều."]},
  "4-3-不管":{zh:["不管结果怎么样，我都想先认真试一试。","至少以后回想起来，我不会后悔。"],py:["Bù guǎn jié guǒ zěn me yàng, wǒ dōu xiǎng xiān rèn zhēn shì yi shì.","Zhì shǎo yǐ hòu huí xiǎng qǐ lái, wǒ bú huì hòu huǐ."],vi:["Bất kể kết quả thế nào, tôi vẫn muốn nghiêm túc thử trước.","Ít nhất sau này nhớ lại, tôi sẽ không hối hận."]},
  "4-3-与":{zh:["这次活动与上次不太一样。","除了听报告，大家还要分组讨论。"],py:["Zhè cì huó dòng yǔ shàng cì bú tài yí yàng.","Chú le tīng bào gào, dà jiā hái yào fēn zǔ tǎo lùn."],vi:["Hoạt động lần này khác khá nhiều so với lần trước.","Ngoài việc nghe báo cáo, mọi người còn phải chia nhóm thảo luận."]},
  "4-3-约会":{zh:["他为了今天晚上的约会，下午就开始认真选衣服。","朋友看见以后笑他说，比考试还紧张。"],py:["Tā wèi le jīn tiān wǎn shang de yuē huì, xià wǔ jiù kāi shǐ rèn zhēn xuǎn yī fu.","Péng you kàn jiàn yǐ hòu xiào tā shuō, bǐ kǎo shì hái jǐn zhāng."],vi:["Vì buổi hẹn tối nay, anh ấy đã bắt đầu chọn quần áo rất nghiêm túc từ buổi chiều.","Bạn bè nhìn thấy thì cười nói rằng anh ấy còn căng thẳng hơn cả lúc đi thi."]},
  "3-20-上网":{zh:["下班以后他回家先上网看新闻，再看一会儿球赛。","有时候视频太好看，他就忘了时间，妈妈只好来敲门。"],py:["Xià bān yǐ hòu tā huí jiā xiān shàng wǎng kàn xīn wén, zài kàn yí huìr qiú sài.","Yǒu shí hou shì pín tài hǎo kàn, tā jiù wàng le shí jiān, mā ma zhǐ hǎo lái qiāo mén."],vi:["Tan làm về nhà, anh ấy lên mạng xem tin trước, rồi xem bóng một lúc.","Đôi khi video hay quá nên anh quên cả giờ, mẹ phải tới gõ cửa."]},
  "3-20-世界":{zh:["他一直想存钱出国，亲眼看看外面的世界。","地图上每一个小点，都可能是一座完全不同的城市。"],py:["Tā yì zhí xiǎng cún qián chū guó, qīn yǎn kàn kan wài miàn de shì jiè.","Dì tú shàng měi yí ge xiǎo diǎn, dōu kě néng shì yī zuò wán quán bù tóng de chéng shì."],vi:["Anh ấy luôn muốn tiết kiệm để ra nước ngoài, tận mắt nhìn thế giới bên ngoài.","Mỗi chấm nhỏ trên bản đồ đều có thể là một thành phố hoàn toàn khác."]},
  "3-20-习惯":{zh:["每天早上跑步，渐渐成了他雷打不动的习惯。","换了新工作，总要慢慢习惯新的时间和节奏。"],py:["Měi tiān zǎo shang pǎo bù, jiàn jiàn chéng le tā léi dǎ bú dòng de xí guàn.","Huàn le xīn gōng zuò, zǒng yào màn man xí guàn xīn de shí jiān hé jié zòu."],vi:["Chạy bộ mỗi sáng dần trở thành thói quen không thể bỏ của anh ấy.","Đổi công việc mới, luôn phải từ từ quen với giờ giấc và nhịp điệu mới."]},
  "3-20-健康":{zh:["奶奶每天散步，说这样对身体比较健康。","他最近少熬夜，也希望大家都能注意自己的健康。"],py:["Nǎi nai měi tiān sàn bù, shuō zhè yàng duì shēn tǐ bǐ jiào jiàn kāng.","Tā zuì jìn shǎo áo yè, yě xī wàng dà jiā dōu néng zhù yì zì jǐ de jiàn kāng."],vi:["Bà nội mỗi ngày đi bộ, bảo vậy thì sức khỏe tốt hơn.","Dạo này anh ấy ít thức khuya hơn, và mong mọi người cũng chú ý sức khỏe của mình."]},
  "3-20-关于":{zh:["图书馆里有一整排关于中国历史的书。","关于周末去哪儿，我们晚上再慢慢商量。"],py:["Tú shū guǎn lǐ yǒu yī zhěng pái guān yú Zhōng guó lì shǐ de shū.","Guān yú zhōu mò qù nǎr, wǒ men wǎn shang zài màn man shāng liang."],vi:["Trong thư viện có cả một dãy sách về lịch sử Trung Quốc.","Chuyện cuối tuần đi đâu, tối chúng ta bàn từ từ."]},
  "3-20-冬天":{zh:["冬天一到，街上就多了卖烤红薯的小车。","他特别怕冷，所以冬天总是穿得很厚，像个小包子。"],py:["Dōng tiān yí dào, jiē shàng jiù duō le mài kǎo hóng shǔ de xiǎo chē.","Tā tè bié pà lěng, suǒ yǐ dōng tiān zǒng shì chuān de hěn hòu, xiàng gè xiǎo bāo zi."],vi:["Đông về, trên phố lại nhiều xe bán khoai lang nướng.","Anh ấy rất sợ lạnh nên mùa đông luôn mặc dày như cục bột."]},
  "3-20-决定":{zh:["想了整整一个星期，她终于决定去上海工作。","一旦决定了，就认真准备，不要一直后悔。"],py:["Xiǎng le zhěng zhěng yī gè xīng qī, tā zhōng yú jué dìng qù Shàng hǎi gōng zuò.","Yí dàn jué dìng le, jiù rèn zhēn zhǔn bèi, bú yào yì zhí hòu huǐ."],vi:["Nghĩ cả tuần, cuối cùng cô ấy quyết định đi Thượng Hải làm việc.","Đã quyết định thì chuẩn bị nghiêm túc, đừng mãi hối tiếc."]},
  "3-20-几乎":{zh:["他几乎每天都来这家面馆，老板都记得他要加辣。","雨下得太大，路上几乎看不见行人，只有车灯。"],py:["Tā jī hū měi tiān dōu lái zhè jiā miàn guǎn, lǎo bǎn dōu jì de tā yào jiā là.","Yǔ xià de tài dà, lù shàng jī hū kàn bú jiàn xíng rén, zhǐ yǒu chē dēng."],vi:["Anh ấy gần như ngày nào cũng tới quán mì, chủ quán nhớ cả chuyện anh thêm cay.","Mưa quá lớn, trên đường gần như không thấy người đi bộ, chỉ có đèn xe."]},
  "3-20-刷牙":{zh:["睡觉以前，妈妈让弟弟先刷牙洗脸再上床。","牙刷用久了毛会弯，要记得换一支新的。"],py:["Shuì jiào yǐ qián, mā ma ràng dì di xiān shuā yá xǐ liǎn zài shàng chuáng.","Yá shuǎ yòng jiǔ le máo huì wān, yào jì de huàn yī zhī xīn de."],vi:["Trước khi ngủ, mẹ bảo em trai đánh răng rửa mặt rồi mới lên giường.","Bàn chải dùng lâu lông cong, nhớ đổi cái mới."]},
  "3-20-发":{zh:["我晚上给同学发邮件问作业，对方很快就回了。","她一上车就发微信说已经到了，让我们别担心。"],py:["Wǒ wǎn shang gěi tóng xué fā yóu jiàn wèn zuò yè, duì fāng hěn kuài jiù huí le.","Tā yī shàng chē jiù fā Wēi xìn shuō yǐ jīng dào le, ràng wǒ men bié dān xīn."],vi:["Tối tôi gửi email hỏi bài tập, bạn học trả lời rất nhanh.","Cô ấy vừa lên xe đã nhắn WeChat báo đã tới, bảo đừng lo."]},
  "3-20-叔叔":{zh:["周末叔叔开车带我们去山里看红叶。","那位叔叔说话很慢，可是每一句都很好笑。"],py:["Zhōu mò shū shu kāi chē dài wǒ men qù shān lǐ kàn hóng yè.","Nà wèi shū shu shuō huà hěn màn, kě shì měi yī jù dōu hěn hǎo xiào."],vi:["Cuối tuần chú lái xe đưa chúng tôi lên núi xem lá đỏ.","Chú đó nói chậm nhưng câu nào cũng buồn cười."]},
  "3-20-变化":{zh:["这几年城市变化很大，连老街都换了模样。","天气变化快，早上还晴，下午就下起大雨。"],py:["Zhè jǐ nián chéng shì biàn huà hěn dà, lián lǎo jiē dōu huàn le mú yàng.","Tiān qì biàn huà kuài, zǎo shang hái qíng, xià wǔ jiù xià qǐ dà yǔ."],vi:["Mấy năm nay thành phố thay đổi nhiều, phố cũ cũng khác hẳn.","Thời tiết đổi nhanh, sáng còn nắng chiều đã mưa to."]},
  "3-20-口":{zh:["他跑完步口渴得厉害，拿起瓶子喝了一大口水。","地铁口旁边有一家很小的面包店，早上总是排队。"],py:["Tā pǎo wán bù kǒu kě de lì hai, ná qǐ píng zi hē le yī dà kǒu shuǐ.","Dì tiě kǒu páng biān yǒu yī jiā hěn xiǎo de miàn bāo diàn, zǎo shang zǒng shì pái duì."],vi:["Chạy xong khát quá, anh cầm chai uống một ngụm lớn.","Bên cạnh cửa ra vào tàu điện ngầm có tiệm bánh nhỏ, sáng nào cũng xếp hàng."]},
  "3-20-各":{zh:["各班的同学们都在操场集合，准备拍毕业照。","这个国家各地方的风俗有一点不一样，很有意思。"],py:["Gè bān de tóng xué men dōu zài cāo chǎng jí hé, zhǔn bèi pā bì yè zhào.","Zhè ge guó jiā gè dì fāng de fēng sú yǒu yī diǎn bù yí yàng, hěn yǒu yì si."],vi:["Học sinh các lớp tập trung ở sân để chụp ảnh tốt nghiệp.","Mỗi vùng trong nước có phong tục hơi khác nhau, rất thú vị."]},
  "3-20-哭":{zh:["小孩摔倒了，坐在地上哭，妈妈赶紧跑过去抱他。","电影结尾太感人，很多观众都忍不住哭了。"],py:["Xiǎo hái shuāi dǎo le, zuò zài dì shàng kū, mā ma gǎn jǐn pǎo guò qù bào tā.","Diàn yǐng jié wěi tài gǎn rén, hěn duō guān zhòng dōu rěn bú zhù kū le."],vi:["Đứa bé ngã, ngồi khóc trên đất, mẹ vội chạy tới bế.","Kết phim cảm động quá, nhiều khán giả không cầm được nước mắt."]},
  "3-20-啤酒":{zh:["夏天傍晚，朋友们在小店门口喝啤酒聊天。","他只喝了一点啤酒，脸就红得像苹果。"],py:["Xià tiān bàng wǎn, péng you men zài xiǎo diàn mén kǒu hē pí jiǔ liáo tiānr.","Tā zhǐ hē le yī diǎn pí jiǔ, liǎn jiù hóng de xiàng píng guǒ."],vi:["Chiều hè mấy người bạn ngồi uống bia trước cửa tiệm trò chuyện.","Anh chỉ uống chút bia mà mặt đỏ như táo."]},
  "3-20-国家":{zh:["每个国家都有自己的节日和传统，值得了解。","她希望长大以后能去很多国家旅行，看看不同的海。"],py:["Měi ge guó jiā dōu yǒu zì jǐ de jié rì hé chuán tǒng, zhí de liǎo jiě.","Tā xī wàng zhǎng dà yǐ hòu néng qù hěn duō guó jiā lǚ xíng, kàn kan bù tóng de hǎi."],vi:["Mỗi quốc gia đều có ngày lễ và truyền thống riêng, đáng tìm hiểu.","Cô ấy mong lớn lên được đi nhiều nước, xem những biển khác nhau."]},
  "3-20-地":{zh:["他开心地跑过来，把好消息悄悄告诉我。","请你慢慢地说，不要着急，我们认真听。"],py:["Tā kāi xīn de pǎo guò lái, bǎ hǎo xiāo xi qiāo qiāo gào su wǒ.","Qǐng nǐ màn man de shuō, bú yào zháo jí, wǒ men rèn zhēn tīng."],vi:["Anh ấy vui vẻ chạy tới, thì thầm báo tin vui.","Bạn nói từ từ, đừng vội, chúng tôi nghe kỹ."]},
  "3-20-坏":{zh:["手机掉在地上，屏幕坏了，他心疼了一整天。","那次坏天气让我们不得不改行程，只好在家看电影。"],py:["Shǒu jī diào zài dì shàng, píng mù huài le, tā xīn téng le yī zhěng tiān.","Nà cì huài tiān qì ràng wǒ men bù dé bù gǎi xíng chéng, zhǐ hǎo zài jiā kàn diàn yǐng."],vi:["Điện thoại rơi vỡ màn hình, anh ấy tiếc cả ngày.","Trời xấu khiến chúng tôi phải đổi lịch, ở nhà xem phim."]},
  "3-20-夏天":{zh:["夏天我们常去河里游泳，回来再吃个冰西瓜。","今年夏天太热，空调几乎一整天都开着。"],py:["Xià tiān wǒ men cháng qù hé lǐ yóu yǒng, huí lái zài chī gè bīng xī guā.","Jīn nián xià tiān tài rè, kōng tiáo jī hū yī zhěng tiān dōu kāi zhe."],vi:["Mùa hè chúng tôi hay xuống sông bơi, về ăn dưa hấu lạnh.","Hè nay nóng quá, điều hòa gần như bật cả ngày."]},
  "3-20-多么":{zh:["站在山顶上，多么小的房子也看得很清楚。","孩子第一次上台，心里多么紧张，手心全是汗。"],py:["Zhàn zài shān dǐng shang, duō me xiǎo de fáng zi yě kàn de hěn qīng chu.","Hái zi dì yī cì shàng tái, xīn lǐ duō me jǐn zhāng, shǒu xīn quán shì hàn."],vi:["Đứng trên đỉnh núi, nhà nhỏ đến mấy cũng nhìn rõ.","Lần đầu lên sân khấu, lòng đứa trẻ hồi hộp biết bao, tay đẫm mồ hôi."]},
  "3-20-头发":{zh:["她剪短了头发，朋友们差点没认出来。","洗完头发以后，记得把头发吹干再出门。"],py:["Tā jiǎn duǎn le tóu fa, péng you men chà diǎn méi rèn chū lái.","Xǐ wán tóu fa yǐ hòu, jì de bǎ tóu fa chuī gān zài chū mén."],vi:["Cô ấy cắt tóc ngắn, bạn bè suýt không nhận ra.","Gội xong nhớ sấy khô tóc rồi mới ra ngoài."]},
  "3-20-奇怪":{zh:["门口突然传来奇怪的声音，大家都安静下来。","他今天问了一个很奇怪的问题，谁也答不上来。"],py:["Mén kǒu tū rán chuán lái qí guài de shēng yīn, dà jiā dōu ān jìng xià lái.","Tā jīn tiān wèn le yí ge hěn qí guài de wèn tí, shéi yě dá bú shàng lái."],vi:["Bỗng có tiếng lạ ở cửa, mọi người im hết.","Hôm nay anh ấy hỏi một câu kỳ quái, không ai trả lời được."]},
  "3-20-情况":{zh:["医生问清楚病人的情况以后，才慢慢开药。","遇到紧急情况，先打求救电话，不要慌。"],py:["Yī shēng wèn qīng chǔ bìng rén de qíng kuàng yǐ hòu, cái màn man kāi yào.","Yù dào jǐn jí qíng kuàng, xiān dǎ qiú jiù diàn huà, bú yào huāng."],vi:["Bác sĩ hỏi kỹ tình hình bệnh nhân rồi mới kê thuốc.","Gặp tình huống khẩn cấp, gọi cứu trước, đừng hoảng."]},
  "3-20-故事":{zh:["爷爷每晚睡觉前都会讲一个小故事。","这个故事的结局让人又笑又感动，大家讨论了很久。"],py:["Yé ye měi wǎn shuì jiào qián dōu huì jiǎng yī ge xiǎo gù shi.","Zhè ge gù shi de jié jú ràng rén yòu xiào yòu gǎn dòng, dà jiā tǎo lùn le hěn jiǔ."],vi:["Ông mỗi tối trước khi ngủ kể một câu chuyện nhỏ.","Kết câu chuyện vừa buồn cười vừa cảm động, mọi người bàn mãi."]},
  "3-20-文化":{zh:["学校办活动，让大家了解不同国家的文化。","吃火锅不只是吃饭，也是一种热热闹闹的文化。"],py:["Xué xiào bàn huó dòng, ràng dà jiā liǎo jiě bù tóng guó jiā de wén huà.","Chī huǒ guō bù zhǐ shì chī fàn, yě shì yī zhǒng rè re nao nao de wén huà."],vi:["Trường tổ chức hoạt động để mọi người hiểu văn hóa các nước.","Ăn lẩu không chỉ là ăn, còn là một nét văn hóa náo nhiệt."]},
  "3-20-最近":{zh:["最近工作太忙，他很少有时间看电影。","你最近怎么样？周末有空一起吃饭吗？"],py:["Zuì jìn gōng zuò tài máng, tā hěn shǎo yǒu shí jiān kàn diàn yǐng.","Nǐ zuì jìn zěn me yàng? Zhōu mò yǒu kòng yī qǐ chī fàn ma?"],vi:["Dạo này làm quá bận, anh ít khi có thời gian xem phim.","Dạo này bạn thế nào? Cuối tuần rảnh đi ăn cùng không?"]},
  "3-20-机会":{zh:["这次比赛是很好的机会，不要轻易放弃。","机会来了就要努力抓住，光后悔没有用。"],py:["Zhè cì bǐ sài shì hěn hǎo de jī huì, bú yào qīng yì fàng qì.","Jī huì lái le jiù yào nǔ lì zhuā zhù, guāng hòu huǐ méi yǒu yòng."],vi:["Kỳ thi này là cơ hội tốt, đừng dễ buông.","Cơ hội đến phải nắm lấy, chỉ hối hận không ích gì."]},
  "3-20-极了":{zh:["这家新开的面馆好吃极了，明天你可以去试试。","路上堵极了，我们迟到了整整半个小时。"],py:["Zhè jiā xīn kāi de miàn guǎn hǎo chī jí le, míng tiān nǐ kě yǐ qù shì shi.","Lù shàng dǔ jí le, wǒ men chí dào le zhěng zhěng bàn gè xiǎo shí."],vi:["Quán mì mới mở ngon cực, mai bạn có thể thử.","Kẹt xe kinh khủng, chúng tôi muộn cả nửa tiếng."]},
  "3-20-校长":{zh:["开学典礼上，校长对大家说了几句鼓励的话。","校长办公室在三楼，走廊尽头靠窗那一间。"],py:["Kāi xué diǎn lǐ shang, xiào zhǎng duì dà jiā shuō le jǐ jù gǔ lì de huà.","Xiào zhǎng bàn gōng shì zài sān lóu, zǒu láng jìn tóu kào chuāng nà yī jiān."],vi:["Lễ khai giảng, hiệu trưởng nói vài câu động viên.","Phòng hiệu trưởng ở tầng ba, cuối hành lang bên cửa sổ."]},
  "3-20-根据":{zh:["根据天气预报，明天可能有大风，别晒衣服了。","请你根据课文内容，简单回答下面的问题。"],py:["Gēn jù tiān qì yù bào, míng tiān kě néng yǒu dà fēng, bié shài yī fu le.","Qǐng nǐ gēn jù kè wén nèi róng, jiǎn dān huí dá xià miàn de wèn tí."],vi:["Theo dự báo, mai có thể gió to, đừng phơi quần áo.","Hãy căn cứ nội dung bài khóa để trả lời ngắn các câu hỏi dưới đây."]},
  "3-20-检查":{zh:["出发前司机检查轮胎和油量，大家才放心。","写完作业以后，自己先检查一遍再交给老师。"],py:["Chū fā qián sī jī jiǎn chá lún tāi hé yóu liàng, dà jiā cái fàng xīn.","Xiě wán zuò yè yǐ hòu, zì jǐ xiān jiǎn chá yī biàn zài jiāo gěi lǎo shī."],vi:["Trước khi đi, tài xế kiểm tra lốp và dầu mọi người mới yên tâm.","Làm xong bài tự kiểm tra lần rồi nộp thầy."]},
  "3-20-注意":{zh:["过马路时一定要注意红绿灯，别看手机。","他最近胃不好，医生叫他注意饮食和休息。"],py:["Guò mǎ lù shí yí dìng yào zhù yì hóng lǜ dēng, bié kàn shǒu jī.","Tā zuì jìn wèi bù hǎo, yī shēng jiào tā zhù yì yǐn shí hé xiū xi."],vi:["Qua đường nhất định chú ý đèn, đừng nhìn điện thoại.","Dạo này dạ dày không tốt, bác sĩ bảo chú ý ăn uống và nghỉ."]},
  "3-20-渴":{zh:["跑完步以后他一口气喝了一大瓶水，还是觉得渴。","夏天在沙漠里旅行，每个人都会渴得难受。"],py:["Pǎo wán bù yǐ hòu tā yī kǒu qì hē le yī dà píng shuǐ, hái jué de kě.","Xià tiān zài shā mò lǐ lǚ xíng, měi ge rén dōu huì kě de nán shòu."],vi:["Chạy xong uống cả chai nước vẫn thấy khát.","Hè ở sa mạc ai cũng khát khó chịu."]},
  "3-20-特点":{zh:["这家店的点心特点是甜而不腻，老人也喜欢。","每个人都有自己的特点，不必跟别人完全一样。"],py:["Zhè jiā diàn de diǎn xīn tè diǎn shì tián ér bú nì, lǎo rén yě xǐ huan.","Měi ge rén dōu yǒu zì jǐ de tè diǎn, bú bì gēn bié rén wán quán yí yàng."],vi:["Bánh tiệm này đặc điểm là ngọt mà không ngấy, người già cũng thích.","Mỗi người có nét riêng, không cần giống hệt ai."]},
  "3-20-瓶子":{zh:["他买咖啡时把空瓶子放进门口的回收箱。","厨房里的油用完了，瓶子洗干净还能装别的。"],py:["Tā mǎi kā fēi shí bǎ kōng píng zi fàng jìn mén kǒu de huí shōu xiāng.","Chú fáng lǐ de yóu yòng wán le, píng zi xǐ gān jìng hái néng zhuāng bié de."],vi:["Mua cà phê xong anh bỏ chai rỗng vào thùng tái chế ở cửa.","Hết dầu ở bếp, chai rửa sạch còn dùng đựng thứ khác."]},
  "3-20-生活":{zh:["来到新城市以后，她的生活慢慢有了固定节奏。","生活不会总是一帆风顺，但总有办法继续往前走。"],py:["Lái dào xīn chéng shì yǐ hòu, tā de shēng huó màn man yǒu le gù dìng jié zòu.","Shēng huó bú huì zǒng shì yī fān fēng shùn, dàn zǒng yǒu bàn fǎ jì xù wǎng qián zǒu."],vi:["Sang thành phố mới, cuộc sống cô ấy dần có nhịp ổn định.","Đời không lúc nào cũng thuận, nhưng luôn có cách bước tiếp."]},
  "3-20-电子邮件":{zh:["公司用电子邮件通知大家开会的时间和地点。","她把照片整理好，用电子邮件发给了远方的家人。"],py:["Gōng sī yòng diàn zǐ yóu jiàn tōng zhī dà jiā kāi huì de shí jiān hé dì diǎn.","Tā bǎ zhào piān zhěng lǐ hǎo, yòng diàn zǐ yóu jiàn fā gěi le yuǎn fāng de jiā rén."],vi:["Công ty gửi email thông báo giờ và địa điểm họp.","Cô ấy sắp xếp ảnh rồi gửi email cho người nhà xa."]},
  "3-20-真正":{zh:["真正的朋友会在困难时陪在你身边。","真正学会一门外语，需要很多年坚持练习。"],py:["Zhēn zhèng de péng you huì zài kùn nan shí péi zài nǐ shēn biān.","Zhēn zhèng xué huì yī wài yǔ, xū yào hěn duō nián jiān chí liàn xí."],vi:["Bạn thật sự sẽ ở bên bạn lúc khó khăn.","Thật sự học được một ngoại ngữ cần nhiều năm kiên trì."]},
  "3-20-种":{zh:["这种苹果又脆又甜，市场上总是很抢手。","商场里同一种衣服有好几种颜色可以挑。"],py:["Zhè zhǒng píng guǒ yòu cuì yòu tián, shì chǎng shàng zǒng shì hěn qiǎng shǒu.","Shāng chǎng lǐ tóng yī zhǒng yī fu yǒu hǎo jǐ zhǒng yán sè kě yǐ tiāo."],vi:["Táo này giòn ngọt, chợ lúc nào cũng cháy hàng.","Cùng một kiểu áo trong siêu thị có mấy màu để chọn."]},
  "3-20-笔记本":{zh:["他在笔记本上写满了今天的课堂笔记。","新买了一本漂亮的笔记本，准备用来记日记。"],py:["Tā zài bǐ jì běn shàng xiě mǎn le jīn tiān de kè táng bǐ jì.","Xīn mǎi le yī běn piào liang de bǐ jì běn, zhǔn bèi yòng lái jì rì jì."],vi:["Anh ấy ghi đầy sổ những gì học hôm nay.","Mới mua quyển sổ đẹp để viết nhật ký."]},
  "3-20-筷子":{zh:["第一次用筷子的时候，他总夹不起那块肉。","这家饭馆提供筷子，也可以向服务员要刀叉。"],py:["Dì yī cì yòng kuài zi de shí hou, tā zǒng jiā bù qǐ nà kuài ròu.","Zhè jiā fàn guǎn tí gōng kuài zi, yě kě yǐ xiàng fú wù yuán yāo dāo chā."],vi:["Lần đầu dùng đũa anh không gắp nổi miếng thịt.","Quán này có đũa, cũng có thể xin nĩa dao."]},
  "3-20-经过":{zh:["我经过学校门口，看见你正在和同学聊天。","经过这次失败，他更清楚自己以后该做什么。"],py:["Wǒ jīng guò xué xiào mén kǒu, kàn jiàn nǐ zhèng zài hé tóng xué liáo tiān.","Jīng guò zhè cì shī bài, tā gèng qīng chǔ zì jǐ yǐ hòu gāi zuò shén me."],vi:["Tôi đi qua cổng trường thì thấy bạn đang nói chuyện với bạn học.","Trải qua lần thất bại này, anh ấy rõ hơn mình nên làm gì sau này."]},
  "3-20-老":{zh:["小区里那位老爷爷每天早上在树下打太极拳。","这件外套太老了，袖口都磨破了还舍不得扔。"],py:["Xiǎo qū lǐ nà wèi lǎo yé ye měi tiān zǎo shang zài shù xià dǎ tài jí quán.","Zhè jiàn wài tài tài lǎo le, xiù kǒu dōu mó pò le hái shě bù dé rēng."],vi:["Ông già trong khu mỗi sáng tập thái cực quyền dưới cây.","Áo khoác này cũ quá, tay áo sờn rách mà vẫn không nỡ vứt."]},
  "3-20-船":{zh:["我们坐船过河，河风吹在脸上很舒服。","小船在湖面上轻轻摇，像摇篮一样让人想睡。"],py:["Wǒ men zuò chuán guò hé, hé fēng chuī zài liǎn shàng hěn shū fu.","Xiǎo chuán zài hú miàn shang qīng qīng yáo, xiàng yáo lán yí yàng ràng rén xiǎng shuì."],vi:["Chúng tôi sang sông bằng thuyền, gió sông mát mặt.","Thuyền nhỏ lắc nhẹ trên hồ như nôi, buồn ngủ."]},
  "3-20-节日":{zh:["春节是他们家一年里最重要的节日。","节日里街上挂满彩灯，到处都很热闹。"],py:["Chūn jié shì tā men jiā yī nián lǐ zuì zhòng yào de jié rì.","Jié rì lǐ jiē shàng guà mǎn cǎi dēng, dào chù dōu hěn rè nao."],vi:["Tết là ngày lễ quan trọng nhất trong năm của gia đình họ.","Ngày lễ phố treo đèn màu, khắp nơi nhộn nhịp."]},
  "3-20-花":{zh:["春天院子里开满了花，香气一直飘进屋里。","这次旅行我们花了不少钱，但觉得很值得。"],py:["Chūn tiān yuàn zi lǐ kāi mǎn le huā, xiāng qì yì zhí piāo jìn wū lǐ.","Zhè cì lǚ xíng wǒ men huā le bù shǎo qián, dàn jué de hěn zhí de."],vi:["Mùa xuân sân đầy hoa, hương bay vào nhà.","Chuyến đi tốn khá nhiều tiền nhưng rất đáng."]},
  "3-20-菜单":{zh:["服务员把菜单递过来，我们先点了几杯饮料。","菜单上没有照片，我们就请服务员推荐几道菜。"],py:["Fú wù yuán bǎ cài dān dì guò lái, wǒ men xiān diǎn le jǐ bēi yǐn liào.","Cài dān shàng méi yǒu zhào piàn, wǒ men jiù qǐng fú wù yuán tuī jiàn jǐ dào cài."],vi:["Phục vụ đưa thực đơn, chúng tôi gọi mấy ly nước trước.","Thực đơn không có ảnh nên nhờ nhân viên gợi ý món."]},
  "3-20-街道":{zh:["这条街道两旁都是老树，夏天走起来很阴凉。","晚上街道上人少了，只剩路灯还亮着。"],py:["Zhè tiáo jiē dào liǎng páng dōu shì lǎo shù, xià tiān zǒu qǐ lái hěn yīn liáng.","Wǎn shang jiē dào shàng rén shǎo le, zhǐ shèng lù dēng hái liàng zhe."],vi:["Hai bên phố toàn cây già, mùa hè đi mát.","Tối phố vắng người, chỉ còn đèn đường sáng."]},
  "3-20-解决":{zh:["他们商量了很久，终于把争吵的问题解决了。","遇到问题时，冷静讨论往往比生气更有效。"],py:["Tā men shāng liang le hěn jiǔ, zhōng yú bǎ zhēng chǎo de wèn tí jiě jué le.","Yù dào wèn tí shí, lěng jìng tǎo lùn wǎng wǎng bǐ shēng qì gèng yǒu xiào."],vi:["Họ bàn lâu cuối cùng giải quyết được chuyện cãi nhau.","Gặp vấn đề, bàn bình tĩnh thường hiệu quả hơn giận dữ."]},
  "3-20-词语":{zh:["这个词语在口语里很常用，新闻里也经常出现。","他把新学的词语写在小卡片上，坐地铁时拿出来看。"],py:["Zhè ge cí yǔ zài kǒu yǔ lǐ hěn cháng yòng, xīn wén lǐ yě jīng cháng chū xiàn.","Tā bǎ xīn xué de cí yǔ xiě zài xiǎo kǎ piàn shàng, zuò dì tiě shí ná chū lái kàn."],vi:["Từ này trong lời nói hằng ngày dùng nhiều, tin cũng hay gặp.","Anh ấy ghi từ mới lên thẻ nhỏ, đi tàu lấy ra xem."]},
  "3-20-试":{zh:["新鞋有点儿紧，他先试穿在店里走几步。","这道菜你试一口，看看咸淡是不是刚好。"],py:["Xīn xié yǒu diǎnr jǐn, tā xiān shì chuān zài diàn lǐ zǒu jǐ bù.","Zhè dào cài nǐ shì yī kǒu, kàn kan xián dàn shì bu shì gāng hǎo."],vi:["Giày mới hơi chật, anh mang thử đi vài bước trong tiệm.","Món này bạn nếm thử xem mặn nhạt vừa chưa."]},
  "3-20-起来":{zh:["闹钟一响，他马上从床上起来去洗脸。","风太大了，快把窗户关起来，别让雨飘进来。"],py:["Nào zhōng yī xiǎng, tā mǎ shàng cóng chuáng shang qǐ lái qù xǐ liǎn.","Fēng tài dà le, kuài bǎ chuāng hu guān qǐ lái, bié ràng yǔ piāo jìn lái."],vi:["Chuông reo là anh bật dậy khỏi giường đi rửa mặt.","Gió to quá, đóng cửa sổ lại kẻo mưa hất vào."]},
  "3-20-选择":{zh:["面对几种选择，她犹豫了很久才点头。","人生里有很多选择，没有绝对的对错。"],py:["Miàn duì jǐ zhǒng xuǎn zé, tā yóu yù le hěn jiǔ cái diǎn tóu.","Rén shēng lǐ yǒu hěn duō xuǎn zé, méi yǒu jué duì de duì cuò."],vi:["Trước mấy lựa chọn, cô ấy lưỡng lự lâu mới gật đầu.","Đời có nhiều lựa chọn, không có đúng sai tuyệt đối."]},
  "3-20-重要":{zh:["明天的面试很重要，今晚你得早点休息。","对他来说，家人的健康比钱更重要。"],py:["Míng tiān de miàn shì hěn zhòng yào, jīn wǎn nǐ dé zǎo diǎn xiū xi.","Duì tā lái shuō, jiā rén de jiàn kāng bǐ qián gèng zhòng yào."],vi:["Phỏng vấn mai rất quan trọng, tối nay bạn nghỉ sớm.","Với anh ấy, sức khỏe gia đình quan trọng hơn tiền."]},
  "3-20-阿姨":{zh:["阿姨下班顺路来接孩子回家吃晚饭。","邻居阿姨经常送我们自家菜园里种的青菜。"],py:["Ā yí xià bān shùn lù lái jiē hái zi huí jiā chī wǎn fàn.","Lín jū ā yí jīng cháng sòng wǒ men zì jiā cài yuán lǐ zhòng de qīng cài."],vi:["Cô tan làm tiện đường đón con về ăn cơm tối.","Cô hàng xóm hay cho rau nhà trồng."]},
  "3-20-除了":{zh:["除了周末，他平时晚上也要加班。","除了中文课，他还想再学一种乐器。"],py:["Chú le zhōu mò, tā píng shí wǎn shang yě yào jiā bān.","Chú le Zhōng wén kè, tā hái xiǎng zài xué yī zhǒng yuè qì."],vi:["Ngoài cuối tuần, tối ngày thường anh cũng tăng ca.","Ngoài tiếng Trung, anh còn muốn học thêm một nhạc cụ."]},
  "3-20-香蕉":{zh:["早餐他吃面包和香蕉，再喝一杯牛奶。","香蕉放得太久，皮上出现了黑点。"],py:["Zǎo cān tā chī miàn bāo hé xiāng jiāo, zài hē yī bēi niú nǎi.","Xiāng jiāo fàng de tài jiǔ, pí shàng chū xiàn le hēi diǎn."],vi:["Sáng anh ăn bánh mì chuối rồi uống sữa.","Chuối để lâu vỏ xuất hiện đốm đen."]},
  "3-20-鼻子":{zh:["空气不好的时候，鼻子会不舒服，记得戴口罩。","小狗用鼻子在地上闻来闻去，找中午吃剩的骨头。"],py:["Kōng qì bù hǎo de shí hou, bí zi huì bù shū fu, jì de dài kǒu zhào.","Xiǎo gǒu yòng bí zi zài dì shang wén lái wén qù, zhǎo zhōng wǔ chī shèng de gǔ tou."],vi:["Không khí kém thì mũi khó chịu, nhớ đeo khẩu trang.","Chó con dùng mũi ngửi khắp đất tìm xương ăn dưa."]}
,
  "1-1-您们":{zh:["您们好，欢迎来我们学校。","请坐，请喝茶。"],py:["Nín men hǎo, huān yíng lái wǒ men xué xiào.","Qǐng zuò, qǐng hē chá."],vi:["Xin chào các vị, chào mừng đến trường chúng tôi.","Xin mời ngồi, mời uống trà."]},
  "1-7-学校":{zh:["我们学校很大。","里面有很多教室和一个图书馆。"],py:["Wǒ men xué xiào hěn dà.","Lǐ miàn yǒu hěn duō jiào shì hé yí gè tú shū guǎn."],vi:["Trường chúng tôi rất lớn.","Bên trong có nhiều phòng học và một thư viện."]},
  "1-7-问":{zh:["我想问你一个问题。","你知道图书馆在哪里吗？"],py:["Wǒ xiǎng wèn nǐ yí gè wèn tí.","Nǐ zhī dào tú shū guǎn zài nǎ lǐ ma?"],vi:["Tôi muốn hỏi bạn một câu hỏi.","Bạn có biết thư viện ở đâu không?"]},
  "1-9-工作":{zh:["他每天工作八个小时。","下班以后，他喜欢看书。"],py:["Tā měi tiān gōng zuò bā gè xiǎo shí.","Xià bān yǐ hòu, tā xǐ huān kàn shū."],vi:["Anh ấy mỗi ngày làm việc tám tiếng.","Sau giờ làm, anh ấy thích đọc sách."]},
  "1-10-本":{zh:["这本书很好看。","我昨天在书店买的。"],py:["Zhè běn shū hěn hǎo kàn.","Wǒ zuó tiān zài shū diàn mǎi de."],vi:["Quyển sách này rất hay.","Tôi mua ở hiệu sách hôm qua."]},
  "1-10-这儿":{zh:["这儿有一家很好的饭店。","我们去那里吃午饭吧。"],py:["Zhèr yǒu yì jiā hěn hǎo de fàn diàn.","Wǒ men qù nà lǐ chī wǔ fàn ba."],vi:["Ở đây có một nhà hàng rất ngon.","Chúng ta đi ăn trưa ở đó đi."]},
  "1-11-住":{zh:["我住在学校附近。","走路十分钟就到了。"],py:["Wǒ zhù zài xué xiào fù jìn.","Zǒu lù shí fēn zhōng jiù dào le."],vi:["Tôi sống ở gần trường.","Đi bộ mười phút là tới."]},
  "1-11-前":{zh:["学校前面有一条小路。","很多学生在那里走。"],py:["Xué xiào qián miàn yǒu yì tiáo xiǎo lù.","Hěn duō xué shēng zài nà lǐ zǒu."],vi:["Phía trước trường có một con đường nhỏ.","Nhiều học sinh đi ở đó."]},
  "1-12-下":{zh:["外面下雨了。","你带伞了吗？"],py:["Wài miàn xià yǔ le.","Nǐ dài sǎn le ma?"],vi:["Bên ngoài đang mưa rồi.","Bạn mang ô chưa?"]},
  "1-12-些":{zh:["我买了一些苹果。","你要不要吃一个？"],py:["Wǒ mǎi le yì xiē píng guǒ.","Nǐ yào bú yào chī yí gè?"],vi:["Tôi mua một ít táo.","Bạn có muốn ăn một quả không?"]},
  "1-12-太..了":{zh:["今天太热了！","我们去买冰水喝吧。"],py:["Jīn tiān tài rè le!","Wǒ men qù mǎi bīng shuǐ hē ba."],vi:["Hôm nay nóng quá!","Chúng ta đi mua nước đá uống đi."]},
  "1-12-小姐":{zh:["那位小姐是新来的同事。","她今天第一天上班。"],py:["Nà wèi xiǎo jiě shì xīn lái de tóng shì.","Tā jīn tiān dì yī tiān shàng bān."],vi:["Cô kia là đồng nghiệp mới đến.","Hôm nay là ngày đầu tiên cô ấy đi làm."]},
  "1-12-来":{zh:["明天你来我家吃饭吧。","我做了很多好吃的菜。"],py:["Míng tiān nǐ lái wǒ jiā chī fàn ba.","Wǒ zuò le hěn duō hǎo chī de cài."],vi:["Ngày mai bạn đến nhà tôi ăn cơm nhé.","Tôi nấu nhiều món ngon lắm."]},
  "1-12-水":{zh:["你要喝水吗？","我去给你倒一杯。"],py:["Nǐ yào hē shuǐ ma?","Wǒ qù gěi nǐ dào yì bēi."],vi:["Bạn muốn uống nước không?","Tôi đi rót cho bạn một cốc."]},
  "1-12-水果":{zh:["妈妈买了很多水果。","有苹果、香蕉和西瓜。"],py:["Mā ma mǎi le hěn duō shuǐ guǒ.","Yǒu píng guǒ, xiāng jiāo hé xī guā."],vi:["Mẹ mua nhiều trái cây.","Có táo, chuối và dưa hấu."]},
  "1-14-不少":{zh:["他认识不少中国朋友。","他们经常一起吃饭聊天。"],py:["Tā rèn shi bù shǎo zhōng guó péng yǒu.","Tā men jīng cháng yì qǐ chī fàn liáo tiān."],vi:["Anh ấy quen khá nhiều bạn Trung Quốc.","Họ thường cùng nhau ăn cơm trò chuyện."]},
  "1-14-先生":{zh:["王先生是我的老师。","他教我们中文，很有耐心。"],py:["Wáng xiān sheng shì wǒ de lǎo shī.","Tā jiāo wǒ men zhōng wén, hěn yǒu nài xīn."],vi:["Ông Vương là thầy giáo của tôi.","Ông ấy dạy chúng tôi tiếng Trung, rất kiên nhẫn."]},
  "1-14-分钟":{zh:["请等我五分钟。","我马上就好了。"],py:["Qǐng děng wǒ wǔ fēn zhōng.","Wǒ mǎ shàng jiù hǎo le."],vi:["Xin đợi tôi năm phút.","Tôi xong ngay thôi."]},
  "1-14-后":{zh:["吃饭后我们去散步。","公园就在前面不远。"],py:["Chī fàn hòu wǒ men qù sàn bù.","Gōng yuán jiù zài qián miàn bù yuǎn."],vi:["Sau khi ăn cơm chúng ta đi dạo.","Công viên ở phía trước không xa."]},
  "1-14-啊":{zh:["啊，今天天气真好！","我们出去走走吧。"],py:["A, jīn tiān tiān qì zhēn hǎo!","Wǒ men chū qù zǒu zou ba."],vi:["Ồ, hôm nay thời tiết đẹp thật!","Chúng ta ra ngoài đi dạo đi."]},
  "1-14-少":{zh:["今天来的人很少。","可能因为天气不好。"],py:["Jīn tiān lái de rén hěn shǎo.","Kě néng yīn wèi tiān qì bù hǎo."],vi:["Hôm nay người đến rất ít.","Có lẽ vì thời tiết không tốt."]},
  "1-14-这些":{zh:["这些东西都是我的。","请你不要动它们。"],py:["Zhè xiē dōng xi dōu shì wǒ de.","Qǐng nǐ bú yào dòng tā men."],vi:["Những thứ này đều là của tôi.","Xin bạn đừng đụng vào chúng."]},
  "2-1-一起":{zh:["我们一起去吃午饭吧。","学校旁边新开了一家面馆。"],py:["Wǒ men yì qǐ qù chī wǔ fàn ba.","Xué xiào páng biān xīn kāi le yì jiā miàn guǎn."],vi:["Chúng ta cùng đi ăn trưa đi.","Bên cạnh trường mới mở một quán mì."]},
  "2-1-也":{zh:["我喜欢吃苹果，也喜欢吃香蕉。","水果对身体很好。"],py:["Wǒ xǐ huān chī píng guǒ, yě xǐ huān chī xiāng jiāo.","Shuǐ guǒ duì shēn tǐ hěn hǎo."],vi:["Tôi thích ăn táo, cũng thích ăn chuối.","Trái cây tốt cho sức khỏe."]},
  "2-2-身体":{zh:["爷爷的身体很好。","他每天早上都去公园走路。"],py:["Yé ye de shēn tǐ hěn hǎo.","Tā měi tiān zǎo shang dōu qù gōng yuán zǒu lù."],vi:["Sức khỏe ông nội rất tốt.","Mỗi sáng ông đều ra công viên đi bộ."]},
  "2-3-千":{zh:["这个手机要三千块钱。","太贵了，我买不起。"],py:["Zhè gè shǒu jī yào sān qiān kuài qián.","Tài guì le, wǒ mǎi bù qǐ."],vi:["Chiếc điện thoại này ba nghìn tệ.","Đắt quá, tôi không mua nổi."]},
  "2-3-粉":{zh:["那朵花是粉的，很好看。","我想送给妈妈。"],py:["Nà duǒ huā shì fěn de, hěn hǎo kàn.","Wǒ xiǎng sòng gěi mā ma."],vi:["Bông hoa kia màu hồng, rất đẹp.","Tôi muốn tặng cho mẹ."]},
  "2-3-粉色":{zh:["她最喜欢粉色。","她的房间里很多东西都是粉色的。"],py:["Tā zuì xǐ huān fěn sè.","Tā de fáng jiān lǐ hěn duō dōng xi dōu shì fěn sè de."],vi:["Cô ấy thích nhất màu hồng.","Trong phòng cô ấy nhiều đồ đều là màu hồng."]},
  "2-3-红色":{zh:["中国人过年喜欢穿红色衣服。","因为红色代表吉祥。"],py:["Zhōng guó rén guò nián xǐ huān chuān hóng sè yī fu.","Yīn wèi hóng sè dài biǎo jí xiáng."],vi:["Người Trung Quốc đón năm mới thích mặc đồ đỏ.","Vì màu đỏ tượng trưng cho may mắn."]},
  "2-3-色":{zh:["你喜欢什么颜色？","我最喜欢蓝色。"],py:["Nǐ xǐ huān shén me yán sè?","Wǒ zuì xǐ huān lán sè."],vi:["Bạn thích màu gì?","Tôi thích nhất màu xanh."]},
  "2-4-给":{zh:["他给我买了一本书。","我非常喜欢这个礼物。"],py:["Tā gěi wǒ mǎi le yì běn shū.","Wǒ fēi cháng xǐ huān zhè gè lǐ wù."],vi:["Anh ấy mua cho tôi một quyển sách.","Tôi rất thích món quà này."]},
  "2-5-吧":{zh:["我们去看电影吧。","今天有一个新电影很好看。"],py:["Wǒ men qù kàn diàn yǐng ba.","Jīn tiān yǒu yí gè xīn diàn yǐng hěn hǎo kàn."],vi:["Chúng ta đi xem phim đi.","Hôm nay có một phim mới rất hay."]},
  "2-5-咖啡":{zh:["我每天早上喝一杯咖啡。","不喝的话，一天都没精神。"],py:["Wǒ měi tiān zǎo shang hē yì bēi kā fēi.","Bù hē de huà, yì tiān dōu méi jīng shén."],vi:["Mỗi sáng tôi uống một ly cà phê.","Nếu không uống thì cả ngày không có tinh thần."]},
  "2-6-因为":{zh:["我今天没去上课，因为生病了。","现在好多了，明天就能去。"],py:["Wǒ jīn tiān méi qù shàng kè, yīn wèi shēng bìng le.","Xiàn zài hǎo duō le, míng tiān jiù néng qù."],vi:["Hôm nay tôi không đi học, vì bị ốm.","Bây giờ đỡ nhiều rồi, ngày mai đi được."]},
