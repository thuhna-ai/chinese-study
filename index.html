    {sub:"2 在商店",vocab:["件","就"],lines:["A：帮我看一下这件衣服怎么样。","B：颜色还可以，就是有点儿大。","A：这件小的怎么样？","B：这件不错，就买这件吧。"]},
    {sub:"3 在教室",vocab:["考试","意思"],lines:["A：今天去不去打球？","B：这两天有点儿累，不去打球了。","A：你在做什么呢？是在想昨天的考试吗？","B：是啊，我觉得听和说还可以，读和写不好，很多字我都不知道是什么意思。"]},
    {sub:"4 在公司",vocab:["咖啡","以后"],lines:["A：休息一下吧，喝咖啡吗？","B：不喝了，我已经喝两杯了。","A：是啊，咖啡喝多了对身体不好。","B：以后我少喝一点儿，每天喝一杯。"]}
  ]},
  {title:"第六课 你怎么不吃了",level:"HSK2",texts:[
    {sub:"1 在学校",vocab:["门","自行车"],lines:["A：你知道小王今天什么时候来学校吗？","B：他已经来了。","A：你怎么知道他来了？","B：我在门外看见他的自行车了。"]},
    {sub:"2 在饭馆",vocab:["羊肉","好吃","面条"],lines:["A：今天的羊肉很好吃，你怎么不吃了？","B：这个星期天天都吃羊肉，不想吃了。","A：那你还想吃什么？","B：来一点儿面条吧。"]},
    {sub:"3 在健身房",vocab:["打篮球","因为","所以","游泳","经常","公斤"],lines:["A：昨天你们怎么都没去打篮球？","B：因为昨天下雨，所以我们都没去。我去游泳了。","A：你经常游泳吗？","B：这个月我天天游泳，我现在七十公斤了。"]},
    {sub:"4 在办公室",vocab:["姐姐"],lines:["A：这两天怎么没看见小张？","B：他去北京了。","A：去北京了？是去旅游吗？","B：不是，听说是去看他姐姐。"]}
  ]},
  {title:"第七课 你家离公司远吗",level:"HSK2",texts:[
    {sub:"1 在家里",vocab:["教室"],lines:["A：大卫回来了吗？","B：没有，他还在教室学习呢。","A：已经9点多了，他怎么还在学习？","B：明天有考试，他说今天要好好准备。"]},
    {sub:"2 去机场的路上",vocab:["机场","路"],lines:["A：你现在在哪儿呢？","B：在去机场的路上。你已经到了吗？","A：我下飞机了。你还有多长时间能到这儿？","B：二十分钟就到。"]},
    {sub:"3 在健身房",vocab:["离","远","公共汽车","小时","慢","快"],lines:["A：你家离公司远吗？","B：很远，坐公共汽车要一个多小时呢！","A：坐公共汽车太慢了，你怎么不开车？","B：开车也不快，路上车太多了！"]},
    {sub:"4 在路上",vocab:["公司"],lines:["A：今天晚上我们一起吃饭吧，给你过生日。","B：今天？离我的生日还有一个多星期呢！","A：下个星期我要去北京，今天过吧。","B：好吧，离这儿不远有一个中国饭馆，走几分钟就到了。"]}
  ]},
  {title:"第八课 让我想想再告诉你",level:"HSK2",texts:[
    {sub:"1 在教室",vocab:["再","让","告诉"],lines:["A：我们下午去看电影，好吗？","B：今天下午我没有时间，明天下午再去吧。","A：你想看什么电影？","B：让我想想再告诉你。"]},
    {sub:"2 在宿舍",vocab:["等","事情"],lines:["A：外边天气很好，我们出去运动运动吧！","B：你等等我，好吗？王老师让我给大卫打个电话。","A：回来再打吧。找大卫有什么事情吗？","B：听说大卫病了，我想找时间去看看他。"]},
    {sub:"3 在宾馆前台",vocab:["服务员"],lines:["A：服务员，我房间的门打不开了。","B：您住哪个房间？","A：317。","B：好的，我叫人去看看。"]},
    {sub:"4 在商店",vocab:["白","黑","贵"],lines:["A：你看看这几件衣服怎么样。","B：这件白的有点儿长，那件黑的有点儿贵。","A：这件红的呢？这是今天新来的。","B：让我再看看。"]}
  ]},
  {title:"第九课 题太多，我没做完",level:"HSK2",texts:[
    {sub:"1 打电话",vocab:["错","从"],lines:["A：你好！请问张欢在吗？","B：你打错了，我们这儿没有叫张欢的。","A：对不起。"]},
    {sub:"2 在学校",vocab:["跳舞","第一","希望","欢迎","问题"],lines:["A：您从几岁开始学习跳舞？","B：我第一次跳舞是在七岁的时候。","A：我女儿今年也七岁了。我希望她能跟您学跳舞，可以吗？","B：没问题，非常欢迎。"]},
    {sub:"3 在家里",vocab:["帮助","上班"],lines:["A：你知道吗？大卫找到工作了。","B：太好了！他从什么时候开始上班？","A：从下个星期一开始。","B：这是他的第一个工作，希望他能喜欢。"]},
    {sub:"4 在教室",vocab:["题","懂","完"],lines:["A：昨天的考试怎么样？你都听懂了吗？","B：听懂了。","A：你都做完了没有？","B：题太多，我没做完。"]}
  ]},
  {title:"第十课 别担心，她游泳游得很好",level:"HSK2",texts:[
    {sub:"1 在家里",vocab:["课","别"],lines:["A：不要看电视了，明天上午还有汉语课呢。","B：看电视对学汉语有帮助。","A：明天的课你都准备好了吗？","B：都准备好了。"]},
    {sub:"2 在医院",vocab:["别"],lines:["A：别看报纸了，医生说你要多休息。","B：好，不看了。给我一杯茶吧。","A：医生说吃药后两个小时不要喝茶。","B：医生还说什么了？","A：医生让你听我的。"]},
    {sub:"3 在家里",vocab:["哥哥","鸡蛋","西瓜","正在"],lines:["A：你怎么买了这么多东西啊？","B：哥哥今天中午回来吃饭。","A：我看看买什么了。羊肉、鸡蛋、面条、西瓜……真不少！妈妈呢？","B：正在准备午饭呢！"]},
    {sub:"4 在家里",vocab:["手机","找","洗"],lines:["A：你在找什么？","B：你看见我的手机了吗？白色的。","A：别找了，手机在桌子上呢，电脑旁边。","B：你看见我的衣服了吗？红色的那件。","A：那件衣服我帮你洗了，在外边呢。"]}
  ]},
  {title:"第十一课 他比我大三岁",level:"HSK2",texts:[
    {sub:"1 在歌厅",vocab:["唱歌","男"],lines:["A：王方，昨天和你一起唱歌的人是谁？","B：一个朋友。","A：什么朋友？是不是男朋友？","B：不是不是，我同学介绍的，昨天第一次见。"]},
    {sub:"2 在宿舍",vocab:["女","孩子","哥哥","比"],lines:["A：左边这个看报纸的女孩子是你姐姐吗？","B：是，右边写字的那个人是我哥哥。","A：你哥哥多大？","B：25岁，他比我大三岁。"]},
    {sub:"3 在商店",vocab:["便宜"],lines:["A：今天的西瓜怎么卖？","B：三块五一斤。","A：比昨天便宜。","B：是，苹果也比昨天便宜一些。您来点儿吧。"]},
    {sub:"4 在学校",vocab:["可能","说话","去年"],lines:["A：前边说话的那个人就是我的汉语老师。你可能不认识她。","B：是新来的汉语老师吗？","A：是去年来的，她姓王，28岁。","B：她比我们老师小两岁。"]}
  ]},
  {title:"第十二课 你穿这件更好看",level:"HSK2",texts:[
    {sub:"1 在教室",vocab:["得"],lines:["A：你每天早上几点起床？","B：六点多。","A：你比我早起一个小时。","B：我睡得也早，我每天晚上十点就睡觉。早睡早起身体好。"]},
    {sub:"2 在朋友家",vocab:["妻子"],lines:["A：再来点儿米饭吧，你吃得太少了。","B：不少了，今天吃得很好，太谢谢你了。","A：你做饭做得怎么样？","B：不怎么样，我妻子比我做得好。"]},
    {sub:"3 在家门口",vocab:["雪","零","度","穿","进"],lines:["A：下雪了，今天真冷。","B：有零下10度吧？","A：是啊，你穿得太少了，我们进房间吧。","B：好吧。"]},
    {sub:"4 在家里",vocab:["弟弟","近"],lines:["A：你在忙什么呢？","B：我弟弟让我帮他找个房子，现在他家离公司有点儿远。","A：住得远真的很累！","B：是啊，他也希望能住得近一点儿。"]}
  ]},
  {title:"第十三课 门开着呢",level:"HSK2",texts:[
    {sub:"1 在办公室",vocab:["着"],lines:["A：门开着呢，请进。","B：请问，张先生在吗？","A：他出去了。你下午再来吧。","B：好的，谢谢！"]},
    {sub:"2 在办公室",vocab:["拿","铅笔"],lines:["A：那个正在说话的女孩儿是谁？","B：我知道她的名字，她姓杨，叫杨笑笑，她姐姐是我同学。","A：那个手里拿着铅笔的呢？","B：我不认识。"]},
    {sub:"3 在运动场",vocab:["笑","长"],lines:["A：听说你有女朋友了？我认识她吗？","B：就是我们班那个长着两个大眼睛，非常爱笑的女孩儿。","A：她不是有男朋友吗？","B：那个已经是她的前男友了。"]},
    {sub:"4 在路上",vocab:["宾馆","一直","往","路口","右边"],lines:["A：请问，这儿离新京宾馆远吗？","B：不远，走路二十分钟就到。","A：你能告诉我怎么走吗？","B：从这儿一直往前走，到了前面的路口再往右走。"]}
  ]},
  {title:"第十四课 你看过那个电影吗",level:"HSK2",texts:[
    {sub:"1 在教室",vocab:["有意思","但是"],lines:["A：你看过那个电影没有？","B：没看过，听说很有意思。","A：那我们下个星期一起去看吧？","B：可以，但是我女朋友也想去。"]},
    {sub:"2 在办公室",vocab:["虽然","次","玩儿"],lines:["A：听说你去过中国，还想去吗？","B：我虽然去过好几次，但是还想再去玩儿玩儿。","A：那我们一起去吧。","B：好啊，到时候我给你打电话。"]},
    {sub:"3 在房间",vocab:["晴"],lines:["A：明天天气怎么样？","B：虽然是晴天，但是很冷。","A：那还能去跑步吗？","B：可以，但是你自己去吧，我还有很多事情要做。"]},
    {sub:"4 在商店",vocab:["百"],lines:["A：你在这个商店买过东西没有？","B：买过一次，这儿的东西还可以，就是不便宜。","A：我喜欢这件衣服，但是觉得有点儿贵。","B：两百块还可以，喜欢就买吧。"]}
  ]},
  {title:"第十五课 新年就要到了",level:"HSK2",texts:[
    {sub:"1 在朋友家",vocab:["日","新年","票","火车站"],lines:["A：今天是12月20日，新年就要到了。","B：新年你准备做什么？","A：我想去北京旅游，北京很不错，我去过一次。","B：你买票了吗？","A：还没有呢，明天就去火车站买票。"]},
    {sub:"2 在公司",vocab:["大家","更"],lines:["A：时间过得真快，新的一年快要到了！","B：是啊，谢谢大家这一年对我的帮助！","C：希望我们的公司明年更好！"]},
    {sub:"3 在车站",vocab:["妹妹","阴"],lines:["A：你妹妹怎么还没来？都八点四十了！","B：我们再等她几分钟吧。","A：都等她半个小时了！","B：她来了，我听见她说话了。"]},
    {sub:"4 在咖啡馆门口",vocab:["阴"],lines:["A：天阴了，我要回去了。","B：好的。快要下雨了，你路上慢点儿。","A：没关系，我坐公共汽车。","B：好的。再见。"]}
  ]},
  {title:"第一课 周末你有什么打算",level:"HSK3",texts:[
    {sub:"1 谈周末的打算",vocab:["打算","电影","咖啡","请","已经","饭馆","电影票"],lines:["小丽：周末你有什么打算？","小刚：我早就想好了，请你吃饭，看电影，喝咖啡。","小丽：请我？","小刚：是啊，我已经找好饭馆了，电影票也买好了。","小丽：我还没想好要不要跟你去呢。"]},
    {sub:"2 在家",vocab:["一直","游戏","作业","考试","着急","复习"],lines:["妈妈：你一直玩儿电脑游戏，作业写完了吗？","儿子：都写完了。","妈妈：明天不是有考试吗？你怎么一点儿也不着急？","儿子：我早就复习好了。","妈妈：那也不能一直玩儿啊。"]},
    {sub:"3 聊旅游计划",vocab:["旅游","最好玩儿","去年","南方","北方","冷","热"],lines:["小丽：下个月我去旅游，你能跟我一起去吗？","小刚：我还没想好呢。你觉得哪儿最好玩儿？","小丽：南方啊，我们去年就是这个时候去的。","小刚：南方太热了，北方好一些，不冷也不热。"]},
    {sub:"4 准备去旅游",vocab:["水果","面包","茶","手机","电脑","地图","衣服","搬家"],lines:["小刚：水果，面包，茶都准备好了，我们还带什么？","小丽：手机，电脑，地图，一个也不能少。","小刚：这些我昨天下午就准备好了。","小丽：再多带几件衣服吧。","小刚：我们是去旅游，不是搬家，还是少带一些吧。"]}
  ]},
  {title:"第二课 他什么时候回来",level:"HSK3",texts:[
    {sub:"1 下山的路上",vocab:["休息","腿","脚","疼","树","上","容易","累"],lines:["小丽：休息一下吧！","小刚：怎么了？","小丽：我现在腿也疼，脚也疼。","小刚：好，那边树多我们过去坐一下吧。","小丽：上来的时候，我怎么没觉得这么累？","小刚：上山容易下山难，你不知道？"]},
    {sub:"2 在打电话",vocab:["秘书","经理","办公室","办事","回来"],lines:["周太太：喂，你好，请问周明在吗？","秘书：周经理出去了，不在办公室。","周太太：他去哪儿了？什么时候回来？","秘书：他出去办事了，下午回来。","周太太：回来了就让他给我打个电话。","秘书：好的，他到了办公室我就告诉他。"]},
    {sub:"3 在楼门口送朋友",vocab:["雨","出租车","伞"],lines:["小刚：雨下得真大。你怎么回去？我送你吧。","小丽：没事，我出去叫辆出租车就行了。","小刚：那你等等，我上楼去给你拿把伞。","小丽：好的，我跟你一起去上吧。","小刚：你在这儿等我吧。我拿了伞就下来。"]},
    {sub:"4 在家",vocab:["胖","运动","做饭"],lines:["周太太：你看，我这么胖，怎么办呢？","周明：你每天晚上吃了饭就睡觉，也不出去走走，能不胖吗？","周太太：其实我每天都运动。","周明：但是你一点儿也没瘦！你做什么运动了？","周太太：做饭啊。"]}
  ]},
  {title:"第三课 桌子上放着很多饮料",level:"HSK3",texts:[
    {sub:"1 在小丽家",vocab:["还是","爬山","小心"],lines:["小刚：明天是晴天还是阴天？","小丽：阴天，电视上说多云。怎么了？有事？","小刚：没事，我们明天要去爬山。","小丽：爬山的时候要小心点儿。","小刚：好，你也去吗？","小丽：我不去，我有事。"]},
    {sub:"2 在商场",vocab:["条","裤子","记得","衬衫","元"],lines:["周太太：你觉得这条裤子怎么样？","周明：我记得你已经有两条这样的裤子了。","周太太：那我们再看看别的。","周明：这件衬衫怎么样？","周太太：还不错，多少钱？","周明：这上面写着320元。","周太太：买一件。"]},
    {sub:"3 在水果店",vocab:["新鲜","甜","只"],lines:["周太太：这些水果真新鲜，我们买西瓜还是苹果？","周明：西瓜吧。你看，这上面写着「西瓜不甜不要钱」。","周太太：那我们买一个大点儿的吧。","周明：再买几个苹果。","周太太：好啊，今天晚上只吃水果不吃饭！"]},
    {sub:"4 在休息室",vocab:["放","饮料","或者","舒服","花","绿"],lines:["小丽：桌子上放着很多饮料，你喝什么？","小刚：茶或者咖啡都可以。你呢？你喝什么？","小丽：我喝茶，茶是我的最爱。天冷了或者工作累了的时候，喝杯热茶会很舒服。","小刚：你喜欢喝什么茶？","小丽：花茶，绿茶，红茶，我都喜欢。"]}
  ]},
  {title:"第四课 她总是笑着跟客人说话",level:"HSK3",texts:[
    {sub:"1 在教室",vocab:["比赛","照片","年级","又"],lines:["小明：这是你们比赛的照片吗？","马可：是，这是我们比赛后照的。","小明：照得不错，你们都是一个年级的吗？","马可：不是。那个又高又漂亮的女孩儿是二年级的。","小明：旁边那个拿着书笑的人是谁？","马可：那是我！"]},
    {sub:"2 在教室",vocab:["聪明","热情","努力","总是","回答","站"],lines:["小丽：你觉得小红怎么样？","同学：她又聪明又热情，也很努力。","小丽：我看她总是笑着回答老师的问题。","同学：她对每个人都笑，也常常对我笑。","小丽：你是不是喜欢她啊？","同学：喜欢她的人太多了，你看那些拿着鲜花站在门口的，都是等她的。"]},
    {sub:"3 在超市门口",vocab:["饿","超市","蛋糕"],lines:["小刚：我有点儿饿了，我们进超市买点儿东西吧。","小丽：好啊，这家超市的蛋糕又便宜又好吃，一块只要2.99元。","小刚：我们买两块，回家吃着蛋糕看电视，怎么样？","小丽：好啊，我再去买一些喝的。","小刚：喝着咖啡吃蛋糕，太好了！"]},
    {sub:"4 在饭馆儿",vocab:["年轻","认真","客人"],lines:["经理：您好！您找谁？","客人：你们这儿是不是有一个又年轻又漂亮的服务员？","经理：我们这儿年轻、漂亮的服务员有很多。","客人：她工作又认真又热情。","经理：您能再说说吗？","客人：她总是笑着跟客人说话。","经理：啊，我知道了，你说的是李小美吧？"]}
  ]},
  {title:"第五课 我最近越来越胖了",level:"HSK3",texts:[
    {sub:"1 在小丽家",vocab:["发烧","为"],lines:["朋友：我听说你身体不舒服，怎么了？","小丽：前几天有点儿发烧，现在好多了。","朋友：喝杯茶吧，这是我为你买的绿茶，很不错。","小丽：谢谢，我要吃药，不喝茶了。","朋友：那喝杯水吧。","小丽：好的。"]},
    {sub:"2 在打电话",vocab:["照顾","用","感冒"],lines:["周太太：对不起，我明天不能和你们出去玩儿了。","张太太：为什么？怎么了？","周太太：我儿子生病了，我要在家照顾他。","张太太：他吃药了吗？要不要去医院？","周太太：不用去医院，昨天吃了感冒药，现在好一些了。","张太太：那我们下次再一起出去玩儿吧。"]},
    {sub:"3 在小刚家",vocab:["季节","当然","春","草","夏","裙子"],lines:["小丽：你最喜欢哪个季节？","小刚：当然是春天，天气不那么冷了，草和树都绿了，花也开了。","小丽：我最喜欢夏天，因为我可以穿漂亮的裙子了。","小刚：那我也喜欢夏天了。","小丽：怎么？你也有漂亮的裙子？","小刚：不，我喜欢看你穿漂亮的裙子。"]},
    {sub:"4 在小刚家",vocab:["最近","越"],lines:["小丽：我最近越来越胖了。","小刚：谁说的？我觉得你越来越漂亮了。","小丽：你看，这条裙子是去年买的，今年就不能穿了。","小刚：那是因为你吃得太多了，少吃点儿吧。","小丽：我做的饭越来越好吃，我能少吃吗？"]}
  ]},
  {title:"第六课 把重要的东西放在我这儿吧",level:"HSK3",texts:[
    {sub:"1 在客厅",vocab:["眼镜","突然","离开","清楚","刚才","帮忙"],lines:["周明：我的眼镜呢？怎么突然找不到了？你看见了吗？","周太太：我没看见啊。","周明：我离不开眼镜，没有眼镜，我一个字也看不清楚。","周太太：你去房间找找，是不是刚才放在桌子上了？","周明：我怎么看得到啊？你快过来帮忙啊。","周太太：好吧，我帮你去找找。"]},
    {sub:"2 在打电话",vocab:["特别","讲","明白","锻炼"],lines:["同学：今天的作业你做完了吗？","儿子：刚做完，你呢？","同学：今天这些题特别难，我看不懂，不会做，你能帮我吗？","儿子：电话里讲不明白，你来我家吧，我给你讲讲。","同学：好啊，我锻炼完了就过去。"]},
    {sub:"3 在休息室",vocab:["音乐","公园","聊天"],lines:["同事：你怎么有点儿不高兴？","小刚：我想请小丽吃饭，但是找不到好饭馆儿。","同事：那你请她听音乐会吧，她喜欢听音乐。","小刚：音乐会人太多，买不到票。","同事：那去公园走走，聊聊天儿吧。","小刚：公园太大，多累啊。"]},
    {sub:"4 在客厅",vocab:["睡着","更"],lines:["周太太：你怎么还喝咖啡？","周明：怎么了？","周太太：你不是说晚上睡不着觉吗？","周明：没事，我只喝一杯。","周太太：你还是喝杯牛奶吧，可以睡得更好些。","周明：好吧，牛奶呢？","周太太：还没买呢。"]}
  ]},
  {title:"第七课 我跟她都认识五年了",level:"HSK3",texts:[
    {sub:"1 在办公室",vocab:["同事","以前","银行"],lines:["同事：那个漂亮的新同事是谁？","小刚：那是小丽。","同事：她刚来北京吗？","小刚：不，她在北京工作三年了。","同事：以前她在哪儿工作？","小刚：她在银行工作了两年以后来的我们公司。"]},
    {sub:"2 在休息室",vocab:["久","感兴趣"],lines:["同事：周末你跟小丽去哪儿玩儿了？","小刚：我们去唱歌了。","同事：你们唱了多久？","小刚：我们唱了两个小时歌，晚上还去听音乐会了。","同事：你们都对音乐感兴趣吗？","小刚：她对音乐感兴趣，我对她更感兴趣。"]},
    {sub:"3 在休息室",vocab:["结婚","欢迎"],lines:["小刚：我跟小丽下个月结婚，到时候欢迎你来。","同事：什么？结婚？","小刚：对啊，突然吗？","同事：你们不是刚认识吗？","小刚：我跟她都认识五年了。","同事：你跟她结婚，那我怎么办啊？"]},
    {sub:"4 在公司门口",vocab:["迟到","半","接","刻","差"],lines:["小丽：你看看手表，怎么迟到了？","小刚：没迟到啊。","小丽：你不是说七点半来接我吗？你迟到了一刻钟。","小刚：现在不是七点半吗？","小丽：已经差一刻八点了！我都在这儿坐了半个小时了。","小刚：不是我迟到了，是你的表快了一刻钟。"]}
  ]},
  {title:"第八课 你去哪儿我就去哪儿",level:"HSK3",texts:[
    {sub:"1 在休息室",vocab:["又","满意","电梯","层","害怕"],lines:["同事：听说你最近打算买房子？","小丽：是，昨天去看了看，今天又去看了看，明天还要再去看看。","同事：都不满意吗？","小丽：一个没有电梯，不方便。一个有电梯，但是在二十层。","同事：二十层怎么了？","小丽：太高了，往下看多害怕啊！"]},
    {sub:"2 在学校",vocab:["熊猫","见面"],lines:["小明：听说你下个星期就要回国了？","马可：是啊，真不想离开北京。","小明：我下星期不在北京，不能去机场送你了。","马可：没关系，你忙吧。","小明：这个小熊猫送给你，欢迎你以后再到中国来。","马可：谢谢。希望以后能再见面。"]},
    {sub:"3 在咖啡厅",vocab:["安静","可乐","一会儿","马上","洗手间"],lines:["小丽：小刚，我们坐哪儿？","小刚：你坐哪儿我就坐哪儿。","小丽：坐这儿吧，这儿安静。你想喝什么饮料？","小刚：你喝什么我就喝什么。","小丽：喝可乐吧。你等我一会儿，我马上回来。","小刚：小丽，你去哪儿？你去哪儿我就去哪儿。","小丽：我去洗手间。"]},
    {sub:"4 在周明家",vocab:["老","几乎","变化","健康","重要"],lines:["老同学：快五年了，你几乎没变化。","周太太：谁说的？我胖了，以前的衣服都不能穿了。","老同学：健康最重要，胖瘦没关系。","周太太：是呀，想吃什么就吃什么。","老同学：你做饭还是周明做饭？","周太太：我做，我想吃什么就做什么，想吃多少就做多少。"]}
  ]},
  {title:"第九课 她的汉语说得跟中国人一样好",level:"HSK3",texts:[
    {sub:"1 在教室",vocab:["中文","班","一样"],lines:["大山：马可，你的中文越说越好了！","马可：哪里哪里，我们班李静说得更好。","大山：怎么好？","马可：她的汉语说得跟中国人一样好。","大山：李静？我怎么没听说过这个名字？","马可：她是我们的汉语老师。"]},
    {sub:"2 在蛋糕店",vocab:["最后","放心","一定"],lines:["小丽：别吃了，你已经吃了三块蛋糕了。","小刚：这是最后一块。","小丽：你总是吃甜的东西，会越吃越胖。","小刚：你放心，我一定不会变胖。","小丽：为什么？","小刚：我们家的人都很瘦，吃不胖。"]},
    {sub:"3 在山上",vocab:["担心","比较","了解","先","中间"],lines:["小丽：我有点儿害怕。","小刚：怎么了？","小丽：山越高，路越难走，我也越爬越冷。","小刚：不用担心，有我呢，我对这儿比较了解。","小丽：那我们先休息一下，一会儿再爬。","小刚：好，一会儿我们可以从中间这条路上去。"]},
    {sub:"4 在小明家",vocab:["参加","影响"],lines:["同学：小明，你的眼睛怎么跟大熊猫一样了？","小明：我这几天脚疼，没休息好。","同学：去医院了吗？医生说什么？","小明：他让我多休息。休息得越多，好得越快。","同学：下个月的篮球比赛，你能参加吗？","小明：一定能参加，一点儿影响也没有。"]}
  ]},
  {title:"第十课 数学比历史难多了",level:"HSK3",texts:[
    {sub:"1 在教室",vocab:["个子","矮"],lines:["朋友：大山，你和马可谁个子高？","大山：马可比我高，我比马可矮一点儿。","朋友：那你们谁大？","大山：我比马可大两岁。","朋友：你们谁的汉语说得更好？","大山：马可比我说得好一些，我的汉语没有他好。"]},
    {sub:"2 在教室",vocab:["历史","体育","数学"],lines:["小明：我喜欢历史课、体育课，不喜欢数学课。","同学：为什么？数学也很有意思啊。","小明：我觉得数学比历史难多了，我听不懂。","同学：别担心，我可以帮你。","小明：好啊，我们每天学多长时间？","同学：一两个小时吧。"]},
    {sub:"3 在休息室",vocab:["方便","自行车","骑","旧","换"],lines:["同事：你最近比以前来得早多了，搬家了？","小丽：是啊，你不知道？我上个月就搬家了，走路二十分钟就到。","同事：那很方便啊。","小丽：我还打算买辆自行车，骑车七八分钟就能到。","同事：你不是有一辆吗？","小丽：那辆太旧了，要换一辆，很便宜，两三百块钱。"]},
    {sub:"4 在看房子",vocab:["地方","中介","主要","环境","附近"],lines:["大山：这两个地方的房子一样吗？","中介：不一样。您看，学校外边的房子比学校里边的大一些。","大山：大小没关系，主要是环境，哪个更安静？","中介：学校里边的没有学校外边的那么安静。","大山：哪个方便一些呢？","中介：学校里边比学校外边方便，附近有三四个车站。"]}
  ]},
  {title:"第十一课 别忘了把空调关了",level:"HSK3",texts:[
    {sub:"1 在教室",vocab:["图书馆","借","词典","灯"],lines:["小明：我先走了。","同学：你去哪儿？","小明：我去图书馆借本书。","同学：帮我把这本词典换了吧。","小明：好，等一会儿你离开教室的时候，记得把灯关了。","同学：好的，放心吧。"]},
    {sub:"2 在会议室",vocab:["会议","结束","忘记","空调","关","左右","地铁","半"],lines:["周明：会议结束后，别忘记把空调关了。","小丽：好的。王经理两点左右来了个电话。","周明：他已经到北京了？","小丽：是的，他正坐地铁来我们公司呢。","周明：等他到了就告诉我。"]},
    {sub:"3 在客厅",vocab:["筷子","双","啤酒","口","瓶子"],lines:["妈妈：还差一双筷子，你去拿一下。","儿子：今天怎么做了这么多菜？","妈妈：今天是你爸爸的生日。","儿子：真的啊？我把爸爸的生日忘了。那我们今天喝点儿啤酒吧。","妈妈：医生说你爸爸一口酒都不能喝，别让他看见酒瓶子。"]},
    {sub:"4",vocab:["笔记本电脑","便宜","电子邮件","习惯","突然"],lines:["这个笔记本电脑我去年买的时候要五千块左右，现在便宜多了。","我想把这个电脑卖了，再买一个更好的。","现在我每天起床后的第一件事就是打开电脑，看电子邮件。","我已经很少写信，也很少用笔写字，已经习惯用电脑来学习和工作了。","哪一天突然没有了电脑，我们怎么办呢？"]}
  ]},
  {title:"第十二课 把重要的东西放在我这儿吧",level:"HSK3",texts:[
    {sub:"1 在家",vocab:["太阳","睡觉","以前","生气","告诉"],lines:["小丽：今天太阳从西边出来了吗？","小刚：怎么了？","小丽：你怎么这么早就要睡觉了？以前都要12点以后才睡觉。","小刚：我明天八点就要到公司。","小丽：有事吗？","小刚：经理生气了，他告诉我，明天8点不到，以后就别来了。"]},
    {sub:"2 在家",vocab:["办事","行李箱","照片","照顾","准备"],lines:["小刚：我要跟周经理去外地办事，明天的飞机。","小丽：那我帮你把衣服放到行李箱里吧。什么时候回来？","小刚：一个星期就回来。","小丽：啊？一个星期以后才回来？","小刚：你要自己照顾好自己，我已经给你准备好吃的和喝的了。","小丽：好吧。我已经把我的照片放在你的包里了。"]},
    {sub:"3 在机场",vocab:["护照","发现","忘记","起飞","钱包","重要"],lines:["周明：你怎么才来？","小刚：对不起，周经理，来机场的路上我才发现忘带护照了。","周明：快点吧，飞机就要起飞了。","小刚：您有钱吗？司机把我送到机场的时候，我才发现忘记带钱包了。","周明：我看你还是把重要的东西放在我这儿吧。"]},
    {sub:"4",vocab:["黑板","习惯","铅笔","教"],lines:["我是一个中学老师，教学生画画儿。","每次下课前，我都会把下次学生需要带的东西写在黑板上，但是每次上课时，总会有学生忘了拿铅笔，所以我有点儿生气，不是因为他们没带铅笔，是因为他们没有好的学习习惯。"]}
  ]},
  {title:"第十三课 我是走回来的",level:"HSK3",texts:[
    {sub:"1 在家",vocab:["终于","回来","红酒","礼物"],lines:["小丽：你终于回来了！从哪儿买回来这么多东西啊？","小刚：都是从那边的商店买回来的。","小丽：怎么还买红酒回来了？谁喝啊？","小刚：这是给爷爷的礼物，明天我们一起送过去，看爷爷奶奶。","小丽：那我的礼物呢？快拿出来让我看看。","小刚：我不是已经回来了吗？"]},
    {sub:"2 在家",vocab:["过去","公共汽车","走"],lines:["小丽：我今天看见你和一个女的进了咖啡店，她是谁啊？","小刚：她是我今天在路上遇到的一个老同学。","小丽：你们就一起去喝咖啡了？","小刚：是啊，一边喝咖啡一边说了些过去的事。","小丽：你回来得这么晚。是说了很多过去的事吗？","小刚：不是。没有公共汽车了，我是走回来的。"]},
    {sub:"3 在打电话",vocab:["电影院","愿意","有意思","生活"],lines:["同事：小丽，周末你一般跟小刚出去看电影吗？","小丽：我很少去电影院看电影，我更愿意在家看电视。","同事：看电视有什么意思啊？","小丽：可以一边吃一边看，做久了还可以站起来休息一会儿。","同事：你应该多出去走走，这样你们的生活会更有意思。","小丽：有他在，我的生活已经很有意思了。"]},
    {sub:"4",vocab:["校长","坏","经常"],lines:["刚结婚的时候，我丈夫是中学老师，他喜欢每天早上起床后，一边吃早饭一边看报纸。","十年过去了，现在他已经是校长了，因为太忙，每天早上我起床后都看不到他，晚上很晚他才回到家。","我真怕他累坏了。","希望他能少一些会议，多一些休息，可以经常和我还有孩子在一起。"]}
  ]},
  {title:"第十四课 你把水果拿过来",level:"HSK3",texts:[
    {sub:"1 在家",vocab:["打扫","干净","然后","冰箱"],lines:["周太太：客人就要来了，你怎么还不打扫房间啊？","周明：别着急，我让孩子们打扫呢，客人来的时候，他们会把房间打扫干净。","周太太：那你也不能看电视啊。","周明：你让我做什么？","周太太：先把茶和杯子放好，然后把冰箱里的西瓜拿出来。","周明：太热了，我还是先把空调打开吧。"]},
    {sub:"2 在打电话",vocab:["洗澡","节目"],lines:["同事：你在忙什么呢？刚才打你的手机你也不接。","小刚：对不起，我刚洗了个澡，没听见。有什么事吗？","同事：我想问问你公司里的一些事情。","小刚：你先等一下，我去把电视关了。","同事：没关系，你先把电视节目看完吧，然后再给我回电话。"]},
    {sub:"3 在小明家",vocab:["月亮","像","盘子","刮风","叔叔","阿姨","故事","声音"],lines:["同学：今晚的月亮真漂亮，像白色的盘子一样。","小明：是啊，外边也刮风，我们坐在外边一边看月亮一边吃东西，怎么样？","同学：好啊，我先把桌椅搬出去，然后你把水果拿过来，我们听叔叔阿姨讲讲他们年轻时候的故事。","小明：太好了！记得给大山打个电话，让他马上过来。","同学：不用打了，你听外边的声音，一定是大山。"]},
    {sub:"4",vocab:["菜单","简单","香蕉"],lines:["你吃过水果饭吗？你在饭馆儿的菜单上见过水果饭吗？你想学着做水果饭吗？","其实做水果饭很简单，先把米饭做好，然后再把一块块新鲜的水果放进去，水果饭就做好了。","你可以做苹果饭、香蕉饭，要是你愿意，还可以做西瓜饭。","多吃新鲜水果对身体好。"]}
  ]},
  {title:"第十五课 其他都没什么问题",level:"HSK3",texts:[
    {sub:"1 在办公室",vocab:["留学","水平","提高","练习","完成","句子","其他","发"],lines:["大山：老师，我来中国留学两年了，但是我的汉语水平提高得一点儿也不快啊。","老师：你每天认真学习，做练习、完成作业，一直不错啊。","大山：这是我昨天的作业，您帮我看看对不对。","老师：写得不错，除了这个句子意思有些不清楚外，其他都没什么问题。","大山：谢谢老师！","老师：以后有什么不明白的地方，可以给我打电话或者发电子邮件。"]},
    {sub:"2 在教室",vocab:["要求","注意","小云"],lines:["学生：老师，除了小云，其他人都来了。","老师：比赛马上就要开始了，小云怎么还没来？","学生：刚才给她打电话了，她在路上呢。","老师：不等她了，我先给大家讲讲这次比赛的要求和一些需要注意的地方。","学生：老师，您放心，今天的比赛我们一定能拿第一。"]},
    {sub:"3 在休息室",vocab:["上网","除了","新闻","花","极"],lines:["同事：现在用电脑上网真方便啊！","小刚：是啊，除了看新闻，人们还可以在网上听歌、看电影、买东西。","同事：对了，你从网上买的那件衣服呢？怎么没见你穿？","小刚：那件衣服我穿着有点儿小，给我弟弟了。","同事：他满意吗？","小刚：不用花钱，还有新衣服穿，他满意极了。"]},
    {sub:"4",vocab:["节日","举行","世界","街道","各","文化"],lines:["除了春节、中秋节以外，啤酒节也是这里很重要的一个节日。","这个地方每年夏天都要举行一次啤酒节。在啤酒节上，你可以喝到世界上不同地方的啤酒。","除了喝啤酒，你还可以在街道两边看到世界上不同地方的歌舞。","你想不想了解世界各个地方的啤酒文化？来这里的啤酒节看看吧。"]}
  ]},
  {title:"第十六课 我现在累得下了班就想睡觉",level:"HSK3",texts:[
    {sub:"1 在公司",vocab:["城市","如果","认为"],lines:["小丽：我不喜欢一直住在同一个城市，想去其他城市看一看。","周明：我年轻的时候也这么想，但是那时候没有钱，如果有钱，就去了。","小丽：那您现在为什么不去？","周明：现在钱不是问题了，主要是没有时间。","小丽：我认为现在您有时间也不会出去玩儿。","周明：您说得对，我现在累得下了班就想睡觉。"]},
    {sub:"2 在同事家",vocab:["皮鞋","帽子","长","可爱","米","公斤","鼻子","头发"],lines:["同事：谢谢你们来看我女儿。你送的小皮鞋和小帽子真漂亮！","小丽：别客气，你女儿长得白白的、胖胖的，真可爱！现在多高了？","同事：快1米了，25公斤。","小丽：你看她鼻子小小的，头发黑黑的，长得像谁？","同事：像她爸爸，刚出生时她爸爸高兴得一个晚上都没睡着。"]},
    {sub:"3 在公司",vocab:["检查","刷牙"],lines:["小刚：我的牙还是很疼。","同事：如果不舒服，就去医院检查一下吧。","小刚：检查好几次了，但是没什么用。","同事：大夫怎么说的？","小刚：每次医生都告诉我，回家好好儿刷牙。"]},
    {sub:"4",vocab:["关系","别人","词语"],lines:["很多人都觉得现在人和人的关系冷冷的，这可能是因为工作太忙，忙得没时间跟别人见面，累得不愿意和别人多说话。","其实，我们应该多对别人笑笑，说话时如果能多用一些「您好」「谢谢」这样的词语，和别人的关系就会变得更好。"]}
  ]},
  {title:"第十七课 谁都有办法看好你的病",level:"HSK3",texts:[
    {sub:"1 在公司",vocab:["请假","一共"],lines:["小丽：周经理，下个星期我可以请几天假吗？","周明：你有什么事？","小丽：我的一个老朋友结婚，我跟他两年没见了。","周明：你一共想请几天假？","小丽：三天。"]},
    {sub:"2 在公司",vocab:["邻居","后来","爱好"],lines:["同事：小丽，那个高高的男人是你们公司的吗？你对他了解吗？","小丽：我们过去是邻居，后来是大学同学，关系一直很不错。","同事：他一般喜欢做什么？","小丽：他有很多爱好，唱歌、画画儿、踢足球，什么都会。","同事：真的？那你介绍我们认识认识吧。","小丽：不行，现在他是我丈夫。"]},
    {sub:"3 在家",vocab:["办法","饱","为了","决定"],lines:["周太太：最近我觉得哪儿都不舒服，你带我去医院检查检查吧。","周明：不用去医院，谁都有办法看好你的「病」。我问你，你多久没运动了？","周太太：我三年没运动了。","周明：谁都知道运动对身体好。但是你吃饱了就睡。","周太太：为了健康，我真应该多锻炼锻炼了。从明天起，我决定每天去长跑。"]},
    {sub:"4",vocab:["选择","冬天","必须","根据","情况","渴"],lines:["「运动很重要」这句话谁都懂。但是你知道怎么运动吗？","第一，要选择「对」的时间。一般来说，早上9点是最好的时间，冬天要再晚一些。","第二，要选择「对」的地点，公园、山上、游泳馆，这些地方都可以运动。","第三，必须要根据自己的健康情况运动。如果你很久没爬山或者游泳了，运动一会儿就一定要休息休息。","还要记得刚运动完口渴的时候，不要马上喝水。"]}
  ]},
  {title:"第十八课 我相信他们会同意的",level:"HSK3",texts:[
    {sub:"1 在家",vocab:["向","万","只要"],lines:["朋友：老周，我打算买房子了，想向你借点儿钱。","周明：没问题，只要我有，就一定会借给你的。还差多少？","朋友：还差5万块钱。","周明：好，钱下午打给你。你打算在哪儿买房？","朋友：就在我们医院前面。","周明：那你以后去医院就方便了。"]},
    {sub:"2 在家",vocab:["动物","照顾","只要"],lines:["小明：妈妈，你看那只狗多可爱，眼睛大大的，嘴小小的，我们买回去吧。","妈妈：动物和小孩儿一样，都需要人照顾。买回家去，谁照顾它啊？","小明：我照顾啊。","妈妈：这段时间你自己的衣服都没洗，你能照顾好它吗？","小明：只要你给我买，我就能照顾好它。"]},
    {sub:"3 在公司",vocab:["选择","同意","相信","关于","机会","而且"],lines:["经理：说说你为什么选择来我们公司工作。","学生：贵公司不但很有名，而且工作环境好。","经理：做这个工作有点儿累，需要经常去外地。你家人同意吗？","学生：只要我愿意，我相信他们就会同意的。","经理：好，那你明天来上班吧。关于这个工作，还有什么问题吗？","学生：没有了，谢谢您给我这个机会，我会努力的。"]},
    {sub:"4",vocab:["国家","种","特点","奇怪","经过","习惯"],lines:["不同的国家有不同的文化，每种文化都有自己的特点。","到了一个新环境，你会觉得什么都很新鲜，而且还会觉得有点奇怪：有些国家的人名写在姓前面，有些国家的人名写在姓后面，但是只要经过一段时间，就会慢慢地习惯。"]}
  ]},
  {title:"第十九课 你没看出来吗",level:"HSK3",texts:[
    {sub:"1 在家",vocab:["耳朵","脸","短"],lines:["爸爸：女儿最近喜欢把头发放在耳朵后面，你知道为什么吗？","妈妈：这样可以使她的脸看上去漂亮一些。","爸爸：我最近觉得她和以前不太一样了。","妈妈：女儿变化不小，她小时候喜欢短头发，像男孩子一样。","爸爸：我也想起来了。她现在慢慢地开始像个女孩子了。"]},
    {sub:"2 在看照片",vocab:["马","张","位","蓝"],lines:["小丽：上次我们参加骑马比赛的照片，我选了几张洗出来了。","同事：快给我看看。骑得最快的这位是谁？","小丽：你没看出来吗？他是小刚啊。","同事：怎么看上去跟现在不太一样？","小丽：他上班穿西服、衬衫，比赛的时候穿的是运动服。","同事：他今天穿蓝西服，看上去像40多岁，还是穿运动服让他更年轻。"]},
    {sub:"3 在小丽家",vocab:["秋","过","鸟","哭"],lines:["朋友：我们一年没见了吧？","小丽：听说你都有女儿了？她多大了？","朋友：她去年秋天出生的，刚过完一岁生日。","小丽：她喜欢什么？我送给她。","朋友：她就喜欢听她爸爸学鸟叫。哭的时候，只要他爸爸学小鸟叫，她马上就安静下来了。","小丽：啊？这个礼物我没办法送。"]},
    {sub:"4",vocab:["黄河","船","经过"],lines:["这次旅游，我去了不少地方，每个地方都让我非常难忘。","我先去看了黄河，黄河是中国有名的大河，我坐在船上，一边看一边照相。","一路上经过了很多地方，每个地方都不一样。","我想快点儿把照片发给大家，叫朋友们也高兴高兴。"]}
  ]},
  {title:"第二十课 我被他影响了",level:"HSK3",texts:[
    {sub:"1 在休息室",vocab:["照相机","被","难过","东","信用卡"],lines:["小丽：我的照相机被谁拿走了？怎么找不到了？","同事：你再找找。是不是没带来？","小丽：我找了，没找到啊。","同事：别难过，再买一个吧，公司东门外不就有一个大商场吗？","小丽：但是我这个月信用卡里的钱已经花得差不多了。"]},
    {sub:"2 在教室",vocab:["关心","只有","才","成绩"],lines:["小明：你怎么突然关心起体育来了？","朋友：我的男朋友喜欢看足球比赛，我被他影响了。","小明：看来只有爱，才能让人有变化。","朋友：是啊，为了和他的爱好一样，我天天看球赛。","小明：除了足球，他还影响你什么了？","朋友：我最近天天上网玩儿游戏，我的成绩差极了。"]},
    {sub:"3 在饭馆儿",vocab:["碗","分"],lines:["朋友：那个拿着碗吃饭的人是你哥哥吗？他和你长得真像。","大卫：我们经常被别人认错。","朋友：只有你们的爸爸妈妈才能分出来哪个是哥哥，哪个是弟弟吧。","大卫：除了父母以外，还有我们自己也能啊。","朋友：你们两个除了长得像，还有什么相同的地方？","大卫：我们住在同一个楼、同一个房间……"]},
    {sub:"4",vocab:["解决","试","真正","多么"],lines:["年轻人遇到难题，常常很着急，不知道怎么办。","其实，不同的问题有不同的解决办法。有些问题看上去很难，但是做起来非常简单，所以得试着做做。","有些问题看上去虽然简单，但是解决起来难极了。","所以只有真正做事情的时候，才能了解有多么难。","不过，我们一定要相信：多么难的问题，都会被解决的。"]}
  ]},
  {title:"第一课 简单的爱情",level:"HSK4上",texts:[
    {sub:"1 孙月和王静聊王静的男朋友",vocab:["法律","俩","印象","深","熟悉","不仅","性格"],lines:["孙月：听说你男朋友李进跟你是一个学校的，是你同学吗？","王静：是的，他学的是新闻，我学的是法律，我和他不是一个班。","孙月：那你们俩是怎么认识的？","王静：我们是在一次足球比赛中认识的。我们班跟他们班比赛，他一个人踢进两个球，我对他印象很深，后来就慢慢熟悉了。","孙月：你为什么喜欢他？","王静：他不仅足球踢得好，性格也不错。"]},
    {sub:"2 王静跟李老师聊她要结婚的事情",vocab:["开玩笑","从来","最好","共同","适合","幸福"],lines:["王静：李老师，我下个月5号就要结婚了。","李老师：你是在开玩笑吧？你们不是才认识一个月？","王静：虽然我们认识的时间不长，但我从来没这么快乐过。","李老师：两个人在一起，最好能有共同的兴趣和爱好。","王静：我们有很多共同的爱好，经常一起打球、唱歌、做菜。","李老师：看来你真的找到适合你的人了。祝你们幸福！"]},
    {sub:"3 高老师和李老师聊结婚后的生活",vocab:["生活","刚","浪漫","够","缺点","接受"],lines:["高老师：听说您跟妻子结婚快二十年了？","李老师：到6月9号，我们就结婚二十年了。这么多年，我们的生活一直挺幸福的。","高老师：我和丈夫刚结婚的时候，每天都觉得很新鲜，在一起有说不完的话。但是现在……","李老师：两个人共同生活，只有浪漫和新鲜感是不够的。","高老师：您说得对！我现在每天看到的都是他的缺点。","李老师：两个人在一起时间长了，就会有很多问题。只有接受了他的缺点，你们才能更好地一起生活。"]},
    {sub:"4",vocab:["羡慕","爱情","星星","即使","加班","亮","感动"],lines:["很多女孩子羡慕浪漫的爱情。那什么是浪漫呢？年轻人说：浪漫是她想要月亮时，你不会给她星星；中年人说：浪漫是即使晚上加班到零点，到家时，自己家里也还亮着灯；老年人说：浪漫其实就像歌中唱的那样，「我能想到最浪漫的事，就是和你一起慢慢变老。」其实，让我们感动的，就是生活中简单的爱情。有时候，简单就是最大的幸福。"]},
    {sub:"5",vocab:["自然","原因","互相","吸引","幽默","脾气"],lines:["说到结婚，人们就会很自然地想起爱情。爱情是结婚的重要原因，但两个人共同生活，不仅需要浪漫的爱情，更需要性格上互相吸引。","我丈夫是个很幽默的人。即使是很普通的事情，从他嘴里说出来也会变得很有意思。在我难过的时候，他总是有办法让我高兴起来。而且他的脾气也不错，结婚快十年了，我们俩几乎没因为什么事红过脸，很多人都特别羡慕我们。"]}
  ]},
  {title:"第二课 真正的朋友",level:"HSK4上",texts:[
    {sub:"1 小夏和马克聊马克的中国朋友",vocab:["适应","交","平时","逛","短信","正好"],lines:["小夏：来中国快一年了，你适应这儿的生活了吗？","马克：开始有点儿不习惯，后来就慢慢适应了，最近我还交了一个中国朋友。","小夏：那就好，快给我讲讲你新交的中国朋友。","马克：我们是在图书馆认识的。平时我们常常一起看书、逛街、踢足球。有时候他还给我发一些幽默短信。","小夏：你的这个朋友真不错！下次介绍我们认识认识，怎么样？","马克：没问题！我们下午要去踢足球，正好一起去吧。"]},
    {sub:"2 小李和小林聊同学聚会的事情",vocab:["聚会","联系","差不多","专门","毕业","麻烦"],lines:["小李：星期天同学聚会，你能来吗？","小林：能来。班里同学你联系得怎么样了？来多少人？","小李：差不多一半儿吧，张远还专门从国外飞回来呢。","小林：是吗？毕业都快十年了，真想大家啊！对了，今天早上，我在地铁站遇到了王静，她毕业后就去上海工作了，她这次是来旅游的。","小李：那太好了！麻烦你跟她联系一下，请她一起来参加同学聚会。聚会就在学校门口那个饭店，六点半。别迟到啊！","小林：放心吧。星期天六点半见！"]},
    {sub:"3 孙月和王静聊她们的朋友",vocab:["好像","重新","尽管","真正","友谊"],lines:["孙月：这是什么时候的照片？你真年轻！","王静：这是上大学时的照片。一看到这张照片，我就想起过去那段快乐的日子，好像重新回到了校园。","孙月：旁边这个人一定是你的好朋友吧？你们现在还联系吗？","王静：当然了，尽管已经毕业这么多年，我们还是经常联系的，每次都有说不完的话。","孙月：真羡慕你！我上大学时最好的朋友去了南方工作，我们俩已经好久没联系了。我一会儿就给她打个电话。","王静：对。要知道，能有一个真正的朋友，有一段真正的友谊，是多么不容易！"]},
    {sub:"4",vocab:["丰富","无聊","讨厌","却","周围","交流"],lines:["每个人都需要朋友，朋友可以丰富我们的生活。离开朋友，我们的生活一定会非常无聊。那么，怎样才能交到更多的朋友呢？当然，要有好脾气。一个脾气不好的人虽然不一定让人讨厌，但是却很难跟人交朋友。因为没有人会喜欢跟一个总是容易生气的人在一起。我们还要经常跟周围的人交流。交流能让人们互相了解，如果有共同的兴趣、爱好或者习惯，就更容易成为朋友了。"]},
    {sub:"5",vocab:["理解","镜子","而","当","困难","及时","陪"],lines:["人的一生可以什么也没有，但不能没有朋友，而且必须要有自己真正的朋友。什么是真正的朋友？不同的人会有不同的理解。有些人觉得朋友就是能和自己一起快乐的人；有些人觉得朋友应该像镜子，能帮自己看到缺点。而我的理解是：当你遇到困难的时候，真正的朋友会站出来，及时给你帮助；当你无聊或者难过的时候，真正的朋友会陪在你身边，想办法让你感到幸福。"]}
  ]},
  {title:"第三课 经理对我印象不错",level:"HSK4上",texts:[
    {sub:"1 小夏和小雨聊小雨面试的情况",vocab:["挺","紧张","信心","能力","招聘","提供"],lines:["小夏：你上午的面试怎么样？","小雨：还可以，他们问的问题都挺容易的，就是我有点儿紧张。","小夏：面试的时候，一定要对自己有信心，要相信自己的能力。","小雨：你说得对！3月15号上午8点在学校体育馆还有一个招聘会，你去吗？","小夏：我还没决定呢。","小雨：听说这次招聘会提供的工作机会很多，我们一起去看看吧。"]},
    {sub:"2 马经理和小林聊招聘的事情",vocab:["负责","本来","应聘","材料","符合","通知"],lines:["马经理：小林，这次招聘不是小李负责吗？","小林：本来是小李负责的，但是他突然生病住院了，所以就交给我来做了。","马经理：哦，这次应聘的人多吗？","小林：经理，这次来应聘的一共有15人。经过笔试和面试，有两个不错。这是他们的材料，您看看。","马经理：这两个人的能力都比较符合我们的要求。你通知他们下周一上午九点来我办公室吧。","小林：好的，那我马上跟他们联系。"]},
    {sub:"3 小林和王静聊王静的工作情况",vocab:["律师","专业","另外","收入","咱们","安排"],lines:["小林：王静，好久不见了！大学毕业后就没联系了，你现在在哪儿工作呢？","王静：我一毕业就去上海当律师了。","小林：你对现在的工作一定非常满意吧？","王静：我很喜欢现在的工作，因为我学的就是法律专业，而且同事们都很喜欢我。另外，收入也不错。","小林：星期天咱们同学聚会，你能来参加吗？","王静：能来。虽然这次来北京，时间安排得很紧张，但我一定借这次机会去跟大家见见面。"]},
    {sub:"4",vocab:["首先","正式","留","其次","诚实"],lines:["面试的时候，经理对我印象不错，还通知我明天就可以上班了。真没想到，找工作这么顺利。你想知道面试需要注意什么吗？首先，要穿正式的衣服，这会给面试者留下一个好的印象，让他觉得你是一个认真的人。其次，应聘时不要紧张。回答问题时，说得不要太快，声音也不要太小，要相信自己有能力做好。当然，最重要的是回答问题要诚实。"]},
    {sub:"5",vocab:["改变","感觉","判断","顾客","准时","不管","与","约会"],lines:["第一印象就是在第一次见面时给别人留下的印象。虽然第一印象不总是对的，但如果想改变却很困难。你给别人的第一印象会影响他们以后对你的感觉和判断。所以，给第一次见面的同事留下好的印象，以后的工作可能会更顺利；给第一次见面的顾客留下好的印象，你可能会卖出更多的东西。但是，如果第一次见面给别人留下像不准时这样的坏印象，那么以后就很难让别人相信你。所以不管是上课、上班，还是与别人约会，准时都非常重要。"]}
  ]},
  {title:"第四课 不要太着急赚钱",level:"HSK4上",texts:[
    {sub:"1 小林和小李聊小李的工作",vocab:["提","以为","份","完全","赚"],lines:["小林：听说你又换工作了？今年已经换了三次工作了吧？","小李：别提了！我以为新工作比以前的好，没想到还没有以前好呢。","小林：上次那份工作你只做了两个月就离开了，其实，完全适应一个新的工作需要一年时间，所以，经常换工作不一定好。","小李：我也明白。但是那份工作的收入太少了！","小林：你才到新公司，不要太急着赚钱，多学习才是最重要的。","小李：好。我一定会努力把现在这份工作做好。"]},
    {sub:"2 王经理和小李在说工作",vocab:["调查","原来","计划","提前","保证","提醒","乱"],lines:["王经理：那份调查还要多长时间才能做完？","小李：按原来的计划应该是两周，但是我们可以提前完成，周末保证做完。","王经理：虽然最近工作很忙，但你们也要注意身体啊。","小李：谢谢您！现在有很多事情等着我做，真不知道该先做哪个好。","王经理：每天早上我都把当天计划要做的事情写在笔记本上，提醒自己安排好时间。你也可以试试这样做。","小李：这个办法真不错！这样我就不会手忙脚乱了。"]},
    {sub:"3 王经理和马经理在说工作",vocab:["生意","谈","并","积累","经验","一切"],lines:["王经理：什么事让你这么高兴啊？","马经理：我们和上次那个公司的生意终于谈成了。","王经理：太好了！你工作那么努力，公司会越来越好的。","马经理：我原来以为做生意很简单，后来才发现其实并不容易，现在赚钱越来越难了。","王经理：慢慢来，万事开头难，重要的是要多积累经验。","马经理：我相信经过我们大家的努力，公司的生意会越做越大，一切都会好的。"]},
    {sub:"4",vocab:["按照","成功","顺利","感谢","消息","按时","奖金"],lines:["我们今年的工作都已经按照计划完成了。这一段时间，尽管工作很紧张，中间也遇到了很多困难，但是因为大家的努力，我们成功地解决了问题，顺利地完成了工作，非常感谢大家对我的帮助！另外，马经理让我告诉大家一个好消息，因为大家按时完成了工作，公司决定这个月给每人多发三千元奖金。感谢大家这三个多月的努力工作，希望明年能有更大的成绩！"]},
    {sub:"5",vocab:["工资","方法","知识","不得不","甚至","责任"],lines:["年轻人刚开始工作的时候，不要太急着赚钱，不要眼睛里只有工资和奖金。在工作的前几年，重要的是丰富自己的工作经验，学习与同事交流的方法，积累专业知识，这些比收入重要多了。但是很多时候，我们不得不去做一些自己不愿意做甚至是非常不喜欢的工作。这时，我们最需要的就是对工作的责任心。一个人即使能力再高，经验再丰富，如果对工作没有责任心，也很难把工作做好。"]}
  ]},
  {title:"第五课 只买对的，不买贵的",level:"HSK4上",texts:[
    {sub:"1 王静在家具店买沙发",vocab:["家具","沙发","打折","价格","质量","肯定","流行"],lines:["售货员：小姐，您好！您想买什么家具？需要我为您介绍一下吗？","王静：谢谢，我想买沙发。","售货员：您看这个沙发怎么样？现在正在打折，比平时便宜了一千块。","王静：价格还可以，就是不知道质量有没有保证。","售货员：您放心，质量肯定不「打折」，这种沙发是今年最流行的。有很多种颜色可以选择，您可以看一下。","王静：这个蓝色的看上去不错，就要这个吧。"]},
    {sub:"2 王静和李进在商场买东西",vocab:["顺便","台","光","实在","制冷","效果","现金"],lines:["王静：咱家的冰箱太旧了，商场正好打折，我们顺便也买一台吧。","李进：今天买的东西太多了。再说，这个月家里已经花了五千多了。","王静：这么多？你不会是记错了吧？","李进：没错。上个星期光买沙发就花了两千多。","王静：但是咱家的冰箱实在是太旧了，制冷效果也不太好了，还是买个新的吧。","李进：那好吧，我带的现金不够，用你的信用卡吧。"]},
    {sub:"3 李进和王静在超市买礼物",vocab:["邀请","葡萄","艺术","广告","味道","优点","实际"],lines:["李进：李老师邀请咱们去他家做客，给他带点儿什么礼物好呢？","王静：他很喜欢葡萄酒，我们就给他买两瓶葡萄酒吧。","李进：可是这里有这么多种，你知道哪种好吗？","王静：我觉得这种不错，你看它酒瓶做得都这么艺术。而且电视上经常有它的广告，我想味道应该不错。","李进：广告只会介绍优点，却不会说它的缺点。实际上，很多东西并不像广告上说的那么好，所以不能完全相信广告。","王静：你说的也对。"]},
    {sub:"4",vocab:["考虑","标准","样子","年龄","浪费"],lines:["买衣服只考虑价格当然不好，但是只考虑买好看的也不一定对。我买衣服的标准是「只买对的，不买贵的」。第一，自己穿着舒服；第二，衣服的质量要好，而且又不能太贵。对我来说，衣服的样子流行不流行并不是很重要。很多年龄大的人喜欢在打折的时候买便宜的衣服，但对那些衣服是不是适合自己却考虑得不多。这点是我理解不了的，因为如果不适合自己，即使花钱很少，也是一种浪费。"]},
    {sub:"5",vocab:["购物","尤其","受到","任何","寄"],lines:["现在网上购物变得越来越流行了，年轻人尤其喜欢在网上买东西。在网上几乎什么都可以买到，你可以上网买书、买衣服、买包，还可以买家具、买手机。网上购物能够受到人们的喜爱，原因主要有两个：首先，网上的东西很多，而且比去商店买便宜，这是吸引人们购买的主要原因。其次，人们可以在任何时间上网购买自己喜欢的东西，卖家可以把你买的东西寄到你办公室或者家里，非常方便。"]}
  ]},
  {title:"第六课 一分钱一分货",level:"HSK4上",texts:[
    {sub:"1 张远和李进聊李进昨晚的购物经历",vocab:["果汁","售货员","袜子","打扰","竟然"],lines:["张远：昨天晚上我给你打电话一直没人接，你忙什么呢？","李进：昨天妻子让我陪她去超市买果汁，我把手机忘在家里了。","张远：买这么点儿东西也用不了那么长时间啊！","李进：我们先去逛了会儿商场。一进门，售货员就热情地为我们介绍这，介绍那，她买了一条裤子、一件衬衫、两双袜子，然后我们就高高兴兴地回家了。","张远：买东西时我只看自己想买的，而且喜欢自己看、自己选，不希望被别人打扰。","李进：是啊！回家以后，我才发现，竟然忘了去商场的超市买果汁！"]},
    {sub:"2 王静在商店买西红柿",vocab:["西红柿","百分之","倍","皮肤","好处","尝"],lines:["王静：西红柿新鲜吗？怎么卖？","售货员：七块钱一斤，您放心，保证百分之百新鲜。","王静：怎么这么贵啊！我记得昨天才三块五一斤，今天的价格是昨天的两倍。","售货员：您问的这种是「绿色」的。一分钱一分货。每天吃一两个这种新鲜的西红柿，对皮肤有好处。","王静：好，那我先买几个尝尝。","售货员：好的，给您西红柿，一共两斤，十四块。"]},
    {sub:"3 李进在商场买行李箱",vocab:["轻","方面","值得","活动","内","免费","修理"],lines:["售货员：先生，我们店的行李箱都在这里，请问您要什么样的？","李进：我想买一个轻一点儿的。","售货员：您看看这个，不管从价格方面看，还是从质量上看，都是值得考虑的。","李进：质量是不错。请问这个多少钱？","售货员：现在我们商场正好有打折活动，打完折是999。另外，一年内我们都负责免费修理。","李进：你们的服务不错，价格也可以，就买这个吧。"]},
    {sub:"4",vocab:["支持","举行","满","其中","小说","会员卡","所有","获得"],lines:["顾客朋友们，为了感谢大家的支持，我们书店今天举行「购书送好礼」活动，购书满100元送一个笔记本，满200元送一本词典。另外，一些图书还有打折活动，其中，小说7.5折，地图8折，留学考试用书6折。如果购书满500元可免费办会员卡，以后购书可打8折。今天过生日的朋友和所有的小朋友还可以获得一份小礼物。欢迎大家选购！"]},
    {sub:"5",vocab:["情况","例如","举办","各","降低"],lines:["人们常说「一分钱一分货」，意思是东西的质量和价格有很大的关系，也可以说「便宜没好货，好货不便宜」，一般情况下，你花的钱越多，买的东西也就越好。其实也不一定都是这样的。有的时候，质量很好的东西也会很便宜。例如，春天来了，冬天的衣服就会打折，质量很好，还很便宜，花很少的钱就可以买到。一到节日，商场也会举办各种各样的活动，降低价格，这个时候我们也可以买到又便宜又好的东西。"]}
  ]},
  {title:"第七课 最好的医生是自己",level:"HSK4上",texts:[
    {sub:"1 小李和小林聊天气和身体情况",vocab:["流血","擦","气候","估计","咳嗽","严重","窗户","空气"],lines:["小李：你的鼻子怎么流血了？快用纸擦擦。","小林：我还不习惯北方的气候，估计是天气太干。今天天气不是很冷，你怎么穿这么多？","小李：就是因为昨天穿得太少了，我都感冒了。","小林：最近感冒的人特别多。你去看医生了吗？","小李：没有，我只是咳嗽，有点儿头疼，不严重，多喝点儿水就好了。","小林：春天天气时冷时热，特别容易感冒。这时候一定要多注意保暖，另外，最好经常打开窗户换换空气。"]},
    {sub:"2 小夏和小雨聊小雨抽烟的事情",vocab:["抽烟","动作","帅","出现","后悔","来不及","反对"],lines:["小夏：你咳嗽好点儿了吗？医生怎么说的？","小雨：还是老样子，他让我以后不要再抽烟了。","小夏：抽烟对身体一点儿好处也没有。","小雨：我也知道，可是我觉得抽烟这个动作看上去很帅。","小夏：等你身体出现问题了，后悔就来不及了。","小雨：其实家人也一直反对我抽烟，自己却觉得没什么。但最近总是咳嗽，所以我有些担心了。","小夏：抽烟不仅对自己没好处，还会影响周围人的身体健康。为了你和你的家人，别再抽了。"]},
    {sub:"3 小李和小林聊电脑对身体的影响",vocab:["大夫","植物","研究","超过","散步"],lines:["小李：我最近眼睛总是跳，大夫说是因为我长时间看电脑，眼睛太累。","小林：长时间坐在电脑前面工作，眼睛很容易累。最好是每过一小时就休息休息，然后再开始工作。","小李：医生也这么说，他还告诉我要多向远处看看，尤其是多看看绿色的植物。","小林：长时间对着电脑不仅对眼睛不好，身体也会不舒服。研究发现，如果人一天静坐超过6小时，就会影响身体健康。","小李：是啊！像咱们这些久坐办公室的人要注意，有时间应该多站起来活动活动。","小林：好，咱们午饭后就去附近的公园散散步吧。"]},
    {sub:"4",vocab:["指","精神","教授","数字","说明","要是"],lines:["每个人都希望自己健康，那么什么才是健康呢？过去，人们认为健康就是指身体不生病。但是，现在人们认识到，健康还指精神上的健康。只有身体和精神都健康，才算是真正的健康。有一位教授用数字来说明健康有多么重要：要是健康是1，其他都是1后面的0；如果没有1，不管有多少0也没用。所以我们平时一定要注意锻炼，别等健康出问题了才后悔。"]},
    {sub:"5",vocab:["既","减肥","辛苦","肚子","感情","烦恼","掉"],lines:["我听一位医生说过一句话：「最好的医生是自己，最好的药是时间，最好的运动是散步。」前两条我理解得不深，最后一条我完全同意。散步是生活中最简单的锻炼方法，既可以活动身体，又可以减肥，而且不会像跑步那样辛苦。晚饭后，一家人一起出去散散步，是一件很幸福的事情。肚子吃饱了需要活动，家人忙了一天需要交流，夫妻说说一天的工作能加深感情，听孩子谈谈学校里有意思的事，一天的烦恼就都跑掉了。"]}
  ]},
  {title:"第八课 生活中不缺少美",level:"HSK4上",texts:[
    {sub:"1 李老师和高老师聊关于巧克力的事情",vocab:["巧克力","亲戚","伤心","使","心情","愉快"],lines:["李老师：这种巧克力味道不错，你在哪儿买的？","高老师：不是我买的，是我女儿给我从国外带回来的礼物。","李老师：很多人出国后常常会买外国的巧克力，回来送给亲戚朋友。","高老师：是啊，因为很多人都爱吃巧克力，尤其是女性。","李老师：这是为什么呢？","高老师：巧克力大多是甜的，而很多女性都喜欢吃甜的。而且，听说伤心难过的时候吃块儿巧克力，还能使人的心情变得愉快。"]},
    {sub:"2 小夏和马克聊关于上次足球比赛的事情",vocab:["景色","放松","压力","回忆","发生","成为","只要"],lines:["小夏：这里的景色真美，空气也好。","马克：怎么样，心情好些了吗？","小夏：好多了，上次足球比赛后，好久都没这么放松了。","马克：你不要有压力，好好儿准备下次比赛就好了。","小夏：这段时间我总是一个人坐在房间里回忆那次比赛。如果我们能再努力一点儿，就一定会多进一个球。","马克：事情已经发生了，过去的就让它成为过去吧。只要这次你好好儿准备，一定能把比赛踢好。"]},
    {sub:"3 马克和司机聊关于堵车的事情",vocab:["师傅","大使馆","堵车","距离","耐心"],lines:["马克：师傅，我去大使馆，你是不是走错了？","师傅：现在是上班时间，前面有点儿堵车，我们走另外一条路，距离差不多。","马克：那就好，堵车浪费时间，遇到堵车，心情也「堵」。","师傅：可不是！上班堵车怕迟到，下班堵车怕回家晚。每天在马路上开车，要想不遇到堵车，还真难。","马克：一遇到堵车，人们就容易变得没有耐心。长期这样，还会影响脾气甚至性格。但是您的心情为什么这么好呢？","师傅：我们改变不了堵车，但是可以试着改变自己的心情。堵车时正好可以休息一下，还可以听听自己喜欢的音乐。"]},
    {sub:"4",vocab:["生命","缺少","到处","态度","因此"],lines:["草绿了，那是生命的颜色；花开了，那是大自然的礼物。生活中不缺少美，缺少的是发现美的眼睛。只要有心，生活中的美到处都是。生活的态度要自己选择，因此，遇到烦恼时，你应该想一些办法让自己从不高兴的心情中走出来。窗外是什么样子，我们无法改变，但我们可以选择站在哪个窗户前。选择一个能够带给我们快乐的窗户，这样才能选对心情，选对生活的态度。"]},
    {sub:"5",vocab:["科学","证明","往往","阳光","积极","特点"],lines:["科学研究证明，女孩子对衣服颜色的选择往往与她们的性格有关。喜欢穿白色衣服的女孩子性格比较阳光，生活态度积极向上是她们的共同特点；而喜欢穿红色衣服的女孩子性格比较浪漫。颜色也会影响人的心情，不同的颜色会给我们带来不同的感情变化。红色让人变得热情；黄色和白色让人心情愉快；黑色却容易让人感到伤心；人们在看到蓝色时会觉得很舒服，变得安静下来；绿色让我们的眼睛得到休息。"]}
  ]},
  {title:"第九课 阳光总在风雨后",level:"HSK4上",texts:[
    {sub:"1 王静和孙月聊孙月减肥的事情",vocab:["饼干","难道","得","坚持","放弃","主意"],lines:["王静：怎么又买了这么多饼干和巧克力？难道你不减肥了？","孙月：减了一个月都没瘦下来，我实在没信心了。","王静：如果你想减肥，就得少吃东西，而且要多运动。","孙月：我就是这么做的，但这一个月下来，我只轻了一公斤。","王静：一个月太短了。要想减肥成功，只能坚持，才会慢有效果。","孙月：我本来已经打算放弃了，但是你刚才的话让我改变了主意。这些饼干和巧克力送给你了。"]},
    {sub:"2 李进和张远聊张远的成功经历",vocab:["网球","国际","轻松","赢","随便","汗","通过"],lines:["李进：你网球打得真好，还得过那么多国际大奖！每次看你比赛，感觉你轻轻松松就赢了。","张远：哪里啊！那是你没看到我辛辛苦苦练习的一面，没有人随随便便就能成功的。","李进：我从小也对网球感兴趣，但是到现在还是打得不怎么样。","张远：你知道吗？不管春夏秋冬，我练球从来没有休息过一天。","李进：真是不容易啊！看来我只看到了你成功时获得的鲜花，却没注意到你成功前流下的汗水。","张远：任何成功都要通过努力才能得到。只要你坚持练习，我相信你也会打越来越好的。"]},
    {sub:"3 小林和小李谈王红的成功经历",vocab:["篇","作家","当时","可是","正确","理想"],lines:["小林：你还记得王红吗？我在报纸上看到一篇关于她的新闻，她现在已经是一个有名的作家了。","小李：听说她毕业后放弃了律师的工作，开始专门写小说，没想到她竟然成功了。","小林：当时她的父母和亲戚都不支持她，可是她坚持自己的选择，现在终于向所有人证明了她的选择是正确的。","小李：看来为了自己的理想，放弃一些东西也是值得的。","小林：一个人只有两只手，不可能得到所有想要的东西，所以有时候放弃是一种聪明的选择。","小李：是啊，只有学会放弃，才能把自己的能力用到最该做的事情上，最后获得成功。"]},
    {sub:"4",vocab:["勇敢","结果","失败","过程","至少","总结"],lines:["如果你想做什么事情，那就勇敢地去做，不要担心结果，不要考虑会不会失败。要是太看重结果，失败就会给人们带来很多烦恼。我们应该把注意力放在做事情的过程上，这样你会在做的过程中发现解决问题的快乐，这是其他任何东西都给不了的。即使最后失败了也没有关系，因为至少你已经努力过，而且我们还可以从失败中总结出有用的经验，有了这些积累，成功自然离我们越来越近。"]},
    {sub:"5",vocab:["取","经历","许多","区别","暂时","面对"],lines:["每一个人都希望成功，可是很多时候，在成功之前会遇到很多困难。有些人遇到困难就放弃，而有些人遇到困难却想办法解决它。对困难的态度不同，结果也是不一样的。爱迪生就是在找了上千种材料后才找到了能点亮电灯的材料。取得成功的人往往都经历过许多失败，他们和普通人的区别就是他们都坚持了下来。所以就算只有1%的希望，我们也要做出100%的努力。困难只是暂时的，「阳光总在风雨后」，只有我们勇敢地面对困难，才能有希望取得成功。"]}
  ]},
  {title:"第十课 幸福的标准",level:"HSK4上",texts:[
    {sub:"1 孙月和王静聊王静的生活情况",vocab:["礼拜天","空儿","母亲","不过","永远","方向"],lines:["孙月：礼拜天有空儿吗？陪我去逛街怎么样？我想去给丈夫买个生日礼物。","王静：我可能去不了，最近事情多。","孙月：你最近是不是工作特别忙？","王静：我现在上有老，下有小。除了工作以外，家里还有母亲和儿子需要照顾。","孙月：真是辛苦啊！你最近脸色不太好，是不是哪儿不舒服？要注意身体啊。","王静：没事儿，谢谢！不过现在我很幸福。因为在母亲面前我可以做一个永远长不大的孩子；在孩子面前我又是个能照顾他的母亲，这让我有了努力的方向。"]},
    {sub:"2 高老师和李老师在谈幸福",vocab:["优秀","硕士","翻译","确实","兴奋","拉"],lines:["高老师：你看人家王老师，刚来这儿工作三年就当了教授，还有个好妻子，真让人羡慕！","李老师：其实，你在别人眼中也是很幸福的，只是你自己没有发现。","高老师：是吗？我哪能跟王老师比啊？","李老师：你有一个漂亮的女儿，还那么优秀，硕士毕业后就当了翻译。","高老师：我女儿确实不错，记得她刚拿到第一个月工资时，就兴奋地拉着我和她爸俩去商场，给我们买礼物，那时我和她爸心里别提多美了！","李老师：所以说每个人有每个人的生活，不用羡慕别人。你羡慕别人的时候，他们可能也正在羡慕你呢。"]},
    {sub:"3 小雨和小夏聊找工作的事情",vocab:["建议","职业","关键","将来","发展","躺","困"],lines:["小雨：时间过得真快，马上就要毕业了。毕业后你打算做什么？","小夏：我还没想好呢，正想听听你的建议。你觉得在选择职业时，收入重要吗？","小雨：在我看来，赚钱多少不是最重要的，兴趣才是关键。只有做自己喜欢的事，才会觉得幸福，将来也会有更好的发展。","小夏：我也这么想。如果我带着热情去做自己喜欢的工作，就不会感到累。不过，现在什么东西都那么贵，生活压力太大了，没有钱也不会过得幸福啊！","小雨：幸福其实很简单，它不是只要有钱就能买到的。我觉得工作结束回家后，洗个热水澡，然后躺在床上看看书、听听音乐，困了睡睡觉，就很幸福。","小夏：你说的也对。如果能找到一份自己既感兴趣，收入又不错的工作，那就最好了。"]},
    {sub:"4",vocab:["经济","条件","富","穷","等","由于"],lines:["有的人希望穿得再好一些，房子再大一些，认为经济条件越好人就越幸福。其实有很多富人过得并不愉快，而有些穷人却过得很快乐。有钱不一定幸福，因为很多东西都是不能用钱买到的，例如时间、感情、生活经历等。但是，从另外一个方面看，如果没有钱，也很难过得幸福。当你生病了，如果由于缺钱而不能及时去看医生，你的健康都很难得到保证，就更别说幸福了。"]},
    {sub:"5",vocab:["比如","橡皮","糖","低","答案"],lines:["什么是幸福？有的人认为，工资高、能赚钱就是幸福；有的人认为，心情放松、身体健康才是幸福；也有人认为，能帮助别人就是一种幸福。还有人说，小时候幸福是一件东西，比如一块橡皮、一块糖，得到了就很幸福；长大后幸福是一种态度，生活的态度决定了我们幸福感的高低。那怎样才算是真正的幸福？其实，幸福并没有一个标准答案，每个人对幸福都有不同的理解。不管你认为幸福是什么，只要你用心去找，就一定能发现它。"]}
  ]}
];

  "1-2-不客气":{zh:["不客气，这是我应该做的。","下次你有需要，也可以告诉我。"],py:["Bú kè qi, zhè shì wǒ yīng gāi zuò de.","Xià cì nǐ yǒu xū yào, yě kě yǐ gào su wǒ."],vi:["Không có gì đâu, đó là việc tôi nên làm.","Lần sau bạn cần gì cũng có thể nói với tôi."]},

  "1-3-名字":{zh:["你的名字怎么写？","我怕写错，所以想确认一下。"],py:["Nǐ de míng zi zěn me xiě?","Wǒ pà xiě cuò, suǒ yǐ xiǎng què rèn yí xià."],vi:["Tên bạn viết thế nào?","Tôi sợ viết sai nên muốn xác nhận một chút."]},
  "1-3-我":{zh:["我今天想早点儿回家。","明天还有考试，我得复习一下。"],py:["Wǒ jīn tiān xiǎng zǎo diǎnr huí jiā.","Míng tiān hái yǒu kǎo shì, wǒ děi fù xí yí xià."],vi:["Hôm nay tôi muốn về nhà sớm hơn.","Ngày mai còn thi nên tôi phải ôn một chút."]},
  "1-3-是":{zh:["他是我的同学，也是我的朋友。","我们经常一起去图书馆学习。"],py:["Tā shì wǒ de tóng xué, yě shì wǒ de péng you.","Wǒ men jīng cháng yì qǐ qù tú shū guǎn xué xí."],vi:["Cậu ấy là bạn cùng lớp của tôi và cũng là bạn của tôi.","Chúng tôi thường cùng nhau đến thư viện học."]},
  "1-3-老师":{zh:["我们老师说话说得很清楚。","上课的时候大家都听得很认真。"],py:["Wǒ men lǎo shī shuō huà shuō de hěn qīng chu.","Shàng kè de shí hou dà jiā dōu tīng de hěn rèn zhēn."],vi:["Giáo viên của chúng tôi nói rất rõ ràng.","Trong giờ học mọi người đều nghe rất chăm chú."]},
  "1-3-学生":{zh:["我是学生，今年刚上大学。","平时除了上课，我还经常去图书馆。"],py:["Wǒ shì xué sheng, jīn nián gāng shàng dà xué.","Píng shí chú le shàng kè, wǒ hái jīng cháng qù tú shū guǎn."],vi:["Tôi là học sinh/sinh viên, năm nay vừa vào đại học.","Bình thường ngoài giờ học, tôi còn thường đến thư viện."]},
  "1-3-吗":{zh:["你今天晚上有时间吗？","如果有，我们一起去吃饭吧。"],py:["Nǐ jīn tiān wǎn shang yǒu shí jiān ma?","Rú guǒ yǒu, wǒ men yì qǐ qù chī fàn ba."],vi:["Tối nay bạn có thời gian không?","Nếu có, chúng ta cùng đi ăn cơm nhé."]},
  "1-3-人":{zh:["那边的人很多，所以有点儿吵。","我们换一个安静一点儿的地方吧。"],py:["Nà biān de rén hěn duō, suǒ yǐ yǒu diǎnr chǎo.","Wǒ men huàn yí ge ān jìng yì diǎnr de dì fang ba."],vi:["Bên kia nhiều người nên hơi ồn.","Chúng ta đổi sang chỗ yên tĩnh hơn một chút nhé."]},
  "1-3-中国":{zh:["我第一次来中国的时候很紧张。","后来认识了很多朋友，生活就越来越习惯了。"],py:["Wǒ dì yī cì lái Zhōng guó de shí hou hěn jǐn zhāng.","Hòu lái rèn shi le hěn duō péng you, shēng huó jiù yuè lái yuè xí guàn le."],vi:["Lần đầu đến Trung Quốc tôi rất lo.","Sau đó quen được nhiều bạn bè, cuộc sống dần dần quen hơn."]},
  "1-3-美国":{zh:["她以前在美国工作。","现在回国以后，想在北京找一份新工作。"],py:["Tā yǐ qián zài Měi guó gōng zuò.","Xiàn zài huí guó yǐ hòu, xiǎng zài Běi jīng zhǎo yí fèn xīn gōng zuò."],vi:["Trước đây cô ấy làm việc ở Mỹ.","Bây giờ về nước rồi, muốn tìm một công việc mới ở Bắc Kinh."]},
  "1-4-她":{zh:["她是我最好的朋友。","我们认识很多年了，关系一直很好。"],py:["Tā shì wǒ zuì hǎo de péng you.","Wǒ men rèn shi hěn duō nián le, guān xì yì zhí hěn hǎo."],vi:["Cô ấy là bạn thân nhất của tôi.","Chúng tôi quen nhau nhiều năm rồi, quan hệ luôn rất tốt."]},
  "1-4-谁":{zh:["门口站着的人是谁？","我觉得好像以前见过他。"],py:["Mén kǒu zhàn zhe de rén shì shéi?","Wǒ jué de hǎo xiàng yǐ qián jiàn guo tā."],vi:["Người đang đứng ở cửa là ai vậy?","Tôi thấy hình như trước đây đã gặp anh ấy rồi."]},
  "1-4-的":{zh:["这是我的书，不是你的。","如果你要用，可以先借去一下。"],py:["Zhè shì wǒ de shū, bú shì nǐ de.","Rú guǒ nǐ yào yòng, kě yǐ xiān jiè qù yí xià."],vi:["Đây là sách của tôi, không phải của bạn.","Nếu bạn cần dùng thì có thể mượn trước một chút."]},
  "1-4-哪":{zh:["你是哪国人？","我听你的口音，觉得你说得很自然。"],py:["Nǐ shì nǎ guó rén?","Wǒ tīng nǐ de kǒu yīn, jué de nǐ shuō de hěn zì rán."],vi:["Bạn là người nước nào?","Nghe khẩu âm của bạn, tôi thấy bạn nói khá tự nhiên."]},
  "1-4-国":{zh:["每个国家都有自己的文化。","旅行的时候，我最喜欢认识新的风俗。"],py:["Měi ge guó jiā dōu yǒu zì jǐ de wén huà.","Lǚ xíng de shí hou, wǒ zuì xǐ huan rèn shi xīn de fēng sú."],vi:["Mỗi quốc gia đều có văn hóa riêng của mình.","Khi du lịch, tôi thích nhất là tìm hiểu phong tục mới."]},
  "1-4-呢":{zh:["我已经吃完了，你呢？","如果你还没吃，我们可以一起去。"],py:["Wǒ yǐ jīng chī wán le, nǐ ne?","Rú guǒ nǐ hái méi chī, wǒ men kě yǐ yì qǐ qù."],vi:["Tôi ăn xong rồi, còn bạn thì sao?","Nếu bạn vẫn chưa ăn thì chúng ta có thể đi cùng nhau."]},
  "1-4-他":{zh:["他今天没来上课。","老师说他可能生病了，让我们别担心。"],py:["Tā jīn tiān méi lái shàng kè.","Lǎo shī shuō tā kě néng shēng bìng le, ràng wǒ men bié dān xīn."],vi:["Hôm nay anh ấy/cậu ấy không đến lớp.","Giáo viên nói có lẽ cậu ấy bị ốm và bảo chúng tôi đừng lo."]},
  "1-4-同学":{zh:["我的同学都很友好。","刚开始我不熟悉这里，他们常常主动帮我。"],py:["Wǒ de tóng xué dōu hěn yǒu hǎo.","Gāng kāi shǐ wǒ bù shú xī zhè lǐ, tā men cháng cháng zhǔ dòng bāng wǒ."],vi:["Bạn cùng lớp của tôi đều rất thân thiện.","Lúc đầu tôi chưa quen ở đây, họ thường chủ động giúp tôi."]},
  "1-4-朋友":{zh:["周末我跟朋友一起去看电影。","看完以后我们还去吃了面条。"],py:["Zhōu mò wǒ gēn péng you yì qǐ qù kàn diàn yǐng.","Kàn wán yǐ hòu wǒ men hái qù chī le miàn tiáo."],vi:["Cuối tuần tôi đi xem phim với bạn.","Xem xong chúng tôi còn đi ăn mì."]},
  "1-5-家":{zh:["我家离学校不远。","走路十分钟就能到，所以很方便。"],py:["Wǒ jiā lí xué xiào bù yuǎn.","Zǒu lù shí fēn zhōng jiù néng dào, suǒ yǐ hěn fāng biàn."],vi:["Nhà tôi không xa trường.","Đi bộ mười phút là tới nên rất tiện."]},
  "1-5-口":{zh:["你家有几口人？","我家有四口人，爸爸妈妈和我，还有弟弟。"],py:["Nǐ jiā yǒu jǐ kǒu rén?","Wǒ jiā yǒu sì kǒu rén, bà ba mā ma hé wǒ, hái yǒu dì di."],vi:["Nhà bạn có mấy người?","Nhà tôi có bốn người: bố mẹ, tôi và em trai."]},
  "1-5-有":{zh:["我有一个新同学。","他很热情，我们很快就成了朋友。"],py:["Wǒ yǒu yí ge xīn tóng xué.","Tā hěn rè qíng, wǒ men hěn kuài jiù chéng le péng you."],vi:["Tôi có một bạn cùng lớp mới.","Cậu ấy rất nhiệt tình nên chúng tôi nhanh chóng trở thành bạn."]},
  "1-5-女儿":{zh:["她有一个女儿，今年六岁。","女儿很可爱，也很喜欢画画。"],py:["Tā yǒu yí gè nǚ ér, jīn nián liù suì.","Nǚ ér hěn kě ài, yě hěn xǐ huan huà huà."],vi:["Cô ấy có một con gái, năm nay sáu tuổi.","Con gái rất đáng yêu và cũng rất thích vẽ."]},
  "1-5-几":{zh:["你家有几个人？","如果周末有空，我们可以一起吃饭。"],py:["Nǐ jiā yǒu jǐ ge rén?","Rú guǒ zhōu mò yǒu kòng, wǒ men kě yǐ yì qǐ chī fàn."],vi:["Nhà bạn có mấy người?","Nếu cuối tuần rảnh, chúng ta có thể ăn cơm cùng nhau."]},
  "1-5-岁":{zh:["你今年几岁？","我今年二十三岁，刚大学毕业。"],py:["Nǐ jīn nián jǐ suì?","Wǒ jīn nián èr shí sān suì, gāng dà xué bì yè."],vi:["Năm nay bạn bao nhiêu tuổi?","Năm nay tôi 23 tuổi, vừa tốt nghiệp đại học."]},
  "1-5-了":{zh:["我吃了早饭就去上课。","下课以后再去图书馆复习。"],py:["Wǒ chī le zǎo fàn jiù qù shàng kè.","Xià kè yǐ hòu zài qù tú shū guǎn fù xí."],vi:["Tôi ăn sáng xong là đi học.","Tan học rồi mới đi thư viện ôn tập."]},
  "1-5-今年":{zh:["今年我想提高中文水平。","我打算每天都练习听力和口语。"],py:["Jīn nián wǒ xiǎng tí gāo Zhōng wén shuǐ píng.","Wǒ dǎ suàn měi tiān dōu liàn xí tīng lì hé kǒu yǔ."],vi:["Năm nay tôi muốn nâng cao trình độ tiếng Trung.","Tôi dự định ngày nào cũng luyện nghe và khẩu ngữ."]},
  "1-5-多":{zh:["这个地方人很多。","周末来这儿玩儿的话，最好早点儿出门。"],py:["Zhè ge dì fang rén hěn duō.","Zhōu mò lái zhèr wánr de huà, zuì hǎo zǎo diǎnr chū mén."],vi:["Nơi này có rất nhiều người.","Nếu cuối tuần đến đây chơi thì tốt nhất nên ra ngoài sớm hơn."]},
  "1-5-大":{zh:["北京是一个很大的城市。","第一次来的人可能会觉得有点儿不熟悉。"],py:["Běi jīng shì yí gè hěn dà de chéng shì.","Dì yī cì lái de rén kě néng huì jué de yǒu diǎnr bù shú xī."],vi:["Bắc Kinh là một thành phố rất lớn.","Người đến lần đầu có thể sẽ thấy hơi chưa quen."]},
  "1-6-会":{zh:["你会说中文吗？","我刚开始学，还不会说得很流利。"],py:["Nǐ huì shuō Zhōng wén ma?","Wǒ gāng kāi shǐ xué, hái bú huì shuō de hěn liú lì."],vi:["Bạn biết nói tiếng Trung không?","Tôi mới bắt đầu học nên vẫn chưa nói lưu loát lắm."]},
  "1-6-说":{zh:["有问题你就说出来。","大家一起讨论，会更容易明白。"],py:["Yǒu wèn tí nǐ jiù shuō chū lái.","Dà jiā yì qǐ tǎo lùn, huì gèng róng yì míng bai."],vi:["Có vấn đề thì bạn cứ nói ra.","Mọi người cùng thảo luận sẽ dễ hiểu hơn."]},
  "1-6-妈妈":{zh:["我妈妈做饭做得很好吃。","周末我回家的时候，最想吃她做的面条。"],py:["Wǒ mā ma zuò fàn zuò de hěn hǎo chī.","Zhōu mò wǒ huí jiā de shí hou, zuì xiǎng chī tā zuò de miàn tiáo."],vi:["Mẹ tôi nấu ăn rất ngon.","Cuối tuần về nhà tôi muốn ăn nhất là mì mẹ làm."]},
  "1-6-菜":{zh:["今天食堂的菜不错。","我吃了两种菜，还喝了一碗汤。"],py:["Jīn tiān shí táng de cài bú cuò.","Wǒ chī le liǎng zhǒng cài, hái hē le yì wǎn tāng."],vi:["Hôm nay món ăn ở nhà ăn khá ổn.","Tôi ăn hai món, còn uống một bát canh."]},
  "1-6-很":{zh:["今天很冷，你多穿一点儿。","不然一会儿出去就会不舒服。"],py:["Jīn tiān hěn lěng, nǐ duō chuān yì diǎnr.","Bù rán yí huìr chū qù jiù huì bù shū fu."],vi:["Hôm nay rất lạnh, bạn mặc thêm chút đi.","Nếu không thì lát ra ngoài sẽ thấy không thoải mái."]},
  "1-6-好吃":{zh:["这家店的饺子很好吃。","我吃完以后还想再点一盘。"],py:["Zhè jiā diàn de jiǎo zi hěn hǎo chī.","Wǒ chī wán yǐ hòu hái xiǎng zài diǎn yì pán."],vi:["Sủi cảo ở quán này rất ngon.","Ăn xong tôi còn muốn gọi thêm một đĩa nữa."]},
  "1-6-做":{zh:["你在做什么？","我在做作业，做完就去休息。"],py:["Nǐ zài zuò shén me?","Wǒ zài zuò zuò yè, zuò wán jiù qù xiū xi."],vi:["Bạn đang làm gì?","Tôi đang làm bài tập, làm xong sẽ đi nghỉ."]},
  "1-6-写":{zh:["我每天都会写几个汉字。","写得慢一点儿，但是要写得清楚。"],py:["Wǒ měi tiān dōu huì xiě jǐ ge hàn zì.","Xiě de màn yì diǎnr, dàn shì yào xiě de qīng chu."],vi:["Mỗi ngày tôi đều viết vài chữ Hán.","Viết chậm một chút nhưng phải viết rõ ràng."]},
  "1-6-汉字":{zh:["汉字对我来说有点儿难。","不过我每天练习一点儿，慢慢就熟悉了。"],py:["Hàn zì duì wǒ lái shuō yǒu diǎnr nán.","Bú guò wǒ měi tiān liàn xí yì diǎnr, màn man jiù shú xī le."],vi:["Chữ Hán với tôi hơi khó.","Nhưng mỗi ngày tôi luyện một chút, dần dần sẽ quen."]},
  "1-6-怎么":{zh:["这个字怎么读？","如果你不知道，我们可以一起查词典。"],py:["Zhè ge zì zěn me dú?","Rú guǒ nǐ bù zhī dào, wǒ men kě yǐ yì qǐ chá cí diǎn."],vi:["Chữ này đọc thế nào?","Nếu bạn không biết, chúng ta có thể cùng tra từ điển."]},
  "1-6-读":{zh:["老师让我们把课文读一遍。","我读得不快，但是尽量读清楚。"],py:["Lǎo shī ràng wǒ men bǎ kè wén dú yí biàn.","Wǒ dú de bù kuài, dàn shì jǐn liàng dú qīng chu."],vi:["Giáo viên bảo chúng tôi đọc bài khóa một lần.","Tôi đọc không nhanh nhưng cố gắng đọc rõ."]},
  "1-7-请":{zh:["请坐，我们慢慢聊。","如果你想喝茶，我可以给你倒一杯。"],py:["Qǐng zuò, wǒ men màn man liáo.","Rú guǒ nǐ xiǎng hē chá, wǒ kě yǐ gěi nǐ dào yì bēi."],vi:["Mời ngồi, chúng ta từ từ nói chuyện.","Nếu bạn muốn uống trà, tôi có thể rót cho bạn một cốc."]},
  "1-7-今天":{zh:["今天我有点儿忙。","不过晚上有时间，我们可以一起吃饭。"],py:["Jīn tiān wǒ yǒu diǎnr máng.","Bú guò wǎn shang yǒu shí jiān, wǒ men kě yǐ yì qǐ chī fàn."],vi:["Hôm nay tôi hơi bận.","Nhưng tối thì rảnh, chúng ta có thể ăn cùng nhau."]},
  "1-7-号":{zh:["今天几号？","我想写在日记里，免得自己忘记。"],py:["Jīn tiān jǐ hào?","Wǒ xiǎng xiě zài rì jì lǐ, miǎn de zì jǐ wàng jì."],vi:["Hôm nay ngày mấy?","Tôi muốn ghi vào nhật ký để khỏi quên."]},
  "1-7-月":{zh:["下个月我打算去旅游。","如果你有时间，也可以跟我一起去。"],py:["Xià ge yuè wǒ dǎ suàn qù lǚ yóu.","Rú guǒ nǐ yǒu shí jiān, yě kě yǐ gēn wǒ yì qǐ qù."],vi:["Tháng sau tôi dự định đi du lịch.","Nếu bạn có thời gian, bạn cũng có thể đi cùng tôi."]},
  "1-7-星期":{zh:["这个星期我有三次考试。","所以我每天都要早点儿复习。"],py:["Zhè ge xīng qī wǒ yǒu sān cì kǎo shì.","Suǒ yǐ wǒ měi tiān dōu yào zǎo diǎnr fù xí."],vi:["Tuần này tôi có ba lần thi.","Vì vậy ngày nào tôi cũng phải ôn sớm hơn một chút."]},
  "1-7-昨天":{zh:["昨天我去图书馆借了两本书。","回到宿舍以后，我一边看一边做笔记。"],py:["Zuó tiān wǒ qù tú shū guǎn jiè le liǎng běn shū.","Huí dào sù shè yǐ hòu, wǒ yì biān kàn yì biān zuò bǐ jì."],vi:["Hôm qua tôi đến thư viện mượn hai quyển sách.","Về ký túc xá, tôi vừa đọc vừa ghi chú."]},
  "1-7-明天":{zh:["明天你有时间吗？","如果有，我们一起去商店买点东西。"],py:["Míng tiān nǐ yǒu shí jiān ma?","Rú guǒ yǒu, wǒ men yì qǐ qù shāng diàn mǎi diǎn dōng xi."],vi:["Ngày mai bạn có thời gian không?","Nếu có, chúng ta cùng đi cửa hàng mua chút đồ nhé."]},
  "1-7-去":{zh:["下课以后我去超市买牛奶。","买完就回家休息。"],py:["Xià kè yǐ hòu wǒ qù chāo shì mǎi niú nǎi.","Mǎi wán jiù huí jiā xiū xi."],vi:["Tan học xong tôi đi siêu thị mua sữa.","Mua xong tôi về nhà nghỉ."]},
  "1-7-看":{zh:["我喜欢在晚上看电影。","看完以后心情会轻松很多。"],py:["Wǒ xǐ huan zài wǎn shang kàn diàn yǐng.","Kàn wán yǐ hòu xīn qíng huì qīng sōng hěn duō."],vi:["Tôi thích xem phim vào buổi tối.","Xem xong tâm trạng sẽ thoải mái hơn nhiều."]},
  "1-7-书":{zh:["这本书很有意思。","我看了一会儿就不想放下了。"],py:["Zhè běn shū hěn yǒu yì si.","Wǒ kàn le yí huìr jiù bù xiǎng fàng xià le."],vi:["Quyển sách này rất thú vị.","Tôi đọc một lát là không muốn đặt xuống nữa."]},
  "1-8-想":{zh:["我想学好中文。","所以每天都练习听、说、读、写。"],py:["Wǒ xiǎng xué hǎo Zhōng wén.","Suǒ yǐ měi tiān dōu liàn xí tīng, shuō, dú, xiě."],vi:["Tôi muốn học giỏi tiếng Trung.","Vì vậy mỗi ngày tôi đều luyện nghe, nói, đọc, viết."]},
  "1-8-喝":{zh:["天气热的时候，我想喝点水。","喝完以后再去外面走一走。"],py:["Tiān qì rè de shí hou, wǒ xiǎng hē diǎn shuǐ.","Hē wán yǐ hòu zài qù wài mian zǒu yi zǒu."],vi:["Khi trời nóng, tôi muốn uống chút nước.","Uống xong rồi ra ngoài đi dạo một chút."]},
  "1-8-茶":{zh:["我不太想喝咖啡，想喝茶。","你也来一杯吗？"],py:["Wǒ bù tài xiǎng hē kā fēi, xiǎng hē chá.","Nǐ yě lái yì bēi ma?"],vi:["Tôi không muốn uống cà phê lắm, muốn uống trà.","Bạn cũng uống một cốc không?"]},
  "1-8-吃":{zh:["我现在有点儿饿，想先吃点东西。","吃完以后我们再去公园。"],py:["Wǒ xiàn zài yǒu diǎnr è, xiǎng xiān chī diǎn dōng xi.","Chī wán yǐ hòu wǒ men zài qù gōng yuán."],vi:["Bây giờ tôi hơi đói, muốn ăn chút gì trước.","Ăn xong rồi chúng ta đi công viên."]},
  "1-8-米饭":{zh:["今天中午我想吃米饭。","如果有鱼和菜，就更好了。"],py:["Jīn tiān zhōng wǔ wǒ xiǎng chī mǐ fàn.","Rú guǒ yǒu yú hé cài, jiù gèng hǎo le."],vi:["Trưa nay tôi muốn ăn cơm.","Nếu có cá và rau thì càng tốt."]},
  "1-8-下午":{zh:["今天下午我去图书馆复习。","晚上再回宿舍做作业。"],py:["Jīn tiān xià wǔ wǒ qù tú shū guǎn fù xí.","Wǎn shang zài huí sù shè zuò zuò yè."],vi:["Chiều nay tôi đi thư viện ôn bài.","Tối lại về ký túc xá làm bài tập."]},
  "1-8-商店":{zh:["这条街上有很多商店。","我们可以慢慢逛，看看有什么好买的。"],py:["Zhè tiáo jiē shàng yǒu hěn duō shāng diàn.","Wǒ men kě yǐ màn man guàng, kàn kan yǒu shén me hǎo mǎi de."],vi:["Trên con phố này có rất nhiều cửa hàng.","Chúng ta có thể từ từ đi dạo xem có gì đáng mua."]},
  "1-8-买":{zh:["我想买一支笔和一本书。","如果不太贵，我今天就一起买了。"],py:["Wǒ xiǎng mǎi yì zhī bǐ hé yì běn shū.","Rú guǒ bù tài guì, wǒ jīn tiān jiù yì qǐ mǎi le."],vi:["Tôi muốn mua một cây bút và một quyển sách.","Nếu không quá đắt, hôm nay tôi sẽ mua luôn."]},
  "1-8-个":{zh:["我有一个问题想问你。","你现在方便回答吗？"],py:["Wǒ yǒu yí gè wèn tí xiǎng wèn nǐ.","Nǐ xiàn zài fāng biàn huí dá ma?"],vi:["Tôi có một câu hỏi muốn hỏi bạn.","Bây giờ bạn có tiện trả lời không?"]},
  "1-8-杯子":{zh:["这是我的杯子，你别拿错了。","你要喝水的话，我可以再给你一个。"],py:["Zhè shì wǒ de bēi zi, nǐ bié ná cuò le.","Nǐ yào hē shuǐ de huà, wǒ kě yǐ zài gěi nǐ yí ge."],vi:["Đây là cốc của tôi, bạn đừng lấy nhầm nhé.","Nếu bạn muốn uống nước, tôi có thể đưa bạn thêm một cái."]},
  "1-8-这":{zh:["这是谁的书？","如果是你的，就先拿回去吧。"],py:["Zhè shì shéi de shū?","Rú guǒ shì nǐ de, jiù xiān ná huí qù ba."],vi:["Quyển sách này của ai vậy?","Nếu là của bạn thì cầm về trước đi."]},
  "1-8-多少":{zh:["这个多少钱？","如果太贵，我就不买了。"],py:["Zhè ge duō shǎo qián?","Rú guǒ tài guì, wǒ jiù bù mǎi le."],vi:["Cái này bao nhiêu tiền?","Nếu đắt quá thì tôi không mua nữa."]},
  "1-8-钱":{zh:["我今天忘了带钱。","幸好手机还能用，我可以刷卡。"],py:["Wǒ jīn tiān wàng le dài qián.","Xìng hǎo shǒu jī hái néng yòng, wǒ kě yǐ shuā kǎ."],vi:["Hôm nay tôi quên mang tiền.","May mà điện thoại vẫn dùng được, tôi có thể quẹt thẻ."]},
  "1-8-块":{zh:["这本书十块钱，很便宜。","我买了两本送朋友。"],py:["Zhè běn shū shí kuài qián, hěn pián yi.","Wǒ mǎi le liǎng běn sòng péng you."],vi:["Quyển sách này mười tệ, rất rẻ.","Tôi mua hai quyển để tặng bạn."]},
  "1-8-那":{zh:["那是什么？我没看清楚。","你走近一点儿让我看看吧。"],py:["Nà shì shén me? Wǒ méi kàn qīng chu.","Nǐ zǒu jìn yì diǎnr ràng wǒ kàn kan ba."],vi:["Cái kia là gì vậy? Tôi nhìn không rõ.","Bạn lại gần chút cho tôi xem nhé."]},
  "1-9-小":{zh:["这只猫很小，也很可爱。","它走路的时候声音一点儿也不大。"],py:["Zhè zhī māo hěn xiǎo, yě hěn kě ài.","Tā zǒu lù de shí hou shēng yīn yì diǎnr yě bú dà."],vi:["Con mèo này rất nhỏ và rất dễ thương.","Khi nó đi lại thì tiếng động cũng không lớn chút nào."]},
  "1-9-猫":{zh:["我家有一只猫，喜欢在桌子下面睡觉。","我回家的时候，它常常跑过来找我。"],py:["Wǒ jiā yǒu yì zhī māo, xǐ huan zài zhuō zi xià mian shuì jiào.","Wǒ huí jiā de shí hou, tā cháng cháng pǎo guò lái zhǎo wǒ."],vi:["Nhà tôi có một con mèo, thích ngủ dưới bàn.","Khi tôi về nhà, nó thường chạy đến tìm tôi."]},
  "1-9-在":{zh:["你在做什么？","我在写作业，写完就去休息。"],py:["Nǐ zài zuò shén me?","Wǒ zài xiě zuò yè, xiě wán jiù qù xiū xi."],vi:["Bạn đang làm gì?","Tôi đang làm bài tập, làm xong sẽ đi nghỉ."]},
  "1-9-那儿":{zh:["洗手间在那儿，你往前走就能看到。","如果还是找不到，我陪你去。"],py:["Xǐ shǒu jiān zài nàr, nǐ wǎng qián zǒu jiù néng kàn dào.","Rú guǒ hái shì zhǎo bú dào, wǒ péi nǐ qù."],vi:["Nhà vệ sinh ở đằng kia, bạn đi thẳng sẽ thấy.","Nếu vẫn không tìm được thì tôi đi cùng bạn."]},
  "1-9-狗":{zh:["我喜欢狗，因为它们很热情。","不过我家太小了，暂时还不能养。"],py:["Wǒ xǐ huan gǒu, yīn wèi tā men hěn rè qíng.","Bú guò wǒ jiā tài xiǎo le, zàn shí hái bù néng yǎng."],vi:["Tôi thích chó vì chúng rất nhiệt tình.","Nhưng nhà tôi nhỏ quá nên tạm thời vẫn chưa nuôi được."]},
  "1-9-椅子":{zh:["这把椅子很舒服，你坐这儿吧。","我去给你倒杯水。"],py:["Zhè bǎ yǐ zi hěn shū fu, nǐ zuò zhèr ba.","Wǒ qù gěi nǐ dào bēi shuǐ."],vi:["Chiếc ghế này rất thoải mái, bạn ngồi đây nhé.","Tôi đi rót cho bạn cốc nước."]},
  "1-9-下面":{zh:["钥匙在桌子下面，你找找看。","我刚才看见你放在那儿了。"],py:["Yào shi zài zhuō zi xià mian, nǐ zhǎo zhao kàn.","Wǒ gāng cái kàn jiàn nǐ fàng zài nàr le."],vi:["Chìa khóa ở dưới bàn, bạn tìm thử xem.","Lúc nãy tôi thấy bạn để ở đó."]},
  "1-9-哪儿":{zh:["你住在哪儿？离学校远不远？","如果不远，我们可以一起走路去上课。"],py:["Nǐ zhù zài nǎr? Lí xué xiào yuǎn bú yuǎn?","Rú guǒ bù yuǎn, wǒ men kě yǐ yì qǐ zǒu lù qù shàng kè."],vi:["Bạn sống ở đâu? Có xa trường không?","Nếu không xa, chúng ta có thể đi bộ cùng nhau đến lớp."]},
  "1-9-这儿":{zh:["这儿很安静，适合看书。","我们坐在这儿休息一会儿吧。"],py:["Zhèr hěn ān jìng, shì hé kàn shū.","Wǒ men zuò zài zhèr xiū xi yí huìr ba."],vi:["Ở đây rất yên tĩnh, phù hợp để đọc sách.","Chúng ta ngồi đây nghỉ một lát nhé."]},
  "1-9-儿子":{zh:["他有一个儿子，今年五岁。","儿子很活泼，见到人就喜欢笑。"],py:["Tā yǒu yí gè ér zi, jīn nián wǔ suì.","Ér zi hěn huó pō, jiàn dào rén jiù xǐ huan xiào."],vi:["Anh ấy có một con trai, năm nay năm tuổi.","Con trai rất hiếu động, gặp ai cũng thích cười."]},
  "1-9-医院":{zh:["我昨天去医院看医生了。","医生说我休息两天就会好。"],py:["Wǒ zuó tiān qù yī yuàn kàn yī shēng le.","Yī shēng shuō wǒ xiū xi liǎng tiān jiù huì hǎo."],vi:["Hôm qua tôi đến bệnh viện khám bác sĩ rồi.","Bác sĩ nói tôi nghỉ hai ngày là sẽ khỏe."]},
  "1-9-医生":{zh:["那位医生说话很温柔，也很认真。","他先检查了我的身体，然后告诉我怎么吃药。"],py:["Nà wèi yī shēng shuō huà hěn wēn róu, yě hěn rèn zhēn.","Tā xiān jiǎn chá le wǒ de shēn tǐ, rán hòu gào su wǒ zěn me chī yào."],vi:["Vị bác sĩ đó nói chuyện rất dịu dàng và cũng rất tận tình.","Ông ấy kiểm tra cơ thể tôi trước rồi nói tôi uống thuốc thế nào."]},
  "1-9-爸爸":{zh:["我爸爸平时很忙，经常加班。","周末有空的时候，他会陪我去公园散步。"],py:["Wǒ bà ba píng shí hěn máng, jīng cháng jiā bān.","Zhōu mò yǒu kòng de shí hou, tā huì péi wǒ qù gōng yuán sàn bù."],vi:["Bố tôi bình thường rất bận, thường tăng ca.","Cuối tuần khi rảnh, bố sẽ đi dạo công viên cùng tôi."]},
  "1-10-桌子":{zh:["书在桌子上，你先拿去看吧。","看完以后再放回原来的地方。"],py:["Shū zài zhuō zi shàng, nǐ xiān ná qù kàn ba.","Kàn wán yǐ hòu zài fàng huí yuán lái de dì fang."],vi:["Sách ở trên bàn, bạn cầm đi đọc trước đi.","Đọc xong rồi đặt lại chỗ cũ nhé."]},
  "1-10-上":{zh:["猫在桌子上睡觉。","我不想吵它，所以走路很轻。"],py:["Māo zài zhuō zi shàng shuì jiào.","Wǒ bù xiǎng chǎo tā, suǒ yǐ zǒu lù hěn qīng."],vi:["Con mèo đang ngủ trên bàn.","Tôi không muốn làm ồn nó nên đi rất nhẹ."]},
  "1-10-电脑":{zh:["我的电脑有点儿旧了。","所以我想买一台新的，用来学习。"],py:["Wǒ de diàn nǎo yǒu diǎnr jiù le.","Suǒ yǐ wǒ xiǎng mǎi yì tái xīn de, yòng lái xué xí."],vi:["Máy tính của tôi hơi cũ rồi.","Vì vậy tôi muốn mua một cái mới để học."]},
  "1-10-和":{zh:["我和朋友一起去图书馆。","我们一边复习一边做笔记。"],py:["Wǒ hé péng you yì qǐ qù tú shū guǎn.","Wǒ men yì biān fù xí yì biān zuò bǐ jì."],vi:["Tôi và bạn cùng nhau đi thư viện.","Chúng tôi vừa ôn vừa ghi chú."]},
  "1-10-里":{zh:["我的手机在包里。","你等我一下，我拿出来给你看。"],py:["Wǒ de shǒu jī zài bāo lǐ.","Nǐ děng wǒ yí xià, wǒ ná chū lái gěi nǐ kàn."],vi:["Điện thoại của tôi ở trong túi.","Bạn đợi tôi một chút, tôi lấy ra cho bạn xem."]},
  "1-10-前面":{zh:["学校就在前面，我们快到了。","再走五分钟就能看到大门。"],py:["Xué xiào jiù zài qián mian, wǒ men kuài dào le.","Zài zǒu wǔ fēn zhōng jiù néng kàn dào dà mén."],vi:["Trường ở ngay phía trước, chúng ta sắp đến rồi.","Đi thêm năm phút là sẽ thấy cổng lớn."]},
  "1-10-后面":{zh:["我坐在教室后面，所以看黑板有点儿不清楚。","下次我想坐前面一点儿。"],py:["Wǒ zuò zài jiào shì hòu mian, suǒ yǐ kàn hēi bǎn yǒu diǎnr bù qīng chu.","Xià cì wǒ xiǎng zuò qián mian yì diǎnr."],vi:["Tôi ngồi phía sau lớp nên nhìn bảng hơi không rõ.","Lần sau tôi muốn ngồi phía trước hơn một chút."]},
  "1-10-没有":{zh:["我没有带钱，所以不能买这个。","你可以先帮我付吗？我回去再还你。"],py:["Wǒ méi yǒu dài qián, suǒ yǐ bù néng mǎi zhè ge.","Nǐ kě yǐ xiān bāng wǒ fù ma? Wǒ huí qù zài huán nǐ."],vi:["Tôi không mang tiền nên không mua cái này được.","Bạn có thể trả giúp tôi trước không? Về tôi trả lại bạn."]},
  "1-10-住":{zh:["你住在哪儿？我送你回去吧。","晚上一个人走路不太安全。"],py:["Nǐ zhù zài nǎr? Wǒ sòng nǐ huí qù ba.","Wǎn shang yí ge rén zǒu lù bù tài ān quán."],vi:["Bạn sống ở đâu? Để tôi đưa bạn về nhé.","Buổi tối đi một mình không an toàn lắm."]},
  "1-10-坐":{zh:["请坐，我们慢慢谈。","站着说话太累了。"],py:["Qǐng zuò, wǒ men màn man tán.","Zhàn zhe shuō huà tài lèi le."],vi:["Mời ngồi, chúng ta nói chuyện từ từ.","Đứng nói chuyện mệt quá."]},
  "1-10-能":{zh:["你能帮我看看这道题吗？","我自己想了很久，还是不太明白。"],py:["Nǐ néng bāng wǒ kàn kan zhè dào tí ma?","Wǒ zì jǐ xiǎng le hěn jiǔ, hái shì bù tài míng bai."],vi:["Bạn có thể giúp tôi xem bài này không?","Tôi tự nghĩ rất lâu rồi mà vẫn chưa hiểu lắm."]},
  "1-10-来":{zh:["有空就来我家玩儿吧。","我妈妈说想请你吃她做的菜。"],py:["Yǒu kòng jiù lái wǒ jiā wánr ba.","Wǒ mā ma shuō xiǎng qǐng nǐ chī tā zuò de cài."],vi:["Rảnh thì đến nhà tôi chơi nhé.","Mẹ tôi nói muốn mời bạn ăn món mẹ làm."]},
  "1-11-现在":{zh:["我现在在图书馆。","等我看完这本书就回宿舍。"],py:["Wǒ xiàn zài zài tú shū guǎn.","Děng wǒ kàn wán zhè běn shū jiù huí sù shè."],vi:["Bây giờ tôi đang ở thư viện.","Đợi tôi đọc xong quyển sách này rồi sẽ về ký túc xá."]},
  "1-11-点":{zh:["现在几点？","我想看看时间，然后安排下午做什么。"],py:["Xiàn zài jǐ diǎn?","Wǒ xiǎng kàn kan shí jiān, rán hòu ān pái xià wǔ zuò shén me."],vi:["Bây giờ mấy giờ?","Tôi muốn xem giờ rồi sắp xếp buổi chiều làm gì."]},
  "1-11-分":{zh:["现在三点十分，我们差不多该走了。","如果再晚一点儿，就会迟到。"],py:["Xiàn zài sān diǎn shí fēn, wǒ men chà bu duō gāi zǒu le.","Rú guǒ zài wǎn yì diǎnr, jiù huì chí dào."],vi:["Bây giờ 3 giờ 10, chúng ta gần như nên đi rồi.","Nếu muộn thêm chút nữa sẽ đến muộn."]},
  "1-11-中午":{zh:["中午我想吃面条，不想吃米饭。","吃完以后我还要去上班。"],py:["Zhōng wǔ wǒ xiǎng chī miàn tiáo, bù xiǎng chī mǐ fàn.","Chī wán yǐ hòu wǒ hái yào qù shàng bān."],vi:["Buổi trưa tôi muốn ăn mì, không muốn ăn cơm.","Ăn xong tôi còn phải đi làm."]},
  "1-11-时候":{zh:["你什么时候有时间？","我想跟你一起去饭店吃饭。"],py:["Nǐ shén me shí hou yǒu shí jiān?","Wǒ xiǎng gēn nǐ yì qǐ qù fàn diàn chī fàn."],vi:["Khi nào bạn có thời gian?","Tôi muốn đi nhà hàng ăn cùng bạn."]},
  "1-11-吃饭":{zh:["我们先去吃饭吧。","吃完饭再去公园散步。"],py:["Wǒ men xiān qù chī fàn ba.","Chī wán fàn zài qù gōng yuán sàn bù."],vi:["Chúng ta đi ăn cơm trước nhé.","Ăn xong rồi đi dạo công viên."]},
  "1-11-回":{zh:["我今天想早点儿回家。","外面下雨了，我不想走太远。"],py:["Wǒ jīn tiān xiǎng zǎo diǎnr huí jiā.","Wài mian xià yǔ le, wǒ bù xiǎng zǒu tài yuǎn."],vi:["Hôm nay tôi muốn về nhà sớm hơn.","Ngoài trời mưa rồi, tôi không muốn đi xa."]},
  "1-11-我们":{zh:["我们都是学生。","所以平时常常一起复习。"],py:["Wǒ men dōu shì xué sheng.","Suǒ yǐ píng shí cháng cháng yì qǐ fù xí."],vi:["Chúng tôi đều là học sinh/sinh viên.","Vì vậy bình thường hay ôn bài cùng nhau."]},
  "1-11-电影":{zh:["周末我们一起去看电影。","看完以后再去商店买点水果。"],py:["Zhōu mò wǒ men yì qǐ qù kàn diàn yǐng.","Kàn wán yǐ hòu zài qù shāng diàn mǎi diǎn shuǐ guǒ."],vi:["Cuối tuần chúng tôi cùng đi xem phim.","Xem xong rồi đến cửa hàng mua ít trái cây."]},
  "1-11-工作":{zh:["我爸爸在公司工作。","他平时很忙，经常很晚才回家。"],py:["Wǒ bà ba zài gōng sī gōng zuò.","Tā píng shí hěn máng, jīng cháng hěn wǎn cái huí jiā."],vi:["Bố tôi làm việc ở công ty.","Bình thường bố rất bận, thường rất muộn mới về nhà."]},
  "1-12-天气":{zh:["今天天气很好，太阳也很亮。","如果你有时间，我们去公园走走吧。"],py:["Jīn tiān tiān qì hěn hǎo, tài yáng yě hěn liàng.","Rú guǒ nǐ yǒu shí jiān, wǒ men qù gōng yuán zǒu zǒu ba."],vi:["Hôm nay thời tiết rất đẹp, mặt trời cũng rất sáng.","Nếu bạn có thời gian, chúng ta ra công viên đi dạo nhé."]},
  "1-12-怎么样":{zh:["你今天怎么样？感觉好点儿了吗？","如果还不舒服，就早点儿休息。"],py:["Nǐ jīn tiān zěn me yàng? Gǎn jué hǎo diǎnr le ma?","Rú guǒ hái bù shū fu, jiù zǎo diǎnr xiū xi."],vi:["Hôm nay bạn thế nào? Đỡ hơn chút chưa?","Nếu vẫn không khỏe thì nghỉ sớm nhé."]},
  "1-12-太":{zh:["今天太热了，我想喝冰水。","要是没有空调，我真的受不了。"],py:["Jīn tiān tài rè le, wǒ xiǎng hē bīng shuǐ.","Yào shì méi yǒu kōng tiáo, wǒ zhēn de shòu bù liǎo."],vi:["Hôm nay nóng quá, tôi muốn uống nước đá.","Nếu không có điều hòa thì tôi thật sự không chịu nổi."]},
  "1-12-热":{zh:["夏天很热，所以我不想在外面走太久。","我打算去图书馆坐一会儿。"],py:["Xià tiān hěn rè, suǒ yǐ wǒ bù xiǎng zài wài mian zǒu tài jiǔ.","Wǒ dǎ suàn qù tú shū guǎn zuò yí huìr."],vi:["Mùa hè rất nóng nên tôi không muốn đi ngoài trời lâu.","Tôi định đến thư viện ngồi một lát."]},
  "1-12-冷":{zh:["今天有点儿冷，你多穿一件衣服。","别感冒了，明天还有课。"],py:["Jīn tiān yǒu diǎnr lěng, nǐ duō chuān yí jiàn yī fu.","Bié gǎn mào le, míng tiān hái yǒu kè."],vi:["Hôm nay hơi lạnh, bạn mặc thêm một áo nữa.","Đừng để bị cảm, mai còn có tiết học."]},
  "1-12-下雨":{zh:["外面下雨了，我们先别出去。","等雨小一点儿再走。"],py:["Wài mian xià yǔ le, wǒ men xiān bié chū qù.","Děng yǔ xiǎo yì diǎnr zài zǒu."],vi:["Ngoài trời mưa rồi, chúng ta đừng ra ngoài vội.","Đợi mưa nhỏ hơn chút rồi đi."]},
  "1-12-雨":{zh:["雨很大，我的鞋都湿了。","回家以后我马上换衣服洗澡。"],py:["Yǔ hěn dà, wǒ de xié dōu shī le.","Huí jiā yǐ hòu wǒ mǎ shàng huàn yī fu xǐ zǎo."],vi:["Mưa rất to, giày của tôi đều ướt hết rồi.","Về nhà tôi sẽ thay đồ và tắm ngay."]},
  "1-12-身体":{zh:["最近我身体不太好，常常觉得累。","医生说我应该早点儿睡觉，多运动。"],py:["Zuì jìn wǒ shēn tǐ bù tài hǎo, cháng cháng jué de lèi.","Yī shēng shuō wǒ yīng gāi zǎo diǎnr shuì jiào, duō yùn dòng."],vi:["Gần đây sức khỏe tôi không tốt lắm, hay thấy mệt.","Bác sĩ nói tôi nên ngủ sớm hơn và vận động nhiều."]},
  "1-12-爱":{zh:["我爱我的家，也爱和家人一起吃饭。","虽然生活很忙，但是我觉得这样很幸福。"],py:["Wǒ ài wǒ de jiā, yě ài hé jiā rén yì qǐ chī fàn.","Suī rán shēng huó hěn máng, dàn shì wǒ jué de zhè yàng hěn xìng fú."],vi:["Tôi yêu gia đình mình và cũng yêu những bữa cơm cùng gia đình.","Tuy cuộc sống bận rộn nhưng tôi thấy như vậy rất hạnh phúc."]},
  "1-13-喂":{zh:["喂，你好，我是小安。","我想问你明天几点见面。"],py:["Wèi, nǐ hǎo, wǒ shì Xiǎo Ān.","Wǒ xiǎng wèn nǐ míng tiān jǐ diǎn jiàn miàn."],vi:["A-lô, xin chào, tôi là Tiểu An.","Tôi muốn hỏi ngày mai mấy giờ gặp nhau."]},
  "1-13-也":{zh:["我也想去公园散步。","如果你去的话，我跟你一起去。"],py:["Wǒ yě xiǎng qù gōng yuán sàn bù.","Rú guǒ nǐ qù de huà, wǒ gēn nǐ yì qǐ qù."],vi:["Tôi cũng muốn đi dạo công viên.","Nếu bạn đi thì tôi đi cùng."]},
  "1-13-学习":{zh:["我每天晚上都学习中文。","先复习生词，再练习写汉字。"],py:["Wǒ měi tiān wǎn shang dōu xué xí Zhōng wén.","Xiān fù xí shēng cí, zài liàn xí xiě Hàn zì."],vi:["Tối nào tôi cũng học tiếng Trung.","Ôn từ mới trước rồi luyện viết chữ Hán."]},
  "1-13-上午":{zh:["上午我有两节课。","下课以后我去图书馆看书。"],py:["Shàng wǔ wǒ yǒu liǎng jié kè.","Xià kè yǐ hòu wǒ qù tú shū guǎn kàn shū."],vi:["Buổi sáng tôi có hai tiết học.","Tan học xong tôi đi thư viện đọc sách."]},
  "1-13-睡觉":{zh:["我昨天晚上睡觉睡得很晚。","所以今天早上起床的时候特别困。"],py:["Wǒ zuó tiān wǎn shang shuì jiào shuì de hěn wǎn.","Suǒ yǐ jīn tiān zǎo shang qǐ chuáng de shí hou tè bié kùn."],vi:["Tối qua tôi ngủ rất muộn.","Vì vậy sáng nay lúc dậy tôi rất buồn ngủ."]},
  "1-13-电视":{zh:["晚饭以后我不想看电视。","我想安静地看书，复习一下。"],py:["Wǎn fàn yǐ hòu wǒ bù xiǎng kàn diàn shì.","Wǒ xiǎng ān jìng de kàn shū, fù xí yí xià."],vi:["Sau bữa tối tôi không muốn xem tivi.","Tôi muốn yên tĩnh đọc sách và ôn một chút."]},
  "1-13-给":{zh:["请给我一杯水。","我有点儿口渴，想先喝一下。"],py:["Qǐng gěi wǒ yì bēi shuǐ.","Wǒ yǒu diǎnr kǒu kě, xiǎng xiān hē yí xià."],vi:["Làm ơn cho tôi một cốc nước.","Tôi hơi khát, muốn uống trước một chút."]},
  "1-13-打电话":{zh:["我晚上给你打电话，好吗？","我有一些事情想跟你商量。"],py:["Wǒ wǎn shang gěi nǐ dǎ diàn huà, hǎo ma?","Wǒ yǒu yì xiē shì qing xiǎng gēn nǐ shāng liang."],vi:["Tối nay tôi gọi điện cho bạn nhé?","Tôi có vài chuyện muốn bàn với bạn."]},
  "1-13-吧":{zh:["我们走吧，不然就晚了。","先去吃饭，然后再回家。"],py:["Wǒ men zǒu ba, bù rán jiù wǎn le.","Xiān qù chī fàn, rán hòu zài huí jiā."],vi:["Chúng ta đi thôi, không thì muộn mất.","Đi ăn cơm trước rồi về nhà sau."]},
  "1-13-喜欢":{zh:["我喜欢听音乐，也喜欢看电影。","周末有空的时候，我就跟朋友一起出去。"],py:["Wǒ xǐ huan tīng yīn yuè, yě xǐ huan kàn diàn yǐng.","Zhōu mò yǒu kòng de shí hou, wǒ jiù gēn péng you yì qǐ chū qù."],vi:["Tôi thích nghe nhạc và cũng thích xem phim.","Cuối tuần rảnh tôi sẽ ra ngoài cùng bạn bè."]},
  "1-14-东西":{zh:["你想买什么东西？","我想买一些水果和面包。"],py:["Nǐ xiǎng mǎi shén me dōng xi?","Wǒ xiǎng mǎi yì xiē shuǐ guǒ hé miàn bāo."],vi:["Bạn muốn mua đồ gì?","Tôi muốn mua ít trái cây và bánh mì."]},
  "1-14-一点儿":{zh:["我会一点儿中文，但是说得不太好。","如果你说慢一点儿，我就能听懂。"],py:["Wǒ huì yì diǎnr Zhōng wén, dàn shì shuō de bú tài hǎo.","Rú guǒ nǐ shuō màn yì diǎnr, wǒ jiù néng tīng dǒng."],vi:["Tôi biết một chút tiếng Trung nhưng nói chưa tốt lắm.","Nếu bạn nói chậm hơn một chút thì tôi sẽ nghe hiểu."]},
  "1-14-苹果":{zh:["我想买几个苹果。","老板说今天的苹果很新鲜。"],py:["Wǒ xiǎng mǎi jǐ ge píng guǒ.","Lǎo bǎn shuō jīn tiān de píng guǒ hěn xīn xiān."],vi:["Tôi muốn mua vài quả táo.","Ông chủ nói táo hôm nay rất tươi."]},
  "1-14-看见":{zh:["我在路口看见你了。","你穿的那件衣服很漂亮，所以我一下子就认出来。"],py:["Wǒ zài lù kǒu kàn jiàn nǐ le.","Nǐ chuān de nà jiàn yī fu hěn piào liang, suǒ yǐ wǒ yí xià zi jiù rèn chū lái."],vi:["Tôi nhìn thấy bạn ở ngã đường rồi.","Bạn mặc bộ đồ rất đẹp nên tôi nhận ra ngay."]},
  "1-14-开":{zh:["请开门，我回来了。","外面下雨，我不想站在门口等太久。"],py:["Qǐng kāi mén, wǒ huí lái le.","Wài mian xià yǔ, wǒ bù xiǎng zhàn zài mén kǒu děng tài jiǔ."],vi:["Mở cửa giúp tôi với, tôi về rồi đây.","Ngoài trời mưa, tôi không muốn đứng ở cửa đợi lâu."]},
  "1-14-水果":{zh:["我每天都会吃一点儿水果。","这样身体会更好，也不容易生病。"],py:["Wǒ měi tiān dōu huì chī yì diǎnr shuǐ guǒ.","Zhè yàng shēn tǐ huì gèng hǎo, yě bù róng yì shēng bìng."],vi:["Mỗi ngày tôi đều ăn một chút trái cây.","Như vậy sức khỏe sẽ tốt hơn và cũng ít bị ốm hơn."]},
  "1-14-水":{zh:["你先喝点水吧。","走了这么久，大家都口渴了。"],py:["Nǐ xiān hē diǎn shuǐ ba.","Zǒu le zhè me jiǔ, dà jiā dōu kǒu kě le."],vi:["Bạn uống chút nước trước đi.","Đi lâu như vậy rồi, ai cũng khát cả."]},
  "1-14-些":{zh:["我想买一些面包和牛奶。","这样明天早上就不用出去买了。"],py:["Wǒ xiǎng mǎi yì xiē miàn bāo hé niú nǎi.","Zhè yàng míng tiān zǎo shang jiù bú yòng chū qù mǎi le."],vi:["Tôi muốn mua một ít bánh mì và sữa.","Như vậy sáng mai không cần ra ngoài mua nữa."]},
  "1-14-都":{zh:["我们都已经到齐了。","现在可以开始上课了。"],py:["Wǒ men dōu yǐ jīng dào qí le.","Xiàn zài kě yǐ kāi shǐ shàng kè le."],vi:["Chúng ta đều đã đến đủ rồi.","Bây giờ có thể bắt đầu học."]},
  "1-14-车":{zh:["外面雨很大，我们坐车去吧。","走路过去会太远，也会淋湿。"],py:["Wài mian yǔ hěn dà, wǒ men zuò chē qù ba.","Zǒu lù guò qù huì tài yuǎn, yě huì lín shī."],vi:["Ngoài trời mưa to, chúng ta đi xe nhé.","Đi bộ qua sẽ xa quá và cũng sẽ bị ướt."]},
  "1-14-回来":{zh:["你什么时候回来？我在家等你。","回来的路上注意安全。"],py:["Nǐ shén me shí hou huí lái? Wǒ zài jiā děng nǐ.","Huí lái de lù shàng zhù yì ān quán."],vi:["Khi nào bạn về? Tôi đợi bạn ở nhà.","Trên đường về nhớ chú ý an toàn."]},
  "1-14-衣服":{zh:["这件衣服很漂亮，可是有点儿贵。","我再看看别的店，再决定买不买。"],py:["Zhè jiàn yī fu hěn piào liang, kě shì yǒu diǎnr guì.","Wǒ zài kàn kan bié de diàn, zài jué dìng mǎi bù mǎi."],vi:["Bộ quần áo này rất đẹp nhưng hơi đắt.","Tôi xem thêm cửa hàng khác rồi mới quyết định mua hay không."]},
  "1-14-漂亮":{zh:["你今天真的很漂亮。","我一看见你就觉得心情很好。"],py:["Nǐ jīn tiān zhēn de hěn piào liang.","Wǒ yí kàn jiàn nǐ jiù jué de xīn qíng hěn hǎo."],vi:["Hôm nay bạn thật sự rất đẹp.","Vừa nhìn thấy bạn là tôi đã thấy tâm trạng rất tốt."]},
  "1-15-认识":{zh:["认识你很高兴。","以后我们可以一起学习中文。"],py:["Rèn shi nǐ hěn gāo xìng.","Yǐ hòu wǒ men kě yǐ yì qǐ xué xí Zhōng wén."],vi:["Rất vui được làm quen với bạn.","Sau này chúng ta có thể cùng học tiếng Trung."]},
  "1-15-年":{zh:["今年是二零二六年。","这一年我想让自己进步更多。"],py:["Jīn nián shì èr líng èr liù nián.","Zhè yì nián wǒ xiǎng ràng zì jǐ jìn bù gèng duō."],vi:["Năm nay là năm 2026.","Năm nay tôi muốn bản thân tiến bộ nhiều hơn."]},
  "1-15-大学":{zh:["我在大学学习法律。","虽然很忙，但是我觉得很有意思。"],py:["Wǒ zài dà xué xué xí fǎ lǜ.","Suī rán hěn máng, dàn shì wǒ jué de hěn yǒu yì si."],vi:["Tôi học luật ở đại học.","Tuy rất bận nhưng tôi thấy rất thú vị."]},
  "1-15-饭店":{zh:["我们去饭店吃饭吧。","听说那家饭店的饺子特别好吃。"],py:["Wǒ men qù fàn diàn chī fàn ba.","Tīng shuō nà jiā fàn diàn de jiǎo zi tè bié hǎo chī."],vi:["Chúng ta đi nhà hàng ăn cơm nhé.","Nghe nói sủi cảo của nhà hàng đó đặc biệt ngon."]},
  "1-15-出租车":{zh:["今天太晚了，我们坐出租车回去。","这样比较安全，也不会走太久。"],py:["Jīn tiān tài wǎn le, wǒ men zuò chū zū chē huí qù.","Zhè yàng bǐ jiào ān quán, yě bú huì zǒu tài jiǔ."],vi:["Hôm nay muộn quá rồi, chúng ta đi taxi về.","Như vậy an toàn hơn và cũng không phải đi lâu."]},
  "1-15-先生":{zh:["王先生，您好。","我想请您帮我看一下这份表格。"],py:["Wáng xiān sheng, nín hǎo.","Wǒ xiǎng qǐng nín bāng wǒ kàn yí xià zhè fèn biǎo gé."],vi:["Chào ông Vương ạ.","Tôi muốn nhờ ông xem giúp tôi tờ biểu mẫu này."]},
  "1-15-一起":{zh:["周末我们一起去公园吧。","如果天气好，我们还可以顺便拍照。"],py:["Zhōu mò wǒ men yì qǐ qù gōng yuán ba.","Rú guǒ tiān qì hǎo, wǒ men hái kě yǐ shùn biàn pāi zhào."],vi:["Cuối tuần chúng ta cùng đi công viên nhé.","Nếu thời tiết đẹp, chúng ta còn có thể tiện thể chụp ảnh."]},
  "1-15-高兴":{zh:["今天认识了新朋友，我很高兴。","希望以后我们能常常见面。"],py:["Jīn tiān rèn shi le xīn péng you, wǒ hěn gāo xìng.","Xī wàng yǐ hòu wǒ men néng cháng cháng jiàn miàn."],vi:["Hôm nay quen thêm bạn mới, tôi rất vui.","Hy vọng sau này chúng ta có thể thường xuyên gặp nhau."]},
  "1-15-听":{zh:["我喜欢听音乐。","听着音乐学习的时候，我会更放松。"],py:["Wǒ xǐ huan tīng yīn yuè.","Tīng zhe yīn yuè xué xí de shí hou, wǒ huì gèng fàng sōng."],vi:["Tôi thích nghe nhạc.","Nghe nhạc khi học, tôi sẽ thư giãn hơn."]},
  "1-15-飞机":{zh:["我明天坐飞机去中国。","到机场以后我会给你打电话。"],py:["Wǒ míng tiān zuò fēi jī qù Zhōng guó.","Dào jī chǎng yǐ hòu wǒ huì gěi nǐ dǎ diàn huà."],vi:["Ngày mai tôi đi máy bay đến Trung Quốc.","Đến sân bay xong tôi sẽ gọi cho bạn."]},
  "1-15-少":{zh:["今天图书馆的人很少。","所以里面特别安静，很适合复习。"],py:["Jīn tiān tú shū guǎn de rén hěn shǎo.","Suǒ yǐ lǐ mian tè bié ān jìng, hěn shì hé fù xí."],vi:["Hôm nay thư viện rất ít người.","Vì vậy bên trong cực kỳ yên tĩnh, rất hợp để ôn bài."]},
  "1-15-啊":{zh:["啊？你明天就要走吗？","我还以为你下个星期才回家。"],py:["A? Nǐ míng tiān jiù yào zǒu ma?","Wǒ hái yǐ wéi nǐ xià ge xīng qī cái huí jiā."],vi:["Hả? Ngày mai bạn đi rồi sao?","Tôi còn tưởng tuần sau bạn mới về nhà cơ."]},
  "1-15-分钟":{zh:["你等我五分钟，我马上就到。","我现在在路上，离你不远。"],py:["Nǐ děng wǒ wǔ fēn zhōng, wǒ mǎ shàng jiù dào.","Wǒ xiàn zài zài lù shàng, lí nǐ bù yuǎn."],vi:["Bạn đợi tôi 5 phút, tôi đến ngay.","Bây giờ tôi đang trên đường, không xa bạn đâu."]},
  "1-15-小姐":{zh:["王小姐，您好。","请问您想喝茶还是咖啡？"],py:["Wáng xiǎo jiě, nín hǎo.","Qǐng wèn nín xiǎng hē chá hái shi kā fēi?"],vi:["Chào cô Vương ạ.","Xin hỏi cô muốn uống trà hay cà phê?"]},
  "2-1-旅游":{zh:["我一直很喜欢旅游，因为可以看到很多新的地方。","每次旅行回来以后，我都会把照片整理好。"],py:["Wǒ yì zhí hěn xǐ huan lǚ yóu, yīn wèi kě yǐ kàn dào hěn duō xīn de dì fang.","Měi cì lǚ xíng huí lái yǐ hòu, wǒ dōu huì bǎ zhào piàn zhěng lǐ hǎo."],vi:["Tôi luôn rất thích du lịch vì có thể nhìn thấy nhiều nơi mới.","Mỗi lần đi du lịch về, tôi đều sắp xếp lại ảnh cho gọn gàng."]},
  "2-1-觉得":{zh:["我觉得这家饭店的面条很好吃。","下次有空的时候，我还想再来一次。"],py:["Wǒ jué de zhè jiā fàn diàn de miàn tiáo hěn hǎo chī.","Xià cì yǒu kòng de shí hou, wǒ hái xiǎng zài lái yí cì."],vi:["Tôi cảm thấy mì ở nhà hàng này rất ngon.","Lần sau khi rảnh, tôi còn muốn quay lại thêm một lần nữa."]},
  "2-1-最":{zh:["在我们家里，我最喜欢喝妈妈做的汤。","味道不但很好，而且每次喝完都觉得很舒服。"],py:["Zài wǒ men jiā lǐ, wǒ zuì xǐ huan hē mā ma zuò de tāng.","Wèi dào bú dàn hěn hǎo, ér qiě měi cì hē wán dōu jué de hěn shū fu."],vi:["Trong nhà tôi, món tôi thích nhất là canh mẹ nấu.","Hương vị không những ngon mà mỗi lần uống xong đều thấy rất dễ chịu."]},
  "2-1-为什么":{zh:["你今天为什么来得这么晚？","我刚才一直在门口等你，还以为你不来了。"],py:["Nǐ jīn tiān wèi shén me lái de zhè me wǎn?","Wǒ gāng cái yì zhí zài mén kǒu děng nǐ, hái yǐ wéi nǐ bù lái le."],vi:["Hôm nay tại sao bạn đến muộn vậy?","Lúc nãy tôi đợi bạn ở cửa mãi, còn tưởng là bạn không đến nữa."]},
  "2-1-运动":{zh:["我平时很喜欢运动，周末常常去公园跑步。","如果一直待在房间里，我会觉得身体不太舒服。"],py:["Wǒ píng shí hěn xǐ huan yùn dòng, zhōu mò cháng cháng qù gōng yuán pǎo bù.","Rú guǒ yì zhí dāi zài fáng jiān lǐ, wǒ huì jué de shēn tǐ bù tài shū fu."],vi:["Bình thường tôi rất thích vận động, cuối tuần thường ra công viên chạy bộ.","Nếu cứ ở mãi trong phòng, tôi sẽ cảm thấy cơ thể không được thoải mái lắm."]},
  "2-1-踢足球":{zh:["下课以后，几个男同学一起去操场踢足球。","我虽然不会踢，可是很喜欢站在旁边看。"],py:["Xià kè yǐ hòu, jǐ ge nán tóng xué yì qǐ qù cāo chǎng tī zú qiú.","Wǒ suī rán bú huì tī, kě shì hěn xǐ huan zhàn zài páng biān kàn."],vi:["Tan học xong, mấy bạn nam cùng nhau ra sân đá bóng.","Tôi tuy không biết đá nhưng rất thích đứng bên cạnh xem."]},
  "2-1-要":{zh:["明天下午我要去银行办点儿事。","如果你也在附近，咱们可以一起吃晚饭。"],py:["Míng tiān xià wǔ wǒ yào qù yín háng bàn diǎnr shì.","Rú guǒ nǐ yě zài fù jìn, zán men kě yǐ yì qǐ chī wǎn fàn."],vi:["Chiều mai tôi muốn đi ngân hàng giải quyết chút việc.","Nếu bạn cũng ở gần đó thì chúng ta có thể ăn tối cùng nhau."]},
  "2-1-新":{zh:["这是我昨天刚买的新词典。","虽然有一点儿贵，可是查词很方便。"],py:["Zhè shì wǒ zuó tiān gāng mǎi de xīn cí diǎn.","Suī rán yǒu yì diǎnr guì, kě shì chá cí hěn fāng biàn."],vi:["Đây là cuốn từ điển mới mà tôi vừa mua hôm qua.","Tuy hơi đắt một chút nhưng tra từ rất tiện."]},
  "2-1-它":{zh:["我家有一只小猫，它最喜欢在窗边睡觉。","每次我回家，它都会马上跑过来。"],py:["Wǒ jiā yǒu yì zhī xiǎo māo, tā zuì xǐ huan zài chuāng biān shuì jiào.","Měi cì wǒ huí jiā, tā dōu huì mǎ shàng pǎo guò lái."],vi:["Nhà tôi có một con mèo nhỏ, nó thích nhất là ngủ bên cửa sổ.","Mỗi lần tôi về nhà, nó đều chạy đến ngay lập tức."]},
  "2-1-眼睛":{zh:["那个孩子的眼睛很亮，看起来特别可爱。","他一笑起来，大家都会跟着高兴。"],py:["Nà ge hái zi de yǎn jing hěn liàng, kàn qǐ lái tè bié kě ài.","Tā yì xiào qǐ lái, dà jiā dōu huì gēn zhe gāo xìng."],vi:["Đôi mắt của đứa trẻ đó rất sáng, trông vô cùng đáng yêu.","Hễ em ấy cười là mọi người cũng thấy vui theo."]},
  "2-2-生病":{zh:["他前两天生病了，所以没有来上课。","今天终于回到教室，大家都问他身体怎么样。"],py:["Tā qián liǎng tiān shēng bìng le, suǒ yǐ méi yǒu lái shàng kè.","Jīn tiān zhōng yú huí dào jiào shì, dà jiā dōu wèn tā shēn tǐ zěn me yàng."],vi:["Hai hôm trước cậu ấy bị ốm nên không đến lớp.","Hôm nay cuối cùng cũng quay lại lớp, mọi người đều hỏi sức khỏe cậu ấy thế nào."]},
  "2-2-每":{zh:["我每天晚上都会花半个小时复习生词。","时间虽然不长，可是坚持下来很有用。"],py:["Wǒ měi tiān wǎn shang dōu huì huā bàn ge xiǎo shí fù xí shēng cí.","Shí jiān suī rán bù cháng, kě shì jiān chí xià lái hěn yǒu yòng."],vi:["Tối nào tôi cũng dành nửa tiếng để ôn từ mới.","Thời gian tuy không dài nhưng kiên trì như vậy rất có ích."]},
  "2-2-早上":{zh:["今天早上我起得很早。","吃完早饭以后，我一个人去操场走了几圈。"],py:["Jīn tiān zǎo shang wǒ qǐ de hěn zǎo.","Chī wán zǎo fàn yǐ hòu, wǒ yí ge rén qù cāo chǎng zǒu le jǐ quān."],vi:["Sáng nay tôi dậy rất sớm.","Ăn sáng xong, tôi một mình ra sân đi vài vòng."]},
  "2-2-跑步":{zh:["我最近开始每天早上跑步。","虽然刚开始有点儿累，可是身体感觉比以前好多了。"],py:["Wǒ zuì jìn kāi shǐ měi tiān zǎo shang pǎo bù.","Suī rán gāng kāi shǐ yǒu diǎnr lèi, kě shì shēn tǐ gǎn jué bǐ yǐ qián hǎo duō le."],vi:["Gần đây tôi bắt đầu chạy bộ mỗi sáng.","Tuy lúc đầu hơi mệt nhưng cảm giác cơ thể tốt hơn trước rất nhiều."]},
  "2-2-起床":{zh:["我平时六点半起床，周末会晚一点儿。","如果前一天睡得太晚，第二天就会特别困。"],py:["Wǒ píng shí liù diǎn bàn qǐ chuáng, zhōu mò huì wǎn yì diǎnr.","Rú guǒ qián yì tiān shuì de tài wǎn, dì èr tiān jiù huì tè bié kùn."],vi:["Bình thường tôi dậy lúc sáu rưỡi, cuối tuần thì muộn hơn một chút.","Nếu hôm trước ngủ quá muộn thì hôm sau sẽ rất buồn ngủ."]},
  "2-2-药":{zh:["医生说这次感冒不严重，按时吃药就可以了。","妈妈怕我忘记，还把时间写在纸上。"],py:["Yī shēng shuō zhè cì gǎn mào bù yán zhòng, àn shí chī yào jiù kě yǐ le.","Mā ma pà wǒ wàng jì, hái bǎ shí jiān xiě zài zhǐ shàng."],vi:["Bác sĩ nói lần cảm này không nghiêm trọng, uống thuốc đúng giờ là được.","Mẹ sợ tôi quên nên còn viết thời gian ra giấy."]},
  "2-2-出院":{zh:["爷爷明天就可以出院了。","大家听到这个消息以后都放心了很多。"],py:["Yé ye míng tiān jiù kě yǐ chū yuàn le.","Dà jiā tīng dào zhè ge xiāo xi yǐ hòu dōu fàng xīn le hěn duō."],vi:["Ông ngày mai là có thể xuất viện rồi.","Mọi người sau khi nghe tin này đều yên tâm hơn rất nhiều."]},
  "2-2-出":{zh:["外面雨下得很大，我们一时出不了门。","只好先坐在教室里等一会儿。"],py:["Wài mian yǔ xià de hěn dà, wǒ men yì shí chū bù liǎo mén.","Zhǐ hǎo xiān zuò zài jiào shì lǐ děng yí huìr."],vi:["Bên ngoài mưa rất to nên chúng tôi nhất thời chưa ra ngoài được.","Đành phải ngồi trong lớp đợi một lát đã."]},
  "2-2-高":{zh:["他比我高很多，所以在人群里特别容易看见。","每次活动的时候，我总能一下子找到他。"],py:["Tā bǐ wǒ gāo hěn duō, suǒ yǐ zài rén qún lǐ tè bié róng yì kàn jiàn.","Měi cì huó dòng de shí hou, wǒ zǒng néng yí xià zi zhǎo dào tā."],vi:["Cậu ấy cao hơn tôi rất nhiều nên trong đám đông rất dễ nhìn thấy.","Mỗi lần hoạt động, tôi luôn có thể tìm thấy cậu ấy ngay lập tức."]},
  "2-2-米":{zh:["我弟弟现在已经一米七了。","虽然年纪还不大，可是个子长得特别快。"],py:["Wǒ dì di xiàn zài yǐ jīng yì mǐ qī le.","Suī rán nián jì hái bú dà, kě shì gè zi zhǎng de tè bié kuài."],vi:["Em trai tôi bây giờ đã cao một mét bảy rồi.","Tuy vẫn còn nhỏ tuổi nhưng chiều cao tăng rất nhanh."]},
  "2-2-知道":{zh:["我早就知道你喜欢安静的地方。","所以今天才专门带你来这家小书店。"],py:["Wǒ zǎo jiù zhī dào nǐ xǐ huan ān jìng de dì fang.","Suǒ yǐ jīn tiān cái zhuān mén dài nǐ lái zhè jiā xiǎo shū diàn."],vi:["Tôi đã sớm biết bạn thích những nơi yên tĩnh.","Vì vậy hôm nay mới đặc biệt dẫn bạn đến hiệu sách nhỏ này."]},
  "2-2-休息":{zh:["你看起来有点儿累，先休息一下吧。","等喝完这杯水以后，我们再继续走。"],py:["Nǐ kàn qǐ lái yǒu diǎnr lèi, xiān xiū xi yí xià ba.","Děng hē wán zhè bēi shuǐ yǐ hòu, wǒ men zài jì xù zǒu."],vi:["Bạn trông có vẻ hơi mệt, nghỉ một chút trước đi.","Đợi uống xong cốc nước này rồi chúng ta đi tiếp."]},
  "2-2-忙":{zh:["我这几天特别忙，连周末都没有时间出去玩儿。","等考试结束以后，我一定要好好休息一下。"],py:["Wǒ zhè jǐ tiān tè bié máng, lián zhōu mò dōu méi yǒu shí jiān chū qù wánr.","Děng kǎo shì jié shù yǐ hòu, wǒ yí dìng yào hǎo hǎo xiū xi yí xià."],vi:["Mấy ngày nay tôi đặc biệt bận, đến cuối tuần cũng không có thời gian ra ngoài chơi.","Đợi thi xong rồi nhất định tôi sẽ nghỉ ngơi cho tử tế một chút."]},
  "2-2-时间":{zh:["你今天下午有时间吗？","如果有的话，我们一起去图书馆找资料吧。"],py:["Nǐ jīn tiān xià wǔ yǒu shí jiān ma?","Rú guǒ yǒu de huà, wǒ men yì qǐ qù tú shū guǎn zhǎo zī liào ba."],vi:["Chiều nay bạn có thời gian không?","Nếu có thì chúng ta cùng đi thư viện tìm tài liệu nhé."]},
  "2-3-手表":{zh:["这块手表是爸爸去年送给我的生日礼物。","虽然样子很简单，可是我一直很喜欢。"],py:["Zhè kuài shǒu biǎo shì bà ba qù nián sòng gěi wǒ de shēng rì lǐ wù.","Suī rán yàng zi hěn jiǎn dān, kě shì wǒ yì zhí hěn xǐ huan."],vi:["Chiếc đồng hồ đeo tay này là quà sinh nhật bố tặng tôi năm ngoái.","Tuy kiểu dáng rất đơn giản nhưng tôi luôn rất thích nó."]},
  "2-3-报纸":{zh:["爷爷每天早上吃完早饭以后都会看报纸。","他说这样可以知道外面发生了什么事。"],py:["Yé ye měi tiān zǎo shang chī wán zǎo fàn yǐ hòu dōu huì kàn bào zhǐ.","Tā shuō zhè yàng kě yǐ zhī dào wài mian fā shēng le shén me shì."],vi:["Ông tôi sáng nào ăn xong cũng đọc báo.","Ông nói làm vậy có thể biết bên ngoài xảy ra chuyện gì."]},
  "2-3-送":{zh:["明天是妹妹的生日，我想送她一本有意思的故事书。","她最近很喜欢看书，我觉得这个礼物会很适合。"],py:["Míng tiān shì mèi mei de shēng rì, wǒ xiǎng sòng tā yì běn yǒu yì si de gù shi shū.","Tā zuì jìn hěn xǐ huan kàn shū, wǒ jué de zhè ge lǐ wù huì hěn shì hé."],vi:["Ngày mai là sinh nhật em gái tôi, tôi muốn tặng em một cuốn truyện thú vị.","Gần đây em rất thích đọc sách nên tôi cảm thấy món quà này sẽ rất phù hợp."]},
  "2-3-一下":{zh:["你先坐一下，我去给你倒杯水。","路上走了这么久，你一定也累了。"],py:["Nǐ xiān zuò yí xià, wǒ qù gěi nǐ dào bēi shuǐ.","Lù shàng zǒu le zhè me jiǔ, nǐ yí dìng yě lèi le."],vi:["Bạn ngồi một chút trước đi, tôi đi rót cho bạn cốc nước.","Đi đường lâu như vậy chắc bạn cũng mệt rồi."]},
  "2-3-牛奶":{zh:["我每天早上都会先喝一杯牛奶。","妈妈说这样对身体比较好。"],py:["Wǒ měi tiān zǎo shang dōu huì xiān hē yì bēi niú nǎi.","Mā ma shuō zhè yàng duì shēn tǐ bǐ jiào hǎo."],vi:["Sáng nào tôi cũng uống một cốc sữa trước.","Mẹ nói làm vậy sẽ tốt hơn cho sức khỏe."]},
  "2-3-房间":{zh:["我的房间不大，可是很安静。","窗边放着一张书桌，所以我很喜欢在里面学习。"],py:["Wǒ de fáng jiān bú dà, kě shì hěn ān jìng.","Chuāng biān fàng zhe yì zhāng shū zhuō, suǒ yǐ wǒ hěn xǐ huan zài lǐ mian xué xí."],vi:["Phòng của tôi không lớn nhưng rất yên tĩnh.","Bên cửa sổ có đặt một cái bàn học nên tôi rất thích học ở trong đó."]},
  "2-3-丈夫":{zh:["她的丈夫在医院工作，平时很忙。","不过只要有空，他就会陪她一起去买菜。"],py:["Tā de zhàng fu zài yī yuàn gōng zuò, píng shí hěn máng.","Bú guò zhǐ yào yǒu kòng, tā jiù huì péi tā yì qǐ qù mǎi cài."],vi:["Chồng cô ấy làm việc ở bệnh viện nên bình thường rất bận.","Nhưng chỉ cần có thời gian, anh ấy sẽ đi chợ cùng cô ấy."]},
  "2-3-旁边":{zh:["学校旁边有一家小饭店，味道还不错。","下课以后，我们常常一起去那儿吃面条。"],py:["Xué xiào páng biān yǒu yì jiā xiǎo fàn diàn, wèi dào hái bú cuò.","Xià kè yǐ hòu, wǒ men cháng cháng yì qǐ qù nàr chī miàn tiáo."],vi:["Bên cạnh trường có một quán ăn nhỏ, hương vị cũng khá ổn.","Sau giờ học, chúng tôi thường cùng đến đó ăn mì."]},
  "2-3-真":{zh:["你今天真漂亮，这件衣服很适合你。","怪不得大家一见到你都说好看。"],py:["Nǐ jīn tiān zhēn piào liang, zhè jiàn yī fu hěn shì hé nǐ.","Guài bu de dà jiā yí jiàn dào nǐ dōu shuō hǎo kàn."],vi:["Hôm nay bạn thật đẹp, bộ đồ này rất hợp với bạn.","Bảo sao ai gặp bạn cũng khen đẹp."]},
  "2-3-颜色":{zh:["这件衣服的颜色我很喜欢。","看起来不太亮，可是穿起来很舒服。"],py:["Zhè jiàn yī fu de yán sè wǒ hěn xǐ huan.","Kàn qǐ lái bù tài liàng, kě shì chuān qǐ lái hěn shū fu."],vi:["Tôi rất thích màu của bộ quần áo này.","Nhìn thì không quá nổi nhưng mặc lên lại rất dễ chịu."]},
  "2-3-左边":{zh:["出了门以后一直往前走，商店就在左边。","如果还是找不到，你再给我打电话。"],py:["Chū le mén yǐ hòu yì zhí wǎng qián zǒu, shāng diàn jiù zài zuǒ biān.","Rú guǒ hái shì zhǎo bú dào, nǐ zài gěi wǒ dǎ diàn huà."],vi:["Ra khỏi cửa rồi cứ đi thẳng, cửa hàng sẽ ở bên trái.","Nếu vẫn không tìm thấy thì bạn lại gọi điện cho tôi."]},
  "2-3-红":{zh:["她今天穿了一条红裙子。","虽然很简单，可是在阳光下面特别好看。"],py:["Tā jīn tiān chuān le yì tiáo hóng qún zi.","Suī rán hěn jiǎn dān, kě shì zài yáng guāng xià mian tè bié hǎo kàn."],vi:["Hôm nay cô ấy mặc một chiếc váy đỏ.","Tuy rất đơn giản nhưng dưới ánh nắng trông cực kỳ đẹp."]},
  "2-4-生日":{zh:["下个星期就是我的生日了。","我不想办太大的聚会，只想跟好朋友一起吃饭。"],py:["Xià ge xīng qī jiù shì wǒ de shēng rì le.","Wǒ bù xiǎng bàn tài dà de jù huì, zhǐ xiǎng gēn hǎo péng you yì qǐ chī fàn."],vi:["Tuần sau là sinh nhật tôi rồi.","Tôi không muốn tổ chức tiệc quá lớn, chỉ muốn ăn cơm cùng bạn thân thôi."]},
  "2-4-快乐":{zh:["看到你这么快乐，我也觉得很高兴。","希望你以后每天都能像今天一样轻松。"],py:["Kàn dào nǐ zhè me kuài lè, wǒ yě jué de hěn gāo xìng.","Xī wàng nǐ yǐ hòu měi tiān dōu néng xiàng jīn tiān yí yàng qīng sōng."],vi:["Thấy bạn vui vẻ như vậy, tôi cũng cảm thấy rất vui.","Hy vọng sau này ngày nào bạn cũng có thể nhẹ nhõm như hôm nay."]},
