  "4-7-感情":{zh:["他们两个人的感情很好。","已经在一起五年了。"],py:["Tā men liǎng ge rén de gǎn qíng hěn hǎo.","Yǐ jīng zài yī qǐ wǔ nián le."],vi:["Tình cảm của hai người họ rất tốt.","Đã ở bên nhau năm năm rồi."]},
  "4-7-抽烟":{zh:["请不要在这里抽烟。","对别人的健康不好。"],py:["Qǐng bù yào zài zhè lǐ chōu yān.","Duì bié rén de jiàn kāng bù hǎo."],vi:["Xin đừng hút thuốc ở đây.","Không tốt cho sức khỏe người khác."]},
  "4-7-指":{zh:["他指着地图说这里是我们要去的地方。","看起来不太远。"],py:["Tā zhǐ zhe dì tú shuō zhè lǐ shì wǒ men yào qù de dì fāng.","Kàn qǐ lái bù tài yuǎn."],vi:["Anh ấy chỉ vào bản đồ nói đây là nơi chúng ta cần đến.","Trông không xa lắm."]},
  "4-7-掉":{zh:["手机从桌子上掉下来了。","幸好没有摔坏。"],py:["Shǒu jī cóng zhuō zi shàng diào xià lái le.","Xìng hǎo méi yǒu shuāi huài."],vi:["Điện thoại rơi từ bàn xuống.","May mắn không bị hỏng."]},
  "4-7-擦":{zh:["桌子太脏了，我用布擦了擦。","现在看起来干净多了。"],py:["Zhuō zi tài zāng le, wǒ yòng bù cā le cā.","Xiàn zài kàn qǐ lái gān jìng duō le."],vi:["Bàn bẩn quá, tôi dùng khăn lau một chút.","Bây giờ trông sạch hơn nhiều rồi."]},
  "4-7-教授":{zh:["这位教授讲课讲得很有趣。","学生们都很喜欢上他的课。"],py:["Zhè wèi jiào shòu jiǎng kè jiǎng de hěn yǒu qù.","Xué shēng men dōu hěn xǐ huān shàng tā de kè."],vi:["Vị giáo sư này giảng bài rất thú vị.","Sinh viên đều rất thích học lớp của ông ấy."]},
  "4-7-散步":{zh:["吃完晚饭，我们去散步吧。","河边的风景很不错。"],py:["Chī wán wǎn fàn, wǒ men qù sàn bù ba.","Hé biān de fēng jǐng hěn bù cuò."],vi:["Ăn xong cơm tối, chúng ta đi bộ đi.","Phong cảnh bên sông rất đẹp."]},
  "4-7-数字":{zh:["请你把这些数字加起来。","我算了两遍，答案是一百。"],py:["Qǐng nǐ bǎ zhè xiē shù zì jiā qǐ lái.","Wǒ suàn le liǎng biàn, dá àn shì yī bǎi."],vi:["Hãy cộng các con số này lại.","Tôi tính hai lần, đáp án là một trăm."]},
  "4-7-既":{zh:["这道菜既好吃又好看。","大家都想学怎么做。"],py:["Zhè dào cài jì hǎo chī yòu hǎo kàn.","Dà jiā dōu xiǎng xué zěn me zuò."],vi:["Món này vừa ngon vừa đẹp.","Mọi người đều muốn học cách làm."]},
  "4-7-来不及":{zh:["已经八点了，来不及吃早饭了。","我拿了面包就跑出去了。"],py:["Yǐ jīng bā diǎn le, lái bù jí chī zǎo fàn le.","Wǒ ná le miàn bāo jiù pǎo chū qù le."],vi:["Đã tám giờ rồi, không kịp ăn sáng nữa.","Tôi cầm bánh mì rồi chạy ra ngoài."]},
  "4-7-植物":{zh:["她的办公室里养了很多植物。","绿色的叶子让人感到放松。"],py:["Tā de bàn gōng shì lǐ yǎng le hěn duō zhí wù.","Lǜ sè de yè zi ràng rén gǎn dào fàng sōng."],vi:["Văn phòng cô ấy trồng rất nhiều cây.","Lá xanh khiến người ta cảm thấy thư giãn."]},
  "4-7-气候":{zh:["这个城市的气候四季如春。","所以很多人喜欢来这里生活。"],py:["Zhè ge chéng shì de qì hòu sì jì rú chūn.","Suǒ yǐ hěn duō rén xǐ huān lái zhè lǐ shēng huó."],vi:["Khí hậu thành phố này bốn mùa như xuân.","Vì vậy nhiều người thích đến đây sống."]},
  "4-7-流血":{zh:["他摔倒了，膝盖流血了。","赶快用纸巾擦一下吧。"],py:["Tā shuāi dǎo le, xī gài liú xiě le.","Gǎn kuài yòng zhǐ jīn cā yī xià ba."],vi:["Anh ấy ngã, đầu gối chảy máu rồi.","Mau dùng khăn giấy lau đi."]},
  "4-7-烦恼":{zh:["最近她有很多烦恼。","我们应该多关心她。"],py:["Zuì jìn tā yǒu hěn duō fán nǎo.","Wǒ men yīng gāi duō guān xīn tā."],vi:["Gần đây cô ấy có nhiều phiền muộn.","Chúng ta nên quan tâm cô ấy nhiều hơn."]},
  "4-7-研究":{zh:["他正在研究中国历史。","已经写了两篇论文了。"],py:["Tā zhèng zài yán jiū Zhōng guó lì shǐ.","Yǐ jīng xiě le liǎng piān lùn wén le."],vi:["Anh ấy đang nghiên cứu lịch sử Trung Quốc.","Đã viết được hai bài luận văn rồi."]},
  "4-7-空气":{zh:["早上公园的空气特别好。","很多老人在那里锻炼身体。"],py:["Zǎo shàng gōng yuán de kōng qì tè bié hǎo.","Hěn duō lǎo rén zài nà lǐ duàn liàn shēn tǐ."],vi:["Buổi sáng không khí ở công viên đặc biệt tốt.","Nhiều người già ở đó tập thể dục."]},
  "4-7-窗户":{zh:["今天天气很好，把窗户打开吧。","外面的空气特别新鲜。"],py:["Jīn tiān tiān qì hěn hǎo, bǎ chuāng hù dǎ kāi ba.","Wài miàn de kōng qì tè bié xīn xiān."],vi:["Hôm nay thời tiết rất đẹp, mở cửa sổ đi.","Không khí bên ngoài đặc biệt trong lành."]},
  "4-7-精神":{zh:["昨晚睡得好，今天精神很好。","工作效率也提高了不少。"],py:["Zuó wǎn shuì de hǎo, jīn tiān jīng shén hěn hǎo.","Gōng zuò xiào lǜ yě tí gāo le bù shǎo."],vi:["Tối qua ngủ ngon, hôm nay tinh thần rất tốt.","Hiệu quả công việc cũng tăng không ít."]},
  "4-7-肚子":{zh:["我肚子好饿，我们去吃饭吧。","附近有一家面馆很好吃。"],py:["Wǒ dù zi hǎo è, wǒ men qù chī fàn ba.","Fù jìn yǒu yī jiā miàn guǎn hěn hǎo chī."],vi:["Bụng tôi đói quá, chúng ta đi ăn đi.","Gần đây có một quán mì rất ngon."]},
  "4-7-要是":{zh:["要是明天不下雨，我们就去爬山。","你想不想一起去？"],py:["Yào shì míng tiān bù xià yǔ, wǒ men jiù qù pá shān.","Nǐ xiǎng bù xiǎng yī qǐ qù?"],vi:["Nếu ngày mai không mưa, chúng ta sẽ đi leo núi.","Bạn có muốn đi cùng không?"]},
  "4-7-说明":{zh:["他的成功说明努力很重要。","天赋不是唯一的条件。"],py:["Tā de chéng gōng shuō míng nǔ lì hěn zhòng yào.","Tiān fù bù shì wéi yī de tiáo jiàn."],vi:["Sự thành công của anh ấy cho thấy nỗ lực rất quan trọng.","Thiên phú không phải điều kiện duy nhất."]},
  "4-7-超过":{zh:["这次考试他的成绩超过了全班同学。","大家都觉得很厉害。"],py:["Zhè cì kǎo shì tā de chéng jì chāo guò le quán bān tóng xué.","Dà jiā dōu jué de hěn lì hài."],vi:["Lần thi này thành tích anh ấy vượt qua cả lớp.","Mọi người đều thấy rất giỏi."]},
  "4-7-辛苦":{zh:["妈妈每天工作很辛苦。","我想帮她多做些家务。"],py:["Mā mā měi tiān gōng zuò hěn xīn kǔ.","Wǒ xiǎng bāng tā duō zuò xiē jiā wù."],vi:["Mẹ mỗi ngày làm việc rất vất vả.","Tôi muốn giúp mẹ làm thêm việc nhà."]},
  "4-8-亲戚":{zh:["过年的时候，很多亲戚来我家。","大家一起吃饭聊天，非常热闹。"],py:["Guò nián de shí hòu, hěn duō qīn qī lái wǒ jiā.","Dà jiā yī qǐ chī fàn liáo tiān, fēi cháng rè nào."],vi:["Khi ăn Tết, nhiều người thân đến nhà tôi.","Mọi người cùng ăn cơm nói chuyện, rất vui."]},
  "4-8-伤心":{zh:["听到这个消息，她很伤心。","朋友们都来安慰她。"],py:["Tīng dào zhè ge xiāo xī, tā hěn shāng xīn.","Péng yǒu men dōu lái ān wèi tā."],vi:["Nghe tin này, cô ấy rất đau lòng.","Bạn bè đều đến an ủi cô ấy."]},
  "4-8-使":{zh:["这首歌使我想起了大学时代。","那时候的生活真的很美好。"],py:["Zhè shǒu gē shǐ wǒ xiǎng qǐ le dà xué shí dài.","Nà shí hòu de shēng huó zhēn de hěn měi hǎo."],vi:["Bài hát này khiến tôi nhớ lại thời đại học.","Cuộc sống lúc đó thực sự rất đẹp."]},
  "4-8-到处":{zh:["春天到了，到处都是花。","空气里都是花的香味。"],py:["Chūn tiān dào le, dào chù dōu shì huā.","Kōng qì lǐ dōu shì huā de xiāng wèi."],vi:["Mùa xuân đến, khắp nơi đều là hoa.","Không khí đều là hương thơm của hoa."]},
  "4-8-压力":{zh:["最近工作压力太大了。","周末我想去爬山放松一下。"],py:["Zuì jìn gōng zuò yā lì tài dà le.","Zhōu mò wǒ xiǎng qù pá shān fàng sōng yī xià."],vi:["Gần đây áp lực công việc quá lớn.","Cuối tuần tôi muốn đi leo núi thư giãn."]},
  "4-8-发生":{zh:["昨天路上发生了一起交通事故。","幸好没有人受伤。"],py:["Zuó tiān lù shàng fā shēng le yī qǐ jiāo tōng shì gù.","Xìng hǎo méi yǒu rén shòu shāng."],vi:["Hôm qua trên đường xảy ra một vụ tai nạn giao thông.","May mắn không ai bị thương."]},
  "4-8-只要":{zh:["只要你努力，就一定会成功。","不要轻易放弃。"],py:["Zhǐ yào nǐ nǔ lì, jiù yī dìng huì chéng gōng.","Bù yào qīng yì fàng qì."],vi:["Chỉ cần bạn nỗ lực, nhất định sẽ thành công.","Đừng dễ dàng bỏ cuộc."]},
  "4-8-回忆":{zh:["看到老照片，我回忆起小时候。","那些日子真让人怀念。"],py:["Kàn dào lǎo zhào piàn, wǒ huí yì qǐ xiǎo shí hòu.","Nà xiē rì zi zhēn ràng rén huái niàn."],vi:["Nhìn ảnh cũ, tôi nhớ lại thời nhỏ.","Những ngày đó thật đáng nhớ."]},
  "4-8-因此":{zh:["他每天都坚持锻炼，因此身体很健康。","很少生病。"],py:["Tā měi tiān dōu jiān chí duàn liàn, yīn cǐ shēn tǐ hěn jiàn kāng.","Hěn shǎo shēng bìng."],vi:["Anh ấy mỗi ngày đều kiên trì tập luyện, vì vậy cơ thể rất khỏe mạnh.","Rất ít khi bị bệnh."]},
  "4-8-堵车":{zh:["早上上班的时候总是堵车。","所以我决定坐地铁去。"],py:["Zǎo shàng shàng bān de shí hòu zǒng shì dǔ chē.","Suǒ yǐ wǒ jué dìng zuò dì tiě qù."],vi:["Buổi sáng đi làm lúc nào cũng tắc đường.","Vì vậy tôi quyết định đi tàu điện ngầm."]},
  "4-8-大使馆":{zh:["我去大使馆办签证。","排了两个小时的队。"],py:["Wǒ qù dà shǐ guǎn bàn qiān zhèng.","Pái le liǎng ge xiǎo shí de duì."],vi:["Tôi đến đại sứ quán làm visa.","Xếp hàng hai tiếng đồng hồ."]},
  "4-8-巧克力":{zh:["情人节他送了我一盒巧克力。","每一颗都特别好吃。"],py:["Qíng rén jié tā sòng le wǒ yī hé qiǎo kè lì.","Měi yī kē dōu tè bié hǎo chī."],vi:["Ngày Valentine anh ấy tặng tôi một hộp sô-cô-la.","Mỗi viên đều đặc biệt ngon."]},
  "4-8-师傅":{zh:["师傅，请问去火车站怎么走？","一直走，第二个路口右转就到了。"],py:["Shī fù, qǐng wèn qù huǒ chē zhàn zěn me zǒu?","Yī zhí zǒu, dì èr ge lù kǒu yòu zhuǎn jiù dào le."],vi:["Bác ơi, xin hỏi đi ga tàu đi đường nào?","Đi thẳng, ngã tư thứ hai rẽ phải là đến."]},
  "4-8-往往":{zh:["成功的人往往比别人更努力。","他们不怕吃苦。"],py:["Chéng gōng de rén wǎng wǎng bǐ bié rén gèng nǔ lì.","Tā men bù pà chī kǔ."],vi:["Người thành công thường nỗ lực hơn người khác.","Họ không sợ khổ."]},
  "4-8-心情":{zh:["今天天气好，我的心情也很好。","决定出去逛逛街。"],py:["Jīn tiān tiān qì hǎo, wǒ de xīn qíng yě hěn hǎo.","Jué dìng chū qù guàng guàng jiē."],vi:["Hôm nay thời tiết đẹp, tâm trạng tôi cũng rất tốt.","Quyết định ra ngoài đi dạo phố."]},
  "4-8-态度":{zh:["他对工作的态度非常认真。","所以领导很信任他。"],py:["Tā duì gōng zuò de tài dù fēi cháng rèn zhēn.","Suǒ yǐ lǐng dǎo hěn xìn rèn tā."],vi:["Thái độ làm việc của anh ấy rất nghiêm túc.","Vì vậy lãnh đạo rất tin tưởng anh ấy."]},
  "4-8-愉快":{zh:["祝你假期愉快！","谢谢，你也一样！"],py:["Zhù nǐ jià qī yú kuài!","Xiè xiè, nǐ yě yī yàng!"],vi:["Chúc bạn kỳ nghỉ vui vẻ!","Cảm ơn, bạn cũng vậy!"]},
  "4-8-成为":{zh:["她从小就想成为一名医生。","现在她终于实现了梦想。"],py:["Tā cóng xiǎo jiù xiǎng chéng wéi yī míng yī shēng.","Xiàn zài tā zhōng yú shí xiàn le mèng xiǎng."],vi:["Cô ấy từ nhỏ đã muốn trở thành bác sĩ.","Bây giờ cô ấy cuối cùng đã thực hiện ước mơ."]},
  "4-8-放松":{zh:["工作了一天，我想放松一下。","听听音乐，看看电影。"],py:["Gōng zuò le yī tiān, wǒ xiǎng fàng sōng yī xià.","Tīng tīng yīn yuè, kàn kàn diàn yǐng."],vi:["Làm việc cả ngày, tôi muốn thư giãn một chút.","Nghe nhạc, xem phim."]},
  "4-8-景色":{zh:["山上的景色美极了。","我拍了很多照片发给朋友。"],py:["Shān shàng de jǐng sè měi jí le.","Wǒ pāi le hěn duō zhào piàn fā gěi péng yǒu."],vi:["Phong cảnh trên núi đẹp cực kỳ.","Tôi chụp nhiều ảnh gửi cho bạn bè."]},
  "4-8-特点":{zh:["这个地方的特点是夏天不热。","所以很多人来这里避暑。"],py:["Zhè ge dì fāng de tè diǎn shì xià tiān bù rè.","Suǒ yǐ hěn duō rén lái zhè lǐ bì shǔ."],vi:["Đặc điểm của nơi này là mùa hè không nóng.","Vì vậy nhiều người đến đây tránh nóng."]},
  "4-8-生命":{zh:["生命是最宝贵的东西。","我们应该好好珍惜每一天。"],py:["Shēng mìng shì zuì bǎo guì de dōng xī.","Wǒ men yīng gāi hǎo hǎo zhēn xī měi yī tiān."],vi:["Sinh mạng là thứ quý giá nhất.","Chúng ta nên trân trọng mỗi ngày."]},
  "4-8-科学":{zh:["孩子们对科学很感兴趣。","周末我带他们去了科技馆。"],py:["Hái zi men duì kē xué hěn gǎn xìng qù.","Zhōu mò wǒ dài tā men qù le kē jì guǎn."],vi:["Bọn trẻ rất hứng thú với khoa học.","Cuối tuần tôi đưa chúng đi bảo tàng khoa học."]},
  "4-8-积极":{zh:["他学习态度很积极。","老师经常表扬他。"],py:["Tā xué xí tài dù hěn jī jí.","Lǎo shī jīng cháng biǎo yáng tā."],vi:["Thái độ học tập của anh ấy rất tích cực.","Thầy giáo thường xuyên khen anh ấy."]},
  "4-8-缺少":{zh:["这个计划缺少一些重要的细节。","我们需要再讨论一下。"],py:["Zhè ge jì huà quē shǎo yī xiē zhòng yào de xì jié.","Wǒ men xū yào zài tǎo lùn yī xià."],vi:["Kế hoạch này thiếu một số chi tiết quan trọng.","Chúng ta cần thảo luận thêm."]},
  "4-8-耐心":{zh:["教孩子写字需要很大的耐心。","不能着急，要慢慢来。"],py:["Jiāo hái zi xiě zì xū yào hěn dà de nài xīn.","Bù néng zháo jí, yào màn màn lái."],vi:["Dạy trẻ viết chữ cần rất nhiều kiên nhẫn.","Không thể vội, phải từ từ thôi."]},
  "4-8-证明":{zh:["事实证明他是对的。","我们都应该向他道歉。"],py:["Shì shí zhèng míng tā shì duì de.","Wǒ men dōu yīng gāi xiàng tā dào qiàn."],vi:["Sự thật chứng minh anh ấy đúng.","Chúng ta đều nên xin lỗi anh ấy."]},
  "4-8-距离":{zh:["我家距离公司不太远。","骑自行车大概二十分钟。"],py:["Wǒ jiā jù lí gōng sī bù tài yuǎn.","Qí zì xíng chē dà gài èr shí fēn zhōng."],vi:["Nhà tôi cách công ty không xa lắm.","Đi xe đạp khoảng hai mươi phút."]},
  "4-8-阳光":{zh:["今天阳光很好，适合出去走走。","我们去公园散步吧。"],py:["Jīn tiān yáng guāng hěn hǎo, shì hé chū qù zǒu zǒu.","Wǒ men qù gōng yuán sàn bù ba."],vi:["Hôm nay ánh nắng rất đẹp, thích hợp ra ngoài đi dạo.","Chúng ta đi công viên đi bộ đi."]},
  "4-9-主意":{zh:["你想到了什么好主意？","我们可以一起去旅游。"],py:["Nǐ xiǎng dào le shénme hǎo zhǔyi?","Wǒmen kěyǐ yìqǐ qù lǚyóu."],vi:["Bạn nghĩ ra ý kiến hay gì vậy?","Chúng ta có thể cùng đi du lịch."]},
  "4-9-作家":{zh:["他是一位很有名的作家。","写了很多大家都喜欢的小说。"],py:["Tā shì yí wèi hěn yǒumíng de zuòjiā.","Xiě le hěn duō dàjiā dōu xǐhuan de xiǎoshuō."],vi:["Anh ấy là một nhà văn rất nổi tiếng.","Đã viết rất nhiều tiểu thuyết mọi người đều thích."]},
  "4-9-勇敢":{zh:["那个小男孩非常勇敢。","一个人走进了黑黑的房间。"],py:["Nà gè xiǎo nánhái fēicháng yǒnggǎn.","Yí gè rén zǒujìn le hēihēi de fángjiān."],vi:["Cậu bé đó rất can đảm.","Một mình đi vào căn phòng tối."]},
  "4-9-区别":{zh:["这两个字看起来很像。","你能说说它们的区别吗？"],py:["Zhè liǎng gè zì kàn qǐlái hěn xiàng.","Nǐ néng shuōshuo tāmen de qūbié ma?"],vi:["Hai chữ này trông rất giống nhau.","Bạn có thể nói về sự khác biệt của chúng không?"]},
  "4-9-取":{zh:["我去银行取了一些钱。","然后买了一件新衣服。"],py:["Wǒ qù yínháng qǔ le yìxiē qián.","Ránhòu mǎi le yí jiàn xīn yīfu."],vi:["Tôi đến ngân hàng rút một ít tiền.","Sau đó mua một bộ quần áo mới."]},
  "4-9-可是":{zh:["我很想去旅游，可是没时间。","等放假以后再说吧。"],py:["Wǒ hěn xiǎng qù lǚyóu, kěshì méi shíjiān.","Děng fàngjià yǐhòu zàishuō ba."],vi:["Tôi rất muốn đi du lịch, nhưng không có thời gian.","Đợi nghỉ phép rồi tính sau."]},
  "4-9-国际":{zh:["这是一个国际会议。","来了很多国家的人。"],py:["Zhè shì yí gè guójì huìyì.","Lái le hěn duō guójiā de rén."],vi:["Đây là một hội nghị quốc tế.","Có rất nhiều người từ các nước đến."]},
  "4-9-坚持":{zh:["学中文要坚持每天练习。","只要不放弃，一定会进步。"],py:["Xué Zhōngwén yào jiānchí měi tiān liànxí.","Zhǐyào bú fàngqì, yídìng huì jìnbù."],vi:["Học tiếng Trung cần kiên trì luyện tập mỗi ngày.","Chỉ cần không bỏ cuộc, nhất định sẽ tiến bộ."]},
  "4-9-失败":{zh:["虽然这次失败了，但别灰心。","下次一定会做得更好。"],py:["Suīrán zhè cì shībài le, dàn bié huīxīn.","Xià cì yídìng huì zuò de gèng hǎo."],vi:["Tuy lần này thất bại, nhưng đừng nản lòng.","Lần sau nhất định sẽ làm tốt hơn."]},
  "4-9-当时":{zh:["当时我还是个小孩子。","什么都不太懂。"],py:["Dāngshí wǒ háishi gè xiǎo háizi.","Shénme dōu bú tài dǒng."],vi:["Lúc đó tôi vẫn còn là một đứa trẻ.","Cái gì cũng không hiểu lắm."]},
  "4-9-得":{zh:["他跑得非常快。","大家都追不上他。"],py:["Tā pǎo de fēicháng kuài.","Dàjiā dōu zhuī bú shàng tā."],vi:["Anh ấy chạy rất nhanh.","Mọi người đều đuổi không kịp."]},
  "4-9-总结":{zh:["老师让我们总结这课的内容。","我写了满满一页纸。"],py:["Lǎoshī ràng wǒmen zǒngjié zhè kè de nèiróng.","Wǒ xiě le mǎnmǎn yí yè zhǐ."],vi:["Thầy bảo chúng tôi tổng kết nội dung bài này.","Tôi viết đầy một trang giấy."]},
  "4-9-放弃":{zh:["这道题太难了，我想放弃。","可是老师说再试一次。"],py:["Zhè dào tí tài nán le, wǒ xiǎng fàngqì.","Kěshì lǎoshī shuō zài shì yí cì."],vi:["Bài này khó quá, tôi muốn bỏ cuộc.","Nhưng thầy nói hãy thử thêm một lần nữa."]},
  "4-9-暂时":{zh:["这个问题暂时没有答案。","我们以后再讨论吧。"],py:["Zhè gè wèntí zànshí méiyǒu dá'àn.","Wǒmen yǐhòu zài tǎolùn ba."],vi:["Vấn đề này tạm thời chưa có đáp án.","Chúng ta sau này thảo luận tiếp nhé."]},
  "4-9-正确":{zh:["请选择正确的答案。","每道题只有一个对的。"],py:["Qǐng xuǎnzé zhèngquè de dá'àn.","Měi dào tí zhǐyǒu yí gè duì de."],vi:["Xin chọn đáp án chính xác.","Mỗi câu chỉ có một đáp án đúng."]},
  "4-9-汗":{zh:["跑步以后出了很多汗。","赶快喝点儿水吧。"],py:["Pǎobù yǐhòu chū le hěn duō hàn.","Gǎnkuài hē diǎnr shuǐ ba."],vi:["Sau khi chạy bộ ra rất nhiều mồ hôi.","Nhanh uống chút nước đi."]},
  "4-9-理想":{zh:["她的理想是当一名医生。","所以现在学习非常努力。"],py:["Tā de lǐxiǎng shì dāng yì míng yīshēng.","Suǒyǐ xiànzài xuéxí fēicháng nǔlì."],vi:["Lý tưởng của cô ấy là trở thành bác sĩ.","Nên bây giờ học rất chăm chỉ."]},
  "4-9-篇":{zh:["老师让我们写一篇作文。","题目是《我的梦想》。"],py:["Lǎoshī ràng wǒmen xiě yì piān zuòwén.","Tímù shì 'Wǒ de mèngxiǎng'."],vi:["Thầy bảo chúng tôi viết một bài luận.","Đề bài là 'Ước mơ của tôi'."]},
  "4-9-经历":{zh:["这次旅行是难忘的经历。","我认识了很多新朋友。"],py:["Zhè cì lǚxíng shì nánwàng de jīnglì.","Wǒ rènshi le hěn duō xīn péngyou."],vi:["Chuyến du lịch này là trải nghiệm khó quên.","Tôi quen biết rất nhiều bạn mới."]},
  "4-9-结果":{zh:["他准备了很长时间。","结果考了全班第一名。"],py:["Tā zhǔnbèi le hěn cháng shíjiān.","Jiéguǒ kǎo le quán bān dì yī míng."],vi:["Anh ấy chuẩn bị rất lâu.","Kết quả thi đứng nhất cả lớp."]},
  "4-9-网球":{zh:["周末我喜欢打网球。","运动让身体更健康。"],py:["Zhōumò wǒ xǐhuan dǎ wǎngqiú.","Yùndòng ràng shēntǐ gèng jiànkāng."],vi:["Cuối tuần tôi thích chơi tennis.","Vận động giúp cơ thể khỏe mạnh hơn."]},
  "4-9-至少":{zh:["每天至少要喝八杯水。","这样对身体很好。"],py:["Měi tiān zhìshǎo yào hē bā bēi shuǐ.","Zhèyàng duì shēntǐ hěn hǎo."],vi:["Mỗi ngày ít nhất phải uống tám cốc nước.","Như vậy rất tốt cho sức khỏe."]},
  "4-9-许多":{zh:["城市里有许多高楼。","晚上看起来非常漂亮。"],py:["Chéngshì lǐ yǒu xǔduō gāolóu.","Wǎnshang kàn qǐlái fēicháng piàoliang."],vi:["Trong thành phố có rất nhiều tòa nhà cao.","Buổi tối trông rất đẹp."]},
  "4-9-赢":{zh:["我们队终于赢了比赛。","大家高兴地跳了起来。"],py:["Wǒmen duì zhōngyú yíng le bǐsài.","Dàjiā gāoxìng de tiào le qǐlái."],vi:["Đội chúng tôi cuối cùng cũng thắng trận đấu.","Mọi người vui mừng nhảy lên."]},
  "4-9-轻松":{zh:["考试结束了，心情很轻松。","今晚可以好好休息了。"],py:["Kǎoshì jiéshù le, xīnqíng hěn qīngsōng.","Jīn wǎn kěyǐ hǎohǎo xiūxi le."],vi:["Thi xong rồi, tâm trạng rất thoải mái.","Tối nay có thể nghỉ ngơi thoải mái rồi."]},
  "4-9-过程":{zh:["学习的过程比结果更重要。","每一步都让你成长。"],py:["Xuéxí de guòchéng bǐ jiéguǒ gèng zhòngyào.","Měi yí bù dōu ràng nǐ chéngzhǎng."],vi:["Quá trình học quan trọng hơn kết quả.","Mỗi bước đều giúp bạn trưởng thành."]},
  "4-9-通过":{zh:["他通过了HSK四级考试。","全家人都为他高兴。"],py:["Tā tōngguò le HSK sì jí kǎoshì.","Quánjiā rén dōu wèi tā gāoxìng."],vi:["Anh ấy đã vượt qua kỳ thi HSK cấp 4.","Cả gia đình đều vui mừng cho anh ấy."]},
  "4-9-随便":{zh:["你想吃什么？随便吧。","那我们就去吃面条。"],py:["Nǐ xiǎng chī shénme? Suíbiàn ba.","Nà wǒmen jiù qù chī miàntiáo."],vi:["Bạn muốn ăn gì? Tùy ý thôi.","Vậy chúng ta đi ăn mì đi."]},
  "4-9-难道":{zh:["难道你不知道明天考试吗？","我告诉你好几次了。"],py:["Nándào nǐ bù zhīdào míngtiān kǎoshì ma?","Wǒ gàosu nǐ hǎo jǐ cì le."],vi:["Chẳng lẽ bạn không biết ngày mai thi sao?","Tôi đã nói với bạn mấy lần rồi."]},
  "4-9-面对":{zh:["面对困难不要害怕。","办法总比问题多。"],py:["Miànduì kùnnan búyào hàipà.","Bànfǎ zǒng bǐ wèntí duō."],vi:["Đối mặt khó khăn đừng sợ hãi.","Cách giải quyết luôn nhiều hơn vấn đề."]},
  "4-9-饼干":{zh:["妈妈买了很多饼干。","我们边吃边看电视。"],py:["Māma mǎi le hěn duō bǐng gān.","Wǒ men biān chī biān kàn diàn shì."],vi:["Mẹ mua rất nhiều bánh quy.","Chúng tôi vừa ăn vừa xem tivi."]},
  "4-10-不过":{zh:["这家饭馆的菜很好吃。","不过价格有点儿贵。"],py:["Zhè jiā fànguǎn de cài hěn hǎochī.","Búguò jiàgé yǒudiǎnr guì."],vi:["Nhà hàng này nấu ăn rất ngon.","Tuy nhiên giá hơi đắt."]},
  "4-10-优秀":{zh:["他是一个很优秀的学生。","每次考试都是第一名。"],py:["Tā shì yí gè hěn yōuxiù de xuéshēng.","Měi cì kǎoshì dōu shì dì yī míng."],vi:["Anh ấy là một học sinh rất xuất sắc.","Mỗi lần thi đều đứng thứ nhất."]},
  "4-10-低":{zh:["今天气温很低，只有五度。","出门要穿厚衣服。"],py:["Jīntiān qìwēn hěn dī, zhǐyǒu wǔ dù.","Chūmén yào chuān hòu yīfu."],vi:["Hôm nay nhiệt độ rất thấp, chỉ có năm độ.","Ra ngoài phải mặc áo dày."]},
  "4-10-关键":{zh:["学好中文的关键是多练习。","光看书是不够的。"],py:["Xué hǎo Zhōngwén de guānjiàn shì duō liànxí.","Guāng kàn shū shì búgòu de."],vi:["Mấu chốt để học giỏi tiếng Trung là luyện tập nhiều.","Chỉ đọc sách thôi là không đủ."]},
  "4-10-兴奋":{zh:["听到好消息，他很兴奋。","高兴得一晚上没睡着。"],py:["Tīng dào hǎo xiāoxi, tā hěn xīngfèn.","Gāoxìng de yí wǎnshang méi shuìzháo."],vi:["Nghe được tin tốt, anh ấy rất phấn khích.","Vui đến nỗi cả đêm không ngủ được."]},
  "4-10-发展":{zh:["这个城市发展得很快。","到处都在建新的大楼。"],py:["Zhè gè chéngshì fāzhǎn de hěn kuài.","Dàochù dōu zài jiàn xīn de dàlóu."],vi:["Thành phố này phát triển rất nhanh.","Khắp nơi đều đang xây tòa nhà mới."]},
  "4-10-困":{zh:["昨晚睡太晚，今天很困。","上课差点儿睡着了。"],py:["Zuówǎn shuì tài wǎn, jīntiān hěn kùn.","Shàngkè chàdiǎnr shuìzháo le."],vi:["Tối qua ngủ muộn quá, hôm nay rất buồn ngủ.","Lúc lên lớp suýt chút nữa ngủ gật."]},
  "4-10-富":{zh:["他虽然很富，但生活很朴素。","从来不买太贵的东西。"],py:["Tā suīrán hěn fù, dàn shēnghuó hěn pǔsù.","Cónglái bù mǎi tài guì de dōngxi."],vi:["Anh ấy tuy rất giàu nhưng sống rất giản dị.","Chưa bao giờ mua đồ quá đắt."]},
  "4-10-将来":{zh:["将来我想去中国留学。","在那里学中文和文化。"],py:["Jiānglái wǒ xiǎng qù Zhōngguó liúxué.","Zài nàlǐ xué Zhōngwén hé wénhuà."],vi:["Tương lai tôi muốn đi du học Trung Quốc.","Ở đó học tiếng Trung và văn hóa."]},
  "4-10-建议":{zh:["医生建议他多运动。","每天走路半小时就够了。"],py:["Yīshēng jiànyì tā duō yùndòng.","Měi tiān zǒulù bàn xiǎoshí jiù gòu le."],vi:["Bác sĩ khuyên anh ấy tập thể dục nhiều hơn.","Mỗi ngày đi bộ nửa tiếng là đủ rồi."]},
  "4-10-拉":{zh:["他拉着妈妈的手过马路。","妈妈让他注意安全。"],py:["Tā lā zhe māma de shǒu guò mǎlù.","Māma ràng tā zhùyì ānquán."],vi:["Cậu bé nắm tay mẹ qua đường.","Mẹ dặn cậu chú ý an toàn."]},
  "4-10-方向":{zh:["你走错方向了。","应该往左拐，不是往右。"],py:["Nǐ zǒu cuò fāngxiàng le.","Yīnggāi wǎng zuǒ guǎi, búshì wǎng yòu."],vi:["Bạn đi sai hướng rồi.","Nên rẽ trái, không phải rẽ phải."]},
  "4-10-条件":{zh:["这个工作的条件很好。","工资高，假期也多。"],py:["Zhè gè gōngzuò de tiáojiàn hěn hǎo.","Gōngzī gāo, jiàqī yě duō."],vi:["Điều kiện của công việc này rất tốt.","Lương cao, kỳ nghỉ cũng nhiều."]},
  "4-10-橡皮":{zh:["我写错了，你有橡皮吗？","给你，用完了还给我。"],py:["Wǒ xiě cuò le, nǐ yǒu xiàngpí ma?","Gěi nǐ, yòng wán le huán gěi wǒ."],vi:["Tôi viết nhầm rồi, bạn có cục tẩy không?","Đây, dùng xong trả lại cho tôi."]},
  "4-10-母亲":{zh:["母亲节那天，我送了妈妈花。","她笑得像花一样美。"],py:["Mǔqīn jié nà tiān, wǒ sòng le māma huā.","Tā xiào de xiàng huā yíyàng měi."],vi:["Ngày lễ Mẫu thân, tôi tặng mẹ hoa.","Mẹ cười đẹp như hoa vậy."]},
  "4-10-比如":{zh:["中国有很多好吃的，比如饺子。","你一定要尝一尝。"],py:["Zhōngguó yǒu hěn duō hǎochī de, bǐrú jiǎozi.","Nǐ yídìng yào cháng yi cháng."],vi:["Trung Quốc có rất nhiều món ngon, ví dụ như sủi cảo.","Bạn nhất định phải thử nhé."]},
  "4-10-永远":{zh:["我会永远记住你的帮助。","谢谢你做的一切。"],py:["Wǒ huì yǒngyuǎn jìzhù nǐ de bāngzhù.","Xièxie nǐ zuò de yíqiè."],vi:["Tôi sẽ mãi mãi nhớ sự giúp đỡ của bạn.","Cảm ơn bạn vì tất cả."]},
  "4-10-由于":{zh:["由于天气不好，航班取消了。","我们只好改签明天的。"],py:["Yóuyú tiānqì bù hǎo, hángbān qǔxiāo le.","Wǒmen zhǐhǎo gǎiqiān míngtiān de."],vi:["Do thời tiết xấu, chuyến bay bị hủy.","Chúng tôi đành phải đổi sang chuyến ngày mai."]},
  "4-10-硕士":{zh:["她明年能拿到硕士学位了。","毕业后想去大公司工作。"],py:["Tā míngnián néng nádào shuòshì xuéwèi le.","Bìyè hòu xiǎng qù dà gōngsī gōngzuò."],vi:["Năm sau cô ấy sẽ lấy được bằng thạc sĩ.","Sau tốt nghiệp muốn đến công ty lớn làm việc."]},
  "4-10-确实":{zh:["这道菜确实很好吃。","难怪这么多人排队。"],py:["Zhè dào cài quèshí hěn hǎochī.","Nánguài zhème duō rén páiduì."],vi:["Món này quả thực rất ngon.","Không trách nhiều người xếp hàng vậy."]},
  "4-10-礼拜天":{zh:["礼拜天我们全家去公园。","孩子们玩得很开心。"],py:["Lǐ bài tiān wǒ men quán jiā qù gōng yuán.","Hái zi men wánr de hěn kāi xīn."],vi:["Chủ nhật cả nhà chúng tôi đi công viên.","Bọn trẻ chơi rất vui."]},
  "4-10-穷":{zh:["小时候家里很穷。","但爸妈一直让我好好学习。"],py:["Xiǎoshíhou jiālǐ hěn qióng.","Dàn bàmā yìzhí ràng wǒ hǎohǎo xuéxí."],vi:["Hồi nhỏ gia đình rất nghèo.","Nhưng bố mẹ luôn bảo tôi chăm chỉ học hành."]},
  "4-10-空儿":{zh:["你有空儿的时候来找我。","我们一起喝杯咖啡。"],py:["Nǐ yǒu kòngr de shíhou lái zhǎo wǒ.","Wǒmen yìqǐ hē bēi kāfēi."],vi:["Khi nào bạn rảnh thì đến tìm tôi.","Chúng ta cùng uống một ly cà phê."]},
  "4-10-等":{zh:["我在门口等了你半个小时。","你怎么才来呀？"],py:["Wǒ zài ménkǒu děng le nǐ bàn gè xiǎoshí.","Nǐ zěnme cái lái ya?"],vi:["Tôi đợi bạn ở cửa nửa tiếng rồi.","Sao giờ mới đến vậy?"]},
  "4-10-答案":{zh:["考完试，答案公布了。","我对了大部分题目。"],py:["Kǎo wán shì, dá'àn gōngbù le.","Wǒ duì le dà bùfen tímù."],vi:["Thi xong rồi, đáp án đã được công bố.","Tôi đúng phần lớn các câu."]},
  "4-10-糖":{zh:["医生说少吃糖对身体好。","可是我太喜欢吃甜的了。"],py:["Yīshēng shuō shǎo chī táng duì shēntǐ hǎo.","Kěshì wǒ tài xǐhuan chī tián de le."],vi:["Bác sĩ nói ăn ít đường tốt cho sức khỏe.","Nhưng tôi quá thích ăn đồ ngọt."]},
  "4-10-经济":{zh:["中国的经济发展很快。","人们的生活越来越好了。"],py:["Zhōngguó de jīngjì fāzhǎn hěn kuài.","Rénmen de shēnghuó yuèláiyuè hǎo le."],vi:["Kinh tế Trung Quốc phát triển rất nhanh.","Cuộc sống của mọi người ngày càng tốt hơn."]},

let filteredV=[], studyQueue=[], currentIdx=0, isFlipped=false;
let hskFilter=new Set([1,2,3,4]), statusFilter='all';
let quizMode='zh2vi', qCorrect=0, qWrong=0, pyCorrect=0, pyWrong=0;
let currentSection='vocab';
let progress=JSON.parse(localStorage.getItem('hsk_progress')||'{}');
let totalCorrect=parseInt(localStorage.getItem('hsk_total_correct')||'0');
let totalWrong=parseInt(localStorage.getItem('hsk_total_wrong')||'0');

function saveProgress(){
  localStorage.setItem('hsk_progress',JSON.stringify(progress));
  localStorage.setItem('hsk_total_correct',totalCorrect);
  localStorage.setItem('hsk_total_wrong',totalWrong);
}

function getWordKey(w){return w[0]+'_'+w[3]+'_'+w[4]}
function getMastery(w){return progress[getWordKey(w)]||0}

function sortByLesson(a,b){
  if(a[3]!==b[3])return a[3]-b[3];
  if(a[4]!==b[4])return a[4]-b[4];
  return V.indexOf(a)-V.indexOf(b);
}

function applyFilters(){
  filteredV=V.filter(w=>{
    if(!hskFilter.has(w[3]))return false;
    let m=getMastery(w);
    if(statusFilter==='new'&&m!==0)return false;
    if(statusFilter==='learning'&&(m<1||m>=3))return false;
    return true;
  }).sort(sortByLesson);
  studyQueue=[...filteredV];
  currentIdx=0;
  isFlipped=false;
  updateStats();
}

function updateStats(){
  let total=V.filter(w=>hskFilter.has(w[3])).length;
  let learning=V.filter(w=>hskFilter.has(w[3])&&getMastery(w)>=1&&getMastery(w)<3).length;
  document.getElementById('totalWords').textContent=total;
  document.getElementById('learningWords').textContent=learning;
  let t=totalCorrect+totalWrong;
  document.getElementById('accuracy').textContent=t>0?Math.round(totalCorrect/t*100)+'%':'0%';
}

function buildLongExample(w){
  const handcraftedKey=`${w[3]}-${w[4]}-${w[0]}`;
  if(HANDCRAFTED_EXAMPLES[handcraftedKey]){
    return HANDCRAFTED_EXAMPLES[handcraftedKey];
  }
  return {zh:[w[5]],py:[w[6]],vi:[w[7]]};
}

function renderExampleLines(lines,className){
  return lines.map(line=>`<div class="${className}">${line}</div>`).join('');
}

function toggleExampleDetails(prefix){
  const el=document.getElementById(prefix+'-example-hidden');
  if(el)el.classList.toggle('show');
}

function switchSection(s,el){
  currentSection=s;
  document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
  document.getElementById('sec-'+s).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  if(s==='vocab'){showCard();renderList();}
  if(s==='test'){
    const activeTest=document.querySelector('#test-nav button.active');
    if(activeTest&&activeTest.dataset.test==='pinyin')nextPinyin();
    else nextQuiz();
  }
  if(s==='grammar')renderGrammar();
  if(s==='reading')renderReadings();
}
function switchSub(section,sub,el){
  const parent=document.getElementById('sec-'+section);
  parent.querySelectorAll('.sub-section').forEach(e=>e.classList.remove('active'));
  document.getElementById('sub-'+sub).classList.add('active');
  const nav=document.getElementById(section+'-nav');
  if(nav){
    nav.querySelectorAll('button').forEach(e=>e.classList.remove('active'));
    el.classList.add('active');
  }
  if(sub==='flashcard')showCard();
  if(sub==='list')renderList();
}
function setTestMode(mode,el){
  document.querySelectorAll('#test-nav button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if(mode==='pinyin'){
    document.getElementById('sub-quiz').classList.remove('active');
    document.getElementById('sub-pinyin').classList.add('active');
    nextPinyin();
  }else{
    quizMode=mode;
    document.getElementById('sub-pinyin').classList.remove('active');
    document.getElementById('sub-quiz').classList.add('active');
    nextQuiz();
  }
}

function toggleHSK(n,el){
  el.classList.toggle('active');
  if(hskFilter.has(n))hskFilter.delete(n);else hskFilter.add(n);
  applyFilters();
  showCard();renderList();renderGrammar();renderReadings();
  if(currentSection==='test'){
    const activeTest=document.querySelector('#test-nav button.active');
    if(activeTest&&activeTest.dataset.test==='pinyin')nextPinyin();
    else nextQuiz();
  }
}

function setStatusFilter(s,el){
  statusFilter=s;
  document.querySelectorAll('[data-status]').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
  showCard();
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function shuffleWords(){
  studyQueue=[...filteredV];
  shuffleArray(studyQueue);
  currentIdx=0;isFlipped=false;
  showCard();
}

function resetProgress(){
  if(confirm('Bạn có chắc muốn xóa toàn bộ tiến trình?')){
    progress={};totalCorrect=0;totalWrong=0;
    saveProgress();applyFilters();
    showCard();renderList();
  }
}

// FLASHCARD
function showCard(){
  if(studyQueue.length===0){
    document.querySelector('.card-container').innerHTML='<div class="empty-state"><div class="emoji">📚</div><p>Không có từ nào. Hãy thay đổi bộ lọc.</p></div>';
    document.getElementById('fc-progress').textContent='0/0';
    return;
  }
  if(currentIdx>=studyQueue.length)currentIdx=0;
  if(currentIdx<0)currentIdx=studyQueue.length-1;
  let w=studyQueue[currentIdx];
  let fc=document.getElementById('flashcard');
  fc.classList.remove('flipped');isFlipped=false;
  let hskClass='hsk'+w[3];
  document.getElementById('fc-badge').className='card-badge '+hskClass;
  document.getElementById('fc-badge').textContent='HSK '+w[3];
  document.getElementById('fc-badge2').className='card-badge '+hskClass;
  document.getElementById('fc-badge2').textContent='HSK '+w[3];
  document.getElementById('fc-lesson').textContent='Bài '+w[4];
  document.getElementById('fc-hanzi').textContent=w[0];
  document.getElementById('fc-hanzi2').textContent=w[0];
  document.getElementById('fc-pinyin').textContent=w[1];
  document.getElementById('fc-vi').textContent=w[2];
  const ex=buildLongExample(w);
  document.getElementById('fc-ex-zh').innerHTML=renderExampleLines(ex.zh,'ex-zh');
  document.getElementById('fc-ex-py').innerHTML=renderExampleLines(ex.py,'ex-py');
  document.getElementById('fc-ex-vi').innerHTML=renderExampleLines(ex.vi,'ex-vi');
  document.getElementById('fc-example-hidden').classList.remove('show');
  document.getElementById('fc-progress').textContent=(currentIdx+1)+'/'+studyQueue.length;
}

function flipCard(){
  let fc=document.getElementById('flashcard');
  fc.classList.toggle('flipped');
  isFlipped=!isFlipped;
}

function nextCard(){currentIdx++;showCard()}
function prevCard(){currentIdx--;showCard()}

function markWord(know){
  if(studyQueue.length===0)return;
  let w=studyQueue[currentIdx];
  let k=getWordKey(w);
  let m=progress[k]||0;
  if(know){m=Math.min(m+1,3);totalCorrect++}else{m=Math.max(m-1,0);totalWrong++}
  progress[k]=m;saveProgress();
  nextCard();
}

// QUIZ
function nextQuiz(){
  if(studyQueue.length<4){
    document.getElementById('quiz-container').innerHTML='<div class="empty-state"><div class="emoji">📝</div><p>Cần ít nhất 4 từ. Hãy thay đổi bộ lọc HSK.</p></div>';
    return;
  }
  let idx=Math.floor(Math.random()*studyQueue.length);
  let w=studyQueue[idx];
  document.getElementById('q-result').style.display='none';
  document.getElementById('q-next-btn').style.display='none';

  let qEl=document.getElementById('q-hanzi');
  let prompt=document.getElementById('q-prompt');

  if(quizMode==='zh2vi'){
    prompt.textContent='Chọn nghĩa tiếng Việt:';
    qEl.textContent=w[0];
  }else{
    prompt.textContent='Chọn chữ Hán đúng:';
    qEl.textContent=w[2];
    qEl.style.fontSize='1.5em';
  }

  let options=[w];
  let pool=studyQueue.filter(x=>x!==w);
  while(options.length<4&&pool.length>0){
    let ri=Math.floor(Math.random()*pool.length);
    options.push(pool[ri]);
    pool.splice(ri,1);
  }
  for(let i=options.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }

  let optsEl=document.getElementById('q-options');
  optsEl.innerHTML='';
  options.forEach(o=>{
    let btn=document.createElement('div');
    btn.className='quiz-option';
    if(quizMode==='zh2vi'){
      btn.textContent=o[2];
    }else{
      btn.textContent=o[0];
      btn.style.fontSize='1.3em';
    }
    btn.onclick=function(){checkQuiz(o,w,optsEl)};
    optsEl.appendChild(btn);
  });
  document.getElementById('q-correct').textContent=qCorrect;
  document.getElementById('q-wrong').textContent=qWrong;
  if(quizMode!=='zh2vi')setTimeout(()=>{qEl.style.fontSize=''},0);
}

function checkQuiz(selected,correct,optsEl){
  let rEl=document.getElementById('q-result');
  let opts=optsEl.querySelectorAll('.quiz-option');
  opts.forEach(o=>{
    o.classList.add('disabled');
    let txt=o.textContent;
    if(quizMode==='zh2vi'){
      if(txt===correct[2])o.classList.add('correct');
      else if(txt===selected[2])o.classList.add('wrong');
    }else{
      if(txt===correct[0])o.classList.add('correct');
      else if(txt===selected[0])o.classList.add('wrong');
    }
  });
  let isCorrect=selected===correct;
  let k=getWordKey(correct);
  let m=progress[k]||0;
  if(isCorrect){
    qCorrect++;totalCorrect++;
    m=Math.min(m+1,3);
    rEl.className='quiz-result correct-result';
    rEl.innerHTML='✓ Chính xác! <b>'+correct[0]+'</b> ('+correct[1]+') = '+correct[2];
  }else{
    qWrong++;totalWrong++;
    m=Math.max(m-1,0);
    rEl.className='quiz-result wrong-result';
    rEl.innerHTML='✗ Sai rồi! Đáp án: <b>'+correct[0]+'</b> ('+correct[1]+') = '+correct[2];
  }
  progress[k]=m;saveProgress();updateStats();
  rEl.style.display='block';
  document.getElementById('q-next-btn').style.display='inline-block';
  document.getElementById('q-correct').textContent=qCorrect;
  document.getElementById('q-wrong').textContent=qWrong;
}

// PINYIN
function nextPinyin(){
  if(studyQueue.length===0)return;
  let idx=Math.floor(Math.random()*studyQueue.length);
  let w=studyQueue[idx];
  document.getElementById('py-hanzi').textContent=w[0];
  document.getElementById('py-vi-hint').textContent='('+w[2]+')';
  document.getElementById('py-input').value='';
  document.getElementById('py-input').dataset.answer=w[1];
  document.getElementById('py-input').dataset.key=getWordKey(w);
  document.getElementById('py-input').dataset.idx=idx;
  document.getElementById('py-result').style.display='none';
  document.getElementById('py-next-btn').style.display='none';
  document.getElementById('py-input').focus();
  document.getElementById('py-correct').textContent=pyCorrect;
  document.getElementById('py-wrong').textContent=pyWrong;
}

function normPinyin(s){
  return s.toLowerCase().replace(/\s+/g,' ').replace(/ü/g,'v').replace(/\u0304|\u0301|\u030c|\u0300/g,'')
    .replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e').replace(/[īíǐì]/g,'i')
    .replace(/[ōóǒò]/g,'o').replace(/[ūúǔù]/g,'u').replace(/[ǖǘǚǜ]/g,'v').trim();
}

function checkPinyin(){
  let input=document.getElementById('py-input');
  let answer=input.dataset.answer;
  let key=input.dataset.key;
  let idx=parseInt(input.dataset.idx);
  let w=studyQueue[idx];
  let rEl=document.getElementById('py-result');
  let userNorm=normPinyin(input.value);
  let ansNorm=normPinyin(answer);
  let isCorrect=userNorm===ansNorm;
  let m=progress[key]||0;
  if(isCorrect){
    pyCorrect++;totalCorrect++;m=Math.min(m+1,3);
    rEl.className='quiz-result correct-result';
    rEl.innerHTML='✓ Chính xác! <b>'+answer+'</b>';
  }else{
    pyWrong++;totalWrong++;m=Math.max(m-1,0);
    rEl.className='quiz-result wrong-result';
    rEl.innerHTML='✗ Sai! Đáp án đúng: <b>'+answer+'</b><br><small>Bạn nhập: '+input.value+'</small>';
    if(w){
      const ex=buildLongExample(w);
      rEl.innerHTML+='<br><div class="card-example" style="margin-top:8px;text-align:left"><div class="example-title">Ví dụ tiếng Trung</div>'+renderExampleLines(ex.zh,'ex-zh')+'<div class="example-title">Pinyin</div>'+renderExampleLines(ex.py,'ex-py')+'<div class="example-title">Nghĩa tiếng Việt</div>'+renderExampleLines(ex.vi,'ex-vi')+'</div>';
    }
  }
  progress[key]=m;saveProgress();updateStats();
  rEl.style.display='block';
  document.getElementById('py-next-btn').style.display='inline-block';
  document.getElementById('py-correct').textContent=pyCorrect;
  document.getElementById('py-wrong').textContent=pyWrong;
}

// LIST
function renderList(){
  let search=(document.getElementById('searchBox')||{}).value||'';
  search=search.toLowerCase();
  let allByHsk=V.filter(w=>hskFilter.has(w[3]));
  let list=allByHsk.filter(w=>{
    if(!search)return true;
    return w[0].includes(search)||w[1].toLowerCase().includes(search)||w[2].toLowerCase().includes(search);
  }).sort(sortByLesson);
  let el=document.getElementById('wordList');
  if(list.length===0){
    el.innerHTML='<div class="empty-state"><div class="emoji">🔍</div><p>Không tìm thấy từ nào.</p></div>';
    return;
  }
  let html='';
  list.forEach((w,i)=>{
    let m=getMastery(w);
    html+='<div class="word-item" onclick="showDetail('+V.indexOf(w)+')">';
    html+='<span class="wi-hanzi">'+w[0]+'</span>';
    html+='<span class="wi-pinyin">'+w[1]+'</span>';
    html+='<span class="wi-vi">'+w[2]+'</span>';
    html+='<span class="wi-badge">HSK '+w[3]+' | Bài '+w[4]+'</span>';
    html+='<span class="mastery-dot mastery-'+m+'"></span>';
    html+='</div>';
  });
  el.innerHTML=html;
}

function grammarLessonNum(g){
  const m=(g.lesson||'').match(/Bài\s*(\d+)/);
  return m?parseInt(m[1],10):999;
}
function grammarLevelNum(g){
  const m=(g.level||'').match(/HSK(\d)/);
  return m?parseInt(m[1],10):9;
}
function renderGrammar(){
  const el=document.getElementById('grammarList');
  const sorted=G.map((g,i)=>({g,i})).sort((a,b)=>{
    const la=grammarLevelNum(a.g),lb=grammarLevelNum(b.g);
    if(la!==lb)return la-lb;
    const ba=grammarLessonNum(a.g),bb=grammarLessonNum(b.g);
    if(ba!==bb)return ba-bb;
    return a.i-b.i;
  }).map(x=>x.g).filter(g=>hskFilter.has(grammarLevelNum(g)));
  if(sorted.length===0){
    el.innerHTML='<div class="empty-state"><div class="emoji">📚</div><p>Chọn ít nhất một cấp HSK để xem.</p></div>';
    return;
  }
  el.innerHTML=sorted.map((g,i)=>`
    <div class="grammar-item">
      <div class="content-head">
        <span class="content-meta">${formatReadingLevel(g.level)} | ${g.lesson}</span>
        <div class="content-title-wrap">
          <div class="content-title">${g.pattern}</div>
        </div>
      </div>
      <div class="grammar-body">
      <div class="grammar-note">${g.note}</div>
      <div class="grammar-ex">
        <div class="example-title">Ví dụ tiếng Trung</div>
        <div class="ex-zh">${g.exZh}</div>
        <div class="example-toggle"><button onclick="toggleExampleDetails('g-${i}')">Xem thêm pinyin + nghĩa Việt</button></div>
        <div class="example-hidden" id="g-${i}-example-hidden">
          <div class="example-title">Pinyin</div>
          <div class="ex-py">${g.exPy}</div>
          <div class="example-title">Nghĩa tiếng Việt</div>
          <div class="ex-vi">${g.exVi}</div>
        </div>
      </div>
      </div>
    </div>
  `).join('');
}

const vocabLookup={};
V.forEach(w=>{if(!vocabLookup[w[0]])vocabLookup[w[0]]={py:w[1],vi:w[2]};});

function highlightVocab(text,vocabList,seen){
  if(!vocabList||!vocabList.length)return text;
  let result=text;
  const sorted=[...vocabList].sort((a,b)=>b.length-a.length);
  sorted.forEach(w=>{
    if(seen.has(w))return;
    const escaped=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp(escaped);
    if(re.test(result)){
      const info=vocabLookup[w];
      const py=info?info.py:'';
      const vi=info?info.vi:'';
      result=result.replace(re,`<span class="vocab-hl" data-py="${py}" data-vi="${vi}">${w}</span>`);
      seen.add(w);
    }
  });
  return result;
}
function cnLessonNum(ch){
  const cn={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  if(/^\d+$/.test(ch))return ch;
  if(ch==='十')return'10';
  if(ch.startsWith('十')&&ch.length===2)return String(10+(cn[ch[1]]||0));
  if(ch.endsWith('十')&&ch.length===2)return String((cn[ch[0]]||0)*10);
  if(ch.includes('十')){
    const p=ch.split('十');
    const tens=p[0]?cn[p[0]]||0:1;
    const ones=p[1]?cn[p[1]]||0:0;
    return String(tens*10+ones);
  }
  return String(cn[ch]||ch);
}
function parseLessonTitle(title){
  const m=title.match(/^(第([一二三四五六七八九十百\d]+)课)\s+(.+)$/);
  if(m)return{chapter:m[1],num:cnLessonNum(m[2]),name:m[3]};
  return{chapter:'',num:'',name:title};
}
function formatReadingLevel(level){
  const m=(level||'').match(/HSK\s*(\d)(.*)/i);
  if(m)return`HSK ${m[1]}${m[2]||''}`;
  return level||'';
}
function formatReadingTag(level,lessonNum){
  return`${formatReadingLevel(level)} | Bài ${lessonNum}`;
}
function parseTextSub(sub){
  const m=sub.match(/^(\d+)\s+(.+)$/);
  if(m)return{num:m[1],name:m[2],isPassage:false};
  if(/^\d+$/.test(sub))return{num:sub,name:null,isPassage:true};
  return{num:'',name:sub,isPassage:false};
}
function readingMatchesHSKFilter(level){
  const m=(level||'').match(/HSK(\d)/);
  return m?hskFilter.has(parseInt(m[1],10)):false;
}
function detectSpeakers(lines){
  const speakers=[];
  lines.forEach(l=>{
    const ci=l.indexOf('：');
    if(ci>0&&ci<10){
      const s=l.substring(0,ci);
      if(!speakers.includes(s))speakers.push(s);
    }
  });
  return speakers;
}
function isPassageText(lines){
  return detectSpeakers(lines).length<2;
}
function renderReadings(){
  const filtered=R.filter(r=>readingMatchesHSKFilter(r.level));
  const el=document.getElementById('readingList');
  if(filtered.length===0){el.innerHTML='<div class="empty-state"><div class="emoji">📖</div><p>Chọn ít nhất một cấp HSK để xem.</p></div>';return;}
  el.innerHTML=filtered.map(r=>{
    const seen=new Set();
    const lesson=parseLessonTitle(r.title);
    const levelTag=formatReadingTag(r.level,lesson.num);
    const textsHtml=r.texts.map(t=>{
      const info=parseTextSub(t.sub);
      const isPassage=isPassageText(t.lines);
      const speakers=isPassage?[]:detectSpeakers(t.lines);
      const linesHtml=t.lines.map(line=>{
        const hl=highlightVocab(line,t.vocab,seen);
        const colonIdx=hl.indexOf('：');
        if(!isPassage&&colonIdx>0&&colonIdx<10){
          const rawSpeaker=line.substring(0,line.indexOf('：'));
          const spIdx=speakers.indexOf(rawSpeaker);
          const cls=spIdx%2===0?'speaker-a':'speaker-b';
          const speaker=hl.substring(0,colonIdx);
          const rest=hl.substring(colonIdx);
          return `<div class="dialogue-line ${cls}"><span class="speaker">${speaker}</span>${rest}</div>`;
        }
        return `<div class="${isPassage?'passage-line':'dialogue-line'}">${hl}</div>`;
      }).join('');
      const textLabel=info.name||'课文';
      const blockClass=isPassage?'passage':'dialogue';
      return `
      <div class="reading-text-block ${blockClass}">
        <div class="content-head">
          <span class="content-meta">${levelTag}</span>
          <div class="content-title-wrap">
            <span class="content-title">${textLabel}</span>
          </div>
        </div>
        <div class="reading-text-body">${linesHtml}</div>
      </div>`;
    }).join('');
    return `
    <div class="reading-lesson">
      <div class="reading-lesson-body">${textsHtml}</div>
    </div>`;
  }).join('');
  initVocabTooltips();
}
function getVocabTipTheme(el){
  if(el.closest('.speaker-a'))return'tip-a';
  if(el.closest('.speaker-b'))return'tip-b';
  if(el.closest('.reading-text-block.passage')||el.closest('.passage-line'))return'tip-passage';
  return'tip-default';
}
function initVocabTooltips(){
  const tip=document.getElementById('vocabTip');
  document.querySelectorAll('.vocab-hl').forEach(el=>{
    el.addEventListener('mouseenter',e=>{
      const py=el.dataset.py;
      const vi=el.dataset.vi;
      if(!py&&!vi)return;
      document.getElementById('vtPy').textContent=py;
      document.getElementById('vtVi').textContent=vi;
      tip.className='vocab-tip '+getVocabTipTheme(el);
      tip.style.display='block';
      const rect=el.getBoundingClientRect();
      let left=rect.left;
      let top=rect.bottom+4;
      if(left+220>window.innerWidth)left=window.innerWidth-224;
      if(top+60>window.innerHeight)top=rect.top-50;
      tip.style.left=left+'px';
      tip.style.top=top+'px';
    });
    el.addEventListener('mouseleave',()=>{
      tip.style.display='none';
    });
  });
}

function showDetail(i){
  let w=V[i];
  document.getElementById('wd-hanzi').textContent=w[0];
  document.getElementById('wd-pinyin').textContent=w[1];
  document.getElementById('wd-vi').textContent=w[2];
  const ex=buildLongExample(w);
  document.getElementById('wd-ex-zh').innerHTML=renderExampleLines(ex.zh,'ex-zh');
  document.getElementById('wd-ex-py').innerHTML=renderExampleLines(ex.py,'ex-py');
  document.getElementById('wd-ex-vi').innerHTML=renderExampleLines(ex.vi,'ex-vi');
  document.getElementById('wd-example-hidden').classList.remove('show');
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('show');
}

document.addEventListener('keydown',e=>{
  if(currentSection==='vocab'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard()}
    if(e.key==='ArrowRight')nextCard();
    if(e.key==='ArrowLeft')prevCard();
    if(e.key==='1')markWord(0);
    if(e.key==='2')markWord(1);
  }
  if(e.key==='Escape')closeDetail();
});

applyFilters();
shuffleWords();
showCard();
renderGrammar();
renderReadings();
</script>
