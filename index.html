  "2-6-好吃":{zh:["这家饭店的菜很好吃。","我每个星期都来这里吃。"],py:["Zhè jiā fàn diàn de cài hěn hǎo chī.","Wǒ měi gè xīng qī dōu lái zhè lǐ chī."],vi:["Món ăn nhà hàng này rất ngon.","Tuần nào tôi cũng đến đây ăn."]},
  "2-6-所以":{zh:["今天下雨了，所以我没出去。","我在家里看了一天电视。"],py:["Jīn tiān xià yǔ le, suǒ yǐ wǒ méi chū qù.","Wǒ zài jiā lǐ kàn le yì tiān diàn shì."],vi:["Hôm nay mưa, nên tôi không ra ngoài.","Tôi ở nhà xem ti vi cả ngày."]},
  "2-6-游泳":{zh:["我喜欢夏天去游泳。","游泳对身体很好。"],py:["Wǒ xǐ huān xià tiān qù yóu yǒng.","Yóu yǒng duì shēn tǐ hěn hǎo."],vi:["Tôi thích mùa hè đi bơi.","Bơi lội tốt cho sức khỏe."]},
  "2-6-经常":{zh:["他经常去图书馆看书。","每次都坐到很晚才走。"],py:["Tā jīng cháng qù tú shū guǎn kàn shū.","Měi cì dōu zuò dào hěn wǎn cái zǒu."],vi:["Anh ấy thường xuyên đến thư viện đọc sách.","Mỗi lần đều ngồi đến rất khuya mới đi."]},
  "2-7-公共汽车":{zh:["我每天坐公共汽车去上班。","车站就在我家门口。"],py:["Wǒ měi tiān zuò gōng gòng qì chē qù shàng bān.","Chē zhàn jiù zài wǒ jiā mén kǒu."],vi:["Mỗi ngày tôi đi xe buýt đi làm.","Trạm xe ngay trước cửa nhà tôi."]},
  "2-7-公司":{zh:["他在一家大公司上班。","每天早上八点就要到。"],py:["Tā zài yì jiā dà gōng sī shàng bān.","Měi tiān zǎo shang bā diǎn jiù yào dào."],vi:["Anh ấy làm việc ở một công ty lớn.","Mỗi ngày sáng tám giờ phải đến."]},
  "2-7-小时":{zh:["从这里到北京要两个小时。","我们坐高铁去很快。"],py:["Cóng zhè lǐ dào Běi jīng yào liǎng gè xiǎo shí.","Wǒ men zuò gāo tiě qù hěn kuài."],vi:["Từ đây đến Bắc Kinh mất hai tiếng.","Chúng ta đi tàu cao tốc rất nhanh."]},
  "2-7-慢":{zh:["请说慢一点，我听不懂。","你再说一次好吗？"],py:["Qǐng shuō màn yì diǎn, wǒ tīng bù dǒng.","Nǐ zài shuō yí cì hǎo ma?"],vi:["Xin nói chậm một chút, tôi nghe không hiểu.","Bạn nói lại một lần được không?"]},
  "2-7-机场":{zh:["我们去机场接他。","他的飞机下午三点到。"],py:["Wǒ men qù jī chǎng jiē tā.","Tā de fēi jī xià wǔ sān diǎn dào."],vi:["Chúng ta ra sân bay đón anh ấy.","Máy bay anh ấy đến lúc ba giờ chiều."]},
  "2-7-离":{zh:["我家离公司不太远。","坐公共汽车二十分钟就到了。"],py:["Wǒ jiā lí gōng sī bú tài yuǎn.","Zuò gōng gòng qì chē èr shí fēn zhōng jiù dào le."],vi:["Nhà tôi cách công ty không xa lắm.","Đi xe buýt hai mươi phút là tới."]},
  "2-7-过":{zh:["你去过北京吗？","我还没有去过，很想去看看。"],py:["Nǐ qù guò Běi jīng ma?","Wǒ hái méi yǒu qù guò, hěn xiǎng qù kàn kan."],vi:["Bạn đã từng đi Bắc Kinh chưa?","Tôi chưa từng đi, rất muốn đi xem."]},
  "2-7-远":{zh:["你家离这里远不远？","不远，走路十分钟就到了。"],py:["Nǐ jiā lí zhè lǐ yuǎn bù yuǎn?","Bù yuǎn, zǒu lù shí fēn zhōng jiù dào le."],vi:["Nhà bạn cách đây có xa không?","Không xa, đi bộ mười phút là tới."]},
  "2-8-事情":{zh:["我有一件事情想跟你说。","你什么时候有空？"],py:["Wǒ yǒu yí jiàn shì qing xiǎng gēn nǐ shuō.","Nǐ shén me shí hou yǒu kòng?"],vi:["Tôi có một chuyện muốn nói với bạn.","Bạn khi nào rảnh?"]},
  "2-8-告诉":{zh:["请你告诉他明天不上课。","我打电话他没有接。"],py:["Qǐng nǐ gào su tā míng tiān bù shàng kè.","Wǒ dǎ diàn huà tā méi yǒu jiē."],vi:["Xin bạn nói cho anh ấy biết ngày mai không có lớp.","Tôi gọi điện mà anh ấy không nghe."]},
  "2-8-找":{zh:["我在找我的钥匙。","你看见了吗？"],py:["Wǒ zài zhǎo wǒ de yào shi.","Nǐ kàn jiàn le ma?"],vi:["Tôi đang tìm chìa khóa.","Bạn có thấy không?"]},
  "2-8-服务员":{zh:["服务员，请给我一杯咖啡。","好的，请稍等。"],py:["Fú wù yuán, qǐng gěi wǒ yì bēi kā fēi.","Hǎo de, qǐng shāo děng."],vi:["Phục vụ ơi, cho tôi một ly cà phê.","Vâng, xin đợi một chút."]},
  "2-8-白":{zh:["她穿了一件白色的裙子。","看起来很漂亮。"],py:["Tā chuān le yí jiàn bái sè de qún zi.","Kàn qǐ lái hěn piào liang."],vi:["Cô ấy mặc một chiếc váy trắng.","Trông rất đẹp."]},
  "2-8-等":{zh:["我在门口等你。","你出来了我们就走。"],py:["Wǒ zài mén kǒu děng nǐ.","Nǐ chū lái le wǒ men jiù zǒu."],vi:["Tôi đợi bạn ở cửa.","Bạn ra rồi chúng ta đi luôn."]},
  "2-8-让":{zh:["妈妈让我早点睡觉。","她说睡得好，身体才好。"],py:["Mā ma ràng wǒ zǎo diǎn shuì jiào.","Tā shuō shuì de hǎo, shēn tǐ cái hǎo."],vi:["Mẹ bảo tôi ngủ sớm.","Mẹ nói ngủ tốt thì sức khỏe mới tốt."]},
  "2-8-贵":{zh:["这件衣服太贵了。","有没有便宜一点的？"],py:["Zhè jiàn yī fu tài guì le.","Yǒu méi yǒu pián yi yì diǎn de?"],vi:["Bộ quần áo này đắt quá.","Có cái nào rẻ hơn không?"]},
  "2-8-黑":{zh:["天黑了，我们回家吧。","路上小心，慢慢走。"],py:["Tiān hēi le, wǒ men huí jiā ba.","Lù shang xiǎo xīn, màn man zǒu."],vi:["Trời tối rồi, chúng ta về nhà đi.","Trên đường cẩn thận, đi chậm thôi."]},
  "2-9-上班":{zh:["我每天早上八点上班。","下午五点下班回家。"],py:["Wǒ měi tiān zǎo shang bā diǎn shàng bān.","Xià wǔ wǔ diǎn xià bān huí jiā."],vi:["Mỗi ngày sáng tám giờ tôi đi làm.","Chiều năm giờ tan ca về nhà."]},
  "2-9-完":{zh:["作业做完了没有？","还没有，还有两道题。"],py:["Zuò yè zuò wán le méi yǒu?","Hái méi yǒu, hái yǒu liǎng dào tí."],vi:["Bài tập làm xong chưa?","Chưa, còn hai câu nữa."]},
  "2-9-希望":{zh:["我希望明年能去中国。","我要好好学中文。"],py:["Wǒ xī wàng míng nián néng qù Zhōng guó.","Wǒ yào hǎo hao xué zhōng wén."],vi:["Tôi hy vọng năm sau có thể đi Trung Quốc.","Tôi phải học tiếng Trung thật tốt."]},
  "2-9-懂":{zh:["你听懂了吗？","如果不懂，可以再问我。"],py:["Nǐ tīng dǒng le ma?","Rú guǒ bù dǒng, kě yǐ zài wèn wǒ."],vi:["Bạn nghe hiểu chưa?","Nếu không hiểu, có thể hỏi lại tôi."]},
  "2-9-欢迎":{zh:["欢迎你来中国！","我带你去看看好玩的地方。"],py:["Huān yíng nǐ lái Zhōng guó!","Wǒ dài nǐ qù kàn kan hǎo wán de dì fang."],vi:["Chào mừng bạn đến Trung Quốc!","Tôi đưa bạn đi xem những nơi vui."]},
  "2-9-第一":{zh:["他是班里第一名。","他每天都很努力学习。"],py:["Tā shì bān lǐ dì yī míng.","Tā měi tiān dōu hěn nǔ lì xué xí."],vi:["Anh ấy đứng thứ nhất trong lớp.","Ngày nào anh ấy cũng rất chăm học."]},
  "2-9-问题":{zh:["这个问题很难。","老师能再说一次吗？"],py:["Zhè gè wèn tí hěn nán.","Lǎo shī néng zài shuō yí cì ma?"],vi:["Câu hỏi này rất khó.","Thầy có thể nói lại một lần nữa không?"]},
  "2-9-题":{zh:["这道题太难了。","我想了很久都不会做。"],py:["Zhè dào tí tài nán le.","Wǒ xiǎng le hěn jiǔ dōu bú huì zuò."],vi:["Câu này khó quá.","Tôi nghĩ rất lâu mà không làm được."]},
  "2-10-别":{zh:["别着急，还有时间。","我们慢慢走就可以了。"],py:["Bié zháo jí, hái yǒu shí jiān.","Wǒ men màn man zǒu jiù kě yǐ le."],vi:["Đừng vội, vẫn còn thời gian.","Chúng ta đi chậm thôi là được."]},
  "2-10-哥哥":{zh:["我哥哥在北京工作。","他是一个医生，很忙。"],py:["Wǒ gē ge zài Běi jīng gōng zuò.","Tā shì yí gè yī shēng, hěn máng."],vi:["Anh trai tôi làm việc ở Bắc Kinh.","Anh ấy là bác sĩ, rất bận."]},
  "2-10-手机":{zh:["我的手机没电了。","你能借我你的充电器吗？"],py:["Wǒ de shǒu jī méi diàn le.","Nǐ néng jiè wǒ nǐ de chōng diàn qì ma?"],vi:["Điện thoại tôi hết pin rồi.","Bạn có thể cho tôi mượn sạc được không?"]},
  "2-10-正在":{zh:["他正在打电话。","你等一下再进去吧。"],py:["Tā zhèng zài dǎ diàn huà.","Nǐ děng yí xià zài jìn qù ba."],vi:["Anh ấy đang gọi điện.","Bạn đợi một chút rồi vào nhé."]},
  "2-10-洗":{zh:["我每天晚上洗澡。","洗完以后很舒服。"],py:["Wǒ měi tiān wǎn shang xǐ zǎo.","Xǐ wán yǐ hòu hěn shū fu."],vi:["Mỗi tối tôi đều tắm.","Tắm xong rất thoải mái."]},
  "2-10-西瓜":{zh:["夏天吃西瓜最好了。","又甜又凉，很舒服。"],py:["Xià tiān chī xī guā zuì hǎo le.","Yòu tián yòu liáng, hěn shū fu."],vi:["Mùa hè ăn dưa hấu là tuyệt nhất.","Vừa ngọt vừa mát, rất dễ chịu."]},
  "2-11-便宜":{zh:["这家店的东西很便宜。","我买了很多衣服。"],py:["Zhè jiā diàn de dōng xi hěn pián yi.","Wǒ mǎi le hěn duō yī fu."],vi:["Đồ ở cửa hàng này rất rẻ.","Tôi mua nhiều quần áo lắm."]},
  "2-11-去年":{zh:["我去年去了上海。","那里很大，东西也很多。"],py:["Wǒ qù nián qù le Shàng hǎi.","Nà lǐ hěn dà, dōng xi yě hěn duō."],vi:["Năm ngoái tôi đi Thượng Hải.","Ở đó rất lớn, đồ cũng rất nhiều."]},
  "2-11-可能":{zh:["他今天可能不来了。","刚才他说不舒服。"],py:["Tā jīn tiān kě néng bù lái le.","Gāng cái tā shuō bù shū fu."],vi:["Hôm nay anh ấy có lẽ không đến.","Vừa nãy anh ấy nói không khỏe."]},
  "2-11-右边":{zh:["银行在超市的右边。","你往前走就能看到。"],py:["Yín háng zài chāo shì de yòu bian.","Nǐ wǎng qián zǒu jiù néng kàn dào."],vi:["Ngân hàng ở bên phải siêu thị.","Bạn đi thẳng sẽ nhìn thấy."]},
  "2-11-女":{zh:["那个女孩子唱歌很好听。","大家都很喜欢听她唱。"],py:["Nà gè nǚ hái zi chàng gē hěn hǎo tīng.","Dà jiā dōu hěn xǐ huān tīng tā chàng."],vi:["Cô gái đó hát rất hay.","Mọi người đều thích nghe cô ấy hát."]},
  "2-11-比":{zh:["今天比昨天冷。","你多穿一点衣服吧。"],py:["Jīn tiān bǐ zuó tiān lěng.","Nǐ duō chuān yì diǎn yī fu ba."],vi:["Hôm nay lạnh hơn hôm qua.","Bạn mặc thêm chút quần áo đi."]},
  "2-11-男":{zh:["那个男孩子是我弟弟。","他今年十二岁了。"],py:["Nà gè nán hái zi shì wǒ dì di.","Tā jīn nián shí èr suì le."],vi:["Cậu bé kia là em trai tôi.","Năm nay em ấy mười hai tuổi rồi."]},
  "2-11-说话":{zh:["上课的时候不要说话。","老师正在讲课呢。"],py:["Shàng kè de shí hou bú yào shuō huà.","Lǎo shī zhèng zài jiǎng kè ne."],vi:["Lúc học không được nói chuyện.","Thầy đang giảng bài kìa."]},
  "2-12-妻子":{zh:["他的妻子是老师。","她在一所小学工作。"],py:["Tā de qī zi shì lǎo shī.","Tā zài yì suǒ xiǎo xué gōng zuò."],vi:["Vợ anh ấy là giáo viên.","Cô ấy làm việc ở một trường tiểu học."]},
  "2-12-度":{zh:["今天三十五度，太热了。","我不想出门。"],py:["Jīn tiān sān shí wǔ dù, tài rè le.","Wǒ bù xiǎng chū mén."],vi:["Hôm nay ba mươi lăm độ, nóng quá.","Tôi không muốn ra ngoài."]},
  "2-12-穿":{zh:["今天很冷，要多穿衣服。","你穿那件红色的外套吧。"],py:["Jīn tiān hěn lěng, yào duō chuān yī fu.","Nǐ chuān nà jiàn hóng sè de wài tào ba."],vi:["Hôm nay rất lạnh, phải mặc nhiều quần áo.","Bạn mặc cái áo khoác đỏ kia đi."]},
  "2-12-近":{zh:["超市离我家很近。","走路五分钟就到了。"],py:["Chāo shì lí wǒ jiā hěn jìn.","Zǒu lù wǔ fēn zhōng jiù dào le."],vi:["Siêu thị gần nhà tôi lắm.","Đi bộ năm phút là tới."]},
  "2-12-进":{zh:["请进，外面太冷了。","快进来坐，喝杯热茶。"],py:["Qǐng jìn, wài miàn tài lěng le.","Kuài jìn lái zuò, hē bēi rè chá."],vi:["Mời vào, bên ngoài lạnh quá.","Vào ngồi nhanh, uống cốc trà nóng."]},
  "2-12-雪":{zh:["外面下雪了，到处都是白色的。","孩子们很高兴，出去玩儿雪。"],py:["Wài miàn xià xuě le, dào chù dōu shì bái sè de.","Hái zi men hěn gāo xìng, chū qù wánr xuě."],vi:["Bên ngoài có tuyết rơi, khắp nơi đều trắng xóa.","Bọn trẻ rất vui, chạy ra ngoài chơi tuyết."]},
  "2-13-一直":{zh:["你一直往前走就能看到。","那家店就在路的左边。"],py:["Nǐ yì zhí wǎng qián zǒu jiù néng kàn dào.","Nà jiā diàn jiù zài lù de zuǒ bian."],vi:["Bạn cứ đi thẳng sẽ nhìn thấy.","Cửa hàng đó ở bên trái đường."]},
  "2-13-宾馆":{zh:["我们住在火车站旁边的宾馆。","房间很干净也很安静。"],py:["Wǒ men zhù zài huǒ chē zhàn páng biān de bīn guǎn.","Fáng jiān hěn gān jìng yě hěn ān jìng."],vi:["Chúng tôi ở khách sạn cạnh ga tàu.","Phòng rất sạch sẽ và yên tĩnh."]},
  "2-13-往":{zh:["从这里往左走三百米。","你就能看到那家书店了。"],py:["Cóng zhè lǐ wǎng zuǒ zǒu sān bǎi mǐ.","Nǐ jiù néng kàn dào nà jiā shū diàn le."],vi:["Từ đây rẽ trái đi ba trăm mét.","Bạn sẽ nhìn thấy hiệu sách đó."]},
  "2-13-手":{zh:["请把手洗干净再吃饭。","这是妈妈每天都说的话。"],py:["Qǐng bǎ shǒu xǐ gān jìng zài chī fàn.","Zhè shì mā ma měi tiān dōu shuō de huà."],vi:["Hãy rửa tay sạch rồi mới ăn cơm.","Đây là câu mẹ ngày nào cũng nói."]},
  "2-13-拿":{zh:["请帮我拿一下那个杯子。","我的手上都是东西。"],py:["Qǐng bāng wǒ ná yí xià nà gè bēi zi.","Wǒ de shǒu shàng dōu shì dōng xi."],vi:["Xin giúp tôi lấy cái cốc kia.","Tay tôi đang đầy đồ."]},
  "2-13-班":{zh:["我们班有二十个学生。","大家都很友好。"],py:["Wǒ men bān yǒu èr shí gè xué shēng.","Dà jiā dōu hěn yǒu hǎo."],vi:["Lớp chúng tôi có hai mươi học sinh.","Mọi người đều rất thân thiện."]},
  "2-13-笑":{zh:["她笑起来很好看。","每次她笑，大家都开心。"],py:["Tā xiào qǐ lái hěn hǎo kàn.","Měi cì tā xiào, dà jiā dōu kāi xīn."],vi:["Cô ấy cười rất đẹp.","Mỗi lần cô ấy cười, ai cũng vui."]},
  "2-13-路口":{zh:["到了路口往右拐。","你就能看到那家医院了。"],py:["Dào le lù kǒu wǎng yòu guǎi.","Nǐ jiù néng kàn dào nà jiā yī yuàn le."],vi:["Đến ngã đường thì rẽ phải.","Bạn sẽ nhìn thấy bệnh viện đó."]},
  "2-13-长":{zh:["她的头发很长很漂亮。","很多人都想跟她一样。"],py:["Tā de tóu fa hěn cháng hěn piào liang.","Hěn duō rén dōu xiǎng gēn tā yí yàng."],vi:["Tóc cô ấy dài và đẹp.","Nhiều người đều muốn giống cô ấy."]},
  "2-14-玩儿":{zh:["周末我们一起出去玩儿。","去公园走走怎么样？"],py:["Zhōu mò wǒ men yì qǐ chū qù wánr.","Qù gōng yuán zǒu zou zěn me yàng?"],vi:["Cuối tuần chúng ta cùng đi chơi.","Đi công viên dạo chơi thế nào?"]},
  "2-14-百":{zh:["这本书一百块钱。","我觉得不贵，就买了。"],py:["Zhè běn shū yì bǎi kuài qián.","Wǒ jué de bú guì, jiù mǎi le."],vi:["Quyển sách này một trăm tệ.","Tôi thấy không đắt nên mua luôn."]},
  "2-15-更":{zh:["这件衣服比那件更好看。","你穿这件去吧。"],py:["Zhè jiàn yī fu bǐ nà jiàn gèng hǎo kàn.","Nǐ chuān zhè jiàn qù ba."],vi:["Bộ quần áo này đẹp hơn bộ kia.","Bạn mặc bộ này đi."]},
  "2-15-阴":{zh:["今天是阴天，没有太阳。","可能下午会下雨。"],py:["Jīn tiān shì yīn tiān, méi yǒu tài yáng.","Kě néng xià wǔ huì xià yǔ."],vi:["Hôm nay trời âm u, không có nắng.","Có lẽ chiều sẽ mưa."]},
  "3-1-一直":{zh:["他一直在等你。","你怎么现在才来？"],py:["Tā yìzhí zài děng nǐ.","Nǐ zěnme xiànzài cái lái?"],vi:["Anh ấy cứ chờ bạn suốt.","Sao bây giờ bạn mới đến?"]},
  "3-1-啊":{zh:["这道菜真好吃啊！","下次我还要再来这家店。"],py:["Zhè dào cài zhēn hǎochī a!","Xià cì wǒ hái yào zài lái zhè jiā diàn."],vi:["Món này ngon thật đấy!","Lần sau tôi còn muốn đến quán này nữa."]},
  "3-2-辆":{zh:["爸爸买了一辆新车。","他高兴得像个孩子一样。"],py:["Bàba mǎi le yí liàng xīn chē.","Tā gāoxìng de xiàng ge háizi yíyàng."],vi:["Bố mua một chiếc xe mới.","Ông ấy vui như một đứa trẻ."]},
  "3-3-只":{zh:["我只有十块钱。","连一杯咖啡都买不起。"],py:["Wǒ zhǐ yǒu shí kuài qián.","Lián yì bēi kāfēi dōu mǎi bu qǐ."],vi:["Tôi chỉ có mười đồng.","Ngay cả một cốc cà phê cũng không mua nổi."]},
  "3-3-绿":{zh:["春天来了，树叶变绿了。","一切都变得很美。"],py:["Chūntiān lái le, shùyè biàn lǜ le.","Yíqiè dōu biàn de hěn měi."],vi:["Mùa xuân đến rồi, lá cây chuyển xanh.","Mọi thứ đều trở nên rất đẹp."]},
  "3-3-记得":{zh:["你记得带钥匙了吗？","上次你忘了，等了两个小时。"],py:["Nǐ jìde dài yàoshi le ma?","Shàng cì nǐ wàng le, děng le liǎng ge xiǎoshí."],vi:["Bạn nhớ mang chìa khóa chưa?","Lần trước bạn quên, phải chờ hai tiếng."]},
  "3-5-夏天":{zh:["夏天到了，天气很热。","我们去海边玩吧。"],py:["Xiàtiān dào le, tiānqì hěn rè.","Wǒmen qù hǎibiān wán ba."],vi:["Mùa hè đến rồi, trời rất nóng.","Chúng ta đi biển chơi đi."]},
  "3-5-最近":{zh:["你最近怎么样？","我有点忙，但还好。"],py:["Nǐ zuìjìn zěnmeyàng?","Wǒ yǒudiǎn máng, dàn hái hǎo."],vi:["Dạo này bạn thế nào?","Tôi hơi bận, nhưng vẫn ổn."]},
  "3-5-草":{zh:["公园里的草绿绿的。","很多小朋友在草地上玩。"],py:["Gōngyuán lǐ de cǎo lǜlǜ de.","Hěn duō xiǎo péngyǒu zài cǎodì shàng wán."],vi:["Cỏ trong công viên xanh mướt.","Rất nhiều bạn nhỏ đang chơi trên bãi cỏ."]},
  "3-5-裙子":{zh:["这条裙子真好看。","我想买来送给姐姐。"],py:["Zhè tiáo qúnzi zhēn hǎokàn.","Wǒ xiǎng mǎi lái sòng gěi jiějie."],vi:["Cái váy này đẹp thật.","Tôi muốn mua tặng chị gái."]},
  "3-6-公园":{zh:["周末我常去公园散步。","那里有很多花和树。"],py:["Zhōumò wǒ cháng qù gōngyuán sànbù.","Nàlǐ yǒu hěn duō huā hé shù."],vi:["Cuối tuần tôi thường đi công viên dạo bộ.","Ở đó có rất nhiều hoa và cây."]},
  "3-6-刚才":{zh:["刚才有人给你打电话了。","你要不要回个电话？"],py:["Gāngcái yǒu rén gěi nǐ dǎ diànhuà le.","Nǐ yào bu yào huí ge diànhuà?"],vi:["Lúc nãy có người gọi điện cho bạn.","Bạn có muốn gọi lại không?"]},
  "3-6-帮忙":{zh:["你能帮忙搬一下桌子吗？","谢谢你，太好了！"],py:["Nǐ néng bāngmáng bān yíxià zhuōzi ma?","Xièxie nǐ, tài hǎo le!"],vi:["Bạn có thể giúp khiêng cái bàn không?","Cảm ơn bạn, tuyệt quá!"]},
  "3-6-明白":{zh:["你说的我都明白了。","谢谢你这么耐心地教我。"],py:["Nǐ shuō de wǒ dōu míngbai le.","Xièxie nǐ zhème nàixīn de jiāo wǒ."],vi:["Tôi hiểu hết những gì bạn nói rồi.","Cảm ơn bạn đã kiên nhẫn dạy tôi."]},
  "3-6-特别":{zh:["今天的天气特别好。","我们出去走走吧。"],py:["Jīntiān de tiānqì tèbié hǎo.","Wǒmen chūqù zǒuzou ba."],vi:["Hôm nay thời tiết đặc biệt tốt.","Chúng ta ra ngoài đi dạo đi."]},
  "3-6-聊天儿":{zh:["我们常在网上聊天儿。","有时候一聊就是两个小时。"],py:["Wǒmen cháng zài wǎng shàng liáo tiānr.","Yǒu shíhou yì liáo jiù shì liǎng ge xiǎoshí."],vi:["Chúng tôi hay nói chuyện trên mạng.","Có khi nói chuyện liền hai tiếng đồng hồ."]},
  "3-6-讲":{zh:["老师讲的课很有意思。","同学们都听得很认真。"],py:["Lǎoshī jiǎng de kè hěn yǒu yìsi.","Tóngxuémen dōu tīng de hěn rènzhēn."],vi:["Thầy giáo giảng bài rất thú vị.","Các bạn học sinh đều nghe rất chăm chú."]},
  "3-6-锻炼":{zh:["医生说我应该多锻炼。","所以我每天早上去跑步。"],py:["Yīshēng shuō wǒ yīnggāi duō duànliàn.","Suǒyǐ wǒ měitiān zǎoshang qù pǎobù."],vi:["Bác sĩ nói tôi nên tập luyện nhiều hơn.","Vì vậy mỗi sáng tôi đều đi chạy bộ."]},
  "3-6-音乐":{zh:["她喜欢一边工作一边听音乐。","她觉得这样效率更高。"],py:["Tā xǐhuan yìbiān gōngzuò yìbiān tīng yīnyuè.","Tā juéde zhèyàng xiàolǜ gèng gāo."],vi:["Cô ấy thích vừa làm việc vừa nghe nhạc.","Cô ấy thấy như vậy hiệu quả hơn."]},
  "3-7-久":{zh:["我们很久没见了。","今天晚上一起吃饭吧。"],py:["Wǒmen hěn jiǔ méi jiàn le.","Jīntiān wǎnshang yìqǐ chīfàn ba."],vi:["Chúng ta lâu rồi không gặp.","Tối nay cùng đi ăn cơm nhé."]},
  "3-7-刻":{zh:["现在是八点一刻。","我们还有四十五分钟。"],py:["Xiànzài shì bā diǎn yí kè.","Wǒmen hái yǒu sìshíwǔ fēnzhōng."],vi:["Bây giờ là tám giờ mười lăm.","Chúng ta còn bốn mươi lăm phút."]},
  "3-7-半":{zh:["现在是下午两点半。","我们还有半个小时。"],py:["Xiànzài shì xiàwǔ liǎng diǎn bàn.","Wǒmen hái yǒu bàn ge xiǎoshí."],vi:["Bây giờ là hai giờ rưỡi chiều.","Chúng ta còn nửa tiếng nữa."]},
  "3-7-差":{zh:["现在差五分九点。","我们快走吧，要迟到了。"],py:["Xiànzài chà wǔ fēn jiǔ diǎn.","Wǒmen kuài zǒu ba, yào chídào le."],vi:["Bây giờ chín giờ kém năm.","Chúng ta đi nhanh thôi, sắp muộn rồi."]},
  "3-7-感兴趣":{zh:["我对中国文化很感兴趣。","所以我来北京学中文了。"],py:["Wǒ duì Zhōngguó wénhuà hěn gǎn xìngqù.","Suǒyǐ wǒ lái Běijīng xué Zhōngwén le."],vi:["Tôi rất hứng thú với văn hóa Trung Quốc.","Vì vậy tôi đến Bắc Kinh học tiếng Trung."]},
  "3-7-接":{zh:["你帮我接一下电话。","我手上正拿着东西呢。"],py:["Nǐ bāng wǒ jiē yíxià diànhuà.","Wǒ shǒu shàng zhèng ná zhe dōngxi ne."],vi:["Bạn giúp tôi nghe điện thoại đi.","Tay tôi đang cầm đồ."]},
  "3-7-结婚":{zh:["他们明年春天结婚。","我们送什么礼物好呢？"],py:["Tāmen míngnián chūntiān jiéhūn.","Wǒmen sòng shénme lǐwù hǎo ne?"],vi:["Họ sẽ kết hôn vào mùa xuân năm sau.","Chúng ta tặng quà gì tốt nhỉ?"]},
  "3-7-迟到":{zh:["今天我又迟到了。","老师让我在门口站了十分钟。"],py:["Jīntiān wǒ yòu chídào le.","Lǎoshī ràng wǒ zài ménkǒu zhàn le shí fēnzhōng."],vi:["Hôm nay tôi lại đến muộn.","Thầy giáo bắt tôi đứng ở cửa mười phút."]},
  "3-8-一会儿":{zh:["你等我一会儿。","我换好衣服就出来。"],py:["Nǐ děng wǒ yíhuìr.","Wǒ huàn hǎo yīfu jiù chūlái."],vi:["Bạn đợi tôi một lát.","Tôi thay xong quần áo là ra ngay."]},
  "3-8-健康":{zh:["健康是最重要的事。","我们要多运动，少熬夜。"],py:["Jiànkāng shì zuì zhòngyào de shì.","Wǒmen yào duō yùndòng, shǎo áoyè."],vi:["Sức khỏe là điều quan trọng nhất.","Chúng ta nên tập thể dục nhiều, ít thức khuya."]},
  "3-8-几乎":{zh:["他几乎每天都来这家店。","服务员都认识他了。"],py:["Tā jīhū měitiān dōu lái zhè jiā diàn.","Fúwùyuán dōu rènshi tā le."],vi:["Anh ấy gần như mỗi ngày đều đến quán này.","Nhân viên phục vụ đều quen anh ấy rồi."]},
  "3-8-变化":{zh:["这个城市变化很大。","十年前这里还没有地铁。"],py:["Zhège chéngshì biànhuà hěn dà.","Shí nián qián zhèlǐ hái méiyǒu dìtiě."],vi:["Thành phố này thay đổi rất nhiều.","Mười năm trước đây còn chưa có tàu điện ngầm."]},
  "3-8-可乐":{zh:["我不想喝可乐了。","太甜了，给我一杯水吧。"],py:["Wǒ bù xiǎng hē kělè le.","Tài tián le, gěi wǒ yì bēi shuǐ ba."],vi:["Tôi không muốn uống coca nữa.","Ngọt quá, cho tôi một cốc nước đi."]},
  "3-8-安静":{zh:["图书馆里很安静。","大家都在认真看书。"],py:["Túshūguǎn lǐ hěn ānjìng.","Dàjiā dōu zài rènzhēn kànshū."],vi:["Trong thư viện rất yên tĩnh.","Mọi người đều đang chăm chú đọc sách."]},
  "3-8-害怕":{zh:["小猫害怕打雷。","每次打雷它都躲到床下面。"],py:["Xiǎo māo hàipà dǎléi.","Měi cì dǎléi tā dōu duǒ dào chuáng xiàmiàn."],vi:["Con mèo nhỏ sợ sấm sét.","Mỗi lần sấm nó đều trốn dưới giường."]},
  "3-8-层":{zh:["我家住在五层。","从窗户可以看到很远的地方。"],py:["Wǒ jiā zhù zài wǔ céng.","Cóng chuānghù kěyǐ kàn dào hěn yuǎn de dìfang."],vi:["Nhà tôi ở tầng năm.","Từ cửa sổ có thể nhìn thấy rất xa."]},
  "3-8-洗手间":{zh:["请问洗手间在哪里？","在那边，往左走就到了。"],py:["Qǐngwèn xǐshǒujiān zài nǎlǐ?","Zài nàbiān, wǎng zuǒ zǒu jiù dào le."],vi:["Xin hỏi nhà vệ sinh ở đâu?","Ở kia, đi về bên trái là đến."]},
  "3-8-满意":{zh:["老板对我的工作很满意。","他说下个月给我加工资。"],py:["Lǎobǎn duì wǒ de gōngzuò hěn mǎnyì.","Tā shuō xià ge yuè gěi wǒ jiā gōngzī."],vi:["Sếp rất hài lòng với công việc của tôi.","Anh ấy nói tháng sau sẽ tăng lương."]},
  "3-8-熊猫":{zh:["大熊猫最喜欢吃竹子。","它们看起来非常可爱。"],py:["Dà xióngmāo zuì xǐhuan chī zhúzi.","Tāmen kàn qǐlái fēicháng kě'ài."],vi:["Gấu trúc thích ăn tre nhất.","Chúng trông rất đáng yêu."]},
  "3-8-电梯":{zh:["电梯坏了，我们走楼梯吧。","幸好只住在三楼。"],py:["Diàntī huài le, wǒmen zǒu lóutī ba.","Xìnghǎo zhǐ zhù zài sān lóu."],vi:["Thang máy hỏng rồi, đi cầu thang bộ đi.","May mà chỉ ở tầng ba."]},
  "3-8-老":{zh:["这棵老树有一百多年了。","村里的人都很爱护它。"],py:["Zhè kē lǎo shù yǒu yì bǎi duō nián le.","Cūn lǐ de rén dōu hěn àihù tā."],vi:["Cây cổ thụ này đã hơn một trăm năm.","Người trong làng đều rất bảo vệ nó."]},
  "3-8-见面":{zh:["我们在咖啡店见面吧。","我三点就到。"],py:["Wǒmen zài kāfēi diàn jiànmiàn ba.","Wǒ sān diǎn jiù dào."],vi:["Chúng ta gặp nhau ở quán cà phê nhé.","Tôi ba giờ sẽ đến."]},
  "3-8-重要":{zh:["这次考试非常重要。","你一定要好好准备。"],py:["Zhè cì kǎoshì fēicháng zhòngyào.","Nǐ yídìng yào hǎohāo zhǔnbèi."],vi:["Kỳ thi lần này rất quan trọng.","Bạn nhất định phải chuẩn bị thật tốt."]},
  "3-8-马上":{zh:["电影马上要开始了！","好的，我马上就来。"],py:["Diànyǐng mǎshàng yào kāishǐ le!","Hǎo de, wǒ mǎshàng jiù lái."],vi:["Phim sắp bắt đầu rồi!","Được, tôi đến ngay."]},
  "3-9-一定":{zh:["明天一定要早点来。","老师说迟到的人不能考试。"],py:["Míngtiān yídìng yào zǎo diǎn lái.","Lǎoshī shuō chídào de rén bù néng kǎoshì."],vi:["Ngày mai nhất định phải đến sớm.","Thầy giáo nói người đến muộn không được thi."]},
  "3-9-一样":{zh:["这两件衣服颜色一样。","但是大小不一样。"],py:["Zhè liǎng jiàn yīfu yánsè yíyàng.","Dànshì dàxiǎo bù yíyàng."],vi:["Hai cái áo này màu sắc giống nhau.","Nhưng kích cỡ không giống nhau."]},
  "3-9-中文":{zh:["我来中国以后开始学中文。","现在能用中文和朋友聊天了。"],py:["Wǒ lái Zhōngguó yǐhòu kāishǐ xué Zhōngwén.","Xiànzài néng yòng Zhōngwén hé péngyǒu liáotiān le."],vi:["Sau khi đến Trung Quốc tôi bắt đầu học tiếng Trung.","Giờ đã có thể dùng tiếng Trung nói chuyện với bạn bè."]},
  "3-9-中间":{zh:["学校在银行和医院中间。","走路五分钟就到了。"],py:["Xuéxiào zài yínháng hé yīyuàn zhōngjiān.","Zǒulù wǔ fēnzhōng jiù dào le."],vi:["Trường học nằm giữa ngân hàng và bệnh viện.","Đi bộ năm phút là đến."]},
  "3-9-了解":{zh:["我想了解一下你们公司。","你们主要做什么？"],py:["Wǒ xiǎng liǎojiě yíxià nǐmen gōngsī.","Nǐmen zhǔyào zuò shénme?"],vi:["Tôi muốn tìm hiểu về công ty các bạn.","Các bạn chủ yếu làm gì?"]},
  "3-9-先":{zh:["你先走吧，别等我了。","我还有一点工作要做。"],py:["Nǐ xiān zǒu ba, bié děng wǒ le.","Wǒ hái yǒu yìdiǎn gōngzuò yào zuò."],vi:["Bạn đi trước đi, đừng đợi tôi.","Tôi còn một chút công việc phải làm."]},
  "3-9-参加":{zh:["我想参加学校的唱歌比赛。","妈妈说会来看我表演。"],py:["Wǒ xiǎng cānjiā xuéxiào de chànggē bǐsài.","Māma shuō huì lái kàn wǒ biǎoyǎn."],vi:["Tôi muốn tham gia cuộc thi hát của trường.","Mẹ nói sẽ đến xem tôi biểu diễn."]},
  "3-9-影响":{zh:["下雨影响了我们的计划。","我们只好在家看电影了。"],py:["Xiàyǔ yǐngxiǎng le wǒmen de jìhuà.","Wǒmen zhǐhǎo zài jiā kàn diànyǐng le."],vi:["Mưa ảnh hưởng đến kế hoạch của chúng tôi.","Chúng tôi đành ở nhà xem phim."]},
  "3-9-担心":{zh:["不要担心考试。","你已经准备得很好了。"],py:["Bú yào dānxīn kǎoshì.","Nǐ yǐjīng zhǔnbèi de hěn hǎo le."],vi:["Đừng lo lắng về kỳ thi.","Bạn đã chuẩn bị rất tốt rồi."]},
  "3-9-放心":{zh:["妈妈，你放心吧。","我会照顾好自己的。"],py:["Māma, nǐ fàngxīn ba.","Wǒ huì zhàogù hǎo zìjǐ de."],vi:["Mẹ ơi, mẹ yên tâm đi.","Con sẽ tự chăm sóc bản thân tốt."]},
  "3-9-最后":{zh:["考试最后一道题很难。","我想了很久才写出来。"],py:["Kǎoshì zuìhòu yí dào tí hěn nán.","Wǒ xiǎng le hěn jiǔ cái xiě chūlái."],vi:["Câu cuối cùng trong bài thi rất khó.","Tôi nghĩ rất lâu mới viết ra được."]},
  "3-9-比较":{zh:["这件衣服比较贵。","我们再看看别的吧。"],py:["Zhè jiàn yīfu bǐjiào guì.","Wǒmen zài kànkan bié de ba."],vi:["Cái áo này khá đắt.","Chúng ta xem cái khác đi."]},
  "3-9-班":{zh:["我们班有二十个学生。","大家都很喜欢我们的老师。"],py:["Wǒmen bān yǒu èrshí ge xuéshēng.","Dàjiā dōu hěn xǐhuan wǒmen de lǎoshī."],vi:["Lớp chúng tôi có hai mươi học sinh.","Mọi người đều rất thích cô giáo của chúng tôi."]},
  "3-10-个子":{zh:["我弟弟的个子很高。","他才十五岁就一米八了。"],py:["Wǒ dìdi de gèzi hěn gāo.","Tā cái shíwǔ suì jiù yī mǐ bā le."],vi:["Em trai tôi cao lắm.","Nó mới mười lăm tuổi đã một mét tám rồi."]},
  "3-10-中介":{zh:["我找了中介帮我租房子。","他很快就帮我找到了。"],py:["Wǒ zhǎo le zhōngjiè bāng wǒ zū fángzi.","Tā hěn kuài jiù bāng wǒ zhǎo dào le."],vi:["Tôi tìm người môi giới giúp thuê nhà.","Anh ấy rất nhanh đã tìm được cho tôi."]},
  "3-10-主要":{zh:["我来中国主要是学习。","当然也想看看这里的风景。"],py:["Wǒ lái Zhōngguó zhǔyào shì xuéxí.","Dāngrán yě xiǎng kànkan zhèlǐ de fēngjǐng."],vi:["Tôi đến Trung Quốc chủ yếu là để học.","Tất nhiên cũng muốn ngắm phong cảnh ở đây."]},
  "3-10-体育":{zh:["我最喜欢的课是体育课。","每次上课我们都踢足球。"],py:["Wǒ zuì xǐhuan de kè shì tǐyù kè.","Měi cì shàngkè wǒmen dōu tī zúqiú."],vi:["Môn tôi thích nhất là thể dục.","Mỗi lần lên lớp chúng tôi đều đá bóng."]},
  "3-10-历史":{zh:["中国的历史非常长。","我想多看看历史方面的书。"],py:["Zhōngguó de lìshǐ fēicháng cháng.","Wǒ xiǎng duō kànkan lìshǐ fāngmiàn de shū."],vi:["Lịch sử Trung Quốc rất dài.","Tôi muốn đọc thêm sách về lịch sử."]},
  "3-10-地方":{zh:["这个地方真漂亮。","下次我要带朋友一起来。"],py:["Zhège dìfang zhēn piàoliang.","Xià cì wǒ yào dài péngyǒu yìqǐ lái."],vi:["Nơi này đẹp thật.","Lần sau tôi sẽ dẫn bạn bè cùng đến."]},
  "3-10-换":{zh:["这条裤子太小了，能换吗？","好的，我帮您换大一号的。"],py:["Zhè tiáo kùzi tài xiǎo le, néng huàn ma?","Hǎo de, wǒ bāng nín huàn dà yí hào de."],vi:["Cái quần này nhỏ quá, đổi được không?","Được, tôi đổi cho bạn cỡ lớn hơn."]},
  "3-10-数学":{zh:["他数学考了一百分。","全班同学都很佩服他。"],py:["Tā shùxué kǎo le yì bǎi fēn.","Quán bān tóngxué dōu hěn pèifú tā."],vi:["Anh ấy thi toán được một trăm điểm.","Cả lớp đều rất ngưỡng mộ anh ấy."]},
  "3-10-方便":{zh:["这里坐地铁很方便。","十分钟就能到市中心。"],py:["Zhèlǐ zuò dìtiě hěn fāngbiàn.","Shí fēnzhōng jiù néng dào shì zhōngxīn."],vi:["Ở đây đi tàu điện ngầm rất tiện.","Mười phút là đến trung tâm thành phố."]},
  "3-10-旧":{zh:["这双鞋太旧了。","我想去买一双新的。"],py:["Zhè shuāng xié tài jiù le.","Wǒ xiǎng qù mǎi yì shuāng xīn de."],vi:["Đôi giày này cũ quá rồi.","Tôi muốn đi mua một đôi mới."]},
  "3-10-环境":{zh:["这个小区的环境很好。","到处都是绿色的树和花。"],py:["Zhège xiǎoqū de huánjìng hěn hǎo.","Dàochù dōu shì lǜsè de shù hé huā."],vi:["Khu chung cư này môi trường rất tốt.","Khắp nơi đều là cây xanh và hoa."]},
  "3-10-矮":{zh:["那棵树很矮，我能摸到。","我摘了几个苹果给妈妈。"],py:["Nà kē shù hěn ǎi, wǒ néng mō dào.","Wǒ zhāi le jǐ ge píngguǒ gěi māma."],vi:["Cái cây đó rất thấp, tôi với tới được.","Tôi hái mấy quả táo cho mẹ."]},
  "3-10-自行车":{zh:["我骑自行车去上学。","从家到学校大概二十分钟。"],py:["Wǒ qí zìxíngchē qù shàngxué.","Cóng jiā dào xuéxiào dàgài èrshí fēnzhōng."],vi:["Tôi đạp xe đi học.","Từ nhà đến trường khoảng hai mươi phút."]},
  "3-10-附近":{zh:["我家附近有一个超市。","买东西非常方便。"],py:["Wǒ jiā fùjìn yǒu yí ge chāoshì.","Mǎi dōngxi fēicháng fāngbiàn."],vi:["Gần nhà tôi có một siêu thị.","Mua đồ rất tiện lợi."]},
  "3-10-骑":{zh:["他每天骑马去上班。","大家都觉得很有趣。"],py:["Tā měitiān qí mǎ qù shàngbān.","Dàjiā dōu juéde hěn yǒuqù."],vi:["Anh ấy mỗi ngày cưỡi ngựa đi làm.","Mọi người đều thấy rất thú vị."]},
  "3-11-习惯":{zh:["我已经习惯了这里的生活。","刚来的时候什么都不习惯。"],py:["Wǒ yǐ jīng xí guàn le zhè lǐ de shēng huó.","Gāng lái de shí hou shén me dōu bù xí guàn."],vi:["Tôi đã quen với cuộc sống ở đây rồi.","Lúc mới đến cái gì cũng không quen."]},
  "3-11-会议":{zh:["下午两点有一个会议。","大家都要准时参加。"],py:["Xià wǔ liǎng diǎn yǒu yí gè huì yì.","Dà jiā dōu yào zhǔn shí cān jiā."],vi:["Hai giờ chiều có một cuộc họp.","Mọi người đều phải tham gia đúng giờ."]},
  "3-11-借":{zh:["我想借你的书看一下。","没问题，你明天还我就行。"],py:["Wǒ xiǎng jiè nǐ de shū kàn yí xià.","Méi wèn tí, nǐ míng tiān huán wǒ jiù xíng."],vi:["Tôi muốn mượn sách của bạn đọc một chút.","Không vấn đề gì, mai trả lại tôi là được."]},
  "3-11-关":{zh:["出门的时候别忘了关灯。","上次忘了关，电费很贵。"],py:["Chū mén de shí hou bié wàng le guān dēng.","Shàng cì wàng le guān, diàn fèi hěn guì."],vi:["Lúc ra khỏi nhà đừng quên tắt đèn.","Lần trước quên tắt, tiền điện rất đắt."]},
  "3-11-双":{zh:["我买了一双新的运动鞋。","穿起来非常舒服。"],py:["Wǒ mǎi le yì shuāng xīn de yùn dòng xié.","Chuān qǐ lái fēi cháng shū fu."],vi:["Tôi mua một đôi giày thể thao mới.","Mang vào rất thoải mái."]},
  "3-11-口":{zh:["我们家一共有四口人。","爸爸、妈妈、姐姐和我。"],py:["Wǒ men jiā yí gòng yǒu sì kǒu rén.","Bà ba, mā ma, jiě jie hé wǒ."],vi:["Nhà chúng tôi tổng cộng có bốn người.","Bố, mẹ, chị gái và tôi."]},
  "3-11-啤酒":{zh:["哥哥很喜欢喝啤酒。","但是医生说不能喝太多。"],py:["Gē ge hěn xǐ huan hē pí jiǔ.","Dàn shì yī shēng shuō bù néng hē tài duō."],vi:["Anh trai rất thích uống bia.","Nhưng bác sĩ nói không được uống quá nhiều."]},
  "3-11-图书馆":{zh:["我每天都去图书馆看书。","那里很安静，适合学习。"],py:["Wǒ měi tiān dōu qù tú shū guǎn kàn shū.","Nà lǐ hěn ān jìng, shì hé xué xí."],vi:["Tôi mỗi ngày đều đi thư viện đọc sách.","Ở đó rất yên tĩnh, thích hợp để học."]},
  "3-11-地铁":{zh:["坐地铁去公司比较快。","只要二十分钟就到了。"],py:["Zuò dì tiě qù gōng sī bǐ jiào kuài.","Zhǐ yào èr shí fēn zhōng jiù dào le."],vi:["Đi tàu điện ngầm đến công ty nhanh hơn.","Chỉ cần hai mươi phút là đến."]},
  "3-11-忘记":{zh:["我忘记带钥匙了。","只能在门口等家人回来。"],py:["Wǒ wàng jì dài yào shi le.","Zhǐ néng zài mén kǒu děng jiā rén huí lái."],vi:["Tôi quên mang chìa khóa rồi.","Chỉ có thể đứng ở cửa đợi người nhà về."]},
  "3-11-灯":{zh:["房间里的灯坏了。","爸爸说明天去买一个新的。"],py:["Fáng jiān lǐ de dēng huài le.","Bà ba shuō míng tiān qù mǎi yí gè xīn de."],vi:["Đèn trong phòng hỏng rồi.","Bố nói ngày mai đi mua cái mới."]},
  "3-11-瓶子":{zh:["桌上有一个空瓶子。","请帮我把它扔了吧。"],py:["Zhuō shàng yǒu yí gè kōng píng zi.","Qǐng bāng wǒ bǎ tā rēng le ba."],vi:["Trên bàn có một cái chai rỗng.","Giúp tôi vứt nó đi nhé."]},
  "3-11-电子邮件":{zh:["请把文件用电子邮件发给我。","我下午就需要用。"],py:["Qǐng bǎ wén jiàn yòng diàn zǐ yóu jiàn fā gěi wǒ.","Wǒ xià wǔ jiù xū yào yòng."],vi:["Hãy gửi tài liệu qua email cho tôi.","Chiều nay tôi cần dùng."]},
  "3-11-空调":{zh:["夏天太热了，快开空调吧。","开了空调就凉快多了。"],py:["Xià tiān tài rè le, kuài kāi kōng tiáo ba.","Kāi le kōng tiáo jiù liáng kuai duō le."],vi:["Mùa hè nóng quá, bật điều hòa đi.","Bật điều hòa rồi mát hơn nhiều."]},
  "3-11-笔记本":{zh:["我买了一个新的笔记本。","用来记上课的笔记。"],py:["Wǒ mǎi le yí gè xīn de bǐ jì běn.","Yòng lái jì shàng kè de bǐ jì."],vi:["Tôi mua một cuốn sổ ghi chép mới.","Dùng để ghi chép bài giảng."]},
  "3-11-筷子":{zh:["你会用筷子吃饭吗？","我刚学的时候觉得很难。"],py:["Nǐ huì yòng kuài zi chī fàn ma?","Wǒ gāng xué de shí hou jué de hěn nán."],vi:["Bạn biết dùng đũa ăn cơm không?","Lúc mới học tôi thấy rất khó."]},
  "3-11-结束":{zh:["电影已经结束了。","我们出去吃东西吧。"],py:["Diàn yǐng yǐ jīng jié shù le.","Wǒ men chū qù chī dōng xi ba."],vi:["Phim đã kết thúc rồi.","Chúng ta ra ngoài ăn gì đi."]},
  "3-11-词典":{zh:["这本词典对学中文很有用。","我经常用它查不会的字。"],py:["Zhè běn cí diǎn duì xué Zhōng wén hěn yǒu yòng.","Wǒ jīng cháng yòng tā chá bú huì de zì."],vi:["Cuốn từ điển này rất có ích cho việc học tiếng Trung.","Tôi thường dùng nó tra những chữ không biết."]},
  "3-11-还":{zh:["已经十点了，他还没回来。","我开始有点儿担心了。"],py:["Yǐ jīng shí diǎn le, tā hái méi huí lái.","Wǒ kāi shǐ yǒu diǎnr dān xīn le."],vi:["Đã mười giờ rồi, anh ấy vẫn chưa về.","Tôi bắt đầu hơi lo lắng."]},
  "3-12-包":{zh:["我买了一个新的包。","可以放很多东西，很方便。"],py:["Wǒ mǎi le yí gè xīn de bāo.","Kě yǐ fàng hěn duō dōng xi, hěn fāng biàn."],vi:["Tôi mua một cái túi mới.","Có thể đựng nhiều đồ, rất tiện."]},
  "3-12-发现":{zh:["我发现钱包不见了。","可能丢在出租车上了。"],py:["Wǒ fā xiàn qián bāo bú jiàn le.","Kě néng diū zài chū zū chē shàng le."],vi:["Tôi phát hiện ví tiền không thấy đâu.","Có lẽ để quên trên taxi rồi."]},
  "3-12-司机":{zh:["那个司机开车开得很快。","我坐在后面有点儿害怕。"],py:["Nà ge sī jī kāi chē kāi de hěn kuài.","Wǒ zuò zài hòu miàn yǒu diǎnr hài pà."],vi:["Tài xế đó lái xe rất nhanh.","Tôi ngồi phía sau hơi sợ."]},
  "3-12-太阳":{zh:["今天太阳很大，外面很热。","我们去游泳吧！"],py:["Jīn tiān tài yáng hěn dà, wài miàn hěn rè.","Wǒ men qù yóu yǒng ba!"],vi:["Hôm nay nắng to, bên ngoài rất nóng.","Chúng ta đi bơi đi!"]},
  "3-12-护照":{zh:["出国以前要先检查护照。","没有护照是不能上飞机的。"],py:["Chū guó yǐ qián yào xiān jiǎn chá hù zhào.","Méi yǒu hù zhào shì bù néng shàng fēi jī de."],vi:["Trước khi ra nước ngoài phải kiểm tra hộ chiếu.","Không có hộ chiếu thì không được lên máy bay."]},
  "3-12-教":{zh:["王老师教我们数学。","他教得很好，大家都喜欢他。"],py:["Wáng lǎo shī jiāo wǒ men shù xué.","Tā jiāo de hěn hǎo, dà jiā dōu xǐ huan tā."],vi:["Thầy Vương dạy chúng tôi toán.","Thầy dạy rất giỏi, ai cũng thích thầy."]},
  "3-12-画":{zh:["妹妹画了一幅画给我。","画的是我们一家人在公园。"],py:["Mèi mei huà le yì fú huà gěi wǒ.","Huà de shì wǒ men yì jiā rén zài gōng yuán."],vi:["Em gái vẽ một bức tranh tặng tôi.","Vẽ cả nhà chúng tôi ở công viên."]},
  "3-12-自己":{zh:["这件事你要自己决定。","别人不能帮你做选择。"],py:["Zhè jiàn shì nǐ yào zì jǐ jué dìng.","Bié rén bù néng bāng nǐ zuò xuǎn zé."],vi:["Việc này bạn phải tự mình quyết định.","Người khác không thể giúp bạn lựa chọn."]},
  "3-12-西":{zh:["学校的西边有一个公园。","我们经常去那里跑步。"],py:["Xué xiào de xī biān yǒu yí gè gōng yuán.","Wǒ men jīng cháng qù nà lǐ pǎo bù."],vi:["Phía tây trường học có một công viên.","Chúng tôi thường đi chạy bộ ở đó."]},
  "3-12-起飞":{zh:["飞机马上就要起飞了。","请大家把手机关了。"],py:["Fēi jī mǎ shàng jiù yào qǐ fēi le.","Qǐng dà jiā bǎ shǒu jī guān le."],vi:["Máy bay sắp cất cánh rồi.","Mời mọi người tắt điện thoại."]},
  "3-12-需要":{zh:["我需要你帮我一个忙。","你明天有时间吗？"],py:["Wǒ xū yào nǐ bāng wǒ yí gè máng.","Nǐ míng tiān yǒu shí jiān ma?"],vi:["Tôi cần bạn giúp một việc.","Ngày mai bạn có thời gian không?"]},
  "3-12-黑板":{zh:["老师在黑板上写了几个生词。","让我们跟着他读。"],py:["Lǎo shī zài hēi bǎn shàng xiě le jǐ gè shēng cí.","Ràng wǒ men gēn zhe tā dú."],vi:["Thầy giáo viết mấy từ mới lên bảng đen.","Bảo chúng tôi đọc theo thầy."]},
  "3-13-一般":{zh:["他一般七点起床。","但今天他九点才起来。"],py:["Tā yì bān qī diǎn qǐ chuáng.","Dàn jīn tiān tā jiǔ diǎn cái qǐ lái."],vi:["Bình thường anh ấy bảy giờ dậy.","Nhưng hôm nay chín giờ mới dậy."]},
  "3-13-坏":{zh:["我的自行车坏了。","今天只能走路去上班。"],py:["Wǒ de zì xíng chē huài le.","Jīn tiān zhǐ néng zǒu lù qù shàng bān."],vi:["Xe đạp của tôi hỏng rồi.","Hôm nay chỉ có thể đi bộ đi làm."]},
  "3-13-奶奶":{zh:["奶奶做的饺子最好吃了。","我每次回家都要吃很多。"],py:["Nǎi nai zuò de jiǎo zi zuì hǎo chī le.","Wǒ měi cì huí jiā dōu yào chī hěn duō."],vi:["Sủi cảo bà nội làm là ngon nhất.","Mỗi lần về nhà tôi đều ăn rất nhiều."]},
  "3-13-应该":{zh:["你生病了，应该去看医生。","不要自己在家吃药。"],py:["Nǐ shēng bìng le, yīng gāi qù kàn yī shēng.","Bú yào zì jǐ zài jiā chī yào."],vi:["Bạn bị ốm rồi, nên đi khám bác sĩ.","Đừng tự ở nhà uống thuốc."]},
  "3-13-愿意":{zh:["你愿意和我一起去看电影吗？","当然愿意，我们什么时候去？"],py:["Nǐ yuàn yì hé wǒ yì qǐ qù kàn diàn yǐng ma?","Dāng rán yuàn yì, wǒ men shén me shí hou qù?"],vi:["Bạn có sẵn lòng đi xem phim cùng tôi không?","Tất nhiên rồi, chúng ta đi khi nào?"]},
  "3-13-校长":{zh:["校长今天来我们班听课了。","同学们都表现得很好。"],py:["Xiào zhǎng jīn tiān lái wǒ men bān tīng kè le.","Tóng xué men dōu biǎo xiàn de hěn hǎo."],vi:["Hôm nay hiệu trưởng đến lớp dự giờ.","Các bạn đều thể hiện rất tốt."]},
  "3-13-爷爷":{zh:["我的爷爷今年八十岁了。","他每天早上都去公园走路。"],py:["Wǒ de yé ye jīn nián bā shí suì le.","Tā měi tiān zǎo shang dōu qù gōng yuán zǒu lù."],vi:["Ông nội tôi năm nay tám mươi tuổi rồi.","Ông mỗi sáng đều đi bộ ở công viên."]},
  "3-13-生活":{zh:["在中国的生活很有意思。","我每天都能学到新东西。"],py:["Zài Zhōng guó de shēng huó hěn yǒu yì si.","Wǒ měi tiān dōu néng xué dào xīn dōng xi."],vi:["Cuộc sống ở Trung Quốc rất thú vị.","Mỗi ngày tôi đều học được điều mới."]},
  "3-13-礼物":{zh:["生日那天我收到了很多礼物。","我最喜欢朋友送的那本书。"],py:["Shēng rì nà tiān wǒ shōu dào le hěn duō lǐ wù.","Wǒ zuì xǐ huan péng you sòng de nà běn shū."],vi:["Ngày sinh nhật tôi nhận được rất nhiều quà.","Tôi thích nhất cuốn sách bạn tặng."]},
  "3-13-终于":{zh:["我学了三年中文，终于能看中文书了。","我特别高兴。"],py:["Wǒ xué le sān nián Zhōng wén, zhōng yú néng kàn Zhōng wén shū le.","Wǒ tè bié gāo xìng."],vi:["Tôi học ba năm tiếng Trung, cuối cùng cũng đọc được sách tiếng Trung rồi.","Tôi vui lắm."]},
  "3-13-经常":{zh:["我经常和朋友去打篮球。","运动让我觉得很开心。"],py:["Wǒ jīng cháng hé péng you qù dǎ lán qiú.","Yùn dòng ràng wǒ jué de hěn kāi xīn."],vi:["Tôi thường xuyên đi chơi bóng rổ với bạn.","Vận động khiến tôi cảm thấy vui."]},
  "3-13-起来":{zh:["早上六点妈妈叫我起来。","但我太困了，不想起床。"],py:["Zǎo shang liù diǎn mā ma jiào wǒ qǐ lái.","Dàn wǒ tài kùn le, bù xiǎng qǐ chuáng."],vi:["Sáu giờ sáng mẹ gọi tôi dậy.","Nhưng tôi buồn ngủ quá, không muốn dậy."]},
  "3-13-过去":{zh:["过去的事情不要再想了。","我们应该向前看。"],py:["Guò qù de shì qing bú yào zài xiǎng le.","Wǒ men yīng gāi xiàng qián kàn."],vi:["Chuyện quá khứ đừng nghĩ nữa.","Chúng ta nên nhìn về phía trước."]},
  "3-13-遇到":{zh:["今天在超市遇到了老同学。","我们一起去喝了杯咖啡。"],py:["Jīn tiān zài chāo shì yù dào le lǎo tóng xué.","Wǒ men yì qǐ qù hē le bēi kā fēi."],vi:["Hôm nay gặp bạn cũ ở siêu thị.","Chúng tôi cùng đi uống cà phê."]},
  "3-14-像":{zh:["她长得很像她妈妈。","眼睛和嘴巴都一样。"],py:["Tā zhǎng de hěn xiàng tā mā ma.","Yǎn jīng hé zuǐ ba dōu yí yàng."],vi:["Cô ấy trông rất giống mẹ.","Mắt và miệng đều giống nhau."]},
  "3-14-冰箱":{zh:["请把水果放进冰箱里。","天气太热，不然会坏的。"],py:["Qǐng bǎ shuǐ guǒ fàng jìn bīng xiāng lǐ.","Tiān qì tài rè, bù rán huì huài de."],vi:["Hãy bỏ trái cây vào tủ lạnh.","Trời quá nóng, không thì sẽ hỏng mất."]},
  "3-14-刮风":{zh:["外面刮风了，把窗户关上吧。","不然屋里会很冷。"],py:["Wài miàn guā fēng le, bǎ chuāng hu guān shàng ba.","Bù rán wū lǐ huì hěn lěng."],vi:["Bên ngoài có gió rồi, đóng cửa sổ lại đi.","Không thì trong nhà sẽ rất lạnh."]},
  "3-14-叔叔":{zh:["叔叔在北京工作。","他每年过年都回来看我们。"],py:["Shū shu zài Běi jīng gōng zuò.","Tā měi nián guò nián dōu huí lái kàn wǒ men."],vi:["Chú ở Bắc Kinh làm việc.","Hàng năm chú đều về ăn Tết với chúng tôi."]},
  "3-14-声音":{zh:["她唱歌的声音很好听。","同学们都很喜欢听她唱歌。"],py:["Tā chàng gē de shēng yīn hěn hǎo tīng.","Tóng xué men dōu hěn xǐ huan tīng tā chàng gē."],vi:["Giọng hát của cô ấy rất hay.","Các bạn đều rất thích nghe cô ấy hát."]},
  "3-14-干净":{zh:["他把房间打扫得很干净。","妈妈看了非常高兴。"],py:["Tā bǎ fáng jiān dǎ sǎo de hěn gān jìng.","Mā ma kàn le fēi cháng gāo xìng."],vi:["Anh ấy dọn phòng rất sạch sẽ.","Mẹ nhìn thấy rất vui."]},
  "3-14-打扫":{zh:["妈妈让我打扫房间。","我花了一个小时才做完。"],py:["Mā ma ràng wǒ dǎ sǎo fáng jiān.","Wǒ huā le yí gè xiǎo shí cái zuò wán."],vi:["Mẹ bảo tôi quét dọn phòng.","Tôi mất một tiếng mới làm xong."]},
  "3-14-故事":{zh:["奶奶给我讲了一个有趣的故事。","我听着听着就睡着了。"],py:["Nǎi nai gěi wǒ jiǎng le yí gè yǒu qù de gù shi.","Wǒ tīng zhe tīng zhe jiù shuì zháo le."],vi:["Bà kể cho tôi nghe một câu chuyện thú vị.","Tôi nghe mãi rồi ngủ mất."]},
  "3-14-月亮":{zh:["今晚的月亮又大又圆。","我们出去散散步吧。"],py:["Jīn wǎn de yuè liang yòu dà yòu yuán.","Wǒ men chū qù sàn san bù ba."],vi:["Tối nay mặt trăng vừa to vừa tròn.","Chúng ta ra ngoài đi dạo đi."]},
  "3-14-洗澡":{zh:["跑完步以后我要先洗澡。","洗完再吃晚饭。"],py:["Pǎo wán bù yǐ hòu wǒ yào xiān xǐ zǎo.","Xǐ wán zài chī wǎn fàn."],vi:["Chạy bộ xong tôi phải tắm trước.","Tắm xong rồi mới ăn tối."]},
  "3-14-然后":{zh:["先吃早饭，然后去上学。","这是我每天早上的安排。"],py:["Xiān chī zǎo fàn, rán hòu qù shàng xué.","Zhè shì wǒ měi tiān zǎo shang de ān pái."],vi:["Ăn sáng trước, sau đó đi học.","Đây là lịch mỗi sáng của tôi."]},
  "3-14-盘子":{zh:["请帮我拿两个盘子。","菜已经做好了，马上就吃。"],py:["Qǐng bāng wǒ ná liǎng gè pán zi.","Cài yǐ jīng zuò hǎo le, mǎ shàng jiù chī."],vi:["Giúp tôi lấy hai cái đĩa.","Món ăn đã nấu xong rồi, sắp ăn thôi."]},
  "3-14-简单":{zh:["这个问题很简单。","我一下子就做出来了。"],py:["Zhè ge wèn tí hěn jiǎn dān.","Wǒ yí xià zi jiù zuò chū lái le."],vi:["Câu hỏi này rất đơn giản.","Tôi làm ra ngay lập tức."]},
  "3-14-节目":{zh:["昨天晚上的节目很有意思。","我看到很晚才睡觉。"],py:["Zuó tiān wǎn shang de jié mù hěn yǒu yì si.","Wǒ kàn dào hěn wǎn cái shuì jiào."],vi:["Chương trình tối qua rất hay.","Tôi xem đến khuya mới đi ngủ."]},
  "3-14-菜单":{zh:["服务员把菜单拿过来了。","我们看看点什么菜吧。"],py:["Fú wù yuán bǎ cài dān ná guò lái le.","Wǒ men kàn kan diǎn shén me cài ba."],vi:["Phục vụ mang thực đơn đến rồi.","Chúng ta xem gọi món gì đi."]},
  "3-14-阿姨":{zh:["隔壁阿姨经常给我们送水果。","她对我们非常好。"],py:["Gé bì ā yí jīng cháng gěi wǒ men sòng shuǐ guǒ.","Tā duì wǒ men fēi cháng hǎo."],vi:["Cô hàng xóm thường cho chúng tôi trái cây.","Cô ấy đối xử với chúng tôi rất tốt."]},
  "3-14-香蕉":{zh:["弟弟最爱吃香蕉。","妈妈每次去超市都给他买。"],py:["Dì di zuì ài chī xiāng jiāo.","Mā ma měi cì qù chāo shì dōu gěi tā mǎi."],vi:["Em trai thích ăn chuối nhất.","Mẹ mỗi lần đi siêu thị đều mua cho em."]},
  "3-15-上网":{zh:["他一有时间就上网。","不是看视频就是聊天。"],py:["Tā yì yǒu shí jiān jiù shàng wǎng.","Bú shì kàn shì pín jiù shì liáo tiān."],vi:["Hễ có thời gian là anh ấy lên mạng.","Không xem video thì nói chuyện."]},
  "3-15-世界":{zh:["世界上有很多有意思的地方。","我最想去的是法国。"],py:["Shì jiè shàng yǒu hěn duō yǒu yì si de dì fang.","Wǒ zuì xiǎng qù de shì Fǎ guó."],vi:["Trên thế giới có rất nhiều nơi thú vị.","Nơi tôi muốn đến nhất là Pháp."]},
  "3-15-举行":{zh:["学校下周要举行运动会。","同学们都在认真准备。"],py:["Xué xiào xià zhōu yào jǔ xíng yùn dòng huì.","Tóng xué men dōu zài rèn zhēn zhǔn bèi."],vi:["Tuần sau trường sẽ tổ chức hội thể thao.","Các bạn đều đang chuẩn bị nghiêm túc."]},
  "3-15-其他":{zh:["除了小明，其他人都到了。","我们再等他五分钟吧。"],py:["Chú le Xiǎo Míng, qí tā rén dōu dào le.","Wǒ men zài děng tā wǔ fēn zhōng ba."],vi:["Ngoài Tiểu Minh ra, những người khác đều đến rồi.","Chúng ta đợi bạn ấy thêm năm phút nữa."]},
  "3-15-发":{zh:["我给你发了一封电子邮件。","你看了以后回复我一下。"],py:["Wǒ gěi nǐ fā le yì fēng diàn zǐ yóu jiàn.","Nǐ kàn le yǐ hòu huí fù wǒ yí xià."],vi:["Tôi đã gửi cho bạn một email.","Bạn xem xong trả lời tôi nhé."]},
  "3-15-句子":{zh:["请把这个句子翻译成英文。","我试了半天也翻不好。"],py:["Qǐng bǎ zhè ge jù zi fān yì chéng Yīng wén.","Wǒ shì le bàn tiān yě fān bù hǎo."],vi:["Hãy dịch câu này sang tiếng Anh.","Tôi thử mãi mà dịch không được."]},
  "3-15-各":{zh:["各位同学请注意听。","下面我要说一件重要的事。"],py:["Gè wèi tóng xué qǐng zhù yì tīng.","Xià miàn wǒ yào shuō yí jiàn zhòng yào de shì."],vi:["Các bạn học sinh chú ý nghe.","Bây giờ tôi sẽ nói một việc quan trọng."]},
  "3-15-完成":{zh:["我终于完成了这篇文章。","写了三天才写好。"],py:["Wǒ zhōng yú wán chéng le zhè piān wén zhāng.","Xiě le sān tiān cái xiě hǎo."],vi:["Tôi cuối cùng cũng hoàn thành bài viết này.","Viết ba ngày mới viết xong."]},
  "3-15-提高":{zh:["我想提高我的口语水平。","所以每天都和中国朋友聊天。"],py:["Wǒ xiǎng tí gāo wǒ de kǒu yǔ shuǐ píng.","Suǒ yǐ měi tiān dōu hé Zhōng guó péng you liáo tiān."],vi:["Tôi muốn nâng cao trình độ nói.","Nên mỗi ngày đều trò chuyện với bạn Trung Quốc."]},
  "3-15-文化":{zh:["我对中国文化很感兴趣。","特别是中国的书法和音乐。"],py:["Wǒ duì Zhōng guó wén huà hěn gǎn xìng qù.","Tè bié shì Zhōng guó de shū fǎ hé yīn yuè."],vi:["Tôi rất quan tâm đến văn hóa Trung Quốc.","Đặc biệt là thư pháp và âm nhạc Trung Quốc."]},
  "3-15-新闻":{zh:["我每天早上都看新闻。","这样可以了解世界上的事情。"],py:["Wǒ měi tiān zǎo shang dōu kàn xīn wén.","Zhè yàng kě yǐ liǎo jiě shì jiè shàng de shì qing."],vi:["Tôi mỗi sáng đều xem tin tức.","Như vậy có thể hiểu chuyện trên thế giới."]},
  "3-15-极了":{zh:["今天热极了，大家都不想出门。","还是在家开空调舒服。"],py:["Jīn tiān rè jí le, dà jiā dōu bù xiǎng chū mén.","Hái shì zài jiā kāi kōng tiáo shū fu."],vi:["Hôm nay nóng cực kỳ, ai cũng không muốn ra ngoài.","Vẫn là ở nhà bật điều hòa thoải mái hơn."]},
  "3-15-水平":{zh:["她的汉语水平很高。","因为她每天都练习说中文。"],py:["Tā de Hàn yǔ shuǐ píng hěn gāo.","Yīn wèi tā měi tiān dōu liàn xí shuō Zhōng wén."],vi:["Trình độ tiếng Trung của cô ấy rất cao.","Vì cô ấy mỗi ngày đều luyện nói tiếng Trung."]},
  "3-15-注意":{zh:["过马路的时候要注意安全。","不要一边走一边看手机。"],py:["Guò mǎ lù de shí hou yào zhù yì ān quán.","Bú yào yì biān zǒu yì biān kàn shǒu jī."],vi:["Khi qua đường phải chú ý an toàn.","Đừng vừa đi vừa xem điện thoại."]},
  "3-15-留学":{zh:["我明年打算去中国留学。","希望能在那边认识很多新朋友。"],py:["Wǒ míng nián dǎ suàn qù Zhōng guó liú xué.","Xī wàng néng zài nà biān rèn shi hěn duō xīn péng you."],vi:["Năm sau tôi dự định đi du học ở Trung Quốc.","Hy vọng có thể quen được nhiều bạn mới ở đó."]},
  "3-15-练习":{zh:["老师让我们多练习写汉字。","我每天都写一个小时。"],py:["Lǎo shī ràng wǒ men duō liàn xí xiě Hàn zì.","Wǒ měi tiān dōu xiě yí gè xiǎo shí."],vi:["Thầy giáo bảo chúng tôi luyện viết chữ Hán nhiều hơn.","Tôi mỗi ngày đều viết một tiếng."]},
  "3-15-节日":{zh:["春节是中国最重要的节日。","大家都回家和家人一起过。"],py:["Chūn Jié shì Zhōng guó zuì zhòng yào de jié rì.","Dà jiā dōu huí jiā hé jiā rén yì qǐ guò."],vi:["Tết Nguyên Đán là ngày lễ quan trọng nhất của Trung Quốc.","Mọi người đều về nhà đón cùng gia đình."]},
  "3-15-花":{zh:["公园里的花开了，特别漂亮。","我拍了很多照片发给朋友。"],py:["Gōng yuán lǐ de huā kāi le, tè bié piào liang.","Wǒ pāi le hěn duō zhào piàn fā gěi péng you."],vi:["Hoa trong công viên nở rồi, đặc biệt đẹp.","Tôi chụp nhiều ảnh gửi cho bạn bè."]},
  "3-15-街道":{zh:["这条街道上有很多商店。","周末的时候人特别多。"],py:["Zhè tiáo jiē dào shàng yǒu hěn duō shāng diàn.","Zhōu mò de shí hou rén tè bié duō."],vi:["Con đường phố này có rất nhiều cửa hàng.","Cuối tuần người đông lắm."]},
  "3-15-要求":{zh:["老师要求我们每天写日记。","虽然很累，但对学习有帮助。"],py:["Lǎo shī yāo qiú wǒ men měi tiān xiě rì jì.","Suī rán hěn lèi, dàn duì xué xí yǒu bāng zhù."],vi:["Thầy giáo yêu cầu chúng tôi mỗi ngày viết nhật ký.","Tuy mệt nhưng rất có ích cho việc học."]},
  "3-15-除了":{zh:["除了中文，我还学了日语。","但是中文学得比较好。"],py:["Chú le Zhōng wén, wǒ hái xué le Rì yǔ.","Dàn shì Zhōng wén xué de bǐ jiào hǎo."],vi:["Ngoài tiếng Trung, tôi còn học tiếng Nhật.","Nhưng tiếng Trung học tốt hơn."]},
  "3-16-公斤":{zh:["这个西瓜有五公斤重。","我一个人吃不完。"],py:["Zhè ge xī guā yǒu wǔ gōng jīn zhòng.","Wǒ yí gè rén chī bù wán."],vi:["Quả dưa hấu này nặng năm kilôgam.","Một mình tôi ăn không hết."]},
  "3-16-关系":{zh:["他们两个人的关系很好。","从小到大一直是好朋友。"],py:["Tā men liǎng gè rén de guān xì hěn hǎo.","Cóng xiǎo dào dà yì zhí shì hǎo péng you."],vi:["Quan hệ của hai người họ rất tốt.","Từ nhỏ đến lớn luôn là bạn tốt."]},
  "3-16-别人":{zh:["不要随便动别人的东西。","这样做是不礼貌的。"],py:["Bú yào suí biàn dòng bié rén de dōng xi.","Zhè yàng zuò shì bù lǐ mào de."],vi:["Đừng tùy tiện động đồ của người khác.","Làm vậy là không lịch sự."]},
  "3-16-刷牙":{zh:["医生说要每天刷牙两次。","早上一次，晚上一次。"],py:["Yī shēng shuō yào měi tiān shuā yá liǎng cì.","Zǎo shang yí cì, wǎn shang yí cì."],vi:["Bác sĩ nói phải đánh răng hai lần mỗi ngày.","Sáng một lần, tối một lần."]},
  "3-16-可爱":{zh:["这只小狗真可爱！","我也好想养一只。"],py:["Zhè zhī xiǎo gǒu zhēn kě ài!","Wǒ yě hǎo xiǎng yǎng yì zhī."],vi:["Chú chó nhỏ này dễ thương quá!","Tôi cũng muốn nuôi một con."]},
  "3-16-城市":{zh:["北京是一个很大的城市。","那里有很多好吃的东西。"],py:["Běi jīng shì yí gè hěn dà de chéng shì.","Nà lǐ yǒu hěn duō hǎo chī de dōng xi."],vi:["Bắc Kinh là một thành phố rất lớn.","Ở đó có rất nhiều đồ ăn ngon."]},
  "3-16-头发":{zh:["她的头发又黑又长。","大家都说她很漂亮。"],py:["Tā de tóu fa yòu hēi yòu cháng.","Dà jiā dōu shuō tā hěn piào liang."],vi:["Tóc cô ấy vừa đen vừa dài.","Mọi người đều nói cô ấy rất đẹp."]},
  "3-16-如果":{zh:["如果明天下雨，我们就不去了。","我们可以在家看电影。"],py:["Rú guǒ míng tiān xià yǔ, wǒ men jiù bú qù le.","Wǒ men kě yǐ zài jiā kàn diàn yǐng."],vi:["Nếu ngày mai mưa thì chúng ta không đi nữa.","Chúng ta có thể ở nhà xem phim."]},
  "3-16-帽子":{zh:["今天太阳很大，戴顶帽子吧。","这样就不会太热了。"],py:["Jīn tiān tài yáng hěn dà, dài dǐng mào zi ba.","Zhè yàng jiù bú huì tài rè le."],vi:["Hôm nay nắng to, đội mũ đi.","Như vậy sẽ không bị quá nóng."]},
  "3-16-检查":{zh:["考试以后要认真检查一遍。","这样才不会出错。"],py:["Kǎo shì yǐ hòu yào rèn zhēn jiǎn chá yí biàn.","Zhè yàng cái bú huì chū cuò."],vi:["Sau khi thi phải kiểm tra lại một lần cẩn thận.","Như vậy mới không bị sai."]},
  "3-16-皮鞋":{zh:["这双皮鞋很漂亮。","但是穿了一天脚有点儿疼。"],py:["Zhè shuāng pí xié hěn piào liang.","Dàn shì chuān le yì tiān jiǎo yǒu diǎnr téng."],vi:["Đôi giày da này rất đẹp.","Nhưng đi cả ngày chân hơi đau."]},
  "3-16-米":{zh:["这棵树有十米高。","是我们学校最高的树。"],py:["Zhè kē shù yǒu shí mǐ gāo.","Shì wǒ men xué xiào zuì gāo de shù."],vi:["Cây này cao mười mét.","Là cây cao nhất ở trường chúng tôi."]},
  "3-16-认为":{zh:["我认为学中文很有意思。","虽然有时候语法很难。"],py:["Wǒ rèn wéi xué Zhōng wén hěn yǒu yì si.","Suī rán yǒu shí hou yǔ fǎ hěn nán."],vi:["Tôi cho rằng học tiếng Trung rất thú vị.","Mặc dù đôi khi ngữ pháp rất khó."]},
  "3-16-词语":{zh:["这几个词语的意思差不多。","但是用法不太一样。"],py:["Zhè jǐ gè cí yǔ de yì si chà bù duō.","Dàn shì yòng fǎ bú tài yí yàng."],vi:["Mấy từ ngữ này nghĩa gần giống nhau.","Nhưng cách dùng không giống nhau lắm."]},
  "3-16-长":{zh:["这条路很长，要走半个小时。","我们坐公共汽车去吧。"],py:["Zhè tiáo lù hěn cháng, yào zǒu bàn gè xiǎo shí.","Wǒ men zuò gōng gòng qì chē qù ba."],vi:["Con đường này rất dài, phải đi bộ nửa tiếng.","Chúng ta đi xe buýt đi."]},
  "3-16-鼻子":{zh:["他感冒了，鼻子不太通。","吃了药以后好多了。"],py:["Tā gǎn mào le, bí zi bú tài tōng.","Chī le yào yǐ hòu hǎo duō le."],vi:["Anh ấy bị cảm, mũi không thông.","Uống thuốc rồi thì đỡ nhiều."]},
  "3-17-一共":{zh:["我们班一共有三十个学生。","老师说还有两个人没来。"],py:["Wǒ men bān yí gòng yǒu sān shí gè xué shēng.","Lǎo shī shuō hái yǒu liǎng gè rén méi lái."],vi:["Lớp chúng tôi tổng cộng có ba mươi học sinh.","Thầy giáo nói còn hai người chưa đến."]},
  "3-17-为了":{zh:["为了考试，他每天复习到很晚。","终于考了一个好成绩。"],py:["Wèi le kǎo shì, tā měi tiān fù xí dào hěn wǎn.","Zhōng yú kǎo le yí gè hǎo chéng jì."],vi:["Vì kỳ thi, anh ấy mỗi ngày ôn bài đến rất khuya.","Cuối cùng đã đạt thành tích tốt."]},
  "3-17-冬天":{zh:["北京的冬天很冷。","经常下雪，要穿很多衣服。"],py:["Běi jīng de dōng tiān hěn lěng.","Jīng cháng xià xuě, yào chuān hěn duō yī fu."],vi:["Mùa đông ở Bắc Kinh rất lạnh.","Thường xuyên có tuyết, phải mặc nhiều quần áo."]},
  "3-17-决定":{zh:["我决定明年去北京工作。","爸爸妈妈都很支持我。"],py:["Wǒ jué dìng míng nián qù Běi jīng gōng zuò.","Bà ba mā ma dōu hěn zhī chí wǒ."],vi:["Tôi quyết định năm sau đi Bắc Kinh làm việc.","Bố mẹ đều ủng hộ tôi."]},
  "3-17-办法":{zh:["我想不到好的办法。","你能帮我想一想吗？"],py:["Wǒ xiǎng bú dào hǎo de bàn fǎ.","Nǐ néng bāng wǒ xiǎng yi xiǎng ma?"],vi:["Tôi nghĩ không ra cách nào hay.","Bạn có thể giúp tôi nghĩ được không?"]},
  "3-17-口":{zh:["到了路口往左拐就到了。","很近，走五分钟就能到。"],py:["Dào le lù kǒu wǎng zuǒ guǎi jiù dào le.","Hěn jìn, zǒu wǔ fēn zhōng jiù néng dào."],vi:["Đến ngã tư rẽ trái là tới.","Rất gần, đi bộ năm phút là đến."]},
  "3-17-后来":{zh:["小时候我不喜欢运动。","后来慢慢地爱上了跑步。"],py:["Xiǎo shí hou wǒ bù xǐ huan yùn dòng.","Hòu lái màn màn de ài shàng le pǎo bù."],vi:["Hồi nhỏ tôi không thích vận động.","Về sau dần dần yêu thích chạy bộ."]},
  "3-17-必须":{zh:["明天有考试，今天必须复习。","不然成绩会不好。"],py:["Míng tiān yǒu kǎo shì, jīn tiān bì xū fù xí.","Bù rán chéng jì huì bù hǎo."],vi:["Ngày mai có thi, hôm nay phải ôn bài.","Không thì thành tích sẽ không tốt."]},
  "3-17-情况":{zh:["你先说说你的情况吧。","我听了以后再帮你想办法。"],py:["Nǐ xiān shuō shuo nǐ de qíng kuàng ba.","Wǒ tīng le yǐ hòu zài bāng nǐ xiǎng bàn fǎ."],vi:["Bạn nói về tình hình của bạn trước đi.","Tôi nghe xong rồi sẽ giúp bạn nghĩ cách."]},
  "3-17-根据":{zh:["根据天气预报，明天会下雨。","我们最好带上雨伞。"],py:["Gēn jù tiān qì yù bào, míng tiān huì xià yǔ.","Wǒ men zuì hǎo dài shang yǔ sǎn."],vi:["Theo dự báo thời tiết, ngày mai sẽ mưa.","Chúng ta tốt nhất mang theo ô."]},
  "3-17-渴":{zh:["跑完步以后我渴极了。","一口气喝了两杯水。"],py:["Pǎo wán bù yǐ hòu wǒ kě jí le.","Yì kǒu qì hē le liǎng bēi shuǐ."],vi:["Chạy bộ xong tôi khát cực kỳ.","Uống một hơi hai ly nước."]},
  "3-17-爱好":{zh:["他的爱好是打篮球。","每个周末他都去打球。"],py:["Tā de ài hào shì dǎ lán qiú.","Měi gè zhōu mò tā dōu qù dǎ qiú."],vi:["Sở thích của anh ấy là chơi bóng rổ.","Mỗi cuối tuần anh ấy đều đi đánh bóng."]},
  "3-17-请假":{zh:["我今天生病了，想请假。","老师说可以，让我好好休息。"],py:["Wǒ jīn tiān shēng bìng le, xiǎng qǐng jià.","Lǎo shī shuō kě yǐ, ràng wǒ hǎo hǎo xiū xi."],vi:["Hôm nay tôi bị ốm, muốn xin nghỉ phép.","Thầy giáo nói được, bảo tôi nghỉ ngơi cho tốt."]},
  "3-17-选择":{zh:["这两件衣服都好看，很难选择。","最后我买了那件红色的。"],py:["Zhè liǎng jiàn yī fu dōu hǎo kàn, hěn nán xuǎn zé.","Zuì hòu wǒ mǎi le nà jiàn hóng sè de."],vi:["Hai cái áo đều đẹp, rất khó lựa chọn.","Cuối cùng tôi mua cái màu đỏ."]},
  "3-17-邻居":{zh:["我们的邻居是一位老太太。","她做的菜特别好吃。"],py:["Wǒ men de lín jū shì yí wèi lǎo tài tai.","Tā zuò de cài tè bié hǎo chī."],vi:["Hàng xóm chúng tôi là một bà cụ.","Bà ấy nấu ăn rất ngon."]},
  "3-17-饱":{zh:["我吃得太饱了，走不动了。","下次不能吃那么多了。"],py:["Wǒ chī de tài bǎo le, zǒu bú dòng le.","Xià cì bù néng chī nà me duō le."],vi:["Tôi ăn no quá, đi không nổi.","Lần sau không được ăn nhiều vậy nữa."]},
  "3-18-万":{zh:["这个城市有一百万人。","是一个非常热闹的地方。"],py:["Zhè ge chéng shì yǒu yì bǎi wàn rén.","Shì yí gè fēi cháng rè nao de dì fang."],vi:["Thành phố này có một triệu người.","Là một nơi rất sôi động."]},
  "3-18-不但...而且":{zh:["他不但会说中文，而且写得也很好。","我们都应该向他学习。"],py:["Tā bú dàn huì shuō Zhōng wén, ér qiě xiě de yě hěn hǎo.","Wǒ men dōu yīng gāi xiàng tā xué xí."],vi:["Anh ấy không những biết nói tiếng Trung, mà còn viết rất giỏi.","Chúng ta đều nên học tập anh ấy."]},
  "3-18-关于":{zh:["这本书是关于中国历史的。","我觉得很有意思。"],py:["Zhè běn shū shì guān yú Zhōng guó lì shǐ de.","Wǒ jué de hěn yǒu yì si."],vi:["Cuốn sách này về lịch sử Trung Quốc.","Tôi thấy rất thú vị."]},
  "3-18-动物":{zh:["我最喜欢的动物是猫。","我家养了两只小猫。"],py:["Wǒ zuì xǐ huan de dòng wù shì māo.","Wǒ jiā yǎng le liǎng zhī xiǎo māo."],vi:["Động vật tôi thích nhất là mèo.","Nhà tôi nuôi hai con mèo nhỏ."]},
  "3-18-只":{zh:["冰箱里只有一个鸡蛋了。","我们要去超市买东西。"],py:["Bīng xiāng lǐ zhǐ yǒu yí gè jī dàn le.","Wǒ men yào qù chāo shì mǎi dōng xi."],vi:["Trong tủ lạnh chỉ còn một quả trứng.","Chúng ta phải đi siêu thị mua đồ."]},
  "3-18-同意":{zh:["我不太同意你的看法。","我觉得我们应该再想想。"],py:["Wǒ bú tài tóng yì nǐ de kàn fǎ.","Wǒ jué de wǒ men yīng gāi zài xiǎng xiǎng."],vi:["Tôi không đồng ý lắm với cách nhìn của bạn.","Tôi nghĩ chúng ta nên suy nghĩ thêm."]},
  "3-18-向":{zh:["他向我走过来，笑着说你好。","原来他是我的新同事。"],py:["Tā xiàng wǒ zǒu guò lái, xiào zhe shuō nǐ hǎo.","Yuán lái tā shì wǒ de xīn tóng shì."],vi:["Anh ấy đi về phía tôi, cười nói xin chào.","Hóa ra anh ấy là đồng nghiệp mới của tôi."]},
  "3-18-嘴":{zh:["弟弟的嘴上都是西瓜汁。","妈妈笑着帮他擦干净了。"],py:["Dì di de zuǐ shàng dōu shì xī guā zhī.","Mā ma xiào zhe bāng tā cā gān jìng le."],vi:["Miệng em trai toàn nước dưa hấu.","Mẹ cười giúp em lau sạch."]},
  "3-18-国家":{zh:["中国是一个很大的国家。","有很多美丽的地方可以去。"],py:["Zhōng guó shì yí gè hěn dà de guó jiā.","Yǒu hěn duō měi lì de dì fang kě yǐ qù."],vi:["Trung Quốc là một quốc gia rất lớn.","Có rất nhiều nơi đẹp có thể đi."]},
  "3-18-地":{zh:["他高兴地跑了过来。","告诉我他考了第一名。"],py:["Tā gāo xìng de pǎo le guò lái.","Gào su wǒ tā kǎo le dì yī míng."],vi:["Anh ấy vui vẻ chạy đến.","Nói với tôi là anh ấy thi được hạng nhất."]},
  "3-18-奇怪":{zh:["今天天气很奇怪。","早上很热，下午突然下雨了。"],py:["Jīn tiān tiān qì hěn qí guài.","Zǎo shang hěn rè, xià wǔ tū rán xià yǔ le."],vi:["Thời tiết hôm nay rất kỳ lạ.","Sáng rất nóng, chiều đột nhiên mưa."]},
  "3-18-机会":{zh:["这是一个很好的机会。","你一定不要错过。"],py:["Zhè shì yí gè hěn hǎo de jī huì.","Nǐ yí dìng bú yào cuò guò."],vi:["Đây là một cơ hội rất tốt.","Bạn nhất định đừng bỏ lỡ."]},
  "3-18-段":{zh:["这段话你说得很好。","请再读一遍给大家听。"],py:["Zhè duàn huà nǐ shuō de hěn hǎo.","Qǐng zài dú yí biàn gěi dà jiā tīng."],vi:["Đoạn này bạn nói rất hay.","Hãy đọc lại một lần cho mọi người nghe."]},
  "3-18-特点":{zh:["每个城市都有自己的特点。","北京的特点是历史很长。"],py:["Měi gè chéng shì dōu yǒu zì jǐ de tè diǎn.","Běi jīng de tè diǎn shì lì shǐ hěn cháng."],vi:["Mỗi thành phố đều có đặc điểm riêng.","Đặc điểm của Bắc Kinh là lịch sử lâu đời."]},
  "3-18-相信":{zh:["我相信你一定能做到。","不要放弃，加油！"],py:["Wǒ xiāng xìn nǐ yí dìng néng zuò dào.","Bú yào fàng qì, jiā yóu!"],vi:["Tôi tin bạn nhất định làm được.","Đừng bỏ cuộc, cố lên!"]},
  "3-18-种":{zh:["这里有好几种水果。","你最想吃哪一种呢？"],py:["Zhè lǐ yǒu hǎo jǐ zhǒng shuǐ guǒ.","Nǐ zuì xiǎng chī nǎ yì zhǒng ne?"],vi:["Ở đây có mấy loại trái cây.","Bạn muốn ăn loại nào nhất?"]},
  "3-19-位":{zh:["这位是我们的新老师。","请大家热烈欢迎她！"],py:["Zhè wèi shì wǒ men de xīn lǎo shī.","Qǐng dà jiā rè liè huān yíng tā!"],vi:["Vị này là thầy giáo mới của chúng ta.","Mời mọi người nhiệt liệt chào đón!"]},
  "3-19-哭":{zh:["小妹妹摔倒了，哭了起来。","妈妈赶快跑过去抱她。"],py:["Xiǎo mèi mei shuāi dǎo le, kū le qǐ lái.","Mā ma gǎn kuài pǎo guò qù bào tā."],vi:["Em gái nhỏ ngã, khóc lên.","Mẹ nhanh chóng chạy đến ôm em."]},
  "3-19-张":{zh:["桌子上有一张中国地图。","我在上面找到了北京。"],py:["Zhuō zi shàng yǒu yì zhāng Zhōng guó dì tú.","Wǒ zài shàng miàn zhǎo dào le Běi jīng."],vi:["Trên bàn có một tấm bản đồ Trung Quốc.","Tôi tìm thấy Bắc Kinh trên đó."]},
  "3-19-短":{zh:["这条裤子太短了。","我想换一条长一点的。"],py:["Zhè tiáo kù zi tài duǎn le.","Wǒ xiǎng huàn yì tiáo cháng yì diǎn de."],vi:["Cái quần này ngắn quá.","Tôi muốn đổi cái dài hơn một chút."]},
  "3-19-秋天":{zh:["秋天到了，树叶变黄了。","天气也慢慢变凉了。"],py:["Qiū tiān dào le, shù yè biàn huáng le.","Tiān qì yě màn màn biàn liáng le."],vi:["Mùa thu đến rồi, lá cây chuyển vàng.","Thời tiết cũng dần dần mát hơn."]},
  "3-19-经过":{zh:["每天上班我都经过一个公园。","里面的花开得很漂亮。"],py:["Měi tiān shàng bān wǒ dōu jīng guò yí gè gōng yuán.","Lǐ miàn de huā kāi de hěn piào liang."],vi:["Mỗi ngày đi làm tôi đều đi qua một công viên.","Hoa bên trong nở rất đẹp."]},
  "3-19-耳朵":{zh:["我的耳朵有点儿疼。","妈妈说应该去看医生。"],py:["Wǒ de ěr duo yǒu diǎnr téng.","Mā ma shuō yīng gāi qù kàn yī shēng."],vi:["Tai tôi hơi đau.","Mẹ nói nên đi khám bác sĩ."]},
  "3-19-脸":{zh:["她的脸红了，不好意思地笑了。","大家都觉得她很可爱。"],py:["Tā de liǎn hóng le, bù hǎo yì si de xiào le.","Dà jiā dōu jué de tā hěn kě ài."],vi:["Mặt cô ấy đỏ lên, ngượng ngùng cười.","Mọi người đều thấy cô ấy rất dễ thương."]},
  "3-19-船":{zh:["我们坐船过了那条河。","河上的风景很漂亮。"],py:["Wǒ men zuò chuán guò le nà tiáo hé.","Hé shàng de fēng jǐng hěn piào liang."],vi:["Chúng tôi đi thuyền qua con sông đó.","Phong cảnh trên sông rất đẹp."]},
  "3-19-马":{zh:["我在农村看到了一匹马。","它跑起来非常快。"],py:["Wǒ zài nóng cūn kàn dào le yì pǐ mǎ.","Tā pǎo qǐ lái fēi cháng kuài."],vi:["Tôi nhìn thấy một con ngựa ở nông thôn.","Nó chạy rất nhanh."]},
  "3-19-鸟":{zh:["树上有一只小鸟在唱歌。","它的声音非常好听。"],py:["Shù shàng yǒu yì zhī xiǎo niǎo zài chàng gē.","Tā de shēng yīn fēi cháng hǎo tīng."],vi:["Trên cây có một con chim nhỏ đang hót.","Tiếng hót của nó rất hay."]},
  "3-19-黄河":{zh:["黄河是中国第二长的河。","很多人都想去看一看。"],py:["Huáng Hé shì Zhōng guó dì èr cháng de hé.","Hěn duō rén dōu xiǎng qù kàn yi kàn."],vi:["Hoàng Hà là con sông dài thứ hai Trung Quốc.","Rất nhiều người đều muốn đi xem."]},
  "3-20-东":{zh:["我家在学校的东边。","走路大概要十五分钟。"],py:["Wǒ jiā zài xué xiào de dōng biān.","Zǒu lù dà gài yào shí wǔ fēn zhōng."],vi:["Nhà tôi ở phía đông trường học.","Đi bộ mất khoảng mười lăm phút."]},
  "3-20-信用卡":{zh:["我的信用卡忘在家里了。","只能用手机付钱了。"],py:["Wǒ de xìn yòng kǎ wàng zài jiā lǐ le.","Zhǐ néng yòng shǒu jī fù qián le."],vi:["Thẻ tín dụng tôi quên ở nhà rồi.","Chỉ có thể dùng điện thoại trả tiền thôi."]},
  "3-20-关心":{zh:["妈妈很关心我的学习。","每天都问我作业做完了没有。"],py:["Mā ma hěn guān xīn wǒ de xué xí.","Měi tiān dōu wèn wǒ zuò yè zuò wán le méi yǒu."],vi:["Mẹ rất quan tâm đến việc học của tôi.","Mỗi ngày đều hỏi tôi làm bài tập xong chưa."]},
  "3-20-分":{zh:["请再等我十分钟。","我换好衣服就出来。"],py:["Qǐng zài děng wǒ shí fēn zhōng.","Wǒ huàn hǎo yī fu jiù chū lái."],vi:["Vui lòng đợi tôi mười phút nữa.","Tôi thay đồ xong là ra ngay."]},
  "3-20-只有…才":{zh:["只有每天练习，才能学好中文。","老师经常这样告诉我们。"],py:["Zhǐ yǒu měi tiān liàn xí, cái néng xué hǎo Zhōng wén.","Lǎo shī jīng cháng zhè yàng gào su wǒ men."],vi:["Chỉ có luyện tập mỗi ngày, mới có thể học giỏi tiếng Trung.","Thầy giáo thường nói với chúng tôi như vậy."]},
  "3-20-成绩":{zh:["这次考试他的成绩很好。","爸爸妈妈都很开心。"],py:["Zhè cì kǎo shì tā de chéng jì hěn hǎo.","Bà ba mā ma dōu hěn kāi xīn."],vi:["Kỳ thi này điểm của anh ấy rất tốt.","Bố mẹ đều rất vui."]},
  "3-20-照相机":{zh:["这个照相机是爸爸送我的。","我用它拍了很多漂亮的照片。"],py:["Zhè ge zhào xiàng jī shì bà ba sòng wǒ de.","Wǒ yòng tā pāi le hěn duō piào liang de zhào piàn."],vi:["Chiếc máy ảnh này là bố tặng tôi.","Tôi dùng nó chụp được rất nhiều ảnh đẹp."]},
  "3-20-被":{zh:["我的手机被弟弟弄坏了。","我很生气，但他说了对不起。"],py:["Wǒ de shǒu jī bèi dì di nòng huài le.","Wǒ hěn shēng qì, dàn tā shuō le duì bu qǐ."],vi:["Điện thoại của tôi bị em trai làm hỏng.","Tôi rất tức giận, nhưng nó đã xin lỗi."]},
  "3-20-难过":{zh:["听到这个消息，她很难过。","朋友们都来安慰她。"],py:["Tīng dào zhè ge xiāo xi, tā hěn nán guò.","Péng you men dōu lái ān wèi tā."],vi:["Nghe tin này, cô ấy rất buồn.","Bạn bè đều đến an ủi cô ấy."]},
  "4-1-生活":{zh:["我很喜欢现在的生活。","每天都过得很开心。"],py:["Wǒ hěn xǐ huān xiàn zài de shēng huó.","Měi tiān dōu guò de hěn kāi xīn."],vi:["Tôi rất thích cuộc sống hiện tại.","Mỗi ngày đều sống rất vui vẻ."]},
  "4-2-真正":{zh:["真正的朋友会在困难时帮助你。","他就是这样的人。"],py:["Zhēn zhèng de péng yǒu huì zài kùn nán shí bāng zhù nǐ.","Tā jiù shì zhè yàng de rén."],vi:["Bạn bè thật sự sẽ giúp đỡ bạn khi khó khăn.","Anh ấy chính là người như vậy."]},
  "4-4-一切":{zh:["只要你努力，一切都会好起来。","不要太担心。"],py:["Zhǐ yào nǐ nǔ lì, yī qiè dōu huì hǎo qǐ lái.","Bú yào tài dān xīn."],vi:["Chỉ cần bạn cố gắng, mọi thứ sẽ tốt lên.","Đừng lo lắng quá."]},
  "4-4-不得不":{zh:["今天下大雨，我不得不打车去公司。","路上堵车堵了一个小时。"],py:["Jīn tiān xià dà yǔ, wǒ bù dé bù dǎ chē qù gōng sī.","Lù shàng dǔ chē dǔ le yí ge xiǎo shí."],vi:["Hôm nay mưa to, tôi buộc phải đi taxi đến công ty.","Trên đường kẹt xe mất một tiếng."]},
  "4-4-乱":{zh:["你的房间太乱了。","快把衣服和书整理一下。"],py:["Nǐ de fáng jiān tài luàn le.","Kuài bǎ yī fu hé shū zhěng lǐ yí xià."],vi:["Phòng của bạn lộn xộn quá.","Nhanh dọn quần áo và sách đi."]},
  "4-4-以为":{zh:["我以为今天不用上班。","没想到老板临时通知要加班。"],py:["Wǒ yǐ wéi jīn tiān bú yòng shàng bān.","Méi xiǎng dào lǎo bǎn lín shí tōng zhī yào jiā bān."],vi:["Tôi tưởng hôm nay không phải đi làm.","Không ngờ sếp thông báo phải tăng ca."]},
  "4-4-份":{zh:["请给我一份今天的报纸。","我想看看有什么新消息。"],py:["Qǐng gěi wǒ yí fèn jīn tiān de bào zhǐ.","Wǒ xiǎng kàn kan yǒu shén me xīn xiāo xī."],vi:["Xin cho tôi một tờ báo hôm nay.","Tôi muốn xem có tin tức gì mới."]},
  "4-4-保证":{zh:["我保证下次不会再迟到了。","老师说再迟到就要扣分。"],py:["Wǒ bǎo zhèng xià cì bú huì zài chí dào le.","Lǎo shī shuō zài chí dào jiù yào kòu fēn."],vi:["Tôi đảm bảo lần sau sẽ không đến muộn nữa.","Thầy giáo nói nếu đến muộn nữa sẽ trừ điểm."]},
  "4-4-原来":{zh:["原来他就是你说的那个人。","我之前一直不知道。"],py:["Yuán lái tā jiù shì nǐ shuō de nà ge rén.","Wǒ zhī qián yì zhí bù zhī dào."],vi:["Hóa ra anh ấy chính là người bạn nói.","Trước đó tôi hoàn toàn không biết."]},
  "4-4-奖金":{zh:["今年公司发了很多奖金。","大家都非常开心。"],py:["Jīn nián gōng sī fā le hěn duō jiǎng jīn.","Dà jiā dōu fēi cháng kāi xīn."],vi:["Năm nay công ty phát nhiều tiền thưởng.","Mọi người đều rất vui."]},
  "4-4-完全":{zh:["我完全同意你的看法。","我们的想法是一样的。"],py:["Wǒ wán quán tóng yì nǐ de kàn fǎ.","Wǒ men de xiǎng fǎ shì yí yàng de."],vi:["Tôi hoàn toàn đồng ý với quan điểm của bạn.","Suy nghĩ của chúng ta giống nhau."]},
  "4-4-工资":{zh:["这个月的工资已经发了。","我打算存一半，花一半。"],py:["Zhè ge yuè de gōng zī yǐ jīng fā le.","Wǒ dǎ suàn cún yí bàn, huā yí bàn."],vi:["Lương tháng này đã phát rồi.","Tôi định tiết kiệm một nửa, tiêu một nửa."]},
  "4-4-并":{zh:["我听了他的话，并没有生气。","反而觉得他说得对。"],py:["Wǒ tīng le tā de huà, bìng méi yǒu shēng qì.","Fǎn ér jué de tā shuō de duì."],vi:["Tôi nghe lời anh ấy nói, và không hề tức giận.","Ngược lại còn thấy anh ấy nói đúng."]},
  "4-4-感谢":{zh:["我非常感谢你的帮助。","没有你我真不知道怎么办。"],py:["Wǒ fēi cháng gǎn xiè nǐ de bāng zhù.","Méi yǒu nǐ wǒ zhēn bù zhī dào zěn me bàn."],vi:["Tôi rất cảm ơn sự giúp đỡ của bạn.","Không có bạn tôi thật không biết làm sao."]},
  "4-4-成功":{zh:["经过多年努力，他终于成功了。","所有的辛苦都是值得的。"],py:["Jīng guò duō nián nǔ lì, tā zhōng yú chéng gōng le.","Suǒ yǒu de xīn kǔ dōu shì zhí de de."],vi:["Sau nhiều năm nỗ lực, anh ấy cuối cùng đã thành công.","Tất cả vất vả đều xứng đáng."]},
  "4-4-按时":{zh:["请大家按时交作业。","迟交的同学会被扣分。"],py:["Qǐng dà jiā àn shí jiāo zuò yè.","Chí jiāo de tóng xué huì bèi kòu fēn."],vi:["Mời mọi người nộp bài đúng giờ.","Bạn nào nộp trễ sẽ bị trừ điểm."]},
  "4-4-按照":{zh:["请按照说明书来安装软件。","步骤写得很清楚。"],py:["Qǐng àn zhào shuō míng shū lái ān zhuāng ruǎn jiàn.","Bù zhòu xiě de hěn qīng chǔ."],vi:["Xin hãy cài đặt phần mềm theo hướng dẫn.","Các bước viết rất rõ ràng."]},
  "4-4-提":{zh:["他在会上提了一个好建议。","大家都觉得很有道理。"],py:["Tā zài huì shàng tí le yí gè hǎo jiàn yì.","Dà jiā dōu jué de hěn yǒu dào lǐ."],vi:["Anh ấy nêu ra một đề xuất hay trong cuộc họp.","Mọi người đều thấy rất có lý."]},
  "4-4-提前":{zh:["明天开会的时间提前了。","请大家八点以前到。"],py:["Míng tiān kāi huì de shí jiān tí qián le.","Qǐng dà jiā bā diǎn yǐ qián dào."],vi:["Thời gian họp ngày mai đã dời sớm hơn.","Mời mọi người đến trước tám giờ."]},
  "4-4-提醒":{zh:["谢谢你提醒我带雨伞。","今天果然下雨了。"],py:["Xiè xie nǐ tí xǐng wǒ dài yǔ sǎn.","Jīn tiān guǒ rán xià yǔ le."],vi:["Cảm ơn bạn nhắc tôi mang ô.","Hôm nay quả nhiên trời mưa thật."]},
  "4-4-方法":{zh:["你的学习方法不太对。","试试每天复习一点吧。"],py:["Nǐ de xué xí fāng fǎ bú tài duì.","Shì shi měi tiān fù xí yì diǎn ba."],vi:["Phương pháp học của bạn chưa đúng lắm.","Thử mỗi ngày ôn tập một chút nhé."]},
  "4-4-消息":{zh:["我刚收到一个好消息。","我被那家公司录用了！"],py:["Wǒ gāng shōu dào yí ge hǎo xiāo xī.","Wǒ bèi nà jiā gōng sī lù yòng le!"],vi:["Tôi vừa nhận được một tin tốt.","Tôi được công ty đó tuyển dụng rồi!"]},
  "4-4-甚至":{zh:["他学中文很努力，甚至周末也不休息。","进步真的很快。"],py:["Tā xué Zhōng wén hěn nǔ lì, shèn zhì zhōu mò yě bù xiū xi.","Jìn bù zhēn de hěn kuài."],vi:["Anh ấy học tiếng Trung rất chăm, thậm chí cuối tuần cũng không nghỉ.","Tiến bộ thực sự rất nhanh."]},
  "4-4-生意":{zh:["他的生意做得越来越大了。","现在已经有三家分店了。"],py:["Tā de shēng yì zuò de yuè lái yuè dà le.","Xiàn zài yǐ jīng yǒu sān jiā fēn diàn le."],vi:["Việc kinh doanh của anh ấy ngày càng lớn.","Bây giờ đã có ba chi nhánh rồi."]},
  "4-4-知识":{zh:["读书可以增加知识。","也能开阔我们的视野。"],py:["Dú shū kě yǐ zēng jiā zhī shí.","Yě néng kāi kuò wǒ men de shì yě."],vi:["Đọc sách có thể tăng thêm kiến thức.","Cũng mở rộng tầm nhìn của chúng ta."]},
  "4-4-积累":{zh:["学语言需要慢慢积累词汇。","每天记十个生词就很好了。"],py:["Xué yǔ yán xū yào màn man jī lěi cí huì.","Měi tiān jì shí ge shēng cí jiù hěn hǎo le."],vi:["Học ngôn ngữ cần từ từ tích lũy từ vựng.","Mỗi ngày nhớ mười từ mới là rất tốt rồi."]},
  "4-4-经验":{zh:["他有丰富的工作经验。","公司很快就录用了他。"],py:["Tā yǒu fēng fù de gōng zuò jīng yàn.","Gōng sī hěn kuài jiù lù yòng le tā."],vi:["Anh ấy có kinh nghiệm làm việc phong phú.","Công ty nhanh chóng tuyển dụng anh ấy."]},
  "4-4-计划":{zh:["我计划暑假去中国旅游。","已经开始订机票了。"],py:["Wǒ jì huà shǔ jià qù Zhōng guó lǚ yóu.","Yǐ jīng kāi shǐ dìng jī piào le."],vi:["Tôi lên kế hoạch đi du lịch Trung Quốc vào nghỉ hè.","Đã bắt đầu đặt vé máy bay rồi."]},
  "4-4-调查":{zh:["公司正在做市场调查。","他们想了解客户的需求。"],py:["Gōng sī zhèng zài zuò shì chǎng diào chá.","Tā men xiǎng liǎo jiě kè hù de xū qiú."],vi:["Công ty đang làm điều tra thị trường.","Họ muốn tìm hiểu nhu cầu của khách hàng."]},
  "4-4-谈":{zh:["我们坐下来好好谈谈吧。","这件事需要仔细讨论。"],py:["Wǒ men zuò xia lái hǎo hǎo tán tan ba.","Zhè jiàn shì xū yào zǐ xì tǎo lùn."],vi:["Chúng ta ngồi xuống nói chuyện nhé.","Việc này cần thảo luận kỹ."]},
  "4-4-责任":{zh:["这是我的责任，我来处理。","请放心，我会做好的。"],py:["Zhè shì wǒ de zé rèn, wǒ lái chǔ lǐ.","Qǐng fàng xīn, wǒ huì zuò hǎo de."],vi:["Đây là trách nhiệm của tôi, để tôi xử lý.","Xin yên tâm, tôi sẽ làm tốt."]},
  "4-4-赚":{zh:["他每个月赚的钱不少。","但是花得也很快。"],py:["Tā měi ge yuè zhuàn de qián bù shǎo.","Dàn shì huā de yě hěn kuài."],vi:["Anh ấy mỗi tháng kiếm không ít tiền.","Nhưng tiêu cũng rất nhanh."]},
  "4-4-顺利":{zh:["面试进行得很顺利。","我觉得自己表现得不错。"],py:["Miàn shì jìn xíng de hěn shùn lì.","Wǒ jué de zì jǐ biǎo xiàn de bú cuò."],vi:["Buổi phỏng vấn diễn ra rất suôn sẻ.","Tôi thấy mình thể hiện khá tốt."]},
  "4-5-价格":{zh:["这个手机的价格太高了。","我想再看看别的牌子。"],py:["Zhè ge shǒu jī de jià gé tài gāo le.","Wǒ xiǎng zài kàn kan bié de pái zi."],vi:["Giá chiếc điện thoại này quá cao.","Tôi muốn xem thêm các hãng khác."]},
  "4-5-任何":{zh:["如果你有任何问题，随时可以问我。","我很乐意帮忙。"],py:["Rú guǒ nǐ yǒu rèn hé wèn tí, suí shí kě yǐ wèn wǒ.","Wǒ hěn lè yì bāng máng."],vi:["Nếu bạn có bất kỳ câu hỏi nào, bất cứ lúc nào cũng có thể hỏi tôi.","Tôi rất sẵn lòng giúp đỡ."]},
  "4-5-优点":{zh:["每个人都有自己的优点。","要学会发现别人的长处。"],py:["Měi ge rén dōu yǒu zì jǐ de yōu diǎn.","Yào xué huì fā xiàn bié rén de cháng chù."],vi:["Mỗi người đều có ưu điểm riêng.","Phải học cách phát hiện điểm mạnh của người khác."]},
  "4-5-光":{zh:["你不能光说不做。","得把想法变成行动才行。"],py:["Nǐ bù néng guāng shuō bú zuò.","Děi bǎ xiǎng fǎ biàn chéng xíng dòng cái xíng."],vi:["Bạn không thể chỉ nói mà không làm.","Phải biến suy nghĩ thành hành động mới được."]},
  "4-5-制冷":{zh:["空调的制冷效果很好。","房间一会儿就凉快了。"],py:["Kōng tiáo de zhì lěng xiào guǒ hěn hǎo.","Fáng jiān yí huìr jiù liáng kuai le."],vi:["Hiệu quả làm lạnh của điều hòa rất tốt.","Một lát phòng đã mát rồi."]},
  "4-5-受到":{zh:["他的演讲受到了大家的欢迎。","很多人都站起来鼓掌。"],py:["Tā de yǎn jiǎng shòu dào le dà jiā de huān yíng.","Hěn duō rén dōu zhàn qǐ lái gǔ zhǎng."],vi:["Bài diễn thuyết của anh ấy được mọi người hoan nghênh.","Nhiều người đều đứng dậy vỗ tay."]},
  "4-5-台":{zh:["办公室新买了两台电脑。","速度比以前快多了。"],py:["Bàn gōng shì xīn mǎi le liǎng tái diàn nǎo.","Sù dù bǐ yǐ qián kuài duō le."],vi:["Văn phòng mới mua hai chiếc máy tính.","Tốc độ nhanh hơn trước nhiều."]},
  "4-5-味道":{zh:["妈妈做的菜味道特别好。","我最喜欢她做的红烧肉。"],py:["Mā ma zuò de cài wèi dào tè bié hǎo.","Wǒ zuì xǐ huān tā zuò de hóng shāo ròu."],vi:["Món ăn mẹ nấu vị đặc biệt ngon.","Tôi thích nhất món thịt kho tàu mẹ nấu."]},
  "4-5-实在":{zh:["今天实在太累了。","我想早点回家休息。"],py:["Jīn tiān shí zài tài lèi le.","Wǒ xiǎng zǎo diǎn huí jiā xiū xi."],vi:["Hôm nay thực sự quá mệt.","Tôi muốn về nhà nghỉ ngơi sớm."]},
  "4-5-实际":{zh:["你的计划不太实际。","我们需要考虑更多细节。"],py:["Nǐ de jì huà bú tài shí jì.","Wǒ men xū yào kǎo lǜ gèng duō xì jié."],vi:["Kế hoạch của bạn không thực tế lắm.","Chúng ta cần cân nhắc thêm chi tiết."]},
  "4-5-家具":{zh:["我们搬了新家，需要买家具。","先去看看沙发和桌子吧。"],py:["Wǒ men bān le xīn jiā, xū yào mǎi jiā jù.","Xiān qù kàn kan shā fā hé zhuō zi ba."],vi:["Chúng tôi chuyển nhà mới, cần mua nội thất.","Trước tiên đi xem sofa và bàn nhé."]},
  "4-5-寄":{zh:["我要去邮局寄一个包裹。","是寄给在北京的朋友的。"],py:["Wǒ yào qù yóu jú jì yí ge bāo guǒ.","Shì jì gěi zài Běi jīng de péng yǒu de."],vi:["Tôi phải đến bưu điện gửi một kiện hàng.","Là gửi cho bạn ở Bắc Kinh."]},
  "4-5-尤其":{zh:["我喜欢中国菜，尤其是四川菜。","又辣又好吃。"],py:["Wǒ xǐ huān Zhōng guó cài, yóu qí shì Sì chuān cài.","Yòu là yòu hǎo chī."],vi:["Tôi thích món Trung Quốc, nhất là món Tứ Xuyên.","Vừa cay vừa ngon."]},
  "4-5-年龄":{zh:["这份工作对年龄有要求吗？","必须在三十五岁以下。"],py:["Zhè fèn gōng zuò duì nián líng yǒu yāo qiú ma?","Bì xū zài sān shí wǔ suì yǐ xià."],vi:["Công việc này có yêu cầu về tuổi không?","Phải dưới ba mươi lăm tuổi."]},
  "4-5-广告":{zh:["电视上的广告越来越多了。","看电影总是被打断。"],py:["Diàn shì shàng de guǎng gào yuè lái yuè duō le.","Kàn diàn yǐng zǒng shì bèi dǎ duàn."],vi:["Quảng cáo trên tivi ngày càng nhiều.","Xem phim lúc nào cũng bị ngắt quãng."]},
  "4-5-打折":{zh:["这家商店今天全场打折。","我买了两件衣服，很便宜。"],py:["Zhè jiā shāng diàn jīn tiān quán chǎng dǎ zhé.","Wǒ mǎi le liǎng jiàn yī fu, hěn pián yi."],vi:["Cửa hàng này hôm nay giảm giá toàn bộ.","Tôi mua hai bộ quần áo, rất rẻ."]},
  "4-5-效果":{zh:["这种药的效果非常好。","吃了两天就不咳嗽了。"],py:["Zhè zhǒng yào de xiào guǒ fēi cháng hǎo.","Chī le liǎng tiān jiù bù ké sòu le."],vi:["Hiệu quả của loại thuốc này rất tốt.","Uống hai ngày là hết ho."]},
  "4-5-标准":{zh:["他的普通话说得很标准。","听不出来是南方人。"],py:["Tā de pǔ tōng huà shuō de hěn biāo zhǔn.","Tīng bu chū lái shì nán fāng rén."],vi:["Tiếng phổ thông của anh ấy nói rất chuẩn.","Nghe không ra là người miền Nam."]},
  "4-5-样子":{zh:["看你高兴的样子，有什么好事？","我今天升职了！"],py:["Kàn nǐ gāo xìng de yàng zi, yǒu shén me hǎo shì?","Wǒ jīn tiān shēng zhí le!"],vi:["Nhìn vẻ vui của bạn, có chuyện gì tốt vậy?","Hôm nay tôi được thăng chức rồi!"]},
  "4-5-沙发":{zh:["这个沙发坐起来很舒服。","我每天都喜欢在上面看书。"],py:["Zhè ge shā fā zuò qǐ lái hěn shū fu.","Wǒ měi tiān dōu xǐ huān zài shàng miàn kàn shū."],vi:["Cái sofa này ngồi rất thoải mái.","Mỗi ngày tôi đều thích đọc sách trên đó."]},
  "4-5-流行":{zh:["这种款式今年很流行。","很多年轻人都在穿。"],py:["Zhè zhǒng kuǎn shì jīn nián hěn liú xíng.","Hěn duō nián qīng rén dōu zài chuān."],vi:["Kiểu dáng này năm nay rất thịnh hành.","Nhiều bạn trẻ đều đang mặc."]},
  "4-5-浪费":{zh:["不要浪费食物。","吃多少就点多少。"],py:["Bú yào làng fèi shí wù.","Chī duō shǎo jiù diǎn duō shǎo."],vi:["Đừng lãng phí thức ăn.","Ăn bao nhiêu thì gọi bấy nhiêu."]},
  "4-5-现金":{zh:["现在很少有人用现金了。","大家都喜欢手机支付。"],py:["Xiàn zài hěn shǎo yǒu rén yòng xiàn jīn le.","Dà jiā dōu xǐ huān shǒu jī zhī fù."],vi:["Bây giờ rất ít người dùng tiền mặt.","Mọi người đều thích thanh toán bằng điện thoại."]},
  "4-5-考虑":{zh:["这件事我需要再考虑一下。","明天给你答复好吗？"],py:["Zhè jiàn shì wǒ xū yào zài kǎo lǜ yí xià.","Míng tiān gěi nǐ dá fù hǎo ma?"],vi:["Việc này tôi cần suy nghĩ thêm.","Ngày mai trả lời bạn được không?"]},
  "4-5-肯定":{zh:["他肯定能通过这次考试。","因为他准备了很长时间。"],py:["Tā kěn dìng néng tōng guò zhè cì kǎo shì.","Yīn wèi tā zhǔn bèi le hěn cháng shí jiān."],vi:["Anh ấy chắc chắn có thể vượt qua kỳ thi.","Vì anh ấy đã chuẩn bị rất lâu."]},
  "4-5-艺术":{zh:["她从小就对艺术感兴趣。","现在已经是一名画家了。"],py:["Tā cóng xiǎo jiù duì yì shù gǎn xìng qù.","Xiàn zài yǐ jīng shì yì míng huà jiā le."],vi:["Cô ấy từ nhỏ đã yêu thích nghệ thuật.","Bây giờ đã là một họa sĩ rồi."]},
  "4-5-葡萄":{zh:["这些葡萄又大又甜。","是从新疆运过来的。"],py:["Zhè xiē pú táo yòu dà yòu tián.","Shì cóng Xīn jiāng yùn guò lái de."],vi:["Những quả nho này vừa to vừa ngọt.","Được vận chuyển từ Tân Cương tới."]},
  "4-5-质量":{zh:["这个品牌的质量一直很好。","所以很多人都喜欢买。"],py:["Zhè ge pǐn pái de zhì liàng yì zhí hěn hǎo.","Suǒ yǐ hěn duō rén dōu xǐ huān mǎi."],vi:["Chất lượng của thương hiệu này luôn rất tốt.","Nên nhiều người đều thích mua."]},
  "4-5-购物":{zh:["我喜欢在网上购物。","又方便又能比较价格。"],py:["Wǒ xǐ huān zài wǎng shàng gòu wù.","Yòu fāng biàn yòu néng bǐ jiào jià gé."],vi:["Tôi thích mua sắm trực tuyến.","Vừa tiện lợi vừa có thể so sánh giá."]},
  "4-5-邀请":{zh:["他邀请我参加他的生日聚会。","我很高兴地答应了。"],py:["Tā yāo qǐng wǒ cān jiā tā de shēng rì jù huì.","Wǒ hěn gāo xìng de dā yìng le."],vi:["Anh ấy mời tôi tham gia tiệc sinh nhật.","Tôi vui vẻ đồng ý."]},
  "4-5-顺便":{zh:["你去超市的时候，顺便帮我买瓶水。","好的，没问题。"],py:["Nǐ qù chāo shì de shí hou, shùn biàn bāng wǒ mǎi píng shuǐ.","Hǎo de, méi wèn tí."],vi:["Khi bạn đi siêu thị, nhân tiện mua giúp tôi chai nước.","Được, không vấn đề gì."]},
  "4-6-举办":{zh:["我们公司明年要举办国际会议。","预计会有很多人参加。"],py:["Wǒ men gōng sī míng nián yào jǔ bàn guó jì huì yì.","Yù jì huì yǒu hěn duō rén cān jiā."],vi:["Công ty chúng tôi năm sau sẽ tổ chức hội nghị quốc tế.","Dự kiến sẽ có rất nhiều người tham gia."]},
  "4-6-举行":{zh:["他们下个月要举行婚礼。","已经开始准备了。"],py:["Tā men xià ge yuè yào jǔ xíng hūn lǐ.","Yǐ jīng kāi shǐ zhǔn bèi le."],vi:["Họ tháng sau sẽ tổ chức đám cưới.","Đã bắt đầu chuẩn bị rồi."]},
  "4-6-会员卡":{zh:["你有这家店的会员卡吗？","有会员卡可以打八折。"],py:["Nǐ yǒu zhè jiā diàn de huì yuán kǎ ma?","Yǒu huì yuán kǎ kě yǐ dǎ bā zhé."],vi:["Bạn có thẻ thành viên của cửa hàng này không?","Có thẻ thành viên được giảm hai mươi phần trăm."]},
  "4-6-例如":{zh:["我会说几种语言，例如英语和中文。","现在正在学日语。"],py:["Wǒ huì shuō jǐ zhǒng yǔ yán, lì rú Yīng yǔ hé Zhōng wén.","Xiàn zài zhèng zài xué Rì yǔ."],vi:["Tôi biết nói mấy thứ tiếng, ví dụ tiếng Anh và tiếng Trung.","Bây giờ đang học tiếng Nhật."]},
  "4-6-修理":{zh:["我的自行车坏了，需要修理。","附近有一家修车店。"],py:["Wǒ de zì xíng chē huài le, xū yào xiū lǐ.","Fù jìn yǒu yì jiā xiū chē diàn."],vi:["Xe đạp của tôi hỏng rồi, cần sửa chữa.","Gần đây có một tiệm sửa xe."]},
  "4-6-倍":{zh:["今年的收入是去年的两倍。","公司发展得越来越好了。"],py:["Jīn nián de shōu rù shì qù nián de liǎng bèi.","Gōng sī fā zhǎn de yuè lái yuè hǎo le."],vi:["Thu nhập năm nay gấp đôi năm ngoái.","Công ty phát triển ngày càng tốt."]},
  "4-6-值得":{zh:["这部电影非常值得看。","我看了两遍还想再看。"],py:["Zhè bù diàn yǐng fēi cháng zhí de kàn.","Wǒ kàn le liǎng biàn hái xiǎng zài kàn."],vi:["Bộ phim này rất đáng xem.","Tôi xem hai lần rồi vẫn muốn xem nữa."]},
  "4-6-免费":{zh:["这个博物馆每周一免费开放。","所以那天人特别多。"],py:["Zhè ge bó wù guǎn měi zhōu yī miǎn fèi kāi fàng.","Suǒ yǐ nà tiān rén tè bié duō."],vi:["Bảo tàng này mở cửa miễn phí mỗi thứ Hai.","Nên ngày đó người đặc biệt đông."]},
  "4-6-其中":{zh:["我买了五本书，其中两本是小说。","剩下的是学习用的。"],py:["Wǒ mǎi le wǔ běn shū, qí zhōng liǎng běn shì xiǎo shuō.","Shèng xià de shì xué xí yòng de."],vi:["Tôi mua năm quyển sách, trong đó hai quyển là tiểu thuyết.","Còn lại là dùng để học."]},
  "4-6-内":{zh:["请在三天内完成这份报告。","时间很紧，大家加油吧。"],py:["Qǐng zài sān tiān nèi wán chéng zhè fèn bào gào.","Shí jiān hěn jǐn, dà jiā jiā yóu ba."],vi:["Xin hoàn thành báo cáo này trong ba ngày.","Thời gian rất gấp, mọi người cố lên nhé."]},
  "4-6-各":{zh:["世界各国的文化都不一样。","了解不同文化很有意思。"],py:["Shì jiè gè guó de wén huà dōu bù yí yàng.","Liǎo jiě bù tóng wén huà hěn yǒu yì si."],vi:["Văn hóa các nước trên thế giới đều khác nhau.","Tìm hiểu văn hóa khác nhau rất thú vị."]},
  "4-6-售货员":{zh:["那个售货员态度很热情。","她帮我选了一件合适的衣服。"],py:["Nà ge shòu huò yuán tài dù hěn rè qíng.","Tā bāng wǒ xuǎn le yí jiàn hé shì de yī fu."],vi:["Nhân viên bán hàng đó thái độ rất nhiệt tình.","Cô ấy giúp tôi chọn một bộ quần áo phù hợp."]},
  "4-6-好处":{zh:["多运动对身体有很多好处。","每天跑步半小时就够了。"],py:["Duō yùn dòng duì shēn tǐ yǒu hěn duō hǎo chù.","Měi tiān pǎo bù bàn xiǎo shí jiù gòu le."],vi:["Vận động nhiều có rất nhiều lợi ích cho cơ thể.","Mỗi ngày chạy bộ nửa tiếng là đủ."]},
  "4-6-小说":{zh:["我最近在看一本有意思的小说。","每天晚上都看到很晚。"],py:["Wǒ zuì jìn zài kàn yì běn yǒu yì si de xiǎo shuō.","Měi tiān wǎn shàng dōu kàn dào hěn wǎn."],vi:["Gần đây tôi đang đọc một cuốn tiểu thuyết thú vị.","Mỗi tối đều đọc đến rất khuya."]},
  "4-6-尝":{zh:["你尝尝这个菜，好吃吗？","嗯，又酸又辣，味道不错。"],py:["Nǐ cháng cháng zhè ge cài, hǎo chī ma?","Ēn, yòu suān yòu là, wèi dào bú cuò."],vi:["Bạn nếm thử món này xem, ngon không?","Ừ, vừa chua vừa cay, vị khá ngon."]},
  "4-6-情况":{zh:["你能说说目前的情况吗？","我想了解具体的细节。"],py:["Nǐ néng shuō shuō mù qián de qíng kuàng ma?","Wǒ xiǎng liǎo jiě jù tǐ de xì jié."],vi:["Bạn có thể nói về tình hình hiện tại không?","Tôi muốn hiểu chi tiết cụ thể."]},
  "4-6-所有":{zh:["所有的票都卖完了。","我们只能下次再来了。"],py:["Suǒ yǒu de piào dōu mài wán le.","Wǒ men zhǐ néng xià cì zài lái le."],vi:["Tất cả vé đều bán hết rồi.","Chúng ta chỉ có thể lần sau quay lại."]},
  "4-6-打扰":{zh:["对不起，打扰你一下。","我想问一下图书馆怎么走。"],py:["Duì bu qǐ, dǎ rǎo nǐ yí xià.","Wǒ xiǎng wèn yí xià tú shū guǎn zěn me zǒu."],vi:["Xin lỗi, làm phiền bạn một chút.","Tôi muốn hỏi đường đi thư viện."]},
  "4-6-支持":{zh:["感谢大家一直支持我。","没有你们我做不到。"],py:["Gǎn xiè dà jiā yì zhí zhī chí wǒ.","Méi yǒu nǐ men wǒ zuò bú dào."],vi:["Cảm ơn mọi người luôn ủng hộ tôi.","Không có các bạn tôi không làm được."]},
  "4-6-方面":{zh:["他在工作方面表现得很优秀。","领导对他非常满意。"],py:["Tā zài gōng zuò fāng miàn biǎo xiàn de hěn yōu xiù.","Lǐng dǎo duì tā fēi cháng mǎn yì."],vi:["Anh ấy thể hiện rất xuất sắc về mặt công việc.","Lãnh đạo rất hài lòng với anh ấy."]},
  "4-6-果汁":{zh:["这杯果汁是用新鲜水果做的。","味道又甜又好喝。"],py:["Zhè bēi guǒ zhī shì yòng xīn xiān shuǐ guǒ zuò de.","Wèi dào yòu tián yòu hǎo hē."],vi:["Ly nước ép này làm từ trái cây tươi.","Vị vừa ngọt vừa ngon."]},
  "4-6-活动":{zh:["学校下周要举办一个活动。","欢迎所有的同学参加。"],py:["Xué xiào xià zhōu yào jǔ bàn yí ge huó dòng.","Huān yíng suǒ yǒu de tóng xué cān jiā."],vi:["Trường tuần sau sẽ tổ chức một hoạt động.","Chào đón tất cả các bạn tham gia."]},
  "4-6-满":{zh:["公交车上人已经满了。","我们等下一辆吧。"],py:["Gōng jiāo chē shàng rén yǐ jīng mǎn le.","Wǒ men děng xià yí liàng ba."],vi:["Xe buýt đã đầy người rồi.","Chúng ta đợi chuyến sau nhé."]},
  "4-6-百分之":{zh:["这次考试百分之九十的人通过了。","成绩比上次好了很多。"],py:["Zhè cì kǎo shì bǎi fēn zhī jiǔ shí de rén tōng guò le.","Chéng jì bǐ shàng cì hǎo le hěn duō."],vi:["Lần thi này chín mươi phần trăm mọi người đã đậu.","Thành tích tốt hơn lần trước rất nhiều."]},
  "4-6-皮肤":{zh:["她的皮肤很白很光滑。","大家都问她用什么护肤品。"],py:["Tā de pí fū hěn bái hěn guāng huá.","Dà jiā dōu wèn tā yòng shén me hù fū pǐn."],vi:["Da cô ấy rất trắng và mịn màng.","Mọi người đều hỏi cô ấy dùng mỹ phẩm gì."]},
  "4-6-竟然":{zh:["他竟然会说五种语言。","真是让人佩服。"],py:["Tā jìng rán huì shuō wǔ zhǒng yǔ yán.","Zhēn shì ràng rén pèi fú."],vi:["Không ngờ anh ấy biết nói năm thứ tiếng.","Thật đáng khâm phục."]},
  "4-6-获得":{zh:["她获得了这次比赛的第一名。","全家人都为她感到骄傲。"],py:["Tā huò dé le zhè cì bǐ sài de dì yī míng.","Quán jiā rén dōu wèi tā gǎn dào jiāo ào."],vi:["Cô ấy đạt được giải nhất cuộc thi lần này.","Cả gia đình đều tự hào về cô ấy."]},
  "4-6-袜子":{zh:["我的袜子破了一个洞。","明天得去买几双新的。"],py:["Wǒ de wà zi pò le yí gè dòng.","Míng tiān děi qù mǎi jǐ shuāng xīn de."],vi:["Tất của tôi bị thủng một lỗ.","Ngày mai phải đi mua mấy đôi mới."]},
  "4-6-西红柿":{zh:["西红柿炒鸡蛋是我最爱的菜。","做法简单，味道也好。"],py:["Xī hóng shì chǎo jī dàn shì wǒ zuì ài de cài.","Zuò fǎ jiǎn dān, wèi dào yě hǎo."],vi:["Cà chua xào trứng là món tôi yêu thích nhất.","Cách làm đơn giản, vị cũng ngon."]},
  "4-6-轻":{zh:["这个箱子看起来大，其实很轻。","我一个人就能拿得动。"],py:["Zhè ge xiāng zi kàn qǐ lái dà, qí shí hěn qīng.","Wǒ yí ge rén jiù néng ná de dòng."],vi:["Cái vali này trông to, thực ra rất nhẹ.","Một mình tôi cũng xách nổi."]},
  "4-6-降低":{zh:["超市降低了蔬菜的价格。","很多人都来买。"],py:["Chāo shì jiàng dī le shū cài de jià gé.","Hěn duō rén dōu lái mǎi."],vi:["Siêu thị giảm giá rau củ.","Rất nhiều người đến mua."]},
  "4-7-严重":{zh:["空气污染的问题越来越严重了。","我们都应该保护环境。"],py:["Kōng qì wū rǎn de wèn tí yuè lái yuè yán zhòng le.","Wǒ men dōu yīng gāi bǎo hù huán jìng."],vi:["Vấn đề ô nhiễm không khí ngày càng nghiêm trọng.","Chúng ta đều nên bảo vệ môi trường."]},
  "4-7-估计":{zh:["我估计他今天不会来了。","因为外面下大雨。"],py:["Wǒ gū jì tā jīn tiān bù huì lái le.","Yīn wèi wài miàn xià dà yǔ."],vi:["Tôi ước chừng hôm nay anh ấy sẽ không đến.","Vì bên ngoài đang mưa to."]},
  "4-7-减肥":{zh:["她最近在减肥，每天跑步半小时。","一个月瘦了三公斤。"],py:["Tā zuì jìn zài jiǎn féi, měi tiān pǎo bù bàn xiǎo shí.","Yī ge yuè shòu le sān gōng jīn."],vi:["Gần đây cô ấy đang giảm cân, mỗi ngày chạy bộ nửa tiếng.","Một tháng giảm được ba ký."]},
  "4-7-出现":{zh:["天空中出现了一道彩虹。","孩子们高兴地叫了起来。"],py:["Tiān kōng zhōng chū xiàn le yī dào cǎi hóng.","Hái zi men gāo xìng de jiào le qǐ lái."],vi:["Trên bầu trời xuất hiện một cầu vồng.","Bọn trẻ vui mừng reo lên."]},
  "4-7-动作":{zh:["老师的动作很标准。","我们都认真地跟着学。"],py:["Lǎo shī de dòng zuò hěn biāo zhǔn.","Wǒ men dōu rèn zhēn de gēn zhe xué."],vi:["Động tác của thầy rất chuẩn.","Chúng tôi đều nghiêm túc học theo."]},
  "4-7-反对":{zh:["父母反对她出国留学。","但她还是坚持自己的决定。"],py:["Fù mǔ fǎn duì tā chū guó liú xué.","Dàn tā hái shì jiān chí zì jǐ de jué dìng."],vi:["Bố mẹ phản đối cô ấy du học nước ngoài.","Nhưng cô ấy vẫn kiên trì quyết định của mình."]},
  "4-7-后悔":{zh:["我很后悔没有好好学习。","现在找工作太难了。"],py:["Wǒ hěn hòu huǐ méi yǒu hǎo hǎo xué xí.","Xiàn zài zhǎo gōng zuò tài nán le."],vi:["Tôi rất hối tiếc đã không chăm chỉ học hành.","Bây giờ tìm việc quá khó."]},
  "4-7-咳嗽":{zh:["他咳嗽了一个星期了。","应该去医院看看大夫。"],py:["Tā ké sòu le yī ge xīng qī le.","Yīng gāi qù yī yuàn kàn kàn dà fū."],vi:["Anh ấy ho suốt một tuần rồi.","Nên đi bệnh viện khám bác sĩ thôi."]},
  "4-7-大夫":{zh:["大夫说我需要多休息。","这几天不要太累了。"],py:["Dà fū shuō wǒ xū yào duō xiū xī.","Zhè jǐ tiān bù yào tài lèi le."],vi:["Bác sĩ nói tôi cần nghỉ ngơi nhiều hơn.","Mấy ngày này đừng quá mệt."]},
  "4-7-帅":{zh:["那个男生长得真帅。","很多女生都喜欢他。"],py:["Nà ge nán shēng zhǎng de zhēn shuài.","Hěn duō nǚ shēng dōu xǐ huān tā."],vi:["Bạn nam đó trông thật đẹp trai.","Nhiều bạn nữ đều thích anh ấy."]},
