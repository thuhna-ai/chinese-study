  "2-4-接":{zh:["刚才妈妈给我打电话的时候，我正在上课，所以没有接。","下课以后我马上给她回了过去。"],py:["Gāng cái mā ma gěi wǒ dǎ diàn huà de shí hou, wǒ zhèng zài shàng kè, suǒ yǐ méi yǒu jiē.","Xià kè yǐ hòu wǒ mǎ shàng gěi tā huí le guò qù."],vi:["Lúc nãy mẹ gọi cho tôi đúng lúc tôi đang học nên không nghe máy.","Tan học xong tôi liền gọi lại cho mẹ ngay."]},
  "2-4-晚上":{zh:["今天晚上我们不在家做饭。","打算下课以后一起去外面吃面条。"],py:["Jīn tiān wǎn shang wǒ men bú zài jiā zuò fàn.","Dǎ suàn xià kè yǐ hòu yì qǐ qù wài mian chī miàn tiáo."],vi:["Tối nay chúng tôi không nấu ăn ở nhà.","Dự định sau giờ học sẽ cùng nhau ra ngoài ăn mì."]},
  "2-4-问":{zh:["我想问你一个小问题。","这个词在这句话里是什么意思？"],py:["Wǒ xiǎng wèn nǐ yí ge xiǎo wèn tí.","Zhè ge cí zài zhè jù huà lǐ shì shén me yì si?"],vi:["Tôi muốn hỏi bạn một câu nhỏ.","Từ này trong câu này có nghĩa là gì?"]},
  "2-4-非常":{zh:["听到这个好消息以后，我非常高兴。","我马上就把这件事告诉了家里人。"],py:["Tīng dào zhè ge hǎo xiāo xi yǐ hòu, wǒ fēi cháng gāo xìng.","Wǒ mǎ shàng jiù bǎ zhè jiàn shì gào su le jiā lǐ rén."],vi:["Sau khi nghe tin tốt này, tôi vô cùng vui mừng.","Tôi lập tức kể chuyện này cho người nhà nghe."]},
  "2-4-开始":{zh:["老师一走进教室，我们就开始上课了。","本来还在说话的同学，也都马上安静下来。"],py:["Lǎo shī yì zǒu jìn jiào shì, wǒ men jiù kāi shǐ shàng kè le.","Běn lái hái zài shuō huà de tóng xué, yě dōu mǎ shàng ān jìng xià lái."],vi:["Giáo viên vừa bước vào lớp là chúng tôi bắt đầu học ngay.","Những bạn vốn còn đang nói chuyện cũng lập tức yên lặng lại."]},
  "2-4-已经":{zh:["他已经把作业做完了。","现在正坐在那儿看报纸，样子特别轻松。"],py:["Tā yǐ jīng bǎ zuò yè zuò wán le.","Xiàn zài zhèng zuò zài nàr kàn bào zhǐ, yàng zi tè bié qīng sōng."],vi:["Cậu ấy đã làm xong bài tập rồi.","Bây giờ đang ngồi đó đọc báo, trông cực kỳ thoải mái."]},
  "2-4-长":{zh:["这条路看起来很长，其实走十分钟就到了。","如果你不着急，我们可以慢慢过去。"],py:["Zhè tiáo lù kàn qǐ lái hěn cháng, qí shí zǒu shí fēn zhōng jiù dào le.","Rú guǒ nǐ bù zháo jí, wǒ men kě yǐ màn man guò qù."],vi:["Con đường này nhìn có vẻ rất dài, nhưng thực ra đi mười phút là tới.","Nếu bạn không vội thì chúng ta có thể từ từ đi qua."]},
  "2-4-两":{zh:["我昨天买了两本中文书。","一本是故事书，另一本是语法练习。"],py:["Wǒ zuó tiān mǎi le liǎng běn Zhōng wén shū.","Yì běn shì gù shi shū, lìng yì běn shì yǔ fǎ liàn xí."],vi:["Hôm qua tôi mua hai quyển sách tiếng Trung.","Một quyển là truyện, quyển còn lại là bài tập ngữ pháp."]},
  "2-4-帮":{zh:["你能不能帮我看一下这道题？","我自己想了很久，还是不太明白。"],py:["Nǐ néng bu néng bāng wǒ kàn yí xià zhè dào tí?","Wǒ zì jǐ xiǎng le hěn jiǔ, hái shì bù tài míng bai."],vi:["Bạn có thể giúp tôi xem bài này một chút không?","Tôi tự nghĩ rất lâu rồi mà vẫn chưa hiểu lắm."]},
  "2-4-介绍":{zh:["第一天上课的时候，老师请大家介绍一下自己。","我虽然有点儿紧张，可是还是认真说完了。"],py:["Dì yī tiān shàng kè de shí hou, lǎo shī qǐng dà jiā jiè shào yí xià zì jǐ.","Wǒ suī rán yǒu diǎnr jǐn zhāng, kě shì hái shì rèn zhēn shuō wán le."],vi:["Ngày đầu tiên đi học, giáo viên mời mọi người giới thiệu về bản thân.","Tôi tuy hơi căng thẳng nhưng vẫn nghiêm túc nói hết."]},
  "2-5-外面":{zh:["外面风很大，你最好把窗户关上。","不然桌子上的纸一会儿就会被吹乱。"],py:["Wài mian fēng hěn dà, nǐ zuì hǎo bǎ chuāng hu guān shàng.","Bù rán zhuō zi shàng de zhǐ yí huìr jiù huì bèi chuī luàn."],vi:["Bên ngoài gió rất lớn, tốt nhất bạn nên đóng cửa sổ lại.","Nếu không thì giấy trên bàn chỉ một lát là bị thổi tung."]},
  "2-5-准备":{zh:["我最近一直在准备下个月的考试。","每天晚上吃完饭以后，我都会先复习再休息。"],py:["Wǒ zuì jìn yì zhí zài zhǔn bèi xià ge yuè de kǎo shì.","Měi tiān wǎn shang chī wán fàn yǐ hòu, wǒ dōu huì xiān fù xí zài xiū xi."],vi:["Gần đây tôi luôn chuẩn bị cho kỳ thi tháng sau.","Tối nào ăn cơm xong tôi cũng ôn bài trước rồi mới nghỉ ngơi."]},
  "2-5-就":{zh:["你先在这儿坐一下，我马上就回来。","我只是去楼下买一瓶水，不会花太多时间。"],py:["Nǐ xiān zài zhèr zuò yí xià, wǒ mǎ shàng jiù huí lái.","Wǒ zhǐ shì qù lóu xià mǎi yì píng shuǐ, bú huì huā tài duō shí jiān."],vi:["Bạn cứ ngồi đây một lát, tôi sẽ quay lại ngay thôi.","Tôi chỉ xuống dưới mua một chai nước nên sẽ không mất nhiều thời gian đâu."]},
  "2-5-鱼":{zh:["我平时很喜欢吃鱼，因为味道比较清淡。","如果是妈妈做的，那我一定会多吃一点儿。"],py:["Wǒ píng shí hěn xǐ huan chī yú, yīn wèi wèi dào bǐ jiào qīng dàn.","Rú guǒ shì mā ma zuò de, nà wǒ yí dìng huì duō chī yì diǎnr."],vi:["Bình thường tôi rất thích ăn cá vì hương vị khá thanh nhẹ.","Nếu là mẹ nấu thì nhất định tôi sẽ ăn nhiều hơn một chút."]},
  "2-5-件":{zh:["这件外套看起来很普通，可是穿起来很暖和。","如果价格再便宜一点儿，我今天就买了。"],py:["Zhè jiàn wài tào kàn qǐ lái hěn pǔ tōng, kě shì chuān qǐ lái hěn nuǎn huo.","Rú guǒ jià gé zài pián yi yì diǎnr, wǒ jīn tiān jiù mǎi le."],vi:["Chiếc áo khoác này nhìn khá bình thường nhưng mặc lên rất ấm.","Nếu giá rẻ hơn một chút nữa thì hôm nay tôi đã mua rồi."]},
  "2-5-还":{zh:["这么晚了，你还在图书馆学习吗？","我本来以为你已经回宿舍休息了。"],py:["Zhè me wǎn le, nǐ hái zài tú shū guǎn xué xí ma?","Wǒ běn lái yǐ wéi nǐ yǐ jīng huí sù shè xiū xi le."],vi:["Muộn thế này rồi mà bạn vẫn còn học ở thư viện à?","Tôi cứ tưởng là bạn đã về ký túc xá nghỉ rồi chứ."]},
  "2-5-可以":{zh:["这里没人，我可以坐这儿吗？","如果不方便的话，我再去找别的位置。"],py:["Zhè lǐ méi rén, wǒ kě yǐ zuò zhèr ma?","Rú guǒ bù fāng biàn de huà, wǒ zài qù zhǎo bié de wèi zi."],vi:["Ở đây không có ai, tôi có thể ngồi chỗ này không?","Nếu không tiện thì tôi sẽ đi tìm chỗ khác."]},
  "2-5-不错":{zh:["你最近的发音进步得不错。","很多以前容易说错的音，现在都自然多了。"],py:["Nǐ zuì jìn de fā yīn jìn bù de bú cuò.","Hěn duō yǐ qián róng yì shuō cuò de yīn, xiàn zài dōu zì rán duō le."],vi:["Phát âm gần đây của bạn tiến bộ khá tốt.","Nhiều âm trước đây dễ nói sai, bây giờ đều tự nhiên hơn nhiều rồi."]},
  "2-5-考试":{zh:["下个星期有一次很重要的考试。","所以这几天我每天都早点儿回去复习。"],py:["Xià ge xīng qī yǒu yí cì hěn zhòng yào de kǎo shì.","Suǒ yǐ zhè jǐ tiān wǒ měi tiān dōu zǎo diǎnr huí qù fù xí."],vi:["Tuần sau có một kỳ thi rất quan trọng.","Vì vậy mấy ngày nay tôi ngày nào cũng về sớm để ôn tập."]},
  "2-5-意思":{zh:["这个句子的意思我大概明白了。","可是有一个词，我还是想回去再查一下词典。"],py:["Zhè ge jù zi de yì si wǒ dà gài míng bai le.","Kě shì yǒu yí ge cí, wǒ hái shì xiǎng huí qù zài chá yí xià cí diǎn."],vi:["Tôi đại khái đã hiểu ý của câu này rồi.","Nhưng vẫn có một từ tôi muốn về tra lại từ điển thêm một lần nữa."]},
  "2-5-经常":{zh:["我经常周末去公园散步。","走一走、看看花和树，心情就会轻松很多。"],py:["Wǒ jīng cháng zhōu mò qù gōng yuán sàn bù.","Zǒu yi zǒu, kàn kan huā hé shù, xīn qíng jiù huì qīng sōng hěn duō."],vi:["Tôi thường cuối tuần ra công viên đi dạo.","Đi một chút, ngắm hoa và cây là tâm trạng sẽ nhẹ nhõm hơn nhiều."]},
  "2-5-对":{zh:["对，这个问题你说得很对。","我刚才没有想到，现在听你一说就明白了。"],py:["Duì, zhè ge wèn tí nǐ shuō de hěn duì.","Wǒ gāng cái méi yǒu xiǎng dào, xiàn zài tīng nǐ yì shuō jiù míng bai le."],vi:["Đúng, vấn đề này bạn nói rất đúng.","Lúc nãy tôi chưa nghĩ ra, bây giờ nghe bạn nói thì hiểu ngay rồi."]},
  "2-5-以后":{zh:["吃完晚饭以后，我打算去楼下走一走。","一直坐在房间里看书，眼睛会有点儿累。"],py:["Chī wán wǎn fàn yǐ hòu, wǒ dǎ suàn qù lóu xià zǒu yi zǒu.","Yì zhí zuò zài fáng jiān lǐ kàn shū, yǎn jing huì yǒu diǎnr lèi."],vi:["Ăn tối xong tôi định xuống dưới đi dạo một chút.","Ngồi mãi trong phòng đọc sách thì mắt sẽ hơi mỏi."]},
  "2-6-门":{zh:["出门以前，别忘了把门关好。","外面风很大，门没关会一直响。"],py:["Chū mén yǐ qián, bié wàng le bǎ mén guān hǎo.","Wài mian fēng hěn dà, mén méi guān huì yì zhí xiǎng."],vi:["Trước khi ra ngoài, đừng quên đóng cửa lại.","Bên ngoài gió lớn, cửa không đóng sẽ kêu mãi."]},
  "2-6-外":{zh:["冬天外面特别冷，你多穿一件衣服吧。","我们先在屋里等一会儿，再出去也不晚。"],py:["Dōng tiān wài mian tè bié lěng, nǐ duō chuān yí jiàn yī fu ba.","Wǒ men xiān zài wū lǐ děng yí huìr, zài chū qù yě bù wǎn."],vi:["Mùa đông bên ngoài rất lạnh, bạn mặc thêm một áo nữa đi.","Chúng ta đợi một lát trong nhà rồi ra ngoài cũng chưa muộn."]},
  "2-6-自行车":{zh:["我家离学校不远，所以常常骑自行车去上课。","路上有风，骑起来很舒服。"],py:["Wǒ jiā lí xué xiào bù yuǎn, suǒ yǐ cháng cháng qí zì xíng chē qù shàng kè.","Lù shàng yǒu fēng, qí qǐ lái hěn shū fu."],vi:["Nhà tôi không xa trường nên thường đạp xe đến lớp.","Trên đường có gió, đi xe rất dễ chịu."]},
  "2-6-羊肉":{zh:["我第一次吃羊肉的时候有点儿不习惯。","后来觉得味道还不错，就慢慢喜欢上了。"],py:["Wǒ dì yī cì chī yáng ròu de shí hou yǒu diǎnr bù xí guàn.","Hòu lái jué de wèi dào hái bú cuò, jiù màn man xǐ huan shàng le."],vi:["Lần đầu tôi ăn thịt cừu thì hơi không quen.","Sau đó thấy vị cũng khá ổn nên dần dần thích."]},
  "2-6-面条":{zh:["今天中午我只想吃一碗面条。","天气有点儿冷，吃热的东西最舒服。"],py:["Jīn tiān zhōng wǔ wǒ zhǐ xiǎng chī yì wǎn miàn tiáo.","Tiān qì yǒu diǎnr lěng, chī rè de dōng xi zuì shū fu."],vi:["Trưa nay tôi chỉ muốn ăn một bát mì.","Trời hơi lạnh, ăn đồ nóng là dễ chịu nhất."]},
  "2-6-远":{zh:["那家超市离我们这儿有点儿远。","要是走过去，可能得半个小时。"],py:["Nà jiā chāo shì lí wǒ men zhèr yǒu diǎnr yuǎn.","Yào shì zǒu guò qù, kě néng děi bàn ge xiǎo shí."],vi:["Siêu thị đó hơi xa chỗ chúng ta.","Nếu đi bộ qua, có thể phải nửa tiếng."]},
  "2-6-打篮球":{zh:["我弟弟很喜欢打篮球，周末常常去操场。","他一打起来就忘了时间。"],py:["Wǒ dì di hěn xǐ huan dǎ lán qiú, zhōu mò cháng cháng qù cāo chǎng.","Tā yì dǎ qǐ lái jiù wàng le shí jiān."],vi:["Em trai tôi rất thích chơi bóng rổ, cuối tuần thường ra sân.","Hễ chơi là em quên luôn thời gian."]},
  "2-6-公共汽车":{zh:["今天下雨了，我就坐公共汽车去学校。","虽然慢一点儿，但是不用走路。"],py:["Jīn tiān xià yǔ le, wǒ jiù zuò gōng gòng qì chē qù xué xiào.","Suī rán màn yì diǎnr, dàn shì bú yòng zǒu lù."],vi:["Hôm nay mưa nên tôi đi xe buýt đến trường.","Tuy chậm hơn một chút nhưng không phải đi bộ."]},
  "2-6-小时":{zh:["我昨天在图书馆学习了两个小时。","回宿舍以后，我就想马上睡觉。"],py:["Wǒ zuó tiān zài tú shū guǎn xué xí le liǎng ge xiǎo shí.","Huí sù shè yǐ hòu, wǒ jiù xiǎng mǎ shàng shuì jiào."],vi:["Hôm qua tôi học ở thư viện hai tiếng.","Về ký túc xá xong tôi chỉ muốn đi ngủ ngay."]},
  "2-6-慢":{zh:["你说得太快了，我听不清楚。","可以说慢一点儿吗？"],py:["Nǐ shuō de tài kuài le, wǒ tīng bù qīng chu.","Kě yǐ shuō màn yì diǎnr ma?"],vi:["Bạn nói nhanh quá nên tôi nghe không rõ.","Bạn có thể nói chậm hơn một chút không?"]},
  "2-6-贵":{zh:["这件衣服很好看，可是有点儿贵。","我想再看看别的店，再决定买不买。"],py:["Zhè jiàn yī fu hěn hǎo kàn, kě shì yǒu diǎnr guì.","Wǒ xiǎng zài kàn kan bié de diàn, zài jué dìng mǎi bù mǎi."],vi:["Bộ đồ này rất đẹp nhưng hơi đắt.","Tôi muốn xem thêm cửa hàng khác rồi mới quyết định mua hay không."]},
  "2-6-公斤":{zh:["我想买一公斤苹果，再买半公斤香蕉。","老板说这些水果今天很新鲜。"],py:["Wǒ xiǎng mǎi yì gōng jīn píng guǒ, zài mǎi bàn gōng jīn xiāng jiāo.","Lǎo bǎn shuō zhè xiē shuǐ guǒ jīn tiān hěn xīn xiān."],vi:["Tôi muốn mua một ký táo và mua thêm nửa ký chuối.","Ông chủ nói trái cây hôm nay rất tươi."]},
  "2-6-姐姐":{zh:["我姐姐比我大三岁。","她平时很忙，但是周末会陪我一起复习。"],py:["Wǒ jiě jie bǐ wǒ dà sān suì.","Tā píng shí hěn máng, dàn shì zhōu mò huì péi wǒ yì qǐ fù xí."],vi:["Chị gái tôi hơn tôi ba tuổi.","Bình thường chị rất bận nhưng cuối tuần sẽ ôn bài cùng tôi."]},
  "2-7-教室":{zh:["教室里的人很多，所以有点儿热。","老师让我们把窗户打开一点儿。"],py:["Jiào shì lǐ de rén hěn duō, suǒ yǐ yǒu diǎnr rè.","Lǎo shī ràng wǒ men bǎ chuāng hu dǎ kāi yì diǎnr."],vi:["Trong lớp rất đông người nên hơi nóng.","Giáo viên bảo chúng tôi mở cửa sổ ra một chút."]},
  "2-7-路":{zh:["这条路我以前走过一次，所以还有印象。","一直往前走就能看到火车站。"],py:["Zhè tiáo lù wǒ yǐ qián zǒu guo yí cì, suǒ yǐ hái yǒu yìn xiàng.","Yì zhí wǎng qián zǒu jiù néng kàn dào huǒ chē zhàn."],vi:["Con đường này tôi từng đi một lần nên vẫn còn ấn tượng.","Cứ đi thẳng về phía trước là sẽ thấy ga tàu."]},
  "2-7-让":{zh:["老师让我们先做这道题。","做完以后再一起讨论答案。"],py:["Lǎo shī ràng wǒ men xiān zuò zhè dào tí.","Zuò wán yǐ hòu zài yì qǐ tǎo lùn dá àn."],vi:["Giáo viên bảo chúng tôi làm bài này trước.","Làm xong rồi cùng nhau thảo luận đáp án."]},
  "2-7-告诉":{zh:["如果你到火车站了，就马上告诉我。","我会在门口等你，不会走远。"],py:["Rú guǒ nǐ dào huǒ chē zhàn le, jiù mǎ shàng gào su wǒ.","Wǒ huì zài mén kǒu děng nǐ, bú huì zǒu yuǎn."],vi:["Nếu bạn đến ga tàu rồi thì báo tôi ngay.","Tôi sẽ đợi bạn ở cửa, sẽ không đi xa."]},
  "2-7-等":{zh:["你先等一下，我去拿钥匙。","很快就回来，不会让你等很久。"],py:["Nǐ xiān děng yí xià, wǒ qù ná yào shi.","Hěn kuài jiù huí lái, bú huì ràng nǐ děng hěn jiǔ."],vi:["Bạn đợi một chút nhé, tôi đi lấy chìa khóa.","Tôi sẽ quay lại nhanh thôi, sẽ không để bạn đợi lâu."]},
  "2-7-找":{zh:["我在找我的手机，可是怎么也找不到。","后来才发现它在包里。"],py:["Wǒ zài zhǎo wǒ de shǒu jī, kě shì zěn me yě zhǎo bú dào.","Hòu lái cái fā xiàn tā zài bāo lǐ."],vi:["Tôi đang tìm điện thoại nhưng tìm thế nào cũng không thấy.","Sau đó mới phát hiện ra nó ở trong túi."]},
  "2-7-事情":{zh:["今天我有一点儿事情要处理。","所以晚上可能不能跟你们一起吃饭。"],py:["Jīn tiān wǒ yǒu yì diǎnr shì qing yào chǔ lǐ.","Suǒ yǐ wǎn shang kě néng bù néng gēn nǐ men yì qǐ chī fàn."],vi:["Hôm nay tôi có chút việc cần xử lý.","Vì vậy tối nay có thể tôi không ăn cùng mọi người được."]},
  "2-7-服务员":{zh:["服务员很热情，一看见我们就过来倒水。","我们点完菜以后，他还提醒我们今天有什么特色菜。"],py:["Fú wù yuán hěn rè qíng, yí kàn jiàn wǒ men jiù guò lái dào shuǐ.","Wǒ men diǎn wán cài yǐ hòu, tā hái tí xǐng wǒ men jīn tiān yǒu shén me tè sè cài."],vi:["Nhân viên phục vụ rất nhiệt tình, vừa thấy chúng tôi đã tới rót nước.","Sau khi gọi món xong, anh ấy còn nhắc hôm nay có món đặc sắc gì."]},
  "2-7-白":{zh:["她今天穿了一件白衣服。","在太阳下面看起来特别干净。"],py:["Tā jīn tiān chuān le yí jiàn bái yī fu.","Zài tài yáng xià mian kàn qǐ lái tè bié gān jìng."],vi:["Hôm nay cô ấy mặc một bộ đồ màu trắng.","Dưới nắng trông đặc biệt sạch sẽ."]},
  "2-7-黑":{zh:["我喜欢黑颜色的鞋。","虽然不太亮，可是很耐脏。"],py:["Wǒ xǐ huan hēi yán sè de xié.","Suī rán bú tài liàng, kě shì hěn nài zāng."],vi:["Tôi thích giày màu đen.","Tuy không nổi nhưng rất ít bẩn."]},
  "2-7-快":{zh:["你走得太快了，我跟不上。","我们慢一点儿吧，这样还能一边聊天儿。"],py:["Nǐ zǒu de tài kuài le, wǒ gēn bù shàng.","Wǒ men màn yì diǎnr ba, zhè yàng hái néng yì biān liáo tiānr."],vi:["Bạn đi nhanh quá, tôi theo không kịp.","Chúng ta đi chậm hơn chút đi, như vậy còn có thể vừa đi vừa trò chuyện."]},
  "2-7-走":{zh:["吃完饭以后，我们一起走到公园去。","路不远，走十分钟就到了。"],py:["Chī wán fàn yǐ hòu, wǒ men yì qǐ zǒu dào gōng yuán qù.","Lù bù yuǎn, zǒu shí fēn zhōng jiù dào le."],vi:["Ăn xong chúng tôi đi bộ đến công viên.","Đường không xa, đi mười phút là tới."]},
  "2-7-到":{zh:["你到了吗？我已经在门口等你了。","如果你找不到路，就给我打电话。"],py:["Nǐ dào le ma? Wǒ yǐ jīng zài mén kǒu děng nǐ le.","Rú guǒ nǐ zhǎo bú dào lù, jiù gěi wǒ dǎ diàn huà."],vi:["Bạn đến chưa? Tôi đang đợi bạn ở cửa rồi.","Nếu bạn không tìm được đường thì gọi cho tôi."]},
  "2-8-再":{zh:["这个句子我没听清楚，你再说一次吧。","你说慢一点儿，我就能明白。"],py:["Zhè ge jù zi wǒ méi tīng qīng chu, nǐ zài shuō yí cì ba.","Nǐ shuō màn yì diǎnr, wǒ jiù néng míng bai."],vi:["Câu này tôi chưa nghe rõ, bạn nói lại một lần nhé.","Bạn nói chậm hơn một chút là tôi sẽ hiểu."]},
  "2-8-第一":{zh:["他这次考试考了第一。","不过他一点儿也不骄傲，还是每天认真学习。"],py:["Tā zhè cì kǎo shì kǎo le dì yī.","Bú guò tā yì diǎnr yě bú jiāo ào, hái shi měi tiān rèn zhēn xué xí."],vi:["Lần thi này cậu ấy đứng hạng nhất.","Nhưng cậu ấy không hề kiêu ngạo, vẫn học hành chăm chỉ mỗi ngày."]},
  "2-8-希望":{zh:["我希望你新年快乐，身体健康。","明年有机会的话，咱们一起去旅游。"],py:["Wǒ xī wàng nǐ xīn nián kuài lè, shēn tǐ jiàn kāng.","Míng nián yǒu jī huì de huà, zán men yì qǐ qù lǚ yóu."],vi:["Tôi hy vọng bạn năm mới vui vẻ và khỏe mạnh.","Nếu năm sau có cơ hội, chúng ta cùng đi du lịch."]},
  "2-8-问题":{zh:["如果你有问题，就下课以后来问我。","我们可以一起查词典，把句子弄明白。"],py:["Rú guǒ nǐ yǒu wèn tí, jiù xià kè yǐ hòu lái wèn wǒ.","Wǒ men kě yǐ yì qǐ chá cí diǎn, bǎ jù zi nòng míng bai."],vi:["Nếu bạn có câu hỏi thì tan học xong đến hỏi tôi.","Chúng ta có thể cùng tra từ điển để hiểu rõ câu."]},
  "2-8-欢迎":{zh:["欢迎你来我们学校参观。","如果你有时间，我可以带你去图书馆看看。"],py:["Huān yíng nǐ lái wǒ men xué xiào cān guān.","Rú guǒ nǐ yǒu shí jiān, wǒ kě yǐ dài nǐ qù tú shū guǎn kàn kan."],vi:["Chào mừng bạn đến tham quan trường của chúng tôi.","Nếu bạn có thời gian, tôi có thể dẫn bạn đi xem thư viện."]},
  "2-8-正在":{zh:["我正在做作业，你一会儿再打电话吧。","等我做完了，我们再慢慢聊天儿。"],py:["Wǒ zhèng zài zuò zuò yè, nǐ yí huìr zài dǎ diàn huà ba.","Děng wǒ zuò wán le, wǒ men zài màn man liáo tiānr."],vi:["Tôi đang làm bài tập, bạn lát nữa hãy gọi nhé.","Đợi tôi làm xong rồi chúng ta từ từ nói chuyện."]},
  "2-8-上班":{zh:["我每天八点上班，下午五点下班。","如果路上不堵车，我回家会很快。"],py:["Wǒ měi tiān bā diǎn shàng bān, xià wǔ wǔ diǎn xià bān.","Rú guǒ lù shàng bù dǔ chē, wǒ huí jiā huì hěn kuài."],vi:["Mỗi ngày tôi đi làm lúc tám giờ và tan làm lúc năm giờ chiều.","Nếu đường không tắc thì tôi về nhà sẽ rất nhanh."]},
  "2-8-手机":{zh:["我的手机昨天不小心摔了一下。","虽然还能用，但是屏幕有一点儿不清楚。"],py:["Wǒ de shǒu jī zuó tiān bú xiǎo xīn shuāi le yí xià.","Suī rán hái néng yòng, dàn shì píng mù yǒu yì diǎnr bù qīng chu."],vi:["Điện thoại của tôi hôm qua lỡ tay làm rơi một cái.","Tuy vẫn dùng được nhưng màn hình hơi không rõ."]},
  "2-8-懂":{zh:["这段话我大概懂了。","不过有两个词我不认识，想回去再查一下。"],py:["Zhè duàn huà wǒ dà gài dǒng le.","Bú guò yǒu liǎng ge cí wǒ bù rèn shi, xiǎng huí qù zài chá yí xià."],vi:["Đoạn này tôi đại khái hiểu rồi.","Nhưng có hai từ tôi không biết, muốn về tra lại thêm."]},
  "2-8-完":{zh:["我把今天的作业都做完了。","现在终于可以放心地休息一会儿。"],py:["Wǒ bǎ jīn tiān de zuò yè dōu zuò wán le.","Xiàn zài zhōng yú kě yǐ fàng xīn de xiū xi yí huìr."],vi:["Tôi đã làm xong hết bài tập hôm nay.","Bây giờ cuối cùng cũng có thể yên tâm nghỉ một lát."]},
  "2-8-题":{zh:["这道题看起来很简单，可是我还是做错了。","我准备重新算一遍，看看哪里出了问题。"],py:["Zhè dào tí kàn qǐ lái hěn jiǎn dān, kě shì wǒ hái shì zuò cuò le.","Wǒ zhǔn bèi chóng xīn suàn yí biàn, kàn kan nǎ lǐ chū le wèn tí."],vi:["Bài này nhìn rất đơn giản nhưng tôi vẫn làm sai.","Tôi định tính lại một lần để xem sai ở đâu."]},
  "2-9-错":{zh:["我刚才把号码写错了。","幸好你及时提醒我，不然就麻烦了。"],py:["Wǒ gāng cái bǎ hào mǎ xiě cuò le.","Xìng hǎo nǐ jí shí tí xǐng wǒ, bù rán jiù má fan le."],vi:["Lúc nãy tôi đã viết sai số.","May mà bạn nhắc kịp thời, nếu không thì phiền rồi."]},
  "2-9-跳舞":{zh:["她从小就喜欢跳舞。","每次听到音乐，她就会忍不住跟着节奏动起来。"],py:["Tā cóng xiǎo jiù xǐ huan tiào wǔ.","Měi cì tīng dào yīn yuè, tā jiù huì rěn bú zhù gēn zhe jié zòu dòng qǐ lái."],vi:["Cô ấy từ nhỏ đã thích nhảy múa.","Mỗi lần nghe nhạc là cô ấy không nhịn được mà nhún nhảy theo nhịp."]},
  "2-9-别":{zh:["别着急，咱们慢慢说。","你先把问题讲清楚，我再帮你想办法。"],py:["Bié zháo jí, zán men màn man shuō.","Nǐ xiān bǎ wèn tí jiǎng qīng chu, wǒ zài bāng nǐ xiǎng bàn fǎ."],vi:["Đừng vội, chúng ta từ từ nói.","Bạn nói rõ vấn đề trước rồi tôi giúp bạn nghĩ cách."]},
  "2-9-从":{zh:["我从家到学校要坐地铁。","如果不堵车，差不多半个小时就能到。"],py:["Wǒ cóng jiā dào xué xiào yào zuò dì tiě.","Rú guǒ bù dǔ chē, chà bu duō bàn ge xiǎo shí jiù néng dào."],vi:["Từ nhà đến trường tôi phải đi tàu điện ngầm.","Nếu không tắc đường thì khoảng nửa tiếng là tới."]},
  "2-9-西瓜":{zh:["夏天我最喜欢吃西瓜。","冰一下以后再吃，味道更甜也更舒服。"],py:["Xià tiān wǒ zuì xǐ huan chī xī guā.","Bīng yí xià yǐ hòu zài chī, wèi dào gèng tián yě gèng shū fu."],vi:["Mùa hè tôi thích nhất là ăn dưa hấu.","Ướp lạnh rồi ăn thì vị ngọt hơn và cũng dễ chịu hơn."]},
  "2-9-说话":{zh:["他平时说话不多，但是每次开口都很有道理。","大家听他说完以后都会点头。"],py:["Tā píng shí shuō huà bù duō, dàn shì měi cì kāi kǒu dōu hěn yǒu dào lǐ.","Dà jiā tīng tā shuō wán yǐ hòu dōu huì diǎn tóu."],vi:["Bình thường anh ấy không nói nhiều, nhưng mỗi lần nói đều rất có lý.","Mọi người nghe xong đều gật đầu."]},
  "2-9-比":{zh:["他比我高一点儿，所以跑得也更快。","不过我觉得只要多练习，我也会进步。"],py:["Tā bǐ wǒ gāo yì diǎnr, suǒ yǐ pǎo de yě gèng kuài.","Bú guò wǒ jué de zhǐ yào duō liàn xí, wǒ yě huì jìn bù."],vi:["Anh ấy cao hơn tôi một chút nên chạy cũng nhanh hơn.","Nhưng tôi nghĩ chỉ cần luyện tập nhiều thì tôi cũng sẽ tiến bộ."]},
  "2-9-一直":{zh:["从地铁站出来以后，你一直往前走就行。","看到路口再左转，很快就到学校了。"],py:["Cóng dì tiě zhàn chū lái yǐ hòu, nǐ yì zhí wǎng qián zǒu jiù xíng.","Kàn dào lù kǒu zài zuǒ zhuǎn, hěn kuài jiù dào xué xiào le."],vi:["Ra khỏi ga tàu điện ngầm rồi bạn cứ đi thẳng là được.","Thấy ngã đường thì rẽ trái, rất nhanh sẽ tới trường."]},
  "2-10-课":{zh:["今天上午我有三节课。","下课以后我还要去图书馆借书。"],py:["Jīn tiān shàng wǔ wǒ yǒu sān jié kè.","Xià kè yǐ hòu wǒ hái yào qù tú shū guǎn jiè shū."],vi:["Sáng nay tôi có ba tiết học.","Tan học xong tôi còn phải đến thư viện mượn sách."]},
  "2-10-帮助":{zh:["谢谢你的帮助，我一个人真的做不了。","有你在旁边，我就安心多了。"],py:["Xiè xie nǐ de bāng zhù, wǒ yí ge rén zhēn de zuò bù liǎo.","Yǒu nǐ zài páng biān, wǒ jiù ān xīn duō le."],vi:["Cảm ơn sự giúp đỡ của bạn, một mình tôi thật sự không làm được.","Có bạn ở bên cạnh tôi yên tâm hơn nhiều."]},
  "2-10-男":{zh:["我们班男学生不多。","不过大家相处得很好，经常一起运动。"],py:["Wǒ men bān nán xué sheng bù duō.","Bú guò dà jiā xiāng chǔ de hěn hǎo, jīng cháng yì qǐ yùn dòng."],vi:["Lớp chúng tôi không có nhiều nam sinh.","Nhưng mọi người hòa hợp rất tốt, thường cùng nhau vận động."]},
  "2-10-女":{zh:["她是女老师，说话很温柔。","可是上课的时候要求也很严格。"],py:["Tā shì nǚ lǎo shī, shuō huà hěn wēn róu.","Kě shì shàng kè de shí hou yāo qiú yě hěn yán gé."],vi:["Cô ấy là giáo viên nữ, nói chuyện rất dịu dàng.","Nhưng khi lên lớp cũng yêu cầu rất nghiêm."]},
  "2-10-鸡蛋":{zh:["我每天早上都会吃一个鸡蛋。","这样上午上课的时候就不会太饿。"],py:["Wǒ měi tiān zǎo shang dōu huì chī yí ge jī dàn.","Zhè yàng shàng wǔ shàng kè de shí hou jiù bú huì tài è."],vi:["Sáng nào tôi cũng ăn một quả trứng.","Như vậy lúc học buổi sáng sẽ không quá đói."]},
  "2-10-右边":{zh:["出了门以后往右边走就是超市。","你如果走过头了，就再回来一点儿。"],py:["Chū le mén yǐ hòu wǎng yòu biān zǒu jiù shì chāo shì.","Nǐ rú guǒ zǒu guò tóu le, jiù zài huí lái yì diǎnr."],vi:["Ra khỏi cửa rồi đi về bên phải là siêu thị.","Nếu bạn đi quá rồi thì quay lại một chút."]},
  "2-10-穿":{zh:["今天外面冷，你多穿一件外套吧。","别感冒了，明天还有考试。"],py:["Jīn tiān wài mian lěng, nǐ duō chuān yí jiàn wài tào ba.","Bié gǎn mào le, míng tiān hái yǒu kǎo shì."],vi:["Hôm nay bên ngoài lạnh, bạn mặc thêm một áo khoác đi.","Đừng để bị cảm, ngày mai còn thi nữa."]},
  "2-10-便宜":{zh:["这家店的东西很便宜，但是质量也还可以。","所以附近的学生都喜欢来这儿买。"],py:["Zhè jiā diàn de dōng xi hěn pián yi, dàn shì zhì liàng yě hái kě yǐ.","Suǒ yǐ fù jìn de xué sheng dōu xǐ huan lái zhèr mǎi."],vi:["Đồ ở cửa hàng này rất rẻ nhưng chất lượng cũng tạm ổn.","Vì vậy sinh viên quanh đây đều thích đến mua."]},
  "2-10-进":{zh:["外面下雨了，快进来吧。","站在门口会被淋湿的。"],py:["Wài mian xià yǔ le, kuài jìn lái ba.","Zhàn zài mén kǒu huì bèi lín shī de."],vi:["Bên ngoài mưa rồi, vào nhanh đi.","Đứng ở cửa sẽ bị ướt đấy."]},
  "2-10-去年":{zh:["去年夏天我去过北京旅行。","那次旅行让我对这座城市留下了很深的印象。"],py:["Qù nián xià tiān wǒ qù guo Běi jīng lǚ xíng.","Nà cì lǚ xíng ràng wǒ duì zhè zuò chéng shì liú xià le hěn shēn de yìn xiàng."],vi:["Mùa hè năm ngoái tôi đã đi du lịch Bắc Kinh.","Chuyến đi đó để lại cho tôi ấn tượng rất sâu về thành phố này."]},
  "2-10-笑":{zh:["他听到我说的笑话以后，马上就笑了。","气氛一下子变得轻松很多。"],py:["Tā tīng dào wǒ shuō de xiào huà yǐ hòu, mǎ shàng jiù xiào le.","Qì fēn yí xià zi biàn de qīng sōng hěn duō."],vi:["Nghe tôi kể chuyện cười xong, anh ấy lập tức cười ngay.","Không khí bỗng trở nên thoải mái hơn nhiều."]},
  "2-11-唱歌":{zh:["周末聚会的时候，大家一起唱歌。","我本来有点儿害羞，可是唱着唱着就越来越放松了。"],py:["Zhōu mò jù huì de shí hou, dà jiā yì qǐ chàng gē.","Wǒ běn lái yǒu diǎnr hài xiū, kě shì chàng zhe chàng zhe jiù yuè lái yuè fàng sōng le."],vi:["Cuối tuần tụ họp, mọi người cùng nhau hát.","Ban đầu tôi hơi ngại, nhưng hát một lúc thì càng lúc càng thoải mái."]},
  "2-11-孩子":{zh:["楼下有几个孩子在外面玩儿。","他们跑来跑去，一直笑个不停。"],py:["Lóu xià yǒu jǐ ge hái zi zài wài mian wánr.","Tā men pǎo lái pǎo qù, yì zhí xiào ge bù tíng."],vi:["Dưới lầu có mấy đứa trẻ đang chơi ngoài trời.","Chúng chạy qua chạy lại và cười mãi không ngừng."]},
  "2-11-妻子":{zh:["他的妻子很温柔，也很会照顾家人。","虽然平时很忙，可是每天晚上都会一起吃饭。"],py:["Tā de qī zi hěn wēn róu, yě hěn huì zhào gu jiā rén.","Suī rán píng shí hěn máng, kě shì měi tiān wǎn shang dōu huì yì qǐ chī fàn."],vi:["Vợ anh ấy rất dịu dàng và rất biết chăm sóc gia đình.","Tuy bình thường rất bận nhưng tối nào cũng ăn cơm cùng nhau."]},
  "2-11-雪":{zh:["昨天晚上突然下雪了。","早上起来一看，路边的树都变白了。"],py:["Zuó tiān wǎn shang tū rán xià xuě le.","Zǎo shang qǐ lái yí kàn, lù biān de shù dōu biàn bái le."],vi:["Tối qua bỗng nhiên tuyết rơi.","Sáng dậy nhìn ra, cây bên đường đều trắng xóa."]},
  "2-11-百":{zh:["这本书一百块钱，对我来说有点儿贵。","我想等打折的时候再买。"],py:["Zhè běn shū yì bǎi kuài qián, duì wǒ lái shuō yǒu diǎnr guì.","Wǒ xiǎng děng dǎ zhé de shí hou zài mǎi."],vi:["Cuốn sách này một trăm tệ, với tôi hơi đắt.","Tôi muốn đợi lúc giảm giá rồi mua."]},
  "2-11-度":{zh:["今天三十度，外面特别热。","我出门的时候只穿了一件很薄的衣服。"],py:["Jīn tiān sān shí dù, wài mian tè bié rè.","Wǒ chū mén de shí hou zhǐ chuān le yí jiàn hěn báo de yī fu."],vi:["Hôm nay 30 độ, bên ngoài rất nóng.","Khi ra ngoài tôi chỉ mặc một chiếc áo rất mỏng."]},
  "2-11-近":{zh:["我家离地铁站很近，走五分钟就到。","所以我平时上班很方便。"],py:["Wǒ jiā lí dì tiě zhàn hěn jìn, zǒu wǔ fēn zhōng jiù dào.","Suǒ yǐ wǒ píng shí shàng bān hěn fāng biàn."],vi:["Nhà tôi rất gần ga tàu điện ngầm, đi bộ 5 phút là tới.","Vì vậy bình thường tôi đi làm rất tiện."]},
  "2-11-姓":{zh:["第一次见面的时候，他问我姓什么。","我回答以后，他也介绍了自己的名字。"],py:["Dì yī cì jiàn miàn de shí hou, tā wèn wǒ xìng shén me.","Wǒ huí dá yǐ hòu, tā yě jiè shào le zì jǐ de míng zi."],vi:["Lần đầu gặp mặt, anh ấy hỏi tôi họ gì.","Tôi trả lời xong, anh ấy cũng giới thiệu tên của mình."]},
  "2-11-路口":{zh:["到下一个路口你要左转。","如果走过了，就很容易迷路。"],py:["Dào xià yí ge lù kǒu nǐ yào zuǒ zhuǎn.","Rú guǒ zǒu guò le, jiù hěn róng yì mí lù."],vi:["Đến ngã đường tiếp theo bạn rẽ trái.","Nếu đi quá thì rất dễ bị lạc."]},
  "2-12-得":{zh:["他中文说得很好，发音也很标准。","我很羡慕他能这么自然地交流。"],py:["Tā Zhōng wén shuō de hěn hǎo, fā yīn yě hěn biāo zhǔn.","Wǒ hěn xiàn mù tā néng zhè me zì rán de jiāo liú."],vi:["Anh ấy nói tiếng Trung rất giỏi, phát âm cũng chuẩn.","Tôi rất ngưỡng mộ việc anh ấy có thể giao tiếp tự nhiên như vậy."]},
  "2-12-零":{zh:["今天早上只有零度，风也很大。","我出门以前赶快戴上帽子和手套。"],py:["Jīn tiān zǎo shang zhǐ yǒu líng dù, fēng yě hěn dà.","Wǒ chū mén yǐ qián gǎn kuài dài shàng mào zi hé shǒu tào."],vi:["Sáng nay chỉ 0 độ, gió cũng rất lớn.","Trước khi ra ngoài tôi vội đội mũ và đeo găng tay."]},
  "2-12-班":{zh:["我们班有二十多个同学。","大家关系不错，经常一起复习。"],py:["Wǒ men bān yǒu èr shí duō gè tóng xué.","Dà jiā guān xì bú cuò, jīng cháng yì qǐ fù xí."],vi:["Lớp chúng tôi có hơn hai mươi bạn.","Mọi người quan hệ khá tốt, thường ôn bài cùng nhau."]},
  "2-12-弟弟":{zh:["我弟弟很喜欢打篮球。","放学以后他总要去操场玩一会儿。"],py:["Wǒ dì di hěn xǐ huan dǎ lán qiú.","Fàng xué yǐ hòu tā zǒng yào qù cāo chǎng wán yí huìr."],vi:["Em trai tôi rất thích chơi bóng rổ.","Tan học xong em ấy lúc nào cũng muốn ra sân chơi một lúc."]},
  "2-12-宾馆":{zh:["我们到北京以后先住在宾馆。","放好行李以后，就出去找地方吃饭了。"],py:["Wǒ men dào Běi jīng yǐ hòu xiān zhù zài bīn guǎn.","Fàng hǎo xíng li yǐ hòu, jiù chū qù zhǎo dì fang chī fàn le."],vi:["Chúng tôi đến Bắc Kinh rồi ở khách sạn trước.","Để hành lý xong là ra ngoài tìm chỗ ăn cơm."]},
  "2-13-着":{zh:["门开着，你先把它关上吧。","外面有点儿冷，风一直吹进来。"],py:["Mén kāi zhe, nǐ xiān bǎ tā guān shàng ba.","Wài mian yǒu diǎnr lěng, fēng yì zhí chuī jìn lái."],vi:["Cửa đang mở, bạn đóng lại trước đi.","Bên ngoài hơi lạnh, gió cứ thổi vào mãi."]},
  "2-13-铅笔":{zh:["我喜欢先用铅笔写，再用笔改。","这样写错了也很容易擦掉。"],py:["Wǒ xǐ huan xiān yòng qiān bǐ xiě, zài yòng bǐ gǎi.","Zhè yàng xiě cuò le yě hěn róng yì cā diào."],vi:["Tôi thích viết bằng bút chì trước rồi mới sửa bằng bút.","Như vậy viết sai cũng rất dễ tẩy."]},
  "2-13-玩儿":{zh:["周末我们打算去公园玩儿。","如果不下雨，就顺便在那儿拍几张照片。"],py:["Zhōu mò wǒ men dǎ suàn qù gōng yuán wánr.","Rú guǒ bú xià yǔ, jiù shùn biàn zài nàr pāi jǐ zhāng zhào piàn."],vi:["Cuối tuần chúng tôi dự định ra công viên chơi.","Nếu không mưa thì tiện thể chụp vài tấm ảnh ở đó."]},
  "2-14-有意思":{zh:["这部电影很有意思，我看完以后还想再看一遍。","里面的故事不复杂，可是很感动。"],py:["Zhè bù diàn yǐng hěn yǒu yì si, wǒ kàn wán yǐ hòu hái xiǎng zài kàn yí biàn.","Lǐ mian de gù shi bù fù zá, kě shì hěn gǎn dòng."],vi:["Bộ phim này rất thú vị, xem xong tôi còn muốn xem lại một lần nữa.","Câu chuyện không phức tạp nhưng rất cảm động."]},
  "2-14-但是":{zh:["我想去参加活动，但是今天真的太忙。","等下次有时间的时候，我一定会去。"],py:["Wǒ xiǎng qù cān jiā huó dòng, dàn shì jīn tiān zhēn de tài máng.","Děng xià cì yǒu shí jiān de shí hou, wǒ yí dìng huì qù."],vi:["Tôi muốn tham gia hoạt động nhưng hôm nay thật sự quá bận.","Đợi lần sau có thời gian, nhất định tôi sẽ đi."]},
  "2-14-虽然":{zh:["虽然外面很冷，但是太阳很好。","我们穿厚一点儿出去走走，也挺舒服的。"],py:["Suī rán wài mian hěn lěng, dàn shì tài yáng hěn hǎo.","Wǒ men chuān hòu yì diǎnr chū qù zǒu zǒu, yě tǐng shū fu de."],vi:["Tuy bên ngoài rất lạnh nhưng nắng đẹp.","Chúng ta mặc dày hơn một chút ra ngoài đi dạo cũng khá dễ chịu."]},
  "2-14-次":{zh:["我去过上海两次。","第一次跟家人，第二次是跟朋友一起旅游。"],py:["Wǒ qù guo Shàng hǎi liǎng cì.","Dì yī cì gēn jiā rén, dì èr cì shì gēn péng you yì qǐ lǚ yóu."],vi:["Tôi đã đi Thượng Hải hai lần.","Lần đầu đi với gia đình, lần thứ hai đi du lịch cùng bạn bè."]},
  "2-14-晴":{zh:["今天的天气很晴，天空特别蓝。","这种天气最适合出去运动。"],py:["Jīn tiān de tiān qì hěn qíng, tiān kōng tè bié lán.","Zhè zhǒng tiān qì zuì shì hé chū qù yùn dòng."],vi:["Thời tiết hôm nay rất nắng, bầu trời xanh đặc biệt.","Thời tiết kiểu này thích hợp nhất để ra ngoài vận động."]},
  "2-14-更":{zh:["他现在比以前更认真了。","每天做完作业以后，还会再复习一会儿。"],py:["Tā xiàn zài bǐ yǐ qián gèng rèn zhēn le.","Měi tiān zuò wán zuò yè yǐ hòu, hái huì zài fù xí yí huìr."],vi:["Bây giờ cậu ấy nghiêm túc hơn trước.","Mỗi ngày làm xong bài tập còn ôn thêm một lúc nữa."]},
  "2-14-阴":{zh:["今天天气有点儿阴，好像要下雨。","我出门的时候还是带了伞。"],py:["Jīn tiān tiān qì yǒu diǎnr yīn, hǎo xiàng yào xià yǔ.","Wǒ chū mén de shí hou hái shi dài le sǎn."],vi:["Hôm nay thời tiết hơi âm u, hình như sắp mưa.","Tôi ra ngoài vẫn mang theo ô."]},
  "2-15-日":{zh:["今天是几月几日？我想写在日记里。","最近太忙了，我总是把日期弄错。"],py:["Jīn tiān shì jǐ yuè jǐ rì? Wǒ xiǎng xiě zài rì jì lǐ.","Zuì jìn tài máng le, wǒ zǒng shì bǎ rì qī nòng cuò."],vi:["Hôm nay là ngày mấy tháng mấy? Tôi muốn ghi vào nhật ký.","Gần đây bận quá nên tôi hay nhớ nhầm ngày tháng."]},
  "2-15-新年":{zh:["新年快到了，街上比平时热闹。","我想给家人买一点儿礼物，表示心意。"],py:["Xīn nián kuài dào le, jiē shàng bǐ píng shí rè nao.","Wǒ xiǎng gěi jiā rén mǎi yì diǎnr lǐ wù, biǎo shì xīn yì."],vi:["Tết/Năm mới sắp đến, ngoài phố nhộn nhịp hơn bình thường.","Tôi muốn mua cho gia đình một ít quà để thể hiện tấm lòng."]},
  "2-15-票":{zh:["我已经买好了两张票。","如果你有时间，咱们周末一起去看电影吧。"],py:["Wǒ yǐ jīng mǎi hǎo le liǎng zhāng piào.","Rú guǒ nǐ yǒu shí jiān, zán men zhōu mò yì qǐ qù kàn diàn yǐng ba."],vi:["Tôi đã mua sẵn hai vé rồi.","Nếu bạn có thời gian, cuối tuần chúng ta cùng đi xem phim nhé."]},
  "2-15-火车站":{zh:["我第一次来这个城市，所以不知道火车站在哪儿。","我问了路口的警察，他很快就告诉我怎么走。"],py:["Wǒ dì yī cì lái zhè ge chéng shì, suǒ yǐ bù zhī dào huǒ chē zhàn zài nǎr.","Wǒ wèn le lù kǒu de jǐng chá, tā hěn kuài jiù gào su wǒ zěn me zǒu."],vi:["Đây là lần đầu tôi đến thành phố này nên không biết ga tàu ở đâu.","Tôi hỏi cảnh sát ở ngã đường, chú ấy nhanh chóng chỉ tôi đường đi."]},
  "2-15-大家":{zh:["大家都到齐了，我们可以开始了。","如果还有人没来，就再等五分钟。"],py:["Dà jiā dōu dào qí le, wǒ men kě yǐ kāi shǐ le.","Rú guǒ hái yǒu rén méi lái, jiù zài děng wǔ fēn zhōng."],vi:["Mọi người đã đến đủ rồi, chúng ta có thể bắt đầu.","Nếu vẫn còn người chưa đến thì đợi thêm 5 phút nữa."]},
  "2-15-妹妹":{zh:["我妹妹很喜欢画画。","每次我给她买新铅笔，她都会高兴一整天。"],py:["Wǒ mèi mei hěn xǐ huan huà huà.","Měi cì wǒ gěi tā mǎi xīn qiān bǐ, tā dōu huì gāo xìng yì zhěng tiān."],vi:["Em gái tôi rất thích vẽ.","Mỗi lần tôi mua cho em bút chì mới, em đều vui cả ngày."]},
  "3-1-周末":{zh:["这个周末我不想一直待在宿舍。","如果天气不错，我打算去公园走走，顺便拍几张照片。"],py:["Zhè ge zhōu mò wǒ bù xiǎng yì zhí dāi zài sù shè.","Rú guǒ tiān qì bú cuò, wǒ dǎ suàn qù gōng yuán zǒu zǒu, shùn biàn pāi jǐ zhāng zhào piàn."],vi:["Cuối tuần này tôi không muốn ở mãi trong ký túc xá.","Nếu thời tiết ổn, tôi dự định ra công viên đi dạo và tiện thể chụp vài tấm ảnh."]},
  "3-1-打算":{zh:["下个月放假以后，我打算回家看爷爷奶奶。","很久没见他们了，我还想给他们带一点儿北京的点心。"],py:["Xià ge yuè fàng jià yǐ hòu, wǒ dǎ suàn huí jiā kàn yé ye nǎi nai.","Hěn jiǔ méi jiàn tā men le, wǒ hái xiǎng gěi tā men dài yì diǎnr Běi jīng de diǎn xīn."],vi:["Sau khi nghỉ tháng sau, tôi dự định về nhà thăm ông bà.","Lâu rồi không gặp họ, tôi còn muốn mang cho họ một ít bánh điểm tâm của Bắc Kinh."]},
  "3-1-跟":{zh:["今天下午我跟同学一起去图书馆。","他负责找资料，我负责把重要的内容记下来。"],py:["Jīn tiān xià wǔ wǒ gēn tóng xué yì qǐ qù tú shū guǎn.","Tā fù zé zhǎo zī liào, wǒ fù zé bǎ zhòng yào de nèi róng jì xià lái."],vi:["Chiều nay tôi cùng bạn học đến thư viện.","Cậu ấy phụ trách tìm tài liệu, còn tôi phụ trách ghi lại nội dung quan trọng."]},
  "3-1-游戏":{zh:["我弟弟一回家就想玩游戏。","妈妈常常提醒他，先做完作业再休息。"],py:["Wǒ dì di yì huí jiā jiù xiǎng wán yóu xì.","Mā ma cháng cháng tí xǐng tā, xiān zuò wán zuò yè zài xiū xi."],vi:["Em trai tôi cứ về đến nhà là muốn chơi game.","Mẹ thường nhắc em làm xong bài tập trước rồi mới nghỉ ngơi."]},
  "3-1-作业":{zh:["今天老师留的作业不算太多。","我打算吃完晚饭以后认真做完，再复习一下生词。"],py:["Jīn tiān lǎo shī liú de zuò yè bú suàn tài duō.","Wǒ dǎ suàn chī wán wǎn fàn yǐ hòu rèn zhēn zuò wán, zài fù xí yí xià shēng cí."],vi:["Bài tập giáo viên giao hôm nay không tính là quá nhiều.","Tôi dự định ăn tối xong sẽ làm nghiêm túc cho xong rồi ôn lại từ mới một chút."]},
  "3-1-着急":{zh:["你先别着急，咱们慢慢想办法。","只要把问题一条一条地看，很快就能解决。"],py:["Nǐ xiān bié zháo jí, zán men màn man xiǎng bàn fǎ.","Zhǐ yào bǎ wèn tí yì tiáo yì tiáo de kàn, hěn kuài jiù néng jiě jué."],vi:["Bạn đừng vội lo, chúng ta từ từ nghĩ cách đã.","Chỉ cần xem từng vấn đề một thì sẽ nhanh chóng giải quyết được thôi."]},
  "3-1-复习":{zh:["考试前一天晚上，我没有学新的内容。","我只是把老师讲过的重点又复习了一遍。"],py:["Kǎo shì qián yì tiān wǎn shang, wǒ méi yǒu xué xīn de nèi róng.","Wǒ zhǐ shì bǎ lǎo shī jiǎng guo de zhòng diǎn yòu fù xí le yí biàn."],vi:["Tối trước ngày thi, tôi không học nội dung mới.","Tôi chỉ ôn lại một lượt những trọng điểm giáo viên đã giảng."]},
  "3-1-南方":{zh:["我小时候住在南方。","那边冬天没有北方那么冷，但是夏天特别热。"],py:["Wǒ xiǎo shí hou zhù zài nán fāng.","Nà biān dōng tiān méi yǒu běi fāng nà me lěng, dàn shì xià tiān tè bié rè."],vi:["Hồi nhỏ tôi sống ở miền Nam.","Mùa đông ở đó không lạnh bằng miền Bắc, nhưng mùa hè thì đặc biệt nóng."]},
  "3-1-北方":{zh:["我来北方以后，第一次看见下雪。","虽然手很冷，可是心里特别高兴。"],py:["Wǒ lái běi fāng yǐ hòu, dì yī cì kàn jiàn xià xuě.","Suī rán shǒu hěn lěng, kě shì xīn lǐ tè bié gāo xìng."],vi:["Sau khi đến miền Bắc, lần đầu tiên tôi nhìn thấy tuyết rơi.","Tuy tay rất lạnh nhưng trong lòng tôi lại vô cùng vui."]},
  "3-1-面包":{zh:["今天早上时间不够，我只吃了两片面包。","到了教室以后，我才发现自己还是有点儿饿。"],py:["Jīn tiān zǎo shang shí jiān bú gòu, wǒ zhǐ chī le liǎng piàn miàn bāo.","Dào le jiào shì yǐ hòu, wǒ cái fā xiàn zì jǐ hái shì yǒu diǎnr è."],vi:["Sáng nay không đủ thời gian nên tôi chỉ ăn hai lát bánh mì.","Đến lớp rồi tôi mới nhận ra mình vẫn còn hơi đói."]},
  "3-1-带":{zh:["明天去爬山的时候，记得带水和雨伞。","山上的天气变化很快，多准备一点儿比较放心。"],py:["Míng tiān qù pá shān de shí hou, jì de dài shuǐ hé yǔ sǎn.","Shān shàng de tiān qì biàn huà hěn kuài, duō zhǔn bèi yì diǎnr bǐ jiào fàng xīn."],vi:["Ngày mai khi đi leo núi, nhớ mang theo nước và ô.","Thời tiết trên núi thay đổi rất nhanh, chuẩn bị nhiều hơn một chút sẽ yên tâm hơn."]},
  "3-1-地图":{zh:["我们第一次来这个城市，对路都不熟。","所以出门以前，我先在手机上看了地图。"],py:["Wǒ men dì yī cì lái zhè ge chéng shì, duì lù dōu bù shú.","Suǒ yǐ chū mén yǐ qián, wǒ xiān zài shǒu jī shàng kàn le dì tú."],vi:["Đây là lần đầu chúng tôi đến thành phố này nên không quen đường.","Vì vậy trước khi ra ngoài, tôi xem bản đồ trên điện thoại trước."]},
  "3-1-搬":{zh:["我下个月要搬到学校附近去住。","这样每天早上就不用起得太早，也不用担心迟到。"],py:["Wǒ xià ge yuè yào bān dào xué xiào fù jìn qù zhù.","Zhè yàng měi tiān zǎo shang jiù bú yòng qǐ de tài zǎo, yě bú yòng dān xīn chí dào."],vi:["Tháng sau tôi sẽ chuyển đến sống gần trường.","Như vậy mỗi sáng sẽ không cần dậy quá sớm và cũng không cần lo đi học muộn nữa."]},
  "3-2-腿":{zh:["昨天打完篮球以后，我的腿一直有点儿酸。","今天上楼的时候，我走得比平时慢多了。"],py:["Zuó tiān dǎ wán lán qiú yǐ hòu, wǒ de tuǐ yì zhí yǒu diǎnr suān.","Jīn tiān shàng lóu de shí hou, wǒ zǒu de bǐ píng shí màn duō le."],vi:["Sau khi chơi bóng rổ hôm qua, chân tôi cứ hơi mỏi.","Hôm nay lúc lên lầu tôi đi chậm hơn bình thường nhiều."]},
  "3-2-疼":{zh:["你要是不舒服，就告诉老师，不要一直忍着疼。","早点儿去医院看看，会比较安全。"],py:["Nǐ yào shì bù shū fu, jiù gào su lǎo shī, bú yào yì zhí rěn zhe téng.","Zǎo diǎnr qù yī yuàn kàn kan, huì bǐ jiào ān quán."],vi:["Nếu bạn thấy không khỏe thì nói với giáo viên đi, đừng cứ cố chịu đau.","Đi bệnh viện sớm một chút sẽ an toàn hơn."]},
  "3-2-脚":{zh:["新鞋虽然好看，可是我穿了一天以后脚很疼。","看来下次买鞋，还是要先试着走一走。"],py:["Xīn xié suī rán hǎo kàn, kě shì wǒ chuān le yì tiān yǐ hòu jiǎo hěn téng.","Kàn lái xià cì mǎi xié, hái shi yào xiān shì zhe zǒu yi zǒu."],vi:["Đôi giày mới tuy đẹp nhưng sau khi mang cả ngày thì chân tôi rất đau.","Có lẽ lần sau mua giày vẫn phải đi thử vài bước trước."]},
  "3-2-树":{zh:["学校门口那棵树很高。","一到夏天，很多同学都喜欢站在下面聊天儿。"],py:["Xué xiào mén kǒu nà kē shù hěn gāo.","Yí dào xià tiān, hěn duō tóng xué dōu xǐ huan zhàn zài xià mian liáo tiānr."],vi:["Cây trước cổng trường rất cao.","Cứ đến mùa hè là nhiều bạn học thích đứng dưới đó trò chuyện."]},
  "3-2-容易":{zh:["这篇课文看起来不长，可是其实不容易懂。","我读了两遍以后，才慢慢明白它的意思。"],py:["Zhè piān kè wén kàn qǐ lái bù cháng, kě shì qí shí bù róng yì dǒng.","Wǒ dú le liǎng biàn yǐ hòu, cái màn man míng bai tā de yì si."],vi:["Bài khóa này nhìn thì không dài nhưng thật ra không dễ hiểu.","Tôi đọc hai lần rồi mới dần hiểu được ý của nó."]},
  "3-2-难":{zh:["老师昨天留的那道题真的很难。","我们几个人讨论了半天，最后才找到答案。"],py:["Lǎo shī zuó tiān liú de nà dào tí zhēn de hěn nán.","Wǒ men jǐ ge rén tǎo lùn le bàn tiān, zuì hòu cái zhǎo dào dá àn."],vi:["Bài tập mà giáo viên giao hôm qua thực sự rất khó.","Mấy người chúng tôi bàn bạc nãy giờ rồi cuối cùng mới tìm ra đáp án."]},
  "3-2-记得":{zh:["你记得明天下午三点有会议吗？","要是忘了，经理一定会很生气。"],py:["Nǐ jì de míng tiān xià wǔ sān diǎn yǒu huì yì ma?","Yào shì wàng le, jīng lǐ yí dìng huì hěn shēng qì."],vi:["Bạn có nhớ chiều mai ba giờ có cuộc họp không?","Nếu quên thì giám đốc nhất định sẽ rất tức giận."]},
  "3-2-太太":{zh:["楼下新搬来了一位王太太。","她见到邻居总是先笑着打招呼。"],py:["Lóu xià xīn bān lái le yí wèi Wáng tài tai.","Tā jiàn dào lín jū zǒng shì xiān xiào zhe dǎ zhāo hu."],vi:["Tầng dưới mới chuyển đến một bà Vương.","Mỗi khi gặp hàng xóm, bà ấy luôn mỉm cười chào trước."]},
  "3-2-秘书":{zh:["那位秘书做事特别认真。","开会以前，她已经把所有材料都准备好了。"],py:["Nà wèi mì shū zuò shì tè bié rèn zhēn.","Kāi huì yǐ qián, tā yǐ jīng bǎ suǒ yǒu cái liào dōu zhǔn bèi hǎo le."],vi:["Vị thư ký đó làm việc đặc biệt nghiêm túc.","Trước khi họp, cô ấy đã chuẩn bị xong toàn bộ tài liệu rồi."]},
  "3-2-经理":{zh:["经理今天下午不在办公室。","如果你有急事，可以先给他发短信。"],py:["Jīng lǐ jīn tiān xià wǔ bú zài bàn gōng shì.","Rú guǒ nǐ yǒu jí shì, kě yǐ xiān gěi tā fā duǎn xìn."],vi:["Chiều nay giám đốc không có ở văn phòng.","Nếu bạn có việc gấp thì có thể nhắn tin cho ông ấy trước."]},
  "3-2-办公室":{zh:["我们公司的办公室不大，但是很干净。","窗户旁边还有几盆绿色的植物，看起来很舒服。"],py:["Wǒ men gōng sī de bàn gōng shì bú dà, dàn shì hěn gān jìng.","Chuāng hu páng biān hái yǒu jǐ pén lǜ sè de zhí wù, kàn qǐ lái hěn shū fu."],vi:["Văn phòng công ty chúng tôi không lớn nhưng rất sạch sẽ.","Bên cạnh cửa sổ còn có mấy chậu cây xanh nhìn rất dễ chịu."]},
  "3-2-楼":{zh:["图书馆在五楼，可是今天电梯坏了。","我只好自己一步一步地走上去。"],py:["Tú shū guǎn zài wǔ lóu, kě shì jīn tiān diàn tī huài le.","Wǒ zhǐ hǎo zì jǐ yí bù yí bù de zǒu shàng qù."],vi:["Thư viện ở tầng năm nhưng hôm nay thang máy bị hỏng.","Tôi đành phải tự đi từng bước lên trên."]},
  "3-2-拿":{zh:["这些书太重了，你一个人拿不动。","我来帮你拿到教室门口吧。"],py:["Zhè xiē shū tài zhòng le, nǐ yí ge rén ná bú dòng.","Wǒ lái bāng nǐ ná dào jiào shì mén kǒu ba."],vi:["Mấy quyển sách này nặng quá, một mình bạn cầm không nổi đâu.","Để tôi giúp bạn cầm đến cửa lớp nhé."]},
  "3-2-把":{zh:["请把窗户打开一点儿。","教室里人太多了，空气有点儿不太好。"],py:["Qǐng bǎ chuāng hu dǎ kāi yì diǎnr.","Jiào shì lǐ rén tài duō le, kōng qì yǒu diǎnr bù tài hǎo."],vi:["Làm ơn mở cửa sổ ra một chút.","Trong lớp quá đông người nên không khí hơi không được tốt lắm."]},
  "3-2-伞":{zh:["早上出门的时候天还很晴，可是我还是带了伞。","没想到下午真的下雨了，幸好没有淋湿。"],py:["Zǎo shang chū mén de shí hou tiān hái hěn qíng, kě shì wǒ hái shi dài le sǎn.","Méi xiǎng dào xià wǔ zhēn de xià yǔ le, xìng hǎo méi yǒu lín shī."],vi:["Sáng ra ngoài trời vẫn còn nắng nhưng tôi vẫn mang theo ô.","Không ngờ chiều thật sự có mưa, may mà tôi không bị ướt."]},
  "3-2-胖":{zh:["他以前挺瘦的，这两年却胖了一点儿。","可能是因为工作太忙，晚上总是没有时间锻炼。"],py:["Tā yǐ qián tǐng shòu de, zhè liǎng nián què pàng le yì diǎnr.","Kě néng shì yīn wèi gōng zuò tài máng, wǎn shang zǒng shì méi yǒu shí jiān duàn liàn."],vi:["Trước đây anh ấy khá gầy, hai năm nay lại mập lên một chút.","Có thể là vì công việc quá bận nên buổi tối luôn không có thời gian tập luyện."]},
  "3-2-其实":{zh:["我表面上看起来很冷静，其实心里特别紧张。","第一次做这么重要的报告，谁都会有点儿担心。"],py:["Wǒ biǎo miàn shàng kàn qǐ lái hěn lěng jìng, qí shí xīn lǐ tè bié jǐn zhāng.","Dì yī cì zuò zhè me zhòng yào de bào gào, shéi dōu huì yǒu diǎnr dān xīn."],vi:["Bề ngoài tôi có vẻ rất bình tĩnh nhưng thật ra trong lòng vô cùng căng thẳng.","Lần đầu làm một bài báo cáo quan trọng như vậy thì ai cũng sẽ hơi lo."]},
  "3-2-瘦":{zh:["她生病以后瘦了很多。","最近妈妈一直在想办法给她做些有营养的菜。"],py:["Tā shēng bìng yǐ hòu shòu le hěn duō.","Zuì jìn mā ma yì zhí zài xiǎng bàn fǎ gěi tā zuò xiē yǒu yíng yǎng de cài."],vi:["Sau khi ốm cô ấy gầy đi rất nhiều.","Gần đây mẹ luôn nghĩ cách nấu cho cô ấy vài món có dinh dưỡng."]},
  "3-3-还是":{zh:["你今天晚上想在家看书，还是跟我们一起出去吃饭？","如果太累的话，早点儿休息也可以。"],py:["Nǐ jīn tiān wǎn shang xiǎng zài jiā kàn shū, hái shi gēn wǒ men yì qǐ chū qù chī fàn?","Rú guǒ tài lèi de huà, zǎo diǎnr xiū xi yě kě yǐ."],vi:["Tối nay bạn muốn ở nhà đọc sách hay đi ăn cùng bọn tôi?","Nếu mệt quá thì nghỉ ngơi sớm cũng được."]},
  "3-3-爬山":{zh:["上个周末我们一起去郊区爬山。","虽然爬到山顶的时候很累，可是风景真的特别漂亮。"],py:["Shàng ge zhōu mò wǒ men yì qǐ qù jiāo qū pá shān.","Suī rán pá dào shān dǐng de shí hou hěn lèi, kě shì fēng jǐng zhēn de tè bié piào liang."],vi:["Cuối tuần trước chúng tôi cùng nhau đi leo núi ở ngoại ô.","Tuy lúc leo lên đến đỉnh rất mệt nhưng phong cảnh thật sự rất đẹp."]},
  "3-3-小心":{zh:["这条路下过雨以后特别滑，你走的时候要小心。","要是摔倒了，明天可能连课都上不了。"],py:["Zhè tiáo lù xià guò yǔ yǐ hòu tè bié huá, nǐ zǒu de shí hou yào xiǎo xīn.","Yào shì shuāi dǎo le, míng tiān kě néng lián kè dōu shàng bù liǎo."],vi:["Con đường này sau khi mưa xong đặc biệt trơn, lúc đi bạn phải cẩn thận.","Nếu ngã thì ngày mai có khi đến lớp cũng không được."]},
  "3-3-条":{zh:["商店里有很多条裤子可以试。","我最后还是选了那条比较简单的黑色裤子。"],py:["Shāng diàn lǐ yǒu hěn duō tiáo kù zi kě yǐ shì.","Wǒ zuì hòu hái shi xuǎn le nà tiáo bǐ jiào jiǎn dān de hēi sè kù zi."],vi:["Trong cửa hàng có rất nhiều chiếc quần để thử.","Cuối cùng tôi vẫn chọn chiếc quần màu đen đơn giản hơn đó."]},
  "3-3-裤子":{zh:["这条裤子穿起来挺舒服的。","如果价格再便宜一点儿，我就马上买了。"],py:["Zhè tiáo kù zi chuān qǐ lái tǐng shū fu de.","Rú guǒ jià gé zài pián yi yì diǎnr, wǒ jiù mǎ shàng mǎi le."],vi:["Chiếc quần này mặc lên khá thoải mái.","Nếu giá rẻ hơn một chút nữa thì tôi sẽ mua ngay."]},
  "3-3-舒服":{zh:["今天太阳很好，坐在窗边看书特别舒服。","要是再有一杯热茶，这个下午就更安静了。"],py:["Jīn tiān tài yáng hěn hǎo, zuò zài chuāng biān kàn shū tè bié shū fu.","Yào shì zài yǒu yì bēi rè chá, zhè ge xià wǔ jiù gèng ān jìng le."],vi:["Hôm nay nắng đẹp, ngồi cạnh cửa sổ đọc sách rất thoải mái.","Nếu có thêm một tách trà nóng nữa thì buổi chiều này sẽ càng yên bình hơn."]},
  "3-3-花":{zh:["她在宿舍的桌子上放了一束花。","房间一下子变得漂亮多了，大家看见都觉得心情很好。"],py:["Tā zài sù shè de zhuō zi shàng fàng le yí shù huā.","Fáng jiān yí xià zi biàn de piào liang duō le, dà jiā kàn jiàn dōu jué de xīn qíng hěn hǎo."],vi:["Cô ấy đặt một bó hoa trên bàn trong ký túc xá.","Căn phòng bỗng đẹp lên nhiều, ai nhìn thấy cũng thấy tâm trạng tốt hơn."]},
  "3-3-衬衫":{zh:["明天要参加比较正式的活动，所以我准备穿白衬衫。","虽然简单一点儿，但是看起来会更干净。"],py:["Míng tiān yào cān jiā bǐ jiào zhèng shì de huó dòng, suǒ yǐ wǒ zhǔn bèi chuān bái chèn shān.","Suī rán jiǎn dān yì diǎnr, dàn shì kàn qǐ lái huì gèng gān jìng."],vi:["Ngày mai phải tham gia một hoạt động khá trang trọng nên tôi định mặc áo sơ mi trắng.","Tuy đơn giản hơn một chút nhưng trông sẽ gọn gàng hơn."]},
  "3-3-元":{zh:["这本词典要九十八元。","我觉得有一点儿贵，所以打算先回去想一想。"],py:["Zhè běn cí diǎn yào jiǔ shí bā yuán.","Wǒ jué de yǒu yì diǎnr guì, suǒ yǐ dǎ suàn xiān huí qù xiǎng yi xiǎng."],vi:["Quyển từ điển này giá chín mươi tám tệ.","Tôi thấy hơi đắt nên định về suy nghĩ thêm đã."]},
  "3-3-新鲜":{zh:["早上的水果市场特别热闹，东西也很新鲜。","妈妈总说，买菜还是早点儿去比较好。"],py:["Zǎo shang de shuǐ guǒ shì chǎng tè bié rè nao, dōng xi yě hěn xīn xiān.","Mā ma zǒng shuō, mǎi cài hái shi zǎo diǎnr qù bǐ jiào hǎo."],vi:["Chợ trái cây buổi sáng đặc biệt nhộn nhịp và đồ cũng rất tươi.","Mẹ tôi luôn nói mua đồ ăn thì vẫn nên đi sớm một chút sẽ tốt hơn."]},
  "3-3-甜":{zh:["这个蛋糕看起来不大，可是味道很甜。","我吃了两口以后，就赶快去喝水了。"],py:["Zhè ge dàn gāo kàn qǐ lái bú dà, kě shì wèi dào hěn tián.","Wǒ chī le liǎng kǒu yǐ hòu, jiù gǎn kuài qù hē shuǐ le."],vi:["Cái bánh này nhìn không lớn nhưng vị rất ngọt.","Tôi ăn hai miếng xong liền vội đi uống nước."]},
  "3-3-或者":{zh:["今天晚上你可以在宿舍休息，或者跟我们去看电影。","大家都不着急，你慢慢决定就行。"],py:["Jīn tiān wǎn shang nǐ kě yǐ zài sù shè xiū xi, huò zhě gēn wǒ men qù kàn diàn yǐng.","Dà jiā dōu bù zháo jí, nǐ màn man jué dìng jiù xíng."],vi:["Tối nay bạn có thể nghỉ ngơi trong ký túc xá hoặc đi xem phim với chúng tôi.","Mọi người đều không vội, bạn cứ từ từ quyết định là được."]},
  "3-3-饮料":{zh:["天气太热了，我想先买一瓶冷饮料。","走了这么久，大家都已经有点儿口渴了。"],py:["Tiān qì tài rè le, wǒ xiǎng xiān mǎi yì píng lěng yǐn liào.","Zǒu le zhè me jiǔ, dà jiā dōu yǐ jīng yǒu diǎnr kǒu kě le."],vi:["Trời nóng quá, tôi muốn mua trước một chai nước lạnh.","Đi lâu như vậy rồi nên mọi người đều đã hơi khát."]},
  "3-3-放":{zh:["你先把行李放在门口吧。","等房间打扫干净以后，再慢慢整理也不晚。"],py:["Nǐ xiān bǎ xíng li fàng zài mén kǒu ba.","Děng fáng jiān dǎ sǎo gān jìng yǐ hòu, zài màn man zhěng lǐ yě bù wǎn."],vi:["Bạn cứ để hành lý ở cửa trước đi.","Đợi phòng được dọn sạch rồi từ từ sắp xếp sau cũng chưa muộn."]},
  "3-4-比赛":{zh:["学校明天有一场篮球比赛。","我们班很多同学都打算去给队员加油。"],py:["Xué xiào míng tiān yǒu yì chǎng lán qiú bǐ sài.","Wǒ men bān hěn duō tóng xué dōu dǎ suàn qù gěi duì yuán jiā yóu."],vi:["Ngày mai trường có một trận bóng rổ.","Nhiều bạn trong lớp tôi đều định đi cổ vũ cho các cầu thủ."]},
  "3-4-照片":{zh:["这张照片是我们去年旅行的时候拍的。","每次看到它，我都会想起那几天很轻松的生活。"],py:["Zhè zhāng zhào piàn shì wǒ men qù nián lǚ xíng de shí hou pāi de.","Měi cì kàn dào tā, wǒ dōu huì xiǎng qǐ nà jǐ tiān hěn qīng sōng de shēng huó."],vi:["Tấm ảnh này là chúng tôi chụp trong chuyến du lịch năm ngoái.","Mỗi lần nhìn thấy nó tôi đều nhớ lại những ngày sống rất thoải mái đó."]},
  "3-4-年级":{zh:["你弟弟现在上几年级了？","我记得去年见到他的时候，他个子还没有这么高。"],py:["Nǐ dì di xiàn zài shàng jǐ nián jí le?","Wǒ jì de qù nián jiàn dào tā de shí hou, tā gè zi hái méi yǒu zhè me gāo."],vi:["Em trai bạn bây giờ học lớp mấy rồi?","Tôi nhớ năm ngoái lúc gặp em ấy thì em còn chưa cao thế này."]},
  "3-4-又":{zh:["他昨天说今天不来了，没想到下午又出现了。","大家看见他的时候，都忍不住笑了。"],py:["Tā zuó tiān shuō jīn tiān bù lái le, méi xiǎng dào xià wǔ yòu chū xiàn le.","Dà jiā kàn jiàn tā de shí hou, dōu rěn bú zhù xiào le."],vi:["Hôm qua cậu ấy nói hôm nay không đến, không ngờ chiều lại xuất hiện.","Lúc mọi người nhìn thấy cậu ấy thì ai cũng bật cười."]},
  "3-4-聪明":{zh:["那个孩子不但很聪明，而且特别愿意思考。","老师才讲了一遍，他就差不多都明白了。"],py:["Nà ge hái zi bú dàn hěn cōng ming, ér qiě tè bié yuàn yì sī kǎo.","Lǎo shī cái jiǎng le yí biàn, tā jiù chà bu duō dōu míng bai le."],vi:["Đứa trẻ đó không những rất thông minh mà còn đặc biệt thích suy nghĩ.","Giáo viên mới giảng một lượt mà em ấy gần như đã hiểu hết rồi."]},
  "3-4-热情":{zh:["这家饭店的服务员特别热情。","我们刚坐下，她就马上给我们倒水。"],py:["Zhè jiā fàn diàn de fú wù yuán tè bié rè qíng.","Wǒ men gāng zuò xià, tā jiù mǎ shàng gěi wǒ men dào shuǐ."],vi:["Nhân viên phục vụ ở nhà hàng này rất nhiệt tình.","Chúng tôi vừa ngồi xuống thì cô ấy đã lập tức rót nước cho chúng tôi."]},
  "3-4-努力":{zh:["如果你想把中文学好，就一定要努力。","每天进步一点儿，时间长了差别就会很大。"],py:["Rú guǒ nǐ xiǎng bǎ Zhōng wén xué hǎo, jiù yí dìng yào nǔ lì.","Měi tiān jìn bù yì diǎnr, shí jiān cháng le chà bié jiù huì hěn dà."],vi:["Nếu bạn muốn học tốt tiếng Trung thì nhất định phải nỗ lực.","Mỗi ngày tiến bộ một chút, lâu dần sự khác biệt sẽ rất lớn."]},
  "3-4-总是":{zh:["他最近总是睡得很晚。","怪不得上课的时候看起来一点儿精神也没有。"],py:["Tā zuì jìn zǒng shì shuì de hěn wǎn.","Guài bu de shàng kè de shí hou kàn qǐ lái yì diǎnr jīng shén yě méi yǒu."],vi:["Dạo này anh ấy lúc nào cũng ngủ rất muộn.","Bảo sao lúc lên lớp trông chẳng có chút tinh thần nào."]},
  "3-4-回答":{zh:["老师问了一个很简单的问题，可是没有人马上回答。","教室里安静了几秒以后，大家才一起笑起来。"],py:["Lǎo shī wèn le yí ge hěn jiǎn dān de wèn tí, kě shì méi yǒu rén mǎ shàng huí dá.","Jiào shì lǐ ān jìng le jǐ miǎo yǐ hòu, dà jiā cái yì qǐ xiào qǐ lái."],vi:["Giáo viên hỏi một câu rất đơn giản nhưng không ai trả lời ngay.","Sau vài giây yên lặng trong lớp, mọi người mới cùng bật cười."]},
  "3-4-站":{zh:["坐了两个小时以后，我决定起来站一会儿。","一直不动的话，背和肩膀都会有点儿不舒服。"],py:["Zuò le liǎng ge xiǎo shí yǐ hòu, wǒ jué dìng qǐ lái zhàn yí huìr.","Yì zhí bú dòng de huà, bèi hé jiān bǎng dōu huì yǒu diǎnr bù shū fu."],vi:["Sau khi ngồi hai tiếng, tôi quyết định đứng dậy một lúc.","Nếu cứ không cử động thì lưng và vai đều sẽ hơi khó chịu."]},
  "3-4-饿":{zh:["我中午只喝了一杯咖啡，现在已经很饿了。","要是再不开饭，我可能连书都看不进去了。"],py:["Wǒ zhōng wǔ zhǐ hē le yì bēi kā fēi, xiàn zài yǐ jīng hěn è le.","Yào shì zài bù kāi fàn, wǒ kě néng lián shū dōu kàn bú jìn qù le."],vi:["Trưa nay tôi chỉ uống một cốc cà phê, bây giờ đã rất đói rồi.","Nếu còn chưa ăn cơm thì có lẽ tôi đến sách cũng không đọc nổi nữa."]},
  "3-4-超市":{zh:["下课以后，我去超市买了一些水果和面包。","最近天气太热，我不想在外面走太久。"],py:["Xià kè yǐ hòu, wǒ qù chāo shì mǎi le yì xiē shuǐ guǒ hé miàn bāo.","Zuì jìn tiān qì tài rè, wǒ bù xiǎng zài wài mian zǒu tài jiǔ."],vi:["Tan học xong tôi đi siêu thị mua một ít trái cây và bánh mì.","Dạo này trời nóng quá nên tôi không muốn đi ngoài đường quá lâu."]},
  "3-4-蛋糕":{zh:["朋友过生日的时候，我给她买了一个小蛋糕。","虽然不大，但是上面写的字特别可爱。"],py:["Péng you guò shēng rì de shí hou, wǒ gěi tā mǎi le yí ge xiǎo dàn gāo.","Suī rán bú dà, dàn shì shàng mian xiě de zì tè bié kě ài."],vi:["Khi bạn tôi sinh nhật, tôi mua cho cô ấy một chiếc bánh kem nhỏ.","Tuy không lớn nhưng chữ viết trên đó rất đáng yêu."]},
  "3-4-年轻":{zh:["那位新来的老师看起来很年轻。","可是她讲课特别清楚，经验也很丰富。"],py:["Nà wèi xīn lái de lǎo shī kàn qǐ lái hěn nián qīng.","Kě shì tā jiǎng kè tè bié qīng chu, jīng yàn yě hěn fēng fù."],vi:["Vị giáo viên mới trông rất trẻ.","Nhưng cô ấy giảng bài rất rõ ràng và kinh nghiệm cũng rất phong phú."]},
  "3-4-客人":{zh:["今天晚上家里有客人来吃饭。","妈妈下午就开始准备菜，我也在旁边帮忙。"],py:["Jīn tiān wǎn shang jiā lǐ yǒu kè rén lái chī fàn.","Mā ma xià wǔ jiù kāi shǐ zhǔn bèi cài, wǒ yě zài páng biān bāng máng."],vi:["Tối nay nhà có khách đến ăn cơm.","Buổi chiều mẹ đã bắt đầu chuẩn bị món ăn, tôi cũng ở bên cạnh phụ giúp."]},
  "3-4-认真":{zh:["他做什么事情都很认真。","连整理桌子这样的小事，他也不会随便。"],py:["Tā zuò shén me shì qing dōu hěn rèn zhēn.","Lián zhěng lǐ zhuō zi zhè yàng de xiǎo shì, tā yě bú huì suí biàn."],vi:["Anh ấy làm việc gì cũng rất nghiêm túc.","Ngay cả việc nhỏ như sắp xếp bàn học, anh ấy cũng không làm qua loa."]},
  "3-5-发烧":{zh:["我昨天晚上开始发烧，所以今天没有去上课。","医生让我好好休息两天，不要再吹风了。"],py:["Wǒ zuó tiān wǎn shang kāi shǐ fā shāo, suǒ yǐ jīn tiān méi yǒu qù shàng kè.","Yī shēng ràng wǒ hǎo hǎo xiū xi liǎng tiān, bú yào zài chuī fēng le."],vi:["Tối qua tôi bắt đầu sốt nên hôm nay không đi học.","Bác sĩ bảo tôi nghỉ ngơi cho tốt hai ngày và đừng ra gió nữa."]},
  "3-5-为":{zh:["为了准备这次比赛，我们已经练习了很久。","大家都希望最后能有一个好结果。"],py:["Wèi le zhǔn bèi zhè cì bǐ sài, wǒ men yǐ jīng liàn xí le hěn jiǔ.","Dà jiā dōu xī wàng zuì hòu néng yǒu yí ge hǎo jié guǒ."],vi:["Để chuẩn bị cho cuộc thi lần này, chúng tôi đã luyện tập rất lâu.","Mọi người đều hy vọng cuối cùng sẽ có một kết quả tốt."]},
  "3-5-照顾":{zh:["我生病的时候，室友一直很认真地照顾我。","她不但帮我买药，还给我带了热粥回来。"],py:["Wǒ shēng bìng de shí hou, shì yǒu yì zhí hěn rèn zhēn de zhào gu wǒ.","Tā bú dàn bāng wǒ mǎi yào, hái gěi wǒ dài le rè zhōu huí lái."],vi:["Lúc tôi bị ốm, bạn cùng phòng đã chăm sóc tôi rất chu đáo.","Cô ấy không những giúp tôi mua thuốc mà còn mang cháo nóng về cho tôi."]},
  "3-5-用":{zh:["我平时喜欢用铅笔先写重点。","这样如果发现错误，修改起来会比较方便。"],py:["Wǒ píng shí xǐ huan yòng qiān bǐ xiān xiě zhòng diǎn.","Zhè yàng rú guǒ fā xiàn cuò wù, xiū gǎi qǐ lái huì bǐ jiào fāng biàn."],vi:["Bình thường tôi thích dùng bút chì để viết trọng điểm trước.","Như vậy nếu phát hiện lỗi thì sửa lại sẽ tiện hơn."]},
  "3-5-感冒":{zh:["最近天气变化太快，我一不小心就感冒了。","现在说话的时候，声音听起来还有一点儿怪。"],py:["Zuì jìn tiān qì biàn huà tài kuài, wǒ yí bú xiǎo xīn jiù gǎn mào le.","Xiàn zài shuō huà de shí hou, shēng yīn tīng qǐ lái hái yǒu yì diǎnr guài."],vi:["Dạo này thời tiết thay đổi quá nhanh, tôi sơ ý một chút là bị cảm.","Bây giờ lúc nói chuyện, giọng nghe vẫn còn hơi lạ."]},
  "3-5-刚才":{zh:["你刚才去哪儿了？","老师找了你半天，还以为你已经回家了。"],py:["Nǐ gāng cái qù nǎr le?","Lǎo shī zhǎo le nǐ bàn tiān, hái yǐ wéi nǐ yǐ jīng huí jiā le."],vi:["Lúc nãy bạn đi đâu vậy?","Giáo viên tìm bạn mãi, còn tưởng là bạn đã về nhà rồi."]},
  "3-5-季节":{zh:["一年四个季节里，我最喜欢秋天。","天气不冷也不热，最适合出去散步。"],py:["Yì nián sì ge jì jié lǐ, wǒ zuì xǐ huan qiū tiān.","Tiān qì bù lěng yě bú rè, zuì shì hé chū qù sàn bù."],vi:["Trong bốn mùa của một năm, tôi thích mùa thu nhất.","Thời tiết không lạnh cũng không nóng, thích hợp nhất để đi dạo."]},
  "3-5-帮忙":{zh:["我一个人搬不动这个桌子，你能不能过来帮忙？","只要抬到门口就行，不会太麻烦你。"],py:["Wǒ yí ge rén bān bú dòng zhè ge zhuō zi, nǐ néng bu néng guò lái bāng máng?","Zhǐ yào tái dào mén kǒu jiù xíng, bú huì tài má fan nǐ."],vi:["Một mình tôi không bê nổi cái bàn này, bạn có thể qua giúp được không?","Chỉ cần khiêng ra đến cửa là được, sẽ không phiền bạn quá đâu."]},
  "3-5-当然":{zh:["你想跟我们一起去看展览吗？","当然可以，人多一点儿会更热闹。"],py:["Nǐ xiǎng gēn wǒ men yì qǐ qù kàn zhǎn lǎn ma?","Dāng rán kě yǐ, rén duō yì diǎnr huì gèng rè nao."],vi:["Bạn muốn đi xem triển lãm cùng bọn tôi không?","Đương nhiên là được, đông người hơn sẽ càng vui."]},
  "3-5-特别":{zh:["这家面馆不大，可是汤特别好喝。","难怪每天中午门口都有很多人排队。"],py:["Zhè jiā miàn guǎn bú dà, kě shì tāng tè bié hǎo hē.","Nán guài měi tiān zhōng wǔ mén kǒu dōu yǒu hěn duō rén pái duì."],vi:["Quán mì này không lớn nhưng nước dùng đặc biệt ngon.","Bảo sao trưa nào trước cửa cũng có rất nhiều người xếp hàng."]},
  "3-5-春天":{zh:["春天来了以后，学校里到处都是绿色。","天气暖和的时候，我最喜欢在操场边慢慢走。"],py:["Chūn tiān lái le yǐ hòu, xué xiào lǐ dào chù dōu shì lǜ sè.","Tiān qì nuǎn huo de shí hou, wǒ zuì xǐ huan zài cāo chǎng biān màn man zǒu."],vi:["Sau khi mùa xuân đến, trong trường chỗ nào cũng xanh mướt.","Khi thời tiết ấm áp, tôi thích nhất là đi bộ chậm rãi bên sân trường."]},
  "3-5-讲":{zh:["这位老师讲课的时候很有意思。","本来有点儿难的语法，让他一讲就清楚多了。"],py:["Zhè wèi lǎo shī jiǎng kè de shí hou hěn yǒu yì si.","Běn lái yǒu diǎnr nán de yǔ fǎ, ràng tā yì jiǎng jiù qīng chu duō le."],vi:["Vị giáo viên này giảng bài rất thú vị.","Ngữ pháp vốn hơi khó qua cách thầy giảng liền trở nên rõ ràng hơn nhiều."]},
  "3-5-明白":{zh:["你刚才说得太快了，我没有完全明白。","能不能再慢一点儿解释一遍？"],py:["Nǐ gāng cái shuō de tài kuài le, wǒ méi yǒu wán quán míng bai.","Néng bu néng zài màn yì diǎnr jiě shì yí biàn?"],vi:["Lúc nãy bạn nói nhanh quá nên tôi chưa hiểu hoàn toàn.","Bạn có thể giải thích lại chậm hơn một chút không?"]},
  "3-5-锻炼":{zh:["最近我每天早上都去操场锻炼。","跑完步以后，整个人的感觉轻松了很多。"],py:["Zuì jìn wǒ měi tiān zǎo shang dōu qù cāo chǎng duàn liàn.","Pǎo wán bù yǐ hòu, zhěng ge rén de gǎn jué qīng sōng le hěn duō."],vi:["Gần đây sáng nào tôi cũng ra sân vận động tập luyện.","Sau khi chạy xong, cả người tôi thấy thoải mái hơn nhiều."]},
  "3-5-越":{zh:["你如果每天都练习口语，就会说得越来越自然。","一开始可能有点儿慢，可是慢慢一定能听出来变化。"],py:["Nǐ rú guǒ měi tiān dōu liàn xí kǒu yǔ, jiù huì shuō de yuè lái yuè zì rán.","Yì kāi shǐ kě néng yǒu diǎnr màn, kě shì màn man yí dìng néng tīng chū lái biàn huà."],vi:["Nếu bạn luyện khẩu ngữ mỗi ngày thì sẽ nói ngày càng tự nhiên hơn.","Ban đầu có thể hơi chậm nhưng dần dần nhất định sẽ nhận ra sự thay đổi."]},
  "3-5-聊天儿":{zh:["晚饭以后，我们几个同学坐在楼下聊天儿。","从作业聊到旅行，结果一不小心就聊到了很晚。"],py:["Wǎn fàn yǐ hòu, wǒ men jǐ ge tóng xué zuò zài lóu xià liáo tiānr.","Cóng zuò yè liáo dào lǚ xíng, jié guǒ yí bú xiǎo xīn jiù liáo dào le hěn wǎn."],vi:["Sau bữa tối, mấy bạn học chúng tôi ngồi dưới lầu trò chuyện.","Từ bài tập nói sang du lịch, cuối cùng vô tình nói chuyện đến rất khuya."]},
  "3-6-眼镜":{zh:["我以前不常戴眼镜，现在上课的时候离黑板远了就看不清。","所以每天出门以前，我都会先检查眼镜有没有放进包里。"],py:["Wǒ yǐ qián bù cháng dài yǎn jìng, xiàn zài shàng kè de shí hou lí hēi bǎn yuǎn le jiù kàn bù qīng.","Suǒ yǐ měi tiān chū mén yǐ qián, wǒ dōu huì xiān jiǎn chá yǎn jìng yǒu méi yǒu fàng jìn bāo lǐ."],vi:["Trước đây tôi không thường đeo kính, nhưng bây giờ ngồi xa bảng là không nhìn rõ nữa.","Vì vậy mỗi ngày trước khi ra ngoài, tôi đều kiểm tra xem kính đã được bỏ vào túi chưa."]},
  "3-6-突然":{zh:["我们本来打算去操场跑步，可是天突然下起了大雨。","大家只好赶快回到教室里坐着聊天儿。"],py:["Wǒ men běn lái dǎ suàn qù cāo chǎng pǎo bù, kě shì tiān tū rán xià qǐ le dà yǔ.","Dà jiā zhǐ hǎo gǎn kuài huí dào jiào shì lǐ zuò zhe liáo tiānr."],vi:["Ban đầu chúng tôi định ra sân chạy bộ, nhưng trời đột nhiên đổ mưa to.","Mọi người đành phải nhanh chóng quay về lớp ngồi trò chuyện."]},
  "3-6-离开":{zh:["他离开宿舍以前，把窗户和灯都关好了。","做事这么认真，难怪老师一直很放心。"],py:["Tā lí kāi sù shè yǐ qián, bǎ chuāng hu hé dēng dōu guān hǎo le.","Zuò shì zhè me rèn zhēn, nán guài lǎo shī yì zhí hěn fàng xīn."],vi:["Trước khi rời ký túc xá, cậu ấy đã đóng cửa sổ và tắt đèn cẩn thận.","Làm việc nghiêm túc như vậy, bảo sao giáo viên luôn rất yên tâm."]},
  "3-6-清楚":{zh:["老师刚才说得有点儿快，我没有听清楚。","下课以后，我又去办公室问了一遍。"],py:["Lǎo shī gāng cái shuō de yǒu diǎnr kuài, wǒ méi yǒu tīng qīng chu.","Xià kè yǐ hòu, wǒ yòu qù bàn gōng shì wèn le yí biàn."],vi:["Lúc nãy giáo viên nói hơi nhanh nên tôi không nghe rõ.","Sau giờ học, tôi lại đến văn phòng hỏi thêm một lần nữa."]},
  "3-6-感兴趣":{zh:["我本来只想随便看看，可是后来对中国历史越来越感兴趣。","现在每个周末，我都会去图书馆借相关的书。"],py:["Wǒ běn lái zhǐ xiǎng suí biàn kàn kan, kě shì hòu lái duì Zhōng guó lì shǐ yuè lái yuè gǎn xìng qù.","Xiàn zài měi ge zhōu mò, wǒ dōu huì qù tú shū guǎn jiè xiāng guān de shū."],vi:["Ban đầu tôi chỉ muốn xem qua thôi, nhưng sau đó ngày càng có hứng thú với lịch sử Trung Quốc.","Bây giờ mỗi cuối tuần tôi đều đến thư viện mượn sách liên quan."]},
  "3-6-结婚":{zh:["我姐姐下个月就要结婚了。","全家人最近都在忙着准备礼物和安排时间。"],py:["Wǒ jiě jie xià ge yuè jiù yào jié hūn le.","Quán jiā rén zuì jìn dōu zài máng zhe zhǔn bèi lǐ wù hé ān pái shí jiān."],vi:["Chị gái tôi tháng sau sẽ kết hôn rồi.","Gần đây cả nhà đều bận chuẩn bị quà và sắp xếp thời gian."]},
  "3-6-久":{zh:["我们已经很久没有一起吃饭了。","这次好不容易都有空，所以大家都来得特别早。"],py:["Wǒ men yǐ jīng hěn jiǔ méi yǒu yì qǐ chī fàn le.","Zhè cì hǎo bù róng yì dōu yǒu kòng, suǒ yǐ dà jiā dōu lái de tè bié zǎo."],vi:["Chúng tôi đã rất lâu rồi không cùng nhau ăn cơm.","Lần này khó lắm mới cùng rảnh nên mọi người đều đến rất sớm."]},
  "3-6-害怕":{zh:["小时候我很害怕一个人走夜路。","现在长大了一点儿，胆子也慢慢大起来了。"],py:["Xiǎo shí hou wǒ hěn hài pà yí ge rén zǒu yè lù.","Xiàn zài zhǎng dà le yì diǎnr, dǎn zi yě màn man dà qǐ lái le."],vi:["Hồi nhỏ tôi rất sợ đi đường tối một mình.","Bây giờ lớn thêm một chút rồi nên cũng dần dạn dĩ hơn."]},
  "3-6-熊猫":{zh:["我第一次在动物园看到熊猫的时候特别激动。","它慢慢地坐在地上吃竹子，看起来又安静又可爱。"],py:["Wǒ dì yī cì zài dòng wù yuán kàn dào xióng māo de shí hou tè bié jī dòng.","Tā màn man de zuò zài dì shàng chī zhú zi, kàn qǐ lái yòu ān jìng yòu kě ài."],vi:["Lần đầu tiên tôi nhìn thấy gấu trúc trong sở thú, tôi vô cùng thích thú.","Nó ngồi chậm rãi dưới đất ăn tre, trông vừa yên tĩnh vừa đáng yêu."]},
  "3-6-见面":{zh:["虽然我们以前只在网上聊过天儿，可是今天见面一点儿也不觉得陌生。","他一开口说话，我就马上想起了熟悉的声音。"],py:["Suī rán wǒ men yǐ qián zhǐ zài wǎng shàng liáo guo tiān r, kě shì jīn tiān jiàn miàn yì diǎnr yě bù jué de mò shēng.","Tā yì kāi kǒu shuō huà, wǒ jiù mǎ shàng xiǎng qǐ le shú xī de shēng yīn."],vi:["Tuy trước đây chúng tôi chỉ từng trò chuyện trên mạng, nhưng hôm nay gặp mặt lại không hề thấy xa lạ.","Vừa nghe anh ấy cất tiếng nói là tôi lập tức nhớ ra giọng quen thuộc đó."]},
  "3-6-迟到":{zh:["今天早上地铁有点儿慢，所以我差一点儿迟到。","幸好老师还没有进教室，我赶快坐到了自己的位置上。"],py:["Jīn tiān zǎo shang dì tiě yǒu diǎnr màn, suǒ yǐ wǒ chà yì diǎnr chí dào.","Xìng hǎo lǎo shī hái méi yǒu jìn jiào shì, wǒ gǎn kuài zuò dào le zì jǐ de wèi zi shàng."],vi:["Sáng nay tàu điện ngầm hơi chậm nên tôi suýt chút nữa đi học muộn.","May mà giáo viên vẫn chưa vào lớp, tôi vội ngồi vào chỗ của mình."]},
  "3-6-安静":{zh:["这家咖啡馆不大，可是特别安静。","很多学生喜欢来这儿看书或者写作业。"],py:["Zhè jiā kā fēi guǎn bú dà, kě shì tè bié ān jìng.","Hěn duō xué sheng xǐ huan lái zhèr kàn shū huò zhě xiě zuò yè."],vi:["Quán cà phê này không lớn nhưng đặc biệt yên tĩnh.","Rất nhiều học sinh thích đến đây đọc sách hoặc làm bài tập."]},
  "3-6-半":{zh:["我今天只睡了半个晚上。","楼上的声音太大，一直到很晚我都没有睡着。"],py:["Wǒ jīn tiān zhǐ shuì le bàn ge wǎn shang.","Lóu shàng de shēng yīn tài dà, yì zhí dào hěn wǎn wǒ dōu méi yǒu shuì zháo."],vi:["Hôm nay tôi chỉ ngủ được nửa đêm thôi.","Tiếng động ở tầng trên quá lớn, mãi đến khuya tôi vẫn chưa ngủ được."]},
  "3-6-可乐":{zh:["天气太热的时候，我偶尔会想喝一瓶冰可乐。","不过喝完以后，我还是觉得白开水更舒服。"],py:["Tiān qì tài rè de shí hou, wǒ ǒu ěr huì xiǎng hē yì píng bīng kě lè.","Bú guò hē wán yǐ hòu, wǒ hái shì jué de bái kāi shuǐ gèng shū fu."],vi:["Khi trời quá nóng, đôi khi tôi muốn uống một chai Coca lạnh.","Nhưng uống xong rồi tôi vẫn thấy nước lọc dễ chịu hơn."]},
  "3-6-一会儿":{zh:["你先在这儿坐一会儿吧，我马上回来。","我只是去楼下拿个快递，不会花太长时间。"],py:["Nǐ xiān zài zhèr zuò yí huìr ba, wǒ mǎ shàng huí lái.","Wǒ zhǐ shì qù lóu xià ná ge kuài dì, bú huì huā tài cháng shí jiān."],vi:["Bạn cứ ngồi ở đây một lát nhé, tôi sẽ quay lại ngay.","Tôi chỉ xuống dưới lấy bưu kiện thôi, sẽ không mất quá nhiều thời gian đâu."]},
  "3-6-刻":{zh:["我们约好三点一刻在地铁站见面。","可是我到的时候，他已经在那里等我了。"],py:["Wǒ men yuē hǎo sān diǎn yí kè zài dì tiě zhàn jiàn miàn.","Kě shì wǒ dào de shí hou, tā yǐ jīng zài nà lǐ děng wǒ le."],vi:["Chúng tôi hẹn nhau lúc ba giờ mười lăm ở ga tàu điện ngầm.","Nhưng khi tôi đến nơi thì anh ấy đã đứng đó đợi tôi rồi."]},
  "3-6-马上":{zh:["老师刚走进教室，大家就马上安静下来了。","本来还在聊天儿的同学，也立刻回到了座位上。"],py:["Lǎo shī gāng zǒu jìn jiào shì, dà jiā jiù mǎ shàng ān jìng xià lái le.","Běn lái hái zài liáo tiānr de tóng xué, yě lì kè huí dào le zuò wèi shàng."],vi:["Giáo viên vừa bước vào lớp là mọi người lập tức yên lặng lại.","Những bạn học vốn còn đang trò chuyện cũng ngay lập tức trở về chỗ ngồi."]},
  "3-6-差":{zh:["现在差五分八点，你要是再不出门就来不及了。","今天路上可能会比较堵，我们最好早点儿走。"],py:["Xiàn zài chà wǔ fēn bā diǎn, nǐ yào shì zài bù chū mén jiù lái bu jí le.","Jīn tiān lù shàng kě néng huì bǐ jiào dǔ, wǒ men zuì hǎo zǎo diǎnr zǒu."],vi:["Bây giờ chỉ còn năm phút nữa là tám giờ rồi, nếu bạn còn chưa ra khỏi nhà thì sẽ không kịp đâu.","Hôm nay trên đường có thể sẽ khá tắc, tốt nhất chúng ta nên đi sớm hơn."]},
  "3-6-洗手间":{zh:["我第一次来这家饭店，所以不知道洗手间在哪儿。","服务员很热情，马上带我走到了门口。"],py:["Wǒ dì yī cì lái zhè jiā fàn diàn, suǒ yǐ bù zhī dào xǐ shǒu jiān zài nǎr.","Fú wù yuán hěn rè qíng, mǎ shàng dài wǒ zǒu dào le mén kǒu."],vi:["Đây là lần đầu tôi đến nhà hàng này nên không biết nhà vệ sinh ở đâu.","Nhân viên phục vụ rất nhiệt tình và lập tức dẫn tôi đến cửa."]},
  "3-7-同事":{zh:["我那位新同事性格很开朗。","虽然才认识几天，可是大家都很愿意跟他一起工作。"],py:["Wǒ nà wèi xīn tóng shì xìng gé hěn kāi lǎng.","Suī rán cái rèn shi jǐ tiān, kě shì dà jiā dōu hěn yuàn yì gēn tā yì qǐ gōng zuò."],vi:["Người đồng nghiệp mới đó của tôi có tính cách rất cởi mở.","Tuy mới quen vài ngày nhưng mọi người đều rất thích làm việc cùng anh ấy."]},
  "3-7-满意":{zh:["老师看了我的作业以后，表示很满意。","他说这次不但写得清楚，而且错误也少了很多。"],py:["Lǎo shī kàn le wǒ de zuò yè yǐ hòu, biǎo shì hěn mǎn yì.","Tā shuō zhè cì bú dàn xiě de qīng chu, ér qiě cuò wù yě shǎo le hěn duō."],vi:["Sau khi xem bài tập của tôi, giáo viên tỏ ra rất hài lòng.","Thầy nói lần này không những viết rõ ràng mà lỗi sai cũng ít đi rất nhiều."]},
  "3-7-电梯":{zh:["这栋楼太高了，走楼梯实在太累。","所以我们决定坐电梯直接上去。"],py:["Zhè dòng lóu tài gāo le, zǒu lóu tī shí zài tài lèi.","Suǒ yǐ wǒ men jué dìng zuò diàn tī zhí jiē shàng qù."],vi:["Tòa nhà này cao quá, đi thang bộ thật sự rất mệt.","Vì vậy chúng tôi quyết định đi thang máy lên thẳng."]},
  "3-7-一样":{zh:["我们买的书封面不一样，可是内容其实差不多。","店员说只是出版社不同，所以价格也有一点儿区别。"],py:["Wǒ men mǎi de shū fēng miàn bù yí yàng, kě shì nèi róng qí shí chà bu duō.","Diàn yuán shuō zhǐ shì chū bǎn shè bù tóng, suǒ yǐ jià gé yě yǒu yì diǎnr qū bié."],vi:["Những quyển sách chúng tôi mua có bìa không giống nhau nhưng nội dung thực ra gần như nhau.","Nhân viên nói chỉ khác nhà xuất bản nên giá cũng có chút chênh lệch."]},
  "3-7-最后":{zh:["最后一个问题最难，我看了很久还是不会。","考试结束以后，我马上去问同学答案。"],py:["Zuì hòu yí ge wèn tí zuì nán, wǒ kàn le hěn jiǔ hái shì bú huì.","Kǎo shì jié shù yǐ hòu, wǒ mǎ shàng qù wèn tóng xué dá àn."],vi:["Câu hỏi cuối cùng là khó nhất, tôi nhìn mãi mà vẫn không biết làm.","Sau khi thi xong, tôi lập tức đi hỏi bạn học đáp án."]},
  "3-7-以前":{zh:["以前我总觉得学语法特别无聊。","可是现在慢慢明白了，很多句子其实都离不开语法。"],py:["Yǐ qián wǒ zǒng jué de xué yǔ fǎ tè bié wú liáo.","Kě shì xiàn zài màn man míng bai le, hěn duō jù zi qí shí dōu lí bù kāi yǔ fǎ."],vi:["Trước đây tôi luôn cảm thấy học ngữ pháp đặc biệt chán.","Nhưng bây giờ tôi dần hiểu ra rằng rất nhiều câu thật ra đều không thể tách rời ngữ pháp."]},
  "3-7-欢迎":{zh:["欢迎你下个周末来我家做客。","我妈妈早就说，想亲自做几样拿手菜给你尝尝。"],py:["Huān yíng nǐ xià ge zhōu mò lái wǒ jiā zuò kè.","Wǒ mā ma zǎo jiù shuō, xiǎng qīn zì zuò jǐ yàng ná shǒu cài gěi nǐ cháng chang."],vi:["Chào mừng bạn cuối tuần sau đến nhà tôi chơi.","Mẹ tôi đã nói từ lâu rằng muốn tự tay nấu vài món sở trường cho bạn thử."]},
  "3-7-银行":{zh:["这条街走到头右边就是银行。","如果你还不太清楚，我可以陪你一起过去。"],py:["Zhè tiáo jiē zǒu dào tóu yòu biān jiù shì yín háng.","Rú guǒ nǐ hái bù tài qīng chu, wǒ kě yǐ péi nǐ yì qǐ guò qù."],vi:["Đi hết con phố này rồi rẽ phải là đến ngân hàng.","Nếu bạn vẫn chưa rõ lắm thì tôi có thể đi cùng bạn qua đó."]},
  "3-8-又":{zh:["他昨天刚说这周不会来了，今天又出现在教室门口。","大家都觉得很惊讶，连老师也笑了。"],py:["Tā zuó tiān gāng shuō zhè zhōu bú huì lái le, jīn tiān yòu chū xiàn zài jiào shì mén kǒu.","Dà jiā dōu jué de hěn jīng yà, lián lǎo shī yě xiào le."],vi:["Hôm qua cậu ấy vừa nói tuần này sẽ không đến, hôm nay lại xuất hiện ở cửa lớp.","Mọi người đều rất ngạc nhiên, đến giáo viên cũng bật cười."]},
  "3-8-中文":{zh:["我刚开始学中文的时候，只会说几句很简单的话。","现在虽然还会出错，但是已经敢跟朋友慢慢交流了。"],py:["Wǒ gāng kāi shǐ xué Zhōng wén de shí hou, zhǐ huì shuō jǐ jù hěn jiǎn dān de huà.","Xiàn zài suī rán hái huì chū cuò, dàn shì yǐ jīng gǎn gēn péng you màn man jiāo liú le."],vi:["Khi mới bắt đầu học tiếng Trung, tôi chỉ biết nói vài câu rất đơn giản.","Bây giờ tuy vẫn còn sai nhưng tôi đã dám từ từ giao tiếp với bạn bè rồi."]},
  "3-8-班":{zh:["你是哪个班的学生？","如果咱们在同一层楼上课，以后可以一起去食堂。"],py:["Nǐ shì nǎ ge bān de xué sheng?","Rú guǒ zán men zài tóng yì céng lóu shàng kè, yǐ hòu kě yǐ yì qǐ qù shí táng."],vi:["Bạn là học sinh lớp nào vậy?","Nếu chúng ta học cùng một tầng thì sau này có thể cùng nhau đi nhà ăn."]},
  "3-8-放心":{zh:["这件事我已经安排好了，你可以放心。","只要按时到那儿，后面的事情都不会有问题。"],py:["Zhè jiàn shì wǒ yǐ jīng ān pái hǎo le, nǐ kě yǐ fàng xīn.","Zhǐ yào àn shí dào nàr, hòu mian de shì qing dōu bú huì yǒu wèn tí."],vi:["Chuyện này tôi đã sắp xếp xong rồi, bạn có thể yên tâm.","Chỉ cần đến đó đúng giờ thì những việc phía sau sẽ không có vấn đề gì đâu."]},
  "3-8-比较":{zh:["这家饭店离学校比较近，所以我们常常来这儿吃午饭。","价格不算贵，而且菜也做得挺快。"],py:["Zhè jiā fàn diàn lí xué xiào bǐ jiào jìn, suǒ yǐ wǒ men cháng cháng lái zhèr chī wǔ fàn.","Jià gé bú suàn guì, ér qiě cài yě zuò de tǐng kuài."],vi:["Nhà hàng này tương đối gần trường nên chúng tôi thường đến đây ăn trưa.","Giá không đắt lắm mà món ăn cũng lên khá nhanh."]},
  "3-8-一定":{zh:["如果明天下午不下雨，我一定去参加比赛。","这次准备了这么久，我不想轻易放弃。"],py:["Rú guǒ míng tiān xià wǔ bù xià yǔ, wǒ yí dìng qù cān jiā bǐ sài.","Zhè cì zhǔn bèi le zhè me jiǔ, wǒ bù xiǎng qīng yì fàng qì."],vi:["Nếu chiều mai không mưa, tôi nhất định sẽ đi tham gia cuộc thi.","Lần này đã chuẩn bị lâu như vậy nên tôi không muốn bỏ cuộc dễ dàng."]},
  "3-8-担心":{zh:["你不用太担心这次考试。","平时你一直很认真，成绩应该不会差。"],py:["Nǐ bú yòng tài dān xīn zhè cì kǎo shì.","Píng shí nǐ yì zhí hěn rèn zhēn, chéng jì yīng gāi bú huì chà."],vi:["Bạn không cần lo lắng quá về kỳ thi lần này.","Bình thường bạn luôn rất chăm chỉ nên kết quả chắc sẽ không tệ đâu."]},
  "3-8-先":{zh:["我们先去图书馆借书，然后再去食堂吃饭。","这样安排的话，下午的时间会比较轻松。"],py:["Wǒ men xiān qù tú shū guǎn jiè shū, rán hòu zài qù shí táng chī fàn.","Zhè yàng ān pái de huà, xià wǔ de shí jiān huì bǐ jiào qīng sōng."],vi:["Chúng ta đi thư viện mượn sách trước rồi mới đến nhà ăn ăn cơm.","Sắp xếp như vậy thì thời gian buổi chiều sẽ thoải mái hơn."]},
  "3-9-个子":{zh:["他个子很高，站在人群里特别明显。","我每次在操场找他，都能一下子看见。"],py:["Tā gè zi hěn gāo, zhàn zài rén qún lǐ tè bié míng xiǎn.","Wǒ měi cì zài cāo chǎng zhǎo tā, dōu néng yí xià zi kàn jiàn."],vi:["Cậu ấy rất cao, đứng trong đám đông rất dễ nhận ra.","Mỗi lần tôi tìm cậu ấy ở sân trường đều có thể nhìn thấy ngay."]},
  "3-9-矮":{zh:["我弟弟虽然个子比我矮，可是跑得比我快。","每次比赛的时候，我都追不上他。"],py:["Wǒ dì di suī rán gè zi bǐ wǒ ǎi, kě shì pǎo de bǐ wǒ kuài.","Měi cì bǐ sài de shí hou, wǒ dōu zhuī bù shàng tā."],vi:["Em trai tôi tuy thấp hơn tôi nhưng lại chạy nhanh hơn.","Mỗi lần thi đấu tôi đều không đuổi kịp em ấy."]},
  "3-9-历史":{zh:["我以前对历史没什么兴趣。","可是自从换了一位新老师以后，我开始觉得这门课很有意思。"],py:["Wǒ yǐ qián duì lì shǐ méi shén me xìng qù.","Kě shì zì cóng huàn le yí wèi xīn lǎo shī yǐ hòu, wǒ kāi shǐ jué de zhè mén kè hěn yǒu yì si."],vi:["Trước đây tôi không mấy hứng thú với lịch sử.","Nhưng từ sau khi đổi sang một giáo viên mới, tôi bắt đầu thấy môn học này rất thú vị."]},
  "3-9-体育":{zh:["今天下午有体育课，所以大家下课以后都先去换衣服。","老师说，先热身再跑步，不然很容易受伤。"],py:["Jīn tiān xià wǔ yǒu tǐ yù kè, suǒ yǐ dà jiā xià kè yǐ hòu dōu xiān qù huàn yī fu.","Lǎo shī shuō, xiān rè shēn zài pǎo bù, bù rán hěn róng yì shòu shāng."],vi:["Chiều nay có tiết thể dục nên sau khi tan học ai cũng đi thay đồ trước.","Giáo viên nói phải khởi động trước rồi mới chạy, nếu không sẽ rất dễ bị thương."]},
  "3-9-数学":{zh:["我一直觉得数学比历史难一点儿。","有时候一个问题想半天，最后还是做错。"],py:["Wǒ yì zhí jué de shù xué bǐ lì shǐ nán yì diǎnr.","Yǒu shí hou yí ge wèn tí xiǎng bàn tiān, zuì hòu hái shì zuò cuò."],vi:["Tôi luôn cảm thấy toán khó hơn lịch sử một chút.","Có lúc một bài toán nghĩ mãi nửa ngày mà cuối cùng vẫn làm sai."]},
  "3-9-方便":{zh:["住在学校附近真的很方便。","不但去上课很快，晚上买东西也不用走太远。"],py:["Zhù zài xué xiào fù jìn zhēn de hěn fāng biàn.","Bú dàn qù shàng kè hěn kuài, wǎn shang mǎi dōng xi yě bú yòng zǒu tài yuǎn."],vi:["Sống gần trường thực sự rất tiện lợi.","Không những đi học rất nhanh mà buổi tối mua đồ cũng không cần đi quá xa."]},
  "3-9-自行车":{zh:["天气好的时候，我喜欢骑自行车去图书馆。","路上有风，心情也会跟着轻松起来。"],py:["Tiān qì hǎo de shí hou, wǒ xǐ huan qí zì xíng chē qù tú shū guǎn.","Lù shàng yǒu fēng, xīn qíng yě huì gēn zhe qīng sōng qǐ lái."],vi:["Khi thời tiết đẹp, tôi thích đi xe đạp đến thư viện.","Trên đường có gió nên tâm trạng cũng trở nên thoải mái hơn."]},
  "3-9-骑":{zh:["我小时候不会骑自行车，总觉得有点儿害怕。","后来爸爸一直在后面扶着，我才慢慢学会。"],py:["Wǒ xiǎo shí hou bú huì qí zì xíng chē, zǒng jué de yǒu diǎnr hài pà.","Hòu lái bà ba yì zhí zài hòu mian fú zhe, wǒ cái màn man xué huì."],vi:["Hồi nhỏ tôi không biết đi xe đạp và luôn thấy hơi sợ.","Sau đó bố cứ đỡ từ phía sau nên tôi mới dần học được."]},
  "3-9-旧":{zh:["这本词典虽然有点儿旧，可是里面的内容很完整。","我用了很久，还是觉得它比新的那本方便。"],py:["Zhè běn cí diǎn suī rán yǒu diǎnr jiù, kě shì lǐ mian de nèi róng hěn wán zhěng.","Wǒ yòng le hěn jiǔ, hái shì jué de tā bǐ xīn de nà běn fāng biàn."],vi:["Quyển từ điển này tuy hơi cũ nhưng nội dung bên trong rất đầy đủ.","Tôi đã dùng nó rất lâu mà vẫn thấy nó tiện hơn quyển mới kia."]},
  "3-9-换":{zh:["今天外面突然冷起来了，我得回去换一件厚一点儿的衣服。","要不然晚上出去吃饭的时候一定会觉得冷。"],py:["Jīn tiān wài mian tū rán lěng qǐ lái le, wǒ děi huí qù huàn yí jiàn hòu yì diǎnr de yī fu.","Yào bù rán wǎn shang chū qù chī fàn de shí hou yí dìng huì jué de lěng."],vi:["Hôm nay bên ngoài đột nhiên lạnh lên, tôi phải về thay một bộ đồ dày hơn.","Nếu không thì tối ra ngoài ăn cơm nhất định sẽ thấy lạnh."]},
  "3-9-地方":{zh:["这个地方我以前来过一次，所以还有一点儿印象。","从这儿一直往前走，左边就能看到那家商店。"],py:["Zhè ge dì fang wǒ yǐ qián lái guo yí cì, suǒ yǐ hái yǒu yì diǎnr yìn xiàng.","Cóng zhèr yì zhí wǎng qián zǒu, zuǒ biān jiù néng kàn dào nà jiā shāng diàn."],vi:["Nơi này trước đây tôi đã từng đến một lần nên vẫn còn chút ấn tượng.","Từ đây đi thẳng về phía trước, bên trái sẽ nhìn thấy cửa hàng đó."]},
  "3-10-图书馆":{zh:["每次想安静一点儿的时候，我都会去图书馆。","那儿不但很安静，而且学习的人也特别多。"],py:["Měi cì xiǎng ān jìng yì diǎnr de shí hou, wǒ dōu huì qù tú shū guǎn.","Nàr bú dàn hěn ān jìng, ér qiě xué xí de rén yě tè bié duō."],vi:["Mỗi khi muốn yên tĩnh hơn một chút, tôi đều đến thư viện.","Ở đó không những rất yên tĩnh mà người học tập cũng đặc biệt nhiều."]},
  "3-10-借":{zh:["我昨天在图书馆借了一本关于北京历史的书。","如果你也感兴趣，等我看完可以借给你。"],py:["Wǒ zuó tiān zài tú shū guǎn jiè le yì běn guān yú Běi jīng lì shǐ de shū.","Rú guǒ nǐ yě gǎn xìng qù, děng wǒ kàn wán kě yǐ jiè gěi nǐ."],vi:["Hôm qua tôi mượn ở thư viện một cuốn sách về lịch sử Bắc Kinh.","Nếu bạn cũng hứng thú thì đợi tôi đọc xong có thể cho bạn mượn."]},
  "3-10-词典":{zh:["我遇到不认识的字的时候，还是习惯先查词典。","这样记下来的意思会比较清楚，也不容易忘。"],py:["Wǒ yù dào bù rèn shi de zì de shí hou, hái shi xí guàn xiān chá cí diǎn.","Zhè yàng jì xià lái de yì si huì bǐ jiào qīng chu, yě bù róng yì wàng."],vi:["Khi gặp chữ không biết, tôi vẫn quen tra từ điển trước.","Như vậy nghĩa ghi lại sẽ rõ ràng hơn và cũng không dễ quên."]},
  "3-10-灯":{zh:["外面已经黑了，你先把灯打开吧。","在这样的光线下看书太久，对眼睛不太好。"],py:["Wài mian yǐ jīng hēi le, nǐ xiān bǎ dēng dǎ kāi ba.","Zài zhè yàng de guāng xiàn xià kàn shū tài jiǔ, duì yǎn jīng bù tài hǎo."],vi:["Bên ngoài đã tối rồi, bạn bật đèn lên trước đi.","Đọc sách quá lâu trong ánh sáng như thế này không tốt cho mắt."]},
  "3-10-会议":{zh:["经理说明天下午有一个很重要的会议。","所以今天晚上我们得先把材料准备好。"],py:["Jīng lǐ shuō míng tiān xià wǔ yǒu yí ge hěn zhòng yào de huì yì.","Suǒ yǐ jīn tiān wǎn shang wǒ men děi xiān bǎ cái liào zhǔn bèi hǎo."],vi:["Giám đốc nói chiều mai có một cuộc họp rất quan trọng.","Vì vậy tối nay chúng tôi phải chuẩn bị tài liệu trước cho xong."]},
  "3-10-结束":{zh:["会议结束以后，大家都没有马上离开。","有人继续问问题，也有人坐在一起商量后面的安排。"],py:["Huì yì jié shù yǐ hòu, dà jiā dōu méi yǒu mǎ shàng lí kāi.","Yǒu rén jì xù wèn wèn tí, yě yǒu rén zuò zài yì qǐ shāng liang hòu mian de ān pái."],vi:["Sau khi cuộc họp kết thúc, mọi người đều chưa rời đi ngay.","Có người tiếp tục đặt câu hỏi, cũng có người ngồi lại bàn sắp xếp công việc phía sau."]},
  "3-10-空调":{zh:["今天教室里有点儿热，能不能把空调打开？","后面坐着的同学已经开始拿书当扇子了。"],py:["Jīn tiān jiào shì lǐ yǒu diǎnr rè, néng bu néng bǎ kōng tiáo dǎ kāi?","Hòu mian zuò zhe de tóng xué yǐ jīng kāi shǐ ná shū dāng shàn zi le."],vi:["Hôm nay trong lớp hơi nóng, có thể bật điều hòa lên được không?","Các bạn ngồi phía sau đã bắt đầu lấy sách làm quạt rồi."]},
  "3-10-关":{zh:["离开教室以前，别忘了把门和窗都关好。","晚上风比较大，不然桌上的纸很容易被吹乱。"],py:["Lí kāi jiào shì yǐ qián, bié wàng le bǎ mén hé chuāng dōu guān hǎo.","Wǎn shang fēng bǐ jiào dà, bù rán zhuō shàng de zhǐ hěn róng yì bèi chuī luàn."],vi:["Trước khi rời lớp học, đừng quên đóng kỹ cửa ra vào và cửa sổ.","Buổi tối gió khá lớn, nếu không giấy trên bàn rất dễ bị thổi tung."]},
  "3-10-地铁":{zh:["我平时上学都坐地铁，因为又快又方便。","只有下雨或者拿太多东西的时候，我才会打车。"],py:["Wǒ píng shí shàng xué dōu zuò dì tiě, yīn wèi yòu kuài yòu fāng biàn.","Zhǐ yǒu xià yǔ huò zhě ná tài duō dōng xi de shí hou, wǒ cái huì dǎ chē."],vi:["Bình thường tôi đi học đều đi tàu điện ngầm vì vừa nhanh vừa tiện.","Chỉ khi trời mưa hoặc mang quá nhiều đồ thì tôi mới đi taxi."]},
  "3-10-双":{zh:["商店门口摆着一双很漂亮的运动鞋。","我试穿以后觉得挺舒服，可是价格有点儿贵。"],py:["Shāng diàn mén kǒu bǎi zhe yì shuāng hěn piào liang de yùn dòng xié.","Wǒ shì chuān yǐ hòu jué de tǐng shū fu, kě shì jià gé yǒu diǎnr guì."],vi:["Trước cửa hàng bày một đôi giày thể thao rất đẹp.","Sau khi thử, tôi thấy khá thoải mái nhưng giá lại hơi đắt."]},
  "3-11-太阳":{zh:["今天早上太阳出来得很早。","我拉开窗帘的时候，房间一下子就亮了起来。"],py:["Jīn tiān zǎo shang tài yáng chū lái de hěn zǎo.","Wǒ lā kāi chuāng lián de shí hou, fáng jiān yí xià zi jiù liàng le qǐ lái."],vi:["Sáng nay mặt trời mọc rất sớm.","Khi tôi kéo rèm cửa ra, căn phòng bỗng sáng hẳn lên."]},
  "3-11-西":{zh:["我们站在河边的时候，正好看见太阳从西边慢慢落下去。","天的颜色一会儿就变成了橙色，很漂亮。"],py:["Wǒ men zhàn zài hé biān de shí hou, zhèng hǎo kàn jiàn tài yáng cóng xī biān màn man luò xià qù.","Tiān de yán sè yí huìr jiù biàn chéng le chéng sè, hěn piào liang."],vi:["Khi đứng bên bờ sông, chúng tôi vừa hay nhìn thấy mặt trời từ từ lặn về phía tây.","Màu trời chỉ một lúc đã chuyển sang màu cam, rất đẹp."]},
  "3-11-自己":{zh:["我现在一个人住，所以很多事情都得自己安排。","刚开始有点儿麻烦，后来也慢慢习惯了。"],py:["Wǒ xiàn zài yí ge rén zhù, suǒ yǐ hěn duō shì qing dōu děi zì jǐ ān pái.","Gāng kāi shǐ yǒu diǎnr má fan, hòu lái yě màn man xí guàn le."],vi:["Bây giờ tôi sống một mình nên nhiều việc đều phải tự sắp xếp.","Lúc đầu hơi phiền một chút nhưng sau đó cũng dần quen."]},
  "3-11-包":{zh:["我出门以前发现自己的包不见了。","后来找了半天，才想起来放在图书馆里了。"],py:["Wǒ chū mén yǐ qián fā xiàn zì jǐ de bāo bú jiàn le.","Hòu lái zhǎo le bàn tiān, cái xiǎng qǐ lái fàng zài tú shū guǎn lǐ le."],vi:["Trước khi ra ngoài tôi phát hiện chiếc túi của mình không thấy đâu nữa.","Sau đó tìm rất lâu tôi mới nhớ ra là đã để nó ở thư viện."]},
  "3-11-发现":{zh:["我做完练习以后，发现自己又写错了一个字。","虽然只是小问题，可是我还是重新抄了一遍。"],py:["Wǒ zuò wán liàn xí yǐ hòu, fā xiàn zì jǐ yòu xiě cuò le yí ge zì.","Suī rán zhǐ shì xiǎo wèn tí, kě shì wǒ hái shì chóng xīn chāo le yí biàn."],vi:["Sau khi làm xong bài tập, tôi phát hiện mình lại viết sai một chữ.","Tuy chỉ là lỗi nhỏ nhưng tôi vẫn chép lại một lần nữa."]},
  "3-11-护照":{zh:["去机场以前，你最好先检查一下护照。","要是到了那儿才发现忘带，就太麻烦了。"],py:["Qù jī chǎng yǐ qián, nǐ zuì hǎo xiān jiǎn chá yí xià hù zhào.","Yào shì dào le nàr cái fā xiàn wàng dài, jiù tài má fan le."],vi:["Trước khi ra sân bay, tốt nhất bạn nên kiểm tra hộ chiếu trước.","Nếu đến đó rồi mới phát hiện quên mang thì sẽ rất phiền phức."]},
  "3-11-画":{zh:["她从小就喜欢画画。","现在一有空，她就坐在窗边安安静静地画风景。"],py:["Tā cóng xiǎo jiù xǐ huan huà huà.","Xiàn zài yí yǒu kòng, tā jiù zuò zài chuāng biān ān ān jìng jìng de huà fēng jǐng."],vi:["Từ nhỏ cô ấy đã thích vẽ tranh.","Bây giờ hễ có thời gian rảnh là cô ấy lại ngồi bên cửa sổ lặng lẽ vẽ phong cảnh."]},
  "3-11-教":{zh:["新来的老师很有耐心，教我们的时候从来不着急。","如果有人没听懂，他就会再讲一遍。"],py:["Xīn lái de lǎo shī hěn yǒu nài xīn, jiāo wǒ men de shí hou cóng lái bù zháo jí.","Rú guǒ yǒu rén méi tīng dǒng, tā jiù huì zài jiǎng yí biàn."],vi:["Giáo viên mới rất kiên nhẫn, khi dạy chúng tôi chưa bao giờ sốt ruột.","Nếu có ai chưa hiểu, thầy sẽ giảng lại một lần nữa."]},
  "3-11-司机":{zh:["那位司机开车很稳，也很有礼貌。","我们下车的时候，他还提醒我们别忘了带东西。"],py:["Nà wèi sī jī kāi chē hěn wěn, yě hěn yǒu lǐ mào.","Wǒ men xià chē de shí hou, tā hái tí xǐng wǒ men bié wàng le dài dōng xi."],vi:["Người tài xế đó lái xe rất chắc tay và cũng rất lịch sự.","Khi chúng tôi xuống xe, chú ấy còn nhắc đừng quên mang đồ theo."]},
  "3-12-终于":{zh:["坐了两个多小时的车以后，我们终于到了海边。","虽然大家都很累，可是一看到大海就立刻高兴起来了。"],py:["Zuò le liǎng ge duō xiǎo shí de chē yǐ hòu, wǒ men zhōng yú dào le hǎi biān.","Suī rán dà jiā dōu hěn lèi, kě shì yí kàn dào dà hǎi jiù lì kè gāo xìng qǐ lái le."],vi:["Sau hơn hai tiếng ngồi xe, cuối cùng chúng tôi cũng đến được bờ biển.","Tuy ai cũng mệt nhưng vừa nhìn thấy biển là lập tức vui lên."]},
  "3-12-爷爷":{zh:["我爷爷每天早上都起得很早。","吃完早饭以后，他会一个人去公园慢慢散步。"],py:["Wǒ yé ye měi tiān zǎo shang dōu qǐ de hěn zǎo.","Chī wán zǎo fàn yǐ hòu, tā huì yí ge rén qù gōng yuán màn man sàn bù."],vi:["Ông tôi sáng nào cũng dậy rất sớm.","Ăn sáng xong, ông sẽ một mình ra công viên đi dạo chậm rãi."]},
  "3-12-礼物":{zh:["朋友过生日的时候，我想送她一份特别一点儿的礼物。","我选了很久，最后决定买一本她一直想看的书。"],py:["Péng you guò shēng rì de shí hou, wǒ xiǎng sòng tā yí fèn tè bié yì diǎnr de lǐ wù.","Wǒ xuǎn le hěn jiǔ, zuì hòu jué dìng mǎi yì běn tā yì zhí xiǎng kàn de shū."],vi:["Khi bạn tôi sinh nhật, tôi muốn tặng cô ấy một món quà đặc biệt hơn một chút.","Tôi chọn rất lâu rồi cuối cùng quyết định mua một cuốn sách mà cô ấy luôn muốn đọc."]},
  "3-12-奶奶":{zh:["我奶奶虽然年纪大了，可是记性还特别好。","她连我小时候说过的话都还记得很清楚。"],py:["Wǒ nǎi nai suī rán nián jì dà le, kě shì jì xìng hái tè bié hǎo.","Tā lián wǒ xiǎo shí hou shuō guo de huà dōu hái jì de hěn qīng chu."],vi:["Bà tôi tuy đã lớn tuổi nhưng trí nhớ vẫn đặc biệt tốt.","Ngay cả những lời tôi nói hồi nhỏ bà cũng còn nhớ rất rõ."]},
  "3-12-遇到":{zh:["如果你在路上遇到什么问题，就马上给我打电话。","别一个人着急，咱们一起想办法。"],py:["Rú guǒ nǐ zài lù shàng yù dào shén me wèn tí, jiù mǎ shàng gěi wǒ dǎ diàn huà.","Bié yí ge rén zháo jí, zán men yì qǐ xiǎng bàn fǎ."],vi:["Nếu trên đường bạn gặp vấn đề gì thì gọi điện cho tôi ngay.","Đừng tự mình lo lắng, chúng ta cùng nghĩ cách."]},
  "3-12-过去":{zh:["过去的事情我已经不太想再提了。","比起一直后悔，我更想把现在的生活过好。"],py:["Guò qù de shì qing wǒ yǐ jīng bù tài xiǎng zài tí le.","Bǐ qǐ yì zhí hòu huǐ, wǒ gèng xiǎng bǎ xiàn zài de shēng huó guò hǎo."],vi:["Chuyện trong quá khứ tôi đã không muốn nhắc lại nhiều nữa.","Thay vì cứ hối hận mãi, tôi muốn sống tốt hiện tại hơn."]},
  "3-12-生气":{zh:["老师看见有人上课玩手机，马上就生气了。","教室里一下子安静下来，谁也不敢说话。"],py:["Lǎo shī kàn jiàn yǒu rén shàng kè wán shǒu jī, mǎ shàng jiù shēng qì le.","Jiào shì lǐ yí xià zi ān jìng xià lái, shéi yě bù gǎn shuō huà."],vi:["Giáo viên nhìn thấy có người chơi điện thoại trong giờ học thì lập tức nổi giận.","Cả lớp bỗng yên lặng hẳn đi, không ai dám nói gì nữa."]},
  "3-12-行李箱":{zh:["这只行李箱看起来不大，可是里面装了很多东西。","我一个人拿不动，只好请朋友过来帮忙。"],py:["Zhè zhī xíng li xiāng kàn qǐ lái bú dà, kě shì lǐ mian zhuāng le hěn duō dōng xi.","Wǒ yí ge rén ná bú dòng, zhǐ hǎo qǐng péng you guò lái bāng máng."],vi:["Chiếc vali này nhìn không lớn nhưng bên trong chứa rất nhiều đồ.","Một mình tôi không nhấc nổi nên đành nhờ bạn đến giúp."]},
  "3-13-打扫":{zh:["周末的时候，我常常把房间彻底打扫一遍。","桌子和地面都干净以后，心情也会舒服很多。"],py:["Zhōu mò de shí hou, wǒ cháng cháng bǎ fáng jiān chè dǐ dǎ sǎo yí biàn.","Zhuō zi hé dì miàn dōu gān jìng yǐ hòu, xīn qíng yě huì shū fu hěn duō."],vi:["Vào cuối tuần, tôi thường dọn dẹp phòng thật kỹ một lượt.","Khi bàn và sàn đều sạch rồi thì tâm trạng cũng dễ chịu hơn nhiều."]},
  "3-13-干净":{zh:["这家小饭店虽然不大，可是特别干净。","桌子擦得很亮，连地上也看不到一点儿垃圾。"],py:["Zhè jiā xiǎo fàn diàn suī rán bú dà, kě shì tè bié gān jìng.","Zhuō zi cā de hěn liàng, lián dì shàng yě kàn bú dào yì diǎnr lā jī."],vi:["Quán ăn nhỏ này tuy không lớn nhưng đặc biệt sạch sẽ.","Bàn được lau rất bóng, đến dưới sàn cũng không thấy chút rác nào."]},
